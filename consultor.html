        const n = Object.keys(c.tools || {}).length, on = c.id === state.activeClientId;
        return '<div class="crow' + (on ? ' on' : '') + '"><div><h3>' + esc(c.nome || 'Sem nome') + '</h3><p>' + [c.idade ? c.idade + ' anos' : '', c.profissao, n + (n === 1 ? ' ferramenta preenchida' : ' ferramentas preenchidas')].filter(Boolean).map(esc).join(' · ') + '</p></div>' +
          '<div class="acts">' + (on ? '<span class="btn sm on">Selecionado</span>' : '<button type="button" class="btn sm" data-act="client-pick" data-id="' + esc(c.id) + '">Selecionar</button>') +
          '<button type="button" class="btn sm" data-act="client-edit" data-id="' + esc(c.id) + '">Editar</button><button type="button" class="btn sm danger" data-act="client-del" data-id="' + esc(c.id) + '">Excluir</button></div></div>';
      }).join('') + '</div>';
    }
    $('#main').innerHTML = h;
  }
  function clientModal(id) {
    const c = id ? state.clients.filter(function (x) { return x.id === id; })[0] : null, v = c || {};
    const body = '<div class="form">' + CLIENT_FIELDS.map(function (f) { return fieldHtml(Object.assign({}, f, { k: 'c_' + f.k }), (function () { const o = {}; o['c_' + f.k] = v[f.k] === undefined ? '' : v[f.k]; return o; })()); }).join('') + '</div>';
    openModal({
      title: c ? 'Editar cliente' : 'Novo cliente', body: body, confirm: 'Salvar',
      onConfirm: function (modal) {
        const data = {};
        CLIENT_FIELDS.forEach(function (f) { const el = $('[data-k="c_' + f.k + '"]', modal); data[f.k] = f.t === 'text' || f.t === 'textarea' ? el.value.trim() : parseNum(el.value, f.t); });
        if (!data.nome) { toast('Informe o nome do cliente.', true); return false; }
        if (c) Object.assign(c, data);
        else { const novo = Object.assign({ id: uid(), tools: {}, criadoEm: new Date().toISOString() }, data); state.clients.push(novo); state.activeClientId = novo.id; }
        scheduleSave(); renderApp(); toast(c ? 'Cliente atualizado.' : 'Cliente criado e selecionado.');
      }
    });
  }
  function renderTool(id) {
    const def = toolDef(id), g = TOOL_GROUPS.filter(function (x) { return x.id === def.group; })[0];
    current.inputs = getInputs(id);
    $('#main').innerHTML = header(g.name, def.name, def.desc, '<button type="button" class="btn sm ghost" data-act="reset">Restaurar exemplo</button>') +
      '<div class="tool' + (def.wide ? ' wide' : '') + '"><form class="panel form" id="toolForm" novalidate>' + formHtml(def, current.inputs) + '</form><section class="results" id="toolResults"></section></div>';
    $('#toolForm').addEventListener('submit', function (e) { e.preventDefault(); });
    renderResults();
  }
  function renderForm() {
    const def = toolDef(current.toolId);
    $('#toolForm').innerHTML = formHtml(def, current.inputs);
  }
  function renderResults() {
    resultsQueued = false;
    const box = $('#toolResults');
    if (!box || current.route !== 'tool') return;
    chartReg = {};
    try { box.innerHTML = resultsHtml(current.toolId, runTool(current.toolId, current.inputs).v); }
    catch (e) { box.innerHTML = '<div class="warn-box">Não foi possível calcular com esses valores. Revise os campos.</div>'; }
  }
  function scheduleResults() {
    if (resultsQueued) return;
    resultsQueued = true;
    window.requestAnimationFrame(renderResults);
  }
  function commitInputs() {
    const jaTinha = !!toolStore()[current.toolId];
    toolStore()[current.toolId] = clone(current.inputs);
    scheduleSave();
    if (!jaTinha) renderSide();
    scheduleResults();
  }
  function renderRelatorio() {
    const c = activeClient(), s = state.settings, store = toolStore();
    const feitas = TOOL_DEFS.filter(function (d) { return !!store[d.id]; });
    let h = header('Entrega', 'Relatório do cliente', 'Reúne as ferramentas preenchidas. Imprima ou salve em PDF.', feitas.length ? '<button type="button" class="btn primary" data-act="print">Imprimir ou salvar PDF</button>' : '');
    if (!feitas.length) { $('#main').innerHTML = h + '<div class="empty"><b>Nada para mostrar ainda</b>Preencha ao menos uma ferramenta' + (c ? ' para ' + esc(c.nome) : '') + ' e ela aparece aqui.</div>'; return; }
    h += '<div class="checks">' + feitas.map(function (d) { return '<button type="button" class="btn sm' + (state.reportSkip[d.id] ? '' : ' on') + '" data-act="rep-toggle" data-id="' + d.id + '">' + esc(d.name) + '</button>'; }).join('') + '</div>';
    const parts = String(s.empresa || BRAND_DEFAULT).trim().split(/\s+/);
    chartReg = {};
    h += '<article class="report"><div class="rep-head"><div class="brand"><div class="brand-mark">' + esc(parts[0].charAt(0).toUpperCase()) + '</div><div class="brand-name"><b>' + esc(parts[0]) + '</b> ' + esc(parts.slice(1).join(' ')) + '<small>' + esc(s.tagline) + '</small></div></div>' +
      '<div class="rep-meta"><b>' + esc(c ? c.nome : 'Planejamento financeiro') + '</b>' + esc(new Date().toLocaleDateString('pt-BR', { day: 'numeric', month: 'long', year: 'numeric' })) + (s.consultor ? '<br>' + esc(s.consultor) + (s.registro ? ' · ' + esc(s.registro) : '') : '') + '</div></div>';
    feitas.filter(function (d) { return !state.reportSkip[d.id]; }).forEach(function (d) {
      let v;
      try { v = runTool(d.id, getInputs(d.id)).v; } catch (e) { return; }
      h += '<section class="rep-sec"><h2>' + icon(d.icon) + esc(d.name) + '</h2>' + (v.kpis.length ? kpisHtml(v.kpis.slice(0, 4)) : '') + '<div class="insight">' + v.insight + '</div>' + (v.chart || '') + '</section>';
    });
    h += '<div class="rep-foot">' + esc(DISCLAIMER) + (s.contato ? '<br>' + esc(s.empresa) + ' · ' + esc(s.contato) : '') + '</div></article>';
    $('#main').innerHTML = h;
  }
  function renderConfig() {
    const s = state.settings, p = s.premissas;
    const f = function (path, label, value, t, tip) {
      const a = 'data-cfg="' + path + '"';
      return '<label class="f"><span class="fl">' + esc(label) + tipIcon(tip) + '</span>' + (t === 'text' ? '<input class="plain" ' + a + ' data-t="text" autocomplete="off" value="' + esc(value) + '">' : numberBox(a, value, t)) + '</label>';
    };
    $('#main').innerHTML = header('Ajustes', 'Configurações', 'Marca do relatório, premissas de mercado e cópia de segurança.') + '<div class="cfg">' +
      '<div class="panel form"><h3 class="card-t">Marca e consultor</h3>' + f('empresa', 'Nome da consultoria', s.empresa, 'text') + f('tagline', 'Assinatura', s.tagline, 'text') + f('consultor', 'Consultor responsável', s.consultor, 'text') +
      f('registro', 'Registro', s.registro, 'text', 'Ex.: Consultor CVM, CFP, CEA.') + f('contato', 'Contato no rodapé do relatório', s.contato, 'text') + '</div>' +
      '<div style="display:grid;gap:18px"><div class="panel form"><h3 class="card-t">Premissas de mercado</h3>' + f('premissas.selic', 'Selic a.a.', p.selic, 'pct') + f('premissas.cdi', 'CDI a.a.', p.cdi, 'pct') +
      f('premissas.ipca', 'IPCA em 12 meses', p.ipca, 'pct') + f('premissas.tr', 'TR a.a.', p.tr, 'pct', 'Usada no rendimento da poupança.') + '</div>' +
      '<div class="panel form"><h3 class="card-t">Cópia de segurança</h3><p class="card-s" style="margin:0">Os dados ficam apenas neste navegador. Exporte um arquivo de tempos em tempos.</p><div class="row-btns"><button type="button" class="btn" data-act="export">Exportar</button><button type="button" class="btn" data-act="import">Importar</button><button type="button" class="btn danger" data-act="wipe">Apagar tudo</button></div><input type="file" id="importFile" accept="application/json,.json" hidden></div></div></div>';
    $('#importFile').addEventListener('change', onImportFile);
  }
  function parseRoute() {
    const h = (window.location.hash || '').replace(/^#\/?/, '');
    if (h.indexOf('t/') === 0 && toolDef(h.slice(2))) return { route: 'tool', toolId: h.slice(2) };
    return { route: ROUTES_FIXED.indexOf(h) >= 0 ? h : 'painel', toolId: null };
  }
  function renderMain() {
    chartReg = {};
    if (current.route === 'tool') renderTool(current.toolId);
    else if (current.route === 'clientes') renderClientes();
    else if (current.route === 'relatorio') renderRelatorio();
    else if (current.route === 'config') renderConfig();
    else renderPainel();
  }
  function renderApp() {
    const r = parseRoute();
    current.route = r.route; current.toolId = r.toolId; current.inputs = null;
    renderSide(); renderMain();
  }

  /* =====================================================================
     8. EVENTOS — todos registrados uma única vez, por delegação
     ===================================================================== */
  function readField(el) {
    if (el.type === 'checkbox') return el.checked;
    if (el.tagName === 'SELECT') return el.dataset.num ? Number(el.value) : el.value;
    if (el.dataset.t === 'text') return el.value;
    return parseNum(el.value, el.dataset.t);
  }
  function applyToolField(el) {
    const k = el.dataset.k, v = readField(el);
    if (el.dataset.row !== undefined) current.inputs[k][Number(el.dataset.row)][el.dataset.col] = v;
    else current.inputs[k] = v;
    if (current.toolId === 'sucessao' && k === 'uf') {
      const u = ITCMD_UF.filter(function (x) { return x.uf === v; })[0];
      if (u) { current.inputs.aliquota = u.ref; renderForm(); }
    }
    commitInputs();
  }
  function applyConfigField(el) {
    const path = el.dataset.cfg.split('.'), v = readField(el);
    if (path.length === 2) state.settings[path[0]][path[1]] = v; else state.settings[path[0]] = v;
    scheduleSave();
    if (path[0] === 'empresa' || path[0] === 'tagline') renderSide();
  }
  function onMainInput(e) {
    const el = e.target;
    if (el.type === 'checkbox' || el.tagName === 'SELECT') return;
    if (el.dataset.cfg) applyConfigField(el);
    else if (el.dataset.k && current.route === 'tool' && current.inputs) applyToolField(el);
  }
  function onMainChange(e) {
    const el = e.target;
    if (el.type === 'checkbox' || el.tagName === 'SELECT') {
      if (el.dataset.cfg) applyConfigField(el);
      else if (el.dataset.k && current.route === 'tool' && current.inputs) applyToolField(el);
      return;
    }
    if (el.dataset.t && el.dataset.t !== 'text' && el.tagName === 'INPUT') el.value = fmtInput(parseNum(el.value, el.dataset.t), el.dataset.t);
  }
  function onMainFocus(e) {
    const el = e.target;
    if (el.tagName === 'INPUT' && el.dataset.t && el.dataset.t !== 'text' && el.select) el.select();
  }
  function exportBackup() {
    const blob = new Blob([JSON.stringify({ app: DB_NAME, exportadoEm: new Date().toISOString(), state: state }, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'garcia-wealth-backup-' + new Date().toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    window.setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    toast('Cópia de segurança exportada.');
  }
  function onImportFile(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function () {
      let data;
      try { data = JSON.parse(String(reader.result)); } catch (err) { toast('Arquivo inválido.', true); return; }
      if (!data || !data.state || data.app !== DB_NAME) { toast('Este arquivo não é uma cópia de segurança desta ferramenta.', true); return; }
      openModal({
        title: 'Importar cópia de segurança', text: 'Os dados atuais serão substituídos pelos do arquivo. Esta ação não pode ser desfeita.', confirm: 'Substituir dados', danger: true,
        onConfirm: function () { state = normalizeState(data.state); scheduleSave(); renderApp(); toast('Dados importados.'); }
      });
    };
    reader.readAsText(file);
    e.target.value = '';
  }
  function onMainClick(e) {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    const act = b.dataset.act, def = current.toolId ? toolDef(current.toolId) : null;
    if (act === 'choice') { current.inputs[b.dataset.k] = Number(b.dataset.v); renderForm(); commitInputs(); }
    else if (act === 'addrow' || act === 'delrow') {
      const f = def.fields.filter(function (x) { return x.k === b.dataset.k; })[0], rows = current.inputs[f.k];
      if (act === 'delrow') rows.splice(Number(b.dataset.row), 1);
      else { const novo = {}; f.cols.forEach(function (c) { novo[c.k] = c.t === 'text' ? '' : (c.t === 'select' ? c.o[0][0] : (c.t === 'check' ? false : 0)); }); rows.push(novo); }
      renderForm(); commitInputs();
      if (act === 'addrow') { const inp = $('#toolForm [data-row="' + (rows.length - 1) + '"]'); if (inp) inp.focus(); }
    }
    else if (act === 'preset') {
      const mp = MODEL_PORTFOLIOS[b.dataset.v];
      current.inputs.rows.forEach(function (r) { r.alvo = mp[r.id] || 0; });
      renderForm(); commitInputs();
    }
    else if (act === 'reset') { delete toolStore()[current.toolId]; scheduleSave(); renderApp(); toast('Exemplo restaurado.'); }
    else if (act === 'client-new') clientModal(null);
    else if (act === 'client-edit') clientModal(b.dataset.id);
    else if (act === 'client-pick') { state.activeClientId = b.dataset.id; scheduleSave(); renderApp(); }
    else if (act === 'client-del') {
      const c = state.clients.filter(function (x) { return x.id === b.dataset.id; })[0];
      openModal({
        title: 'Excluir cliente', text: 'As simulações de ' + (c ? c.nome : 'este cliente') + ' serão apagadas. Esta ação não pode ser desfeita.', confirm: 'Excluir', danger: true,
        onConfirm: function () { state.clients = state.clients.filter(function (x) { return x.id !== b.dataset.id; }); if (state.activeClientId === b.dataset.id) state.activeClientId = null; scheduleSave(); renderApp(); toast('Cliente excluído.'); }
      });
    }
    else if (act === 'rep-toggle') { if (state.reportSkip[b.dataset.id]) delete state.reportSkip[b.dataset.id]; else state.reportSkip[b.dataset.id] = true; scheduleSave(); renderRelatorio(); }
    else if (act === 'print') window.print();
    else if (act === 'export') exportBackup();
    else if (act === 'import') $('#importFile').click();
    else if (act === 'wipe') {
      openModal({
        title: 'Apagar todos os dados', text: 'Clientes, simulações e configurações serão apagados deste navegador. Esta ação não pode ser desfeita.', confirm: 'Apagar tudo', danger: true,
        onConfirm: function () { state = defaultState(); scheduleSave(); renderApp(); toast('Dados apagados.'); }
      });
    }
  }
  function placeTip(x, y) {
    const tip = $('#tip'), w = tip.offsetWidth, h = tip.offsetHeight;
    tip.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, x + 14)) + 'px';
    tip.style.top = Math.max(8, Math.min(window.innerHeight - h - 8, y + 14)) + 'px';
  }
  function hideTip() { $('#tip').style.display = 'none'; }
  function onPointerMove(e) {
    const tip = $('#tip');
    const q = e.target.closest ? e.target.closest('[data-tip]') : null;
    if (q) { tip.textContent = q.dataset.tip; tip.style.display = 'block'; placeTip(e.clientX, e.clientY); return; }
    const ch = e.target.closest ? e.target.closest('.chart[data-chart]') : null;
    const reg = ch ? chartReg[ch.dataset.chart] : null;
    document.querySelectorAll('.chart .xh').forEach(function (l) { l.style.display = 'none'; });
    if (!reg) { hideTip(); return; }
    const svg = $('svg', ch), box = svg.getBoundingClientRect(), o = reg.o, P = CHART_PAD, W = reg.w;
    const vx = (e.clientX - box.left) / box.width * W;
    if (vx < P.l - 12 || vx > W - P.r + 12 || e.clientY < box.top || e.clientY > box.bottom) { hideTip(); return; }
    const k = clamp(Math.round((vx - P.l) / (W - P.l - P.r) * (reg.n - 1)), 0, reg.n - 1);
    const x = P.l + (W - P.l - P.r) * (reg.n > 1 ? k / (reg.n - 1) : 0.5);
    const line = $('.xh', svg);
    line.setAttribute('x1', x); line.setAttribute('x2', x); line.style.display = 'block';
    const fmt = o.fmtTip || brl;
    let h = '<div class="tt">' + esc(o.labels[k]) + '</div>' + o.series.map(function (s) { return '<div class="tr2"><span><i style="background:var(' + s.c + ')"></i>' + esc(s.name) + '</span><b>' + esc(fmt(s.values[k])) + '</b></div>'; }).join('');
    if (o.band) h += '<div class="tr2"><span>Cenário bom</span><b>' + esc(fmt(o.band.hi[k])) + '</b></div><div class="tr2"><span>Cenário ruim</span><b>' + esc(fmt(o.band.lo[k])) + '</b></div>';
    tip.innerHTML = h; tip.style.display = 'block'; placeTip(e.clientX, e.clientY);
  }
  function bindEvents() {
    const main = $('#main');
    main.addEventListener('input', onMainInput);
    main.addEventListener('change', onMainChange);
    main.addEventListener('click', onMainClick);
    main.addEventListener('focusin', onMainFocus);
    document.addEventListener('mousemove', onPointerMove);
    document.addEventListener('scroll', hideTip, true);
    window.addEventListener('hashchange', renderApp);
    $('#clientSelect').addEventListener('change', function (e) { state.activeClientId = e.target.value || null; scheduleSave(); renderApp(); });
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden' && saveQueued) persistNow(); });
  }
  function init() {
    loadState().then(function () {
      bindEvents();
      renderApp();
      if (memoryOnly) toast('Este navegador bloqueou o armazenamento local: os dados não serão salvos nesta sessão.', true);
    });
  }

  /* Biblioteca de cálculo exposta apenas para testes automatizados (Node) */
  const CALC = {
    rateMonthly: rateMonthly, annuityFactor: annuityFactor, annuityDueFactor: annuityDueFactor, fvFactor: fvFactor,
    irRendaFixa: irRendaFixa, iofPct: iofPct, aliquotaRegressiva: aliquotaRegressiva, irpfTabela: irpfTabela, irpfDevido: irpfDevido,
    gaussianMatrix: gaussianMatrix, percentile: percentile, lognormalReturn: lognormalReturn, portfolioStats: portfolioStats,
    range95: range95, stressImpact: stressImpact, simulateGrowth: simulateGrowth, necessarioAposentadoria: necessarioAposentadoria,
    simulateWithdrawals: simulateWithdrawals, saqueSustentavel: saqueSustentavel, poupancaMensal: poupancaMensal, fatorBruto: fatorBruto, previdenciaLongoPrazo: previdenciaLongoPrazo,
    amortizationSchedule: amortizationSchedule, benchAposentadoria: benchAposentadoria, irCompleta: irCompleta,
    computeJuros: computeJuros, computeIndep: computeIndep, computeRenda: computeRenda, computeMetas: computeMetas, computeRaioX: computeRaioX,
    computeRisco: computeRisco, computeCustos: computeCustos, computeRendaFixa: computeRendaFixa, computeAlocacao: computeAlocacao,
    computePgbl: computePgbl, computeProtecao: computeProtecao, computeSucessao: computeSucessao, computeImovel: computeImovel,
    TOOL_DEFS: TOOL_DEFS, ASSET_CLASSES: ASSET_CLASSES, ASSET_CORR: ASSET_CORR, MODEL_PORTFOLIOS: MODEL_PORTFOLIOS,
    STRESS_SCENARIOS: STRESS_SCENARIOS, DEFAULT_PREMISSAS: DEFAULT_PREMISSAS, RISK_QUESTIONS: RISK_QUESTIONS
  };

  /* =====================================================================
     9. INICIALIZAÇÃO — único ponto de entrada
     ===================================================================== */
  if (typeof document === 'undefined') {
    if (typeof module !== 'undefined' && module.exports) module.exports = CALC;
    return;
  }
  document.addEventListener('DOMContentLoaded', init);
})();
</script>
</body>
</html>
