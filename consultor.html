<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GARCIA WEALTH · Ferramentas do consultor</title>
<style>
:root {
  --bg: #0a0b0a; --surface: #121412; --surface2: #191c19; --field: #0d0f0d;
  --line: #232723; --line2: #333a32;
  --text: #eceee8; --text2: #b3b9ae; --muted: #7b8477;
  --accent: #97aa63; --accent-strong: #b2c57c; --accent-soft: rgba(151, 170, 99, .12); --on-accent: #0c0e09;
  --c1: #7d9a3c; --c2: #3f8fd0; --c3: #c98500; --c4: #b565c9; --c5: #d95926;
  --good: #0ca30c; --warn: #fab219; --serious: #ec835a; --crit: #d03b3b;
  --radius: 14px; --shadow: 0 18px 50px rgba(0, 0, 0, .55);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font: 14px/1.5 "Inter", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
::selection { background: rgba(151, 170, 99, .35); }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: #2a2f29; border-radius: 10px; border: 2px solid var(--bg); }

#app { display: grid; grid-template-columns: 252px 1fr; min-height: 100vh; }

/* ---------- barra lateral ---------- */
.side { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; border-right: 1px solid var(--line); padding: 26px 16px 16px; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 12px; padding: 0 8px 22px; }
.brand-mark { width: 30px; height: 30px; border: 1.5px solid var(--accent); border-radius: 8px; display: grid; place-items: center; font-weight: 600; font-size: 14px; color: var(--accent); letter-spacing: 0; flex: none; }
.brand-name { font-size: 13px; letter-spacing: .2em; line-height: 1.25; font-weight: 300; text-transform: uppercase; }
.brand-name b { font-weight: 700; }
.brand-name small { display: block; font-size: 10px; letter-spacing: .08em; color: var(--muted); text-transform: none; margin-top: 3px; font-weight: 400; }
.client-box { margin: 0 4px 18px; }
.client-box label { display: block; font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0 4px 6px; }
.nav-group { font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 18px 12px 6px; }
.nav a { display: flex; align-items: center; gap: 11px; padding: 8px 12px; border-radius: 9px; color: var(--text2); text-decoration: none; font-size: 13.5px; position: relative; }
.nav a:hover { background: var(--surface); color: var(--text); }
.nav a.on { background: var(--accent-soft); color: var(--text); }
.nav a.on::before { content: ""; position: absolute; left: -16px; top: 9px; bottom: 9px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent); }
.nav a.on .ico { color: var(--accent); }
.nav .tick { margin-left: auto; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.ico { width: 17px; height: 17px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.side-foot { margin-top: auto; padding: 18px 12px 0; font-size: 11px; color: var(--muted); }

/* ---------- área principal ---------- */
main { padding: 38px 46px 80px; min-width: 0; max-width: 1320px; width: 100%; }
.th { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 26px; }
.th h1 { font-size: 27px; font-weight: 600; letter-spacing: -.015em; margin: 0 0 4px; }
.th p { margin: 0; color: var(--text2); font-size: 14.5px; }
.eyebrow { font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); margin-bottom: 8px; }
.th-actions { display: flex; gap: 8px; flex: none; }

.btn { text-decoration: none; height: 36px; padding: 0 14px; border-radius: 9px; border: 1px solid var(--line2); background: transparent; color: var(--text2); font-size: 13px; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.btn:hover { border-color: var(--accent); color: var(--text); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.btn.primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); color: var(--on-accent); }
.btn.ghost { border-color: transparent; }
.btn.danger:hover { border-color: var(--crit); color: #ff8f8f; }
.btn.sm { height: 30px; padding: 0 10px; font-size: 12.5px; }
.btn.on { border-color: var(--accent); color: var(--text); background: var(--accent-soft); }

.tool { display: grid; grid-template-columns: 348px 1fr; gap: 26px; align-items: start; }
.tool.wide { grid-template-columns: 1fr; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; }
.form { display: grid; gap: 14px; }
.tool:not(.wide) .form { position: sticky; top: 24px; max-height: calc(100vh - 48px); overflow-y: auto; }
.tool.wide .form { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.tool.wide .form .sec, .tool.wide .form .tbl, .tool.wide .form .presets { grid-column: 1 / -1; }
.sec { font-size: 10.5px; letter-spacing: .13em; text-transform: uppercase; color: var(--muted); padding-top: 12px; margin-top: 4px; border-top: 1px solid var(--line); }
.f { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; min-width: 0; }
.fl { font-size: 12.5px; color: var(--text2); display: flex; align-items: center; gap: 6px; }
.fi { display: flex; align-items: center; height: 40px; background: var(--field); border: 1px solid var(--line); border-radius: 9px; padding: 0 12px; gap: 8px; transition: border-color .12s; }
.fi:focus-within { border-color: var(--accent); }
.fi em { font-style: normal; color: var(--muted); font-size: 12.5px; flex: none; }
.fi input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; height: 100%; text-align: right; font-variant-numeric: tabular-nums; }
.fi input.txt { text-align: left; }
select, textarea, .plain { width: 100%; height: 40px; background: var(--field); border: 1px solid var(--line); border-radius: 9px; padding: 0 12px; outline: 0; }
select:focus, textarea:focus, .plain:focus { border-color: var(--accent); }
textarea { height: 84px; padding: 10px 12px; resize: vertical; }
select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 17px) 17px, calc(100% - 12px) 17px; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 30px; }
select option { background: var(--surface); }
.q { width: 15px; height: 15px; border-radius: 50%; border: 1px solid var(--line2); color: var(--muted); font-size: 10px; font-style: normal; display: inline-grid; place-items: center; cursor: help; flex: none; }
.q:hover { border-color: var(--accent); color: var(--accent); }
.sw { display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 13px; color: var(--text2); min-height: 40px; }
.sw input { appearance: none; width: 34px; height: 20px; border-radius: 20px; background: var(--line2); position: relative; outline: 0; cursor: pointer; flex: none; transition: background .15s; margin: 0; }
.sw input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--text2); transition: transform .15s; }
.sw input:checked { background: var(--accent); }
.sw input:checked::after { transform: translateX(14px); background: var(--on-accent); }

.choice { display: grid; gap: 7px; }
.choice-q { font-size: 13px; color: var(--text); }
.choice-q span { color: var(--muted); margin-right: 6px; }
.choice-o { display: grid; gap: 5px; }
.choice-o button { text-align: left; padding: 8px 11px; border-radius: 8px; border: 1px solid var(--line); background: var(--field); color: var(--text2); font-size: 12.5px; }
.choice-o button:hover { border-color: var(--line2); color: var(--text); }
.choice-o button.on { border-color: var(--accent); background: var(--accent-soft); color: var(--text); }

.tbl { display: grid; gap: 6px; }
.tr { display: grid; gap: 8px; align-items: center; }
.tr.head { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 0 2px 2px; }
.tr.head > span { display: flex; align-items: center; gap: 6px; }
.tr .fi { height: 36px; }
.tr select { height: 36px; background-position: calc(100% - 17px) 15px, calc(100% - 12px) 15px; }
.tr .lbl { font-size: 13.5px; color: var(--text); }
.tr .del { width: 30px; height: 30px; border-radius: 8px; border: 0; background: none; color: var(--muted); font-size: 17px; line-height: 1; }
.tr .del:hover { background: var(--surface2); color: #ff8f8f; }
.tr .sw { justify-content: center; min-height: 36px; }
.tbl .add { justify-self: start; margin-top: 4px; }
.presets { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.presets span { font-size: 12.5px; color: var(--muted); margin-right: 4px; }

/* ---------- resultados ---------- */
.results { display: grid; gap: 18px; min-width: 0; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
.kpis.k4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.tool.wide .kpis.k4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; min-width: 0; }
.kpi.hero { border-color: rgba(151, 170, 99, .45); background: linear-gradient(180deg, rgba(151, 170, 99, .09), rgba(151, 170, 99, .02) 70%), var(--surface); }
.kpi-l { font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.kpi-v { font-size: 25px; font-weight: 600; letter-spacing: -.02em; margin-top: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi.hero .kpi-v { font-size: 31px; }
.tool:not(.wide) .kpis:not(.k4) .kpi.mid .kpi-v { font-size: 23px; margin-top: 12px; }
.kpi.long .kpi-v { font-size: 19px; line-height: 1.3; white-space: normal; margin-top: 10px; }
.kpi-s { font-size: 12.5px; color: var(--text2); margin-top: 3px; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 7px; vertical-align: 1px; }
.insight { border-left: 2px solid var(--accent); padding: 4px 0 4px 18px; font-size: 15.5px; line-height: 1.6; color: var(--text); max-width: 860px; }
.insight b { font-weight: 600; color: var(--accent-strong); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px 22px; min-width: 0; }
.card-t { font-size: 13.5px; font-weight: 600; margin: 0 0 3px; }
.card-s { font-size: 12.5px; color: var(--muted); margin: 0 0 14px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.warn-box { border: 1px solid rgba(250, 178, 25, .4); background: rgba(250, 178, 25, .07); border-radius: 10px; padding: 11px 14px; font-size: 13.5px; color: var(--text); }
details.more { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
details.more summary { padding: 14px 20px; font-size: 13px; color: var(--text2); cursor: pointer; list-style: none; display: flex; align-items: center; gap: 8px; }
details.more summary::-webkit-details-marker { display: none; }
details.more summary::before { content: "+"; color: var(--accent); font-size: 16px; width: 12px; }
details.more[open] summary::before { content: "–"; }
details.more .inner { padding: 0 20px 18px; }
.method { font-size: 12.5px; color: var(--muted); line-height: 1.6; }

table.t { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.t th { text-align: right; font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 500; padding: 8px 10px; border-bottom: 1px solid var(--line); }
table.t td { text-align: right; padding: 10px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.t th:first-child, table.t td:first-child { text-align: left; padding-left: 0; white-space: normal; }
table.t th:last-child, table.t td:last-child { padding-right: 0; }
table.t tr:last-child td { border-bottom: 0; }
table.t tr.best td { color: var(--text); }
table.t tr.best td:first-child::after { content: attr(data-badge); margin-left: 8px; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--on-accent); background: var(--accent); padding: 2px 6px; border-radius: 4px; }
table.t tfoot td { border-top: 1px solid var(--line2); border-bottom: 0; font-weight: 600; }
.pos { color: var(--accent-strong); } .neg { color: #e8866b; } .mut { color: var(--muted); }
.tag { display: inline-block; font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: 5px; border: 1px solid var(--line2); color: var(--text2); }

/* gráficos */
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { fill: var(--muted); font-size: 11px; font-family: inherit; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .xh { stroke: var(--line2); stroke-width: 1; display: none; }
.legend { display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 10px; font-size: 12.5px; color: var(--text2); }
.legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; margin-right: 7px; vertical-align: middle; }
.legend i.band { height: 10px; opacity: .3; }
.bars { display: grid; gap: 11px; }
.bar-row { display: grid; grid-template-columns: minmax(120px, 34%) 1fr auto; gap: 14px; align-items: center; font-size: 13px; }
.bar-row .bl { color: var(--text2); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-row .bl small { display: block; color: var(--muted); font-size: 11.5px; }
.bar-track { height: 10px; background: var(--field); border-radius: 3px; position: relative; }
.bar-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 0 4px 4px 0; background: var(--c1); min-width: 2px; }
.bar-mark { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--text); border-radius: 1px; }
.bar-row .bv { text-align: right; white-space: nowrap; min-width: 84px; }
.bars.two .bar-track { height: 18px; background: none; }
.bars.two .bar-fill { height: 7px; bottom: auto; }
.bars.two .bar-fill.b2 { top: 10px; background: var(--c2); }
.score { display: flex; align-items: baseline; gap: 10px; }
.score b { font-size: 54px; font-weight: 600; letter-spacing: -.03em; line-height: 1; }
.score span { color: var(--muted); font-size: 15px; }

/* painel inicial */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(238px, 1fr)); gap: 14px; }
.tcard { display: block; text-decoration: none; color: inherit; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; transition: border-color .12s, transform .12s; position: relative; }
.tcard:hover { border-color: var(--accent); transform: translateY(-1px); }
.tcard .ico { width: 20px; height: 20px; color: var(--accent); margin-bottom: 14px; }
.tcard h3 { font-size: 14.5px; font-weight: 600; margin: 0 0 4px; }
.tcard p { font-size: 12.5px; color: var(--muted); margin: 0; line-height: 1.5; }
.tcard .done { position: absolute; top: 18px; right: 18px; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.group-t { font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 30px 0 12px; display: flex; align-items: center; gap: 12px; }
.group-t::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.group-t b { color: var(--accent); font-weight: 500; }
.strip { display: grid; grid-template-columns: 1.3fr 1fr; gap: 14px; }
.agenda li { display: flex; gap: 10px; align-items: baseline; padding: 5px 0; font-size: 13.5px; color: var(--text2); }
.agenda ul { list-style: none; margin: 0; padding: 0; }
.agenda li::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); flex: none; transform: translateY(-2px); }
.agenda .next { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
.agenda .next li::before { background: var(--line2); }
.prem { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.prem div { font-size: 11px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
.prem b { display: block; font-size: 21px; color: var(--text); letter-spacing: -.01em; margin-top: 4px; font-weight: 600; text-transform: none; }

.clist { display: grid; gap: 10px; }
.crow { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 20px; }
.crow.on { border-color: rgba(151, 170, 99, .5); }
.crow h3 { margin: 0 0 2px; font-size: 15px; font-weight: 600; }
.crow p { margin: 0; font-size: 12.5px; color: var(--muted); }
.crow .acts { display: flex; gap: 6px; }
.empty { border: 1px dashed var(--line2); border-radius: var(--radius); padding: 44px 20px; text-align: center; color: var(--muted); }
.empty b { display: block; color: var(--text); font-size: 15px; margin-bottom: 6px; font-weight: 600; }
.empty .btn { margin-top: 16px; }
.cfg { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; align-items: start; }
.cfg .form { position: static; }
.row-btns { display: flex; gap: 8px; flex-wrap: wrap; }

/* modal, avisos e dicas */
.overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, .66); display: grid; place-items: center; z-index: 50; padding: 20px; }
.modal { width: min(560px, 100%); max-height: 90vh; overflow: auto; background: var(--surface); border: 1px solid var(--line2); border-radius: 16px; padding: 26px; box-shadow: var(--shadow); }
.modal h2 { margin: 0 0 6px; font-size: 18px; font-weight: 600; }
.modal p { margin: 0 0 18px; color: var(--text2); }
.modal .form { grid-template-columns: 1fr 1fr; }
.modal .form .full { grid-column: 1 / -1; }
.modal-foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 22px; }
#toasts { position: fixed; right: 22px; bottom: 22px; display: grid; gap: 8px; z-index: 60; }
.toast { background: var(--surface2); border: 1px solid var(--line2); border-left: 3px solid var(--accent); border-radius: 10px; padding: 11px 16px; font-size: 13.5px; box-shadow: var(--shadow); max-width: 360px; }
.toast.err { border-left-color: var(--crit); }
#tip { position: fixed; z-index: 70; pointer-events: none; background: #1d211d; border: 1px solid var(--line2); border-radius: 9px; padding: 9px 12px; font-size: 12.5px; color: var(--text); box-shadow: var(--shadow); display: none; max-width: 280px; line-height: 1.5; }
#tip .tt { color: var(--muted); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 5px; }
#tip .tr2 { display: flex; justify-content: space-between; gap: 18px; white-space: nowrap; }
#tip .tr2 i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 7px; }

/* relatório */
.report { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 44px 48px; max-width: 920px; }
.rep-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; padding-bottom: 22px; border-bottom: 1px solid var(--line2); margin-bottom: 8px; }
.rep-head .brand { padding: 0; }
.rep-meta { text-align: right; font-size: 12.5px; color: var(--text2); }
.rep-meta b { display: block; font-size: 17px; color: var(--text); font-weight: 600; }
.rep-sec { padding: 26px 0; border-bottom: 1px solid var(--line); break-inside: avoid; }
.rep-sec h2 { font-size: 16px; margin: 0 0 14px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
.rep-sec h2 .ico { color: var(--accent); }
.rep-sec .kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
.rep-sec .kpi { padding: 12px 14px; }
.rep-sec .kpi-v, .rep-sec .kpi.hero .kpi-v { font-size: 18px; }
.rep-sec .insight { font-size: 14px; }
.rep-sec .card { margin-top: 14px; border: 0; padding: 0; background: none; }
.rep-sec .chart { max-width: 660px; }
.rep-sec .grid2 { grid-template-columns: 1fr; }
.rep-foot { padding-top: 20px; font-size: 11px; color: var(--muted); line-height: 1.6; }
.checks { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }

@media (max-width: 1080px) {
  #app { grid-template-columns: 1fr; }
  .side { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
  main { padding: 26px 20px 60px; }
  .tool, .grid2, .strip, .cfg { grid-template-columns: 1fr; }
  .tool:not(.wide) .form { position: static; max-height: none; }
  .tool.wide .form { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

@media print {
  :root {
    --bg: #fff; --surface: #fff; --surface2: #f4f5f1; --field: #f4f5f1; --line: #dfe2d9; --line2: #c5cabd;
    --text: #151713; --text2: #3d4239; --muted: #6c7366; --accent: #5f7a22; --accent-strong: #4b6218; --accent-soft: rgba(95, 122, 34, .1);

  /* =====================================================================

     ===================================================================== */
  function num(v, d) { v = Number(v); return isFinite(v) ? v : (d || 0); }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function sum(arr) { let s = 0; for (let i = 0; i < arr.length; i++) s += arr[i]; return s; }

  // Taxa mensal equivalente a uma taxa anual efetiva (em %)
  function rateMonthly(aPct) { return Math.pow(1 + aPct / 100, 1 / 12) - 1; }
  // Valor presente de uma série de 1 por período, paga no fim de cada período
  function annuityFactor(r, n) { return r === 0 ? n : (1 - Math.pow(1 + r, -n)) / r; }
  // Idem, paga no início de cada período
  function annuityDueFactor(r, n) { return annuityFactor(r, n) * (1 + r); }
  // Valor futuro de uma série de 1 por período, paga no fim de cada período
  function fvFactor(r, n) { return r === 0 ? n : (Math.pow(1 + r, n) - 1) / r; }

  function irRendaFixa(dias) {
    for (let i = 0; i < IR_RENDA_FIXA.length; i++) if (dias <= IR_RENDA_FIXA[i][0]) return IR_RENDA_FIXA[i][1];
    return 15;
  }
  function iofPct(dias) { return dias >= 30 ? 0 : IOF_TABELA[Math.max(1, Math.round(dias)) - 1]; }
  function aliquotaRegressiva(anos) {
    for (let i = 0; i < PREV_REGRESSIVA.length; i++) if (anos <= PREV_REGRESSIVA[i][0]) return PREV_REGRESSIVA[i][1];
    return 10;
  }
  function irpfTabela(base) {
    base = Math.max(0, base);
    for (let i = 0; i < IRPF_ANUAL.length; i++) {
      if (base <= IRPF_ANUAL[i][0]) return Math.max(0, base * IRPF_ANUAL[i][1] / 100 - IRPF_ANUAL[i][2]);
    }
    return 0;
  }
  function irpfAliquotaMarginal(base) {
    for (let i = 0; i < IRPF_ANUAL.length; i++) if (base <= IRPF_ANUAL[i][0]) return IRPF_ANUAL[i][1];
    return 27.5;
  }
  // Imposto anual já com o redutor da Lei 15.270/2025 (calculado sobre a renda tributável)
  function irpfDevido(rendaTributavel, base) {
    const imposto = irpfTabela(base);
    let red = 0;
    if (rendaTributavel <= IRPF_REDUTOR.isento) red = imposto;
    else if (rendaTributavel <= IRPF_REDUTOR.limite) red = Math.max(0, IRPF_REDUTOR.a - IRPF_REDUTOR.b * rendaTributavel);
    return Math.max(0, imposto - Math.min(imposto, red));
  }

  // Gerador pseudoaleatório com semente (resultados estáveis entre recálculos)
  function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function gaussianMatrix(rows, cols, seed) {
    const rnd = mulberry32(seed);
    const out = [];
    for (let i = 0; i < rows; i++) {
      const row = new Float64Array(cols);
      for (let j = 0; j < cols; j++) {
        let u = rnd(); if (u < 1e-12) u = 1e-12;
        row[j] = Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * rnd());
      }
      out.push(row);
    }
    return out;
  }
  function percentile(sorted, p) {
    if (!sorted.length) return 0;
    const idx = (sorted.length - 1) * p;
    const lo = Math.floor(idx), hi = Math.ceil(idx);
    return sorted[lo] + (sorted[hi] - sorted[lo]) * (idx - lo);
  }
  function columnPercentiles(matrix, cols, ps) {
    const out = ps.map(function () { return []; });
    for (let j = 0; j < cols; j++) {
      const col = [];
      for (let i = 0; i < matrix.length; i++) col.push(matrix[i][j]);
      col.sort(function (a, b) { return a - b; });
      for (let k = 0; k < ps.length; k++) out[k].push(percentile(col, ps[k]));
    }
    return out;
  }
  // Retorno anual lognormal cuja mediana é a taxa informada
  function lognormalReturn(retPct, volPct, z) { return Math.exp(Math.log(1 + retPct / 100) + (volPct / 100) * z) - 1; }

  function portfolioStats(weightsPct) {
    let ret = 0, variance = 0, total = 0;
    const w = ASSET_CLASSES.map(function (c) { const v = num(weightsPct[c.id]) / 100; total += v; return v; });
    for (let i = 0; i < w.length; i++) {
      ret += w[i] * ASSET_CLASSES[i].ret;
      for (let j = 0; j < w.length; j++) variance += w[i] * w[j] * ASSET_CORR[i][j] * ASSET_CLASSES[i].vol * ASSET_CLASSES[j].vol;
    }
    return { ret: ret, vol: Math.sqrt(Math.max(0, variance)), total: total * 100 };
  }
  // Faixa de 95% para um horizonte em anos (retorno e volatilidade em % a.a.)
  function range95(retPct, volPct, years) {
    const mean = (Math.pow(1 + retPct / 100, years) - 1) * 100;
    const sd = volPct * Math.sqrt(years);
    return { lo: mean - 1.96 * sd, hi: mean + 1.96 * sd, mean: mean };
  }
  function stressImpact(weightsPct, scenario) {
    let r = 0;
    ASSET_CLASSES.forEach(function (c) { r += num(weightsPct[c.id]) / 100 * num(scenario.s[c.id]); });
    return r;
  }

  /* ---------- Juros compostos ---------- */
  function simulateGrowth(inicial, aporte, crescPct, rm, meses) {
    let bal = inicial, investido = inicial, ap = aporte;
    const saldo = [bal], inv = [investido];
    let cruzamento = null;
    const marcos = MILESTONES.map(function (v) { return { v: v, mes: inicial >= v ? 0 : null }; });
    for (let m = 1; m <= meses; m++) {
      const juros = bal * rm;
      if (cruzamento === null && ap > 0 && juros >= ap) cruzamento = m;
      bal += juros + ap;
      investido += ap;
      for (let k = 0; k < marcos.length; k++) if (marcos[k].mes === null && bal >= marcos[k].v) marcos[k].mes = m;
      if (m % 12 === 0) { saldo.push(bal); inv.push(investido); ap *= 1 + crescPct / 100; }
    }
    return { bal: bal, investido: investido, saldo: saldo, inv: inv, cruzamento: cruzamento, marcos: marcos };
  }
  function computeJuros(i) {
    const anos = clamp(Math.round(num(i.anos)), 1, 80);
    const taxaLiq = ((1 + num(i.taxa) / 100) * (1 - num(i.custo) / 100) - 1) * 100;
    const rm = rateMonthly(taxaLiq);
    const sim = simulateGrowth(num(i.inicial), num(i.aporte), num(i.crescAporte), rm, anos * 12);
    const infl = num(i.inflacao) / 100;
    const ganho = sim.bal - sim.investido;
    const ir = Math.max(0, ganho) * num(i.ir) / 100;
    const liquido = sim.bal - ir;
    const deflator = Math.pow(1 + infl, anos);
    const taxaReal = ((1 + taxaLiq / 100) / (1 + infl) - 1) * 100;
    const real = sim.saldo.map(function (v, k) { return v / Math.pow(1 + infl, k); });
    const labels = sim.saldo.map(function (v, k) { return k === 0 ? 'Hoje' : k + (k === 1 ? ' ano' : ' anos'); });
    const atr = clamp(Math.round(num(i.atraso)), 0, anos - 1);
    let atraso = null;
    if (atr > 0) {
      const s2 = simulateGrowth(num(i.inicial), num(i.aporte), num(i.crescAporte), rm, (anos - atr) * 12);
      const liq2 = s2.bal - Math.max(0, s2.bal - s2.investido) * num(i.ir) / 100;
      atraso = { anos: atr, liquido: liq2, custo: liquido - liq2 };
    }
    return {
      anos: anos, taxaLiq: taxaLiq, taxaReal: taxaReal, bruto: sim.bal, investido: sim.investido, ganho: ganho, ir: ir,
      liquido: liquido, liquidoReal: liquido / deflator,
      rendaPerpetua: taxaReal > 0 ? (liquido / deflator) * rateMonthly(taxaReal) : 0,
      cruzamento: sim.cruzamento, marcos: sim.marcos, atraso: atraso,
      series: { labels: labels, saldo: sim.saldo, investido: sim.inv, real: real }
    };
  }

  /* ---------- Independência financeira (tudo em valores de hoje) ---------- */
  function necessarioAposentadoria(saqueMensal, anos, retRealPct, legado) {
    const rm = rateMonthly(retRealPct);
    return saqueMensal * annuityDueFactor(rm, anos * 12) + legado / Math.pow(1 + retRealPct / 100, anos);
  }
  function computeIndep(i) {
    const idade = clamp(Math.round(num(i.idade)), 0, 110);
    const idadeApos = clamp(Math.round(num(i.idadeApos)), idade, 115);
    const expect = clamp(Math.round(num(i.expectativa)), idadeApos + 1, 120);
    const nAcc = idadeApos - idade, nRet = expect - idadeApos;
    const rmA = rateMonthly(num(i.retAcum)), rmD = rateMonthly(num(i.retApos));
    const saque = Math.max(0, num(i.rendaDesejada) - num(i.outrasRendas));
    const legado = Math.max(0, num(i.legado));
    const acc = simulateGrowth(num(i.patrimonio), num(i.aporte), num(i.crescAporte), rmA, nAcc * 12);
    const patApos = acc.bal;
    const necessario = necessarioAposentadoria(saque, nRet, num(i.retApos), legado);
    const pvLegado = legado / Math.pow(1 + num(i.retApos) / 100, nRet);
    const rendaSust = Math.max(0, patApos - pvLegado) / annuityDueFactor(rmD, nRet * 12) + num(i.outrasRendas);
    // aporte necessário: o valor futuro é linear no aporte
    const unit = simulateGrowth(0, 1, num(i.crescAporte), rmA, nAcc * 12).bal;
    const semAporte = num(i.patrimonio) * Math.pow(1 + rmA, nAcc * 12);
    const aporteReq = unit > 0 ? Math.max(0, (necessario - semAporte) / unit) : null;
    // trajetória determinística ano a ano
    const labels = [], det = [];
    for (let k = 0; k <= nAcc; k++) { labels.push(String(idade + k)); det.push(acc.saldo[k]); }
    let bal = patApos, idadeFim = null;
    for (let m = 1; m <= nRet * 12; m++) {
      bal = (bal - saque) * (1 + rmD);
      if (bal < 0 && idadeFim === null) idadeFim = idadeApos + Math.floor((m - 1) / 12);
      if (m % 12 === 0) { labels.push(String(idadeApos + m / 12)); det.push(Math.max(0, bal)); }
    }
    // quantos anos a mais de trabalho fecham a conta
    let anosExtras = null;
    for (let k = 0; k <= 30 && idadeApos + k < expect; k++) {
      const p = simulateGrowth(num(i.patrimonio), num(i.aporte), num(i.crescAporte), rmA, (nAcc + k) * 12).bal;
      if (p >= necessarioAposentadoria(saque, nRet - k, num(i.retApos), legado)) { anosExtras = k; break; }
    }
    // Monte Carlo com passos anuais
    const total = nAcc + nRet;
    const z = gaussianMatrix(MC_SIMS, total, MC_SEED);
    const paths = [];
    let ok = 0;
    for (let s = 0; s < MC_SIMS; s++) {
      const path = new Float64Array(total + 1);
      let b = num(i.patrimonio), ap = num(i.aporte) * 12, falhou = false;
      path[0] = b;
      for (let y = 0; y < total; y++) {
        if (y < nAcc) {
          const r = lognormalReturn(num(i.retAcum), num(i.vol), z[s][y]);
          b = b * (1 + r) + ap * Math.sqrt(1 + r);
          ap *= 1 + num(i.crescAporte) / 100;
        } else {
          const r2 = lognormalReturn(num(i.retApos), num(i.vol), z[s][y]);
          b = b * (1 + r2) - saque * 12 * Math.sqrt(1 + r2);
          if (b < 0) { falhou = true; b = 0; }
        }
        path[y + 1] = b;
      }
      if (!falhou && path[total] >= legado * 0.999) ok++;
      paths.push(path);
    }
    const pcs = columnPercentiles(paths, total + 1, [0.1, 0.5, 0.9]);
    return {
      idade: idade, idadeApos: idadeApos, expect: expect, nAcc: nAcc, nRet: nRet, saque: saque,
      patApos: patApos, necessario: necessario, gap: patApos - necessario, rendaSust: rendaSust,
      aporteReq: aporteReq, idadeFim: idadeFim, anosExtras: anosExtras, prob: ok / MC_SIMS * 100,
      series: { labels: labels, det: det, p10: pcs[0], p50: pcs[1], p90: pcs[2] }
    };
  }

  /* ---------- Renda com guardrails ---------- */
  // Retirada anual sustentável: zera o saldo no fim do prazo (mais a margem de segurança), à taxa esperada
  function saqueSustentavel(saldo, anosRestantes, retPct) { return saldo / annuityDueFactor(retPct / 100, anosRestantes + RENDA_MARGEM_ANOS); }
  /* Regra de ajuste (guardrails que consideram o prazo restante): a cada revisão anual compara-se a
     retirada com a sustentável para o prazo que falta. A referência é a relação inicial, limitada a 1
     (um plano que já começa acima do sustentável não é tratado como normal). Se a relação passar da
     referência em mais que a faixa, corta-se a retirada; se ficar abaixo, aumenta-se. */
  function simulateWithdrawals(P0, saqueAnual, anos, retPct, volPct, z, regra) {
    const n = z.length;
    const kRef = Math.min(1, saqueAnual / saqueSustentavel(P0, anos, retPct));
    let ok = 0, cortes = 0, firmes = 0;
    const rendas = [], saldos = [], minimos = [];
    for (let s = 0; s < n; s++) {
      let b = P0, w = saqueAnual, falhou = false, cortou = false, minW = saqueAnual;
      const wPath = new Float64Array(anos), bPath = new Float64Array(anos + 1);
      bPath[0] = b;
      for (let y = 0; y < anos; y++) {
        if (regra && y > 0 && b > 0) {
          const k = w / saqueSustentavel(b, anos - y, retPct);
          if (k > kRef * (1 + regra.faixa)) { w *= 1 - regra.ajuste; cortou = true; }
          else if (k < kRef * (1 - regra.faixa)) w *= 1 + regra.ajuste;
        }
        if (b <= 0) { falhou = true; b = 0; wPath[y] = 0; bPath[y + 1] = 0; minW = 0; continue; }
        const pago = Math.min(w, b);
        if (pago < w - 1e-9) falhou = true;
        if (pago < minW) minW = pago;
        wPath[y] = pago / 12;
        b = (b - pago) * (1 + lognormalReturn(retPct, volPct, z[s][y]));
        bPath[y + 1] = b;
      }
      if (!falhou) ok++;
      if (cortou) cortes++;
      if (!falhou && minW >= saqueAnual * RENDA_PISO_FIRME - 1e-9) firmes++;
      rendas.push(wPath); saldos.push(bPath); minimos.push(minW / 12);
    }
    minimos.sort(function (a, b) { return a - b; });
    return { sucesso: ok / n * 100, cortes: cortes / n * 100, firme: firmes / n * 100, rendas: rendas, saldos: saldos, piorRenda: percentile(minimos, 0.1) };
  }
  function computeRenda(i) {
    const P0 = Math.max(1, num(i.patrimonio));
    const anos = clamp(Math.round(num(i.anos)), 2, 70);
    const saque = Math.max(0, num(i.rendaMensal)) * 12;
    const regra = { faixa: clamp(num(i.faixa), 1, 90) / 100, ajuste: clamp(num(i.ajuste), 1, 50) / 100 };
    const z = gaussianMatrix(MC_SIMS, anos, MC_SEED);
    const fixo = simulateWithdrawals(P0, saque, anos, num(i.ret), num(i.vol), z, null);
    const guard = simulateWithdrawals(P0, saque, anos, num(i.ret), num(i.vol), z, regra);
    const pr = columnPercentiles(guard.rendas, anos, [0.1, 0.5, 0.9]);
    const labels = [];
    for (let y = 1; y <= anos; y++) labels.push('Ano ' + y);
    const sust = saqueSustentavel(P0, anos, num(i.ret));
    const kRef = Math.min(1, saque / sust);
    // limites de patrimônio na próxima revisão anual (falta um ano a menos)
    const fator = annuityDueFactor(num(i.ret) / 100, anos - 1 + RENDA_MARGEM_ANOS);
    return {
      anos: anos, taxaInicial: saque / P0 * 100, fixo: fixo.sucesso, guard: guard.sucesso, firme: guard.firme, cortes: guard.cortes,
      piorRenda: guard.piorRenda, sustentavel: sust / 12, acimaDoSustentavel: saque > sust * 1.0001,
      pisoPatrimonio: kRef > 0 ? saque * fator / (kRef * (1 + regra.faixa)) : 0, tetoPatrimonio: kRef > 0 ? saque * fator / (kRef * (1 - regra.faixa)) : 0,
      rendaCorte: saque / 12 * (1 - regra.ajuste), rendaAumento: saque / 12 * (1 + regra.ajuste),
      series: { labels: labels, p10: pr[0], p50: pr[1], p90: pr[2] }
    };
  }

  /* ---------- Metas ---------- */
  function computeMetas(i) {
    const cap = Math.max(0, num(i.capacidade));
    const metas = (i.rows || []).map(function (g, idx) {
      const anos = Math.max(1 / 12, num(g.anos));
      const ret = anos <= 2 ? num(i.retCurto) : (anos <= 5 ? num(i.retMedio) : num(i.retLongo));
      const rm = rateMonthly(ret), n = Math.round(anos * 12);
      const fvRes = num(g.reservado) * Math.pow(1 + rm, n);
      const falta = Math.max(0, num(g.valor) - fvRes);
      return {
        idx: idx, nome: g.nome || 'Meta', valor: num(g.valor), anos: anos, prio: num(g.prio) || 2, ret: ret,
        pmt: falta / fvFactor(rm, n), pronto: num(g.valor) > 0 ? clamp(fvRes / num(g.valor), 0, 1) * 100 : 100
      };
    });
    const ordem = metas.slice().sort(function (a, b) { return a.prio - b.prio || a.anos - b.anos; });
    let resto = cap;
    ordem.forEach(function (m) {
      m.alocado = Math.min(m.pmt, resto);
      resto -= m.alocado;
      m.cobertura = m.pmt > 0 ? m.alocado / m.pmt * 100 : 100;
    });
    const necessario = sum(metas.map(function (m) { return m.pmt; }));
    return { metas: ordem, necessario: necessario, capacidade: cap, saldo: cap - necessario, cobertas: ordem.filter(function (m) { return m.cobertura >= 99.9; }).length };
  }

  /* ---------- Raio-X financeiro ---------- */
  function benchAposentadoria(idade) {
    const b = RETIRE_BENCH;
    if (idade <= b[0][0]) return b[0][1];
    for (let k = 1; k < b.length; k++) {
      if (idade <= b[k][0]) return b[k - 1][1] + (b[k][1] - b[k - 1][1]) * (idade - b[k - 1][0]) / (b[k][0] - b[k - 1][0]);
    }
    return b[b.length - 1][1];
  }
  function scoreLinear(v, zero, cem) { return clamp((v - zero) / (cem - zero), 0, 1) * 100; }
  function computeRaioX(i) {
    const renda = Math.max(1, num(i.renda)), despesas = Math.max(1, num(i.despesas));
    const ativos = Math.max(1, num(i.investimentos) + num(i.imobilizado));
    const mesesAlvo = RESERVA_MESES[i.tipoRenda] || 6;
    const poup = num(i.aporte) / renda * 100;
    const meses = num(i.reserva) / despesas;
    const parc = num(i.parcelas) / renda * 100;
    const endiv = num(i.dividas) / ativos * 100;
    const liq = num(i.investimentos) / ativos * 100;
    const dep = Math.round(num(i.dependentes));
    const necessidade = renda * 12 * 5;
    const cobertura = (num(i.seguro) + num(i.investimentos)) / necessidade * 100;
    const mult = num(i.investimentos) / (renda * 12);
    const bench = benchAposentadoria(num(i.idade));
    const ind = [
      { id: 'poupanca', nome: 'Taxa de poupança', valor: poup, un: '%', meta: '20% ou mais', score: scoreLinear(poup, 0, 20), acao: 'Elevar o aporte mensal em direção a 20% da renda.' },
      { id: 'reserva', nome: 'Reserva de emergência', valor: meses, un: ' meses', meta: mesesAlvo + ' meses', score: scoreLinear(meses, 0, mesesAlvo), acao: 'Completar a reserva de emergência antes de assumir mais risco.' },
      { id: 'parcelas', nome: 'Renda comprometida com dívidas', valor: parc, un: '%', meta: 'até 15%', score: scoreLinear(parc, 45, 15), acao: 'Reduzir as parcelas: renegociar ou quitar as dívidas mais caras.' },
      { id: 'endividamento', nome: 'Dívidas sobre o patrimônio', valor: endiv, un: '%', meta: 'até 10%', score: scoreLinear(endiv, 60, 10), acao: 'Diminuir o endividamento em relação aos bens.' },
      { id: 'liquidez', nome: 'Patrimônio com liquidez', valor: liq, un: '%', meta: '40% ou mais', score: scoreLinear(liq, 0, 40), acao: 'Aumentar a parcela líquida: o patrimônio está concentrado em bens difíceis de vender.' },
      { id: 'protecao', nome: 'Proteção da família', valor: dep > 0 ? cobertura : null, un: '%', meta: '5 anos de renda', score: dep > 0 ? scoreLinear(cobertura, 0, 100) : 100, acao: 'Contratar ou ampliar o seguro de vida para proteger os dependentes.' },
      { id: 'aposentadoria', nome: 'Rumo da aposentadoria', valor: mult, un: '× renda anual', meta: bench.toFixed(1).replace('.', ',') + '× para a idade', score: bench > 0 ? scoreLinear(mult, 0, bench) : 100, acao: 'Acelerar a acumulação para a aposentadoria.' }
    ];
    let total = 0, pesos = 0;
    ind.forEach(function (x) { total += x.score * HEALTH_WEIGHTS[x.id]; pesos += HEALTH_WEIGHTS[x.id]; });
    const nota = total / pesos;
    const prioridades = ind.filter(function (x) { return x.score < 80; }).sort(function (a, b) { return a.score - b.score; }).slice(0, 3);
    return { nota: nota, faixa: nota >= 85 ? 'Excelente' : (nota >= 70 ? 'Bom' : (nota >= 50 ? 'Atenção' : 'Crítico')), indicadores: ind, prioridades: prioridades };
  }

  /* ---------- Perfil de risco ---------- */
  function profileIndex(score) { for (let k = 0; k < RISK_CUTS.length; k++) if (score <= RISK_CUTS[k]) return k; return 3; }
  function computeRisco(i) {
    let cap = 0, tol = 0, respondidas = 0;
    RISK_QUESTIONS.forEach(function (q) {
      const v = i[q.k];
      if (v === null || v === undefined || v === '') return;
      respondidas++;
      if (q.dim === 'cap') cap += num(v); else tol += num(v);
    });
    const completo = respondidas === RISK_QUESTIONS.length;
    const capIdx = profileIndex(cap), tolIdx = profileIndex(tol);
    const idx = Math.min(capIdx, tolIdx);
    const pat = num(i.patrimonio);
    const tabela = PROFILES.map(function (p) {
      const st = portfolioStats(MODEL_PORTFOLIOS[p.id]);
      const r6 = range95(st.ret, st.vol, 0.5);
      return { id: p.id, nome: p.name, ret: st.ret, vol: st.vol, lo: r6.lo, hi: r6.hi, loRs: pat * r6.lo / 100, hiRs: pat * r6.hi / 100 };
    });
    return { completo: completo, respondidas: respondidas, cap: cap, tol: tol, capIdx: capIdx, tolIdx: tolIdx, idx: idx, perfil: PROFILES[idx], tabela: tabela, divergente: completo && capIdx !== tolIdx };
  }

  /* ---------- Raio-X de custos ---------- */
  function computeCustos(i) {
    const rows = (i.rows || []).map(function (r) {
      const c = num(r.adm) + num(r.perf) + num(r.outros);
      return { nome: r.nome || 'Produto', valor: num(r.valor), custoPct: c, custoRs: num(r.valor) * c / 100 };
    });
    const total = sum(rows.map(function (r) { return r.valor; }));
    const custoRs = sum(rows.map(function (r) { return r.custoRs; }));
    const custoPct = total > 0 ? custoRs / total * 100 : 0;
    const anos = clamp(Math.round(num(i.anos)), 1, 60);
    const r = num(i.retBruto) / 100;
    const novoPct = num(i.custoNovo) + num(i.fee);
    const fAtual = (1 + r) * (1 - custoPct / 100), fNovo = (1 + r) * (1 - novoPct / 100);
    const labels = [], atual = [], novo = [], semCusto = [];
    for (let y = 0; y <= anos; y++) {
      labels.push(y === 0 ? 'Hoje' : y + (y === 1 ? ' ano' : ' anos'));
      atual.push(total * Math.pow(fAtual, y)); novo.push(total * Math.pow(fNovo, y)); semCusto.push(total * Math.pow(1 + r, y));
    }
    return {
      rows: rows.slice().sort(function (a, b) { return b.custoRs - a.custoRs; }), total: total, custoRs: custoRs, custoPct: custoPct,
      novoPct: novoPct, novoRs: total * novoPct / 100, anos: anos, fvAtual: atual[anos], fvNovo: novo[anos],
      diferenca: novo[anos] - atual[anos], custoAcumulado: semCusto[anos] - atual[anos],
      series: { labels: labels, atual: atual, novo: novo }
    };
  }

  /* ---------- Renda fixa ---------- */
  function poupancaMensal(selicPct, trPct) {
    const base = selicPct > POUPANCA_GATILHO_SELIC ? POUPANCA_TAXA_MENSAL / 100 : rateMonthly(selicPct) * POUPANCA_PCT_SELIC / 100;
    return (1 + base) * (1 + rateMonthly(trPct)) - 1;
  }
  function fatorBruto(tipo, taxa, dias, cdiPct, ipcaPct, selicPct, trPct) {
    const du = Math.round(dias * 252 / 365);
    if (tipo === 'cdi') return Math.pow(1 + (Math.pow(1 + cdiPct / 100, 1 / 252) - 1) * taxa / 100, du);
    if (tipo === 'pre') return Math.pow(1 + taxa / 100, du / 252);
    if (tipo === 'ipca') return Math.pow((1 + ipcaPct / 100) * (1 + taxa / 100), du / 252);
    return Math.pow(1 + poupancaMensal(selicPct, trPct), Math.floor(dias / 30));
  }
  function computeRendaFixa(i, env) {
    const valor = Math.max(0, num(i.valor)), dias = clamp(Math.round(num(i.dias)), 1, 36500);
    const cdi = num(i.cdi), ipca = num(i.ipca);
    const selic = env.premissas.selic, tr = env.premissas.tr;
    const du = Math.round(dias * 252 / 365);
    const cdiDia = Math.pow(1 + cdi / 100, 1 / 252) - 1;
    const aliq = irRendaFixa(dias), iof = iofPct(dias);
    const rows = (i.rows || []).map(function (r) {
      const isento = !!r.isento || r.tipo === 'poup';
      const f = fatorBruto(r.tipo, num(r.taxa), dias, cdi, ipca, selic, tr) * Math.pow(1 - num(r.custo) / 100, dias / 365);
      const ganho = valor * (f - 1);
      const vIof = isento ? 0 : Math.max(0, ganho) * iof / 100;
      const vIr = isento ? 0 : Math.max(0, ganho - vIof) * aliq / 100;
      const liquido = valor + ganho - vIof - vIr;
      const liqAa = valor > 0 ? (Math.pow(liquido / valor, 365 / dias) - 1) * 100 : 0;
      // CDB tributado que entrega o mesmo líquido
      const fEq = 1 + (liquido / Math.max(1, valor) - 1) / (1 - aliq / 100);
      const equiv = cdiDia > 0 && du > 0 && fEq > 0 ? (Math.pow(fEq, 1 / du) - 1) / cdiDia * 100 : 0;
      return { nome: r.nome || 'Título', tipo: r.tipo, isento: isento, bruto: valor + ganho, ir: vIr + vIof, liquido: liquido, liqAa: liqAa, realAa: ((1 + liqAa / 100) / (1 + ipca / 100) - 1) * 100, equiv: equiv };
    }).sort(function (a, b) { return b.liquido - a.liquido; });
    const mtm = [-2, -1, -0.5, 0.5, 1, 2].map(function (d) {
      const nova = num(i.mtmTaxa) + d;
      return { delta: d, nova: nova, variacao: (Math.pow((1 + num(i.mtmTaxa) / 100) / (1 + nova / 100), num(i.mtmAnos)) - 1) * 100 };
    });
    return { rows: rows, aliq: aliq, iof: iof, dias: dias, valor: valor, mtm: mtm };
  }

  /* ---------- Alocação e rebalanceamento ---------- */
  function computeAlocacao(i) {
    const rows = i.rows || [];
    const total = sum(rows.map(function (r) { return Math.max(0, num(r.atual)); }));
    const aporte = Math.max(0, num(i.aporte));
    const somaAlvo = sum(rows.map(function (r) { return num(r.alvo); }));
    const final = total + aporte;
    const out = rows.map(function (r) {
      const atual = Math.max(0, num(r.atual));
      return { id: r.id, nome: r.nome, atual: atual, atualPct: total > 0 ? atual / total * 100 : 0, alvo: num(r.alvo), alvoRs: final * num(r.alvo) / 100, ordem: 0 };
    });
    if (i.modo === 'completo') {
      out.forEach(function (r) { r.ordem = r.alvoRs - r.atual; });
    } else {
      const deficits = out.map(function (r) { return Math.max(0, r.alvoRs - r.atual); });
      const somaDef = sum(deficits);
      out.forEach(function (r, k) { r.ordem = somaDef > 0 ? aporte * deficits[k] / somaDef : aporte * r.alvo / Math.max(1, somaAlvo); });
    }
    const wAtual = {}, wAlvo = {}, wDepois = {};
    out.forEach(function (r) {
      r.depois = r.atual + r.ordem;
      r.depoisPct = final > 0 ? r.depois / final * 100 : 0;
      r.desvio = r.atualPct - r.alvo;
      wAtual[r.id] = r.atualPct; wAlvo[r.id] = r.alvo; wDepois[r.id] = r.depoisPct;
    });
    const sAtual = portfolioStats(wAtual), sAlvo = portfolioStats(wAlvo);
    const stress = STRESS_SCENARIOS.map(function (s) { return { nome: s.name, atual: stressImpact(wAtual, s), alvo: stressImpact(wAlvo, s) }; });
    return {
      rows: out, total: total, final: final, somaAlvo: somaAlvo, valido: Math.abs(somaAlvo - 100) < 0.01,
      atual: sAtual, alvo: sAlvo, rAtual: range95(sAtual.ret, sAtual.vol, 1), rAlvo: range95(sAlvo.ret, sAlvo.vol, 1), stress: stress,
      desvioMax: Math.max.apply(null, out.map(function (r) { return Math.abs(r.desvio); }).concat([0])),
      giro: sum(out.map(function (r) { return Math.abs(r.ordem); }))
    };
  }

  /* ---------- PGBL e imposto de renda ---------- */
  function irCompleta(i, pgbl) {
    const renda = num(i.rendaAnual);
    const dedPgbl = i.contribui ? Math.min(pgbl, renda * PGBL_LIMITE_PCT / 100) : 0;
    const ded = num(i.inss) + Math.round(num(i.dependentes)) * IRPF_DEPENDENTE + num(i.saude) + num(i.educacao) + num(i.pensao) + dedPgbl;
    return irpfDevido(renda, renda - ded);
  }
  function previdenciaLongoPrazo(aporteAnual, restituicaoPct, anos, retPct) {
    let pgbl = 0, restit = 0, vgbl = 0, fundo = 0;
    const r = retPct / 100;
    const semestre = 1 + (Math.sqrt(1 + r) - 1) * (1 - COME_COTAS_PCT / 100);
    for (let k = 0; k < anos; k++) {
      const idade = anos - k, fv = aporteAnual * Math.pow(1 + r, idade), al = aliquotaRegressiva(idade) / 100;
      pgbl += fv * (1 - al);
      vgbl += fv - (fv - aporteAnual) * al;
      fundo += aporteAnual * Math.pow(semestre, 2 * idade);
      if (idade > 1) {
        const c = aporteAnual * restituicaoPct / 100, fr = c * Math.pow(1 + r, idade - 1);
        restit += fr - (fr - c) * aliquotaRegressiva(idade - 1) / 100;
      } else restit += aporteAnual * restituicaoPct / 100;
    }
    return { pgbl: pgbl + restit, vgbl: vgbl, fundo: fundo, investido: aporteAnual * anos };
  }
  function computePgbl(i) {
    const renda = Math.max(0, num(i.rendaAnual));
    const limite = i.contribui ? renda * PGBL_LIMITE_PCT / 100 : 0;
    const feito = Math.max(0, num(i.pgblFeito));
    const espaco = Math.max(0, limite - feito);
    const simplificada = irpfDevido(renda, renda - Math.min(renda * IRPF_SIMPLIFICADO_PCT / 100, IRPF_SIMPLIFICADO_TETO));
    const completaHoje = irCompleta(i, feito);
    const completaMax = irCompleta(i, limite);
    const semAporte = Math.min(simplificada, completaHoje);
    const economia = Math.max(0, semAporte - completaMax);
    // menor aporte adicional que já captura toda a economia
    let ideal = 0;
    if (economia > 0.5) {
      let lo = 0, hi = espaco;
      for (let k = 0; k < 40; k++) {
        const mid = (lo + hi) / 2;
        if (irCompleta(i, feito + mid) <= completaMax + 0.005) hi = mid; else lo = mid;
      }
      ideal = espaco - hi < 1 ? espaco : Math.ceil(hi * 100) / 100;
    }
    const curvaX = [], curvaCompleta = [], curvaSimpl = [];
    const maxX = Math.max(limite, feito, 1);
    for (let k = 0; k <= 24; k++) {
      const x = maxX * k / 24;
      curvaX.push(x); curvaCompleta.push(irCompleta(i, x)); curvaSimpl.push(simplificada);
    }
    const anos = clamp(Math.round(num(i.anos)), 1, 60);
    const retornoImediato = ideal > 0 ? economia / ideal * 100 : 0;
    const base = ideal > 0 ? ideal : (limite > 0 ? limite : renda * PGBL_LIMITE_PCT / 100);
    return {
      limite: limite, espaco: espaco, simplificada: simplificada, completaHoje: completaHoje, completaMax: completaMax,
      economia: economia, ideal: ideal, retornoImediato: retornoImediato, melhor: completaMax < simplificada ? 'completa' : 'simplificada',
      vale: economia > 0.5, anos: anos, longo: previdenciaLongoPrazo(base, retornoImediato, anos, num(i.retorno)), aporteLongo: base,
      curva: { x: curvaX, completa: curvaCompleta, simplificada: curvaSimpl }
    };
  }

  /* ---------- Reserva e seguro de vida ---------- */
  function computeProtecao(i) {
    const meses = RESERVA_MESES[i.tipoRenda] || 6;
    const alvo = num(i.despesas) * meses;
    const rm = rateMonthly(num(i.taxaReal));
    const anos = clamp(Math.round(num(i.anosCobertura)), 0, 80);
    const renda = num(i.despesasFamilia) * annuityDueFactor(rm, anos * 12);
    const necessidades = [
      { l: 'Renda para a família', v: renda }, { l: 'Dívidas a quitar', v: num(i.dividas) },
      { l: 'Educação dos filhos', v: num(i.educacao) }, { l: 'Custos de inventário', v: num(i.inventario) }
    ];
    const recursos = [{ l: 'Investimentos disponíveis', v: num(i.patrimonio) }, { l: 'Seguros já contratados', v: num(i.seguros) }];
    const totalNec = sum(necessidades.map(function (x) { return x.v; })), totalRec = sum(recursos.map(function (x) { return x.v; }));
    return {
      meses: meses, reservaAlvo: alvo, reservaFalta: Math.max(0, alvo - num(i.reservaAtual)), reservaMeses: num(i.despesas) > 0 ? num(i.reservaAtual) / num(i.despesas) : 0,
      necessidades: necessidades, recursos: recursos, totalNec: totalNec, totalRec: totalRec, seguro: Math.max(0, totalNec - totalRec)
    };
  }

  /* ---------- Sucessão ---------- */
  function computeSucessao(i) {
    const bens = num(i.imoveis) + num(i.empresa) + num(i.investimentos) + num(i.outros);
    const espolio = Math.max(0, bens - num(i.dividas));
    const base = espolio * (1 - num(i.meacao) / 100);
    const itcmd = base * num(i.aliquota) / 100;
    const honor = base * num(i.honorarios) / 100, custas = base * num(i.custas) / 100;
    const total = itcmd + honor + custas;
    const liquidez = num(i.previdencia) + num(i.seguro);
    const herdeiros = Math.max(1, Math.round(num(i.herdeiros)));
    const itcmdTeto = base * ITCMD_TETO / 100;
    return {
      espolio: espolio, base: base, itcmd: itcmd, honorarios: honor, custas: custas, total: total, pct: base > 0 ? total / base * 100 : 0,
      liquidez: liquidez, falta: Math.max(0, total - liquidez), sobra: Math.max(0, liquidez - total),
      porHerdeiro: (base - total + liquidez) / herdeiros, itcmdTeto: itcmdTeto, aumentoTeto: Math.max(0, itcmdTeto - itcmd), herdeiros: herdeiros
    };
  }

  /* ---------- Imóvel e financiamento ---------- */
  function amortizationSchedule(pv, im, n, sistema, extra) {
    let bal = pv, juros = 0, pago = 0, meses = 0, primeira = 0, ultima = 0;
    const amortSac = pv / n;
    const pmt = im === 0 ? pv / n : pv * im / (1 - Math.pow(1 + im, -n));
    const saldo = [pv], parcelas = [];
    while (bal > 0.005 && meses < n) {
      const j = bal * im;
      let amort = sistema === 'sac' ? amortSac : pmt - j;
      amort = Math.min(bal, amort + (extra || 0));
      const parcela = j + amort;
      bal -= amort; juros += j; pago += parcela; meses++;
      if (meses === 1) primeira = parcela;
      ultima = parcela;
      parcelas.push(parcela);
      if (meses % 12 === 0) saldo.push(Math.max(0, bal));
    }
    return { juros: juros, pago: pago, meses: meses, primeira: primeira, ultima: ultima, saldo: saldo, parcelas: parcelas };
  }
  function computeImovel(i) {
    const valor = Math.max(0, num(i.valorImovel));
    const pv = Math.max(0, valor - num(i.entrada));
    const n = clamp(Math.round(num(i.prazo)), 1, 600);
    const im = rateMonthly(num(i.taxa));
    const sac = amortizationSchedule(pv, im, n, 'sac', 0), price = amortizationSchedule(pv, im, n, 'price', 0);
    const esc = i.sistema === 'price' ? price : sac;
    const extra = Math.max(0, num(i.extra));
    const comExtra = amortizationSchedule(pv, im, n, i.sistema === 'price' ? 'price' : 'sac', extra);
    // comprar × alugar: quem gasta menos no mês investe a diferença
    const H = clamp(Math.round(num(i.horizonte)), 1, 60);
    const ri = rateMonthly(num(i.retInvest));
    const inicial = num(i.entrada) + valor * num(i.custoCompra) / 100;
    let invCompra = 0, invAluguel = inicial, aluguel = num(i.aluguel), imovel = valor, saldo = pv;
    const amortSac = pv / n, pmt = im === 0 ? pv / n : pv * im / (1 - Math.pow(1 + im, -n));
    const serieCompra = [valor - pv], serieAluguel = [inicial], labels = ['Hoje'];
    for (let m = 1; m <= H * 12; m++) {
      let parcela = 0;
      if (saldo > 0.005 && m <= n) {
        const j = saldo * im;
        const am = Math.min(saldo, i.sistema === 'price' ? pmt - j : amortSac);
        parcela = j + am; saldo -= am;
      }
      const gastoCompra = parcela + imovel * num(i.custosProp) / 100 / 12;
      invCompra *= 1 + ri; invAluguel *= 1 + ri;
      if (gastoCompra > aluguel) invAluguel += gastoCompra - aluguel; else invCompra += aluguel - gastoCompra;
      imovel *= 1 + rateMonthly(num(i.valorizacao));
      if (m % 12 === 0) {
        aluguel *= 1 + num(i.reajuste) / 100;
        labels.push(m / 12 + (m === 12 ? ' ano' : ' anos'));
        serieCompra.push(imovel - Math.max(0, saldo) + invCompra); serieAluguel.push(invAluguel);
      }
    }
    const patCompra = serieCompra[serieCompra.length - 1], patAluguel = serieAluguel[serieAluguel.length - 1];
    return {
      financiado: pv, sac: sac, price: price, escolhido: esc, comExtra: comExtra, extra: extra,
      jurosPoupados: esc.juros - comExtra.juros, mesesPoupados: esc.meses - comExtra.meses,
      horizonte: H, patCompra: patCompra, patAluguel: patAluguel, vantagem: patCompra - patAluguel,
      series: { labels: labels, compra: serieCompra, aluguel: serieAluguel }
    };
  }

  /* =====================================================================
     3. FORMATAÇÃO E GRÁFICOS
     ===================================================================== */
  function esc(s) { return String(s === null || s === undefined ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function numf(v, dec) { return num(v).toLocaleString('pt-BR', { minimumFractionDigits: dec || 0, maximumFractionDigits: dec || 0 }); }
  function brl(v) { v = num(v); return (v < 0 ? '−R$ ' : 'R$ ') + NF0.format(Math.abs(Math.round(v))); }
  function brlK(v) {
    v = num(v); const a = Math.abs(v), s = v < 0 ? '−' : '';
    if (a >= 1e9) return s + 'R$ ' + numf(a / 1e9, 1) + ' bi';
    if (a >= 1e6) return s + 'R$ ' + numf(a / 1e6, a >= 1e7 ? 0 : 1) + ' mi';
    if (a >= 1e3) return s + 'R$ ' + numf(a / 1e3, 0) + ' mil';
    return s + 'R$ ' + numf(a, 0);
  }
  function pct(v, dec) { return numf(v, dec === undefined ? 1 : dec).replace('-', '−') + '%'; }
  function signedPct(v, dec) { return (v > 0 ? '+' : '') + pct(v, dec); }
  function signedBrl(v) { return (v > 0 ? '+' : '') + brl(v); }
  function tempo(meses) {
    const a = Math.floor(meses / 12), m = meses % 12;
    const pa = a ? a + (a === 1 ? ' ano' : ' anos') : '', pm = m ? m + (m === 1 ? ' mês' : ' meses') : '';
    return pa && pm ? pa + ' e ' + pm : (pa || pm || 'agora');
  }
  function icon(name) { return '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">' + (ICONS[name] || '') + '</svg>'; }

  function niceStep(range, n) {
    if (!(range > 0)) return 1;
    const raw = range / n, mag = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / mag;
    return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * mag;
  }
  // Gráfico de linhas com faixa opcional. series: [{ name, values, c, area, dash }]
  function lineChart(o) {
    const id = 'ch' + (++chartSeq);
    const W = o.w || CHART_W, H = o.h || 300, P = CHART_PAD;
    const n = o.labels.length;
    let max = -Infinity, min = 0;
    o.series.forEach(function (s) { s.values.forEach(function (v) { if (v > max) max = v; if (v < min) min = v; }); });
    if (o.band) { o.band.hi.forEach(function (v) { if (v > max) max = v; }); o.band.lo.forEach(function (v) { if (v < min) min = v; }); }
    if (!(max > min)) max = min + 1;
    const step = niceStep(max - min, 4);
    const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step;
    const X = function (k) { return P.l + (W - P.l - P.r) * (n > 1 ? k / (n - 1) : 0.5); };
    const Y = function (v) { return P.t + (H - P.t - P.b) * (1 - (v - lo) / (hi - lo)); };
    const fa = o.fmtAxis || brlK;
    let g = '';
    for (let v = lo; v <= hi + step / 2; v += step) {
      g += '<line class="grid" x1="' + P.l + '" x2="' + (W - P.r) + '" y1="' + Y(v).toFixed(1) + '" y2="' + Y(v).toFixed(1) + '"/>';
      g += '<text x="' + (P.l - 10) + '" y="' + (Y(v) + 4).toFixed(1) + '" text-anchor="end">' + esc(fa(v)) + '</text>';
    }
    const ticks = Math.min(n, W < 600 ? 5 : 7);
    for (let t = 0; t < ticks; t++) {
      const k = ticks > 1 ? Math.round(t * (n - 1) / (ticks - 1)) : 0;
      g += '<text x="' + X(k).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="' + (t === 0 ? 'start' : (t === ticks - 1 ? 'end' : 'middle')) + '">' + esc(o.labels[k]) + '</text>';
    }
    if (o.band) {
      let d = '';
      for (let k = 0; k < n; k++) d += (k ? 'L' : 'M') + X(k).toFixed(1) + ' ' + Y(o.band.hi[k]).toFixed(1);
      for (let k = n - 1; k >= 0; k--) d += 'L' + X(k).toFixed(1) + ' ' + Y(o.band.lo[k]).toFixed(1);
      g += '<path d="' + d + 'Z" fill="var(' + o.band.c + ')" opacity="0.16"/>';
    }
    o.series.forEach(function (s) {
      let d = '';
      for (let k = 0; k < n; k++) d += (k ? 'L' : 'M') + X(k).toFixed(1) + ' ' + Y(s.values[k]).toFixed(1);
      if (s.area) g += '<path d="' + d + 'L' + X(n - 1).toFixed(1) + ' ' + Y(lo).toFixed(1) + 'L' + X(0).toFixed(1) + ' ' + Y(lo).toFixed(1) + 'Z" fill="var(' + s.c + ')" opacity="0.1"/>';
      g += '<path d="' + d + '" fill="none" stroke="var(' + s.c + ')" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"' + (s.dash ? ' stroke-dasharray="5 5"' : '') + '/>';
      g += '<circle cx="' + X(n - 1).toFixed(1) + '" cy="' + Y(s.values[n - 1]).toFixed(1) + '" r="4" fill="var(' + s.c + ')" stroke="var(--surface)" stroke-width="2"/>';
    });
    g += '<line class="xh" y1="' + P.t + '" y2="' + (H - P.b) + '"/>';
    let legend = '';
    if (o.series.length + (o.band ? 1 : 0) > 1) {
      legend = '<div class="legend">' + o.series.map(function (s) { return '<span><i style="background:var(' + s.c + ')"></i>' + esc(s.name) + '</span>'; }).join('') +
        (o.band ? '<span><i class="band" style="background:var(' + o.band.c + ')"></i>' + esc(o.band.name) + '</span>' : '') + '</div>';
    }
    chartReg[id] = { o: o, n: n, w: W };
    return '<div class="chart" data-chart="' + id + '">' + legend + '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(o.title || 'Gráfico') + '">' + g + '</svg></div>';
  }
  // Barras horizontais. rows: [{ l, sub, v, t, c, v2, mark }]
  function barList(rows, o) {
    o = o || {};
    let max = o.max || 0;
    if (!o.max) rows.forEach(function (r) { max = Math.max(max, Math.abs(num(r.v)), Math.abs(num(r.v2))); });
    if (!(max > 0)) max = 1;
    const w = function (v) { return clamp(Math.abs(num(v)) / max * 100, 0, 100).toFixed(2); };
    return '<div class="bars' + (o.two ? ' two' : '') + '">' + rows.map(function (r) {
      return '<div class="bar-row"><div class="bl">' + esc(r.l) + (r.sub ? '<small>' + esc(r.sub) + '</small>' : '') + '</div>' +
        '<div class="bar-track"><div class="bar-fill" style="width:' + w(r.v) + '%' + (r.c ? ';background:var(' + r.c + ')' : '') + '"></div>' +
        (o.two ? '<div class="bar-fill b2" style="width:' + w(r.v2) + '%"></div>' : '') +
        (r.mark !== undefined ? '<div class="bar-mark" style="left:' + w(r.mark) + '%"></div>' : '') + '</div>' +
        '<div class="bv">' + (r.t || '') + '</div></div>';
    }).join('') + '</div>';
  }
  function card(title, sub, body) { return '<div class="card">' + (title ? '<h3 class="card-t">' + esc(title) + '</h3>' : '') + (sub ? '<p class="card-s">' + esc(sub) + '</p>' : '') + body + '</div>'; }
  function legendTwo(a, b) { return '<div class="legend"><span><i style="background:var(--c1)"></i>' + esc(a) + '</span><span><i style="background:var(--c2)"></i>' + esc(b) + '</span></div>'; }
  function table(head, rows, o) {
    o = o || {};
    return '<table class="t"><thead><tr>' + head.map(function (h) { return '<th>' + esc(h) + '</th>'; }).join('') + '</tr></thead><tbody>' +
      rows.map(function (r, k) { return '<tr' + (o.best === k ? ' class="best"' : '') + '>' + r.map(function (c, j) { return '<td' + (o.best === k && j === 0 ? ' data-badge="' + esc(o.badge || 'melhor') + '"' : '') + '>' + c + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody>' +
      (o.foot ? '<tfoot><tr>' + o.foot.map(function (c) { return '<td>' + c + '</td>'; }).join('') + '</tr></tfoot>' : '') + '</table>';
  }

  /* =====================================================================
     4. LEITURA DE CADA FERRAMENTA — devolve { kpis, insight, chart, blocks, warn }
     ===================================================================== */
  function viewRaioX(r) {
    const forte = r.indicadores.slice().sort(function (a, b) { return b.score - a.score; })[0];
    const fraco = r.indicadores.slice().sort(function (a, b) { return a.score - b.score; })[0];
    const fmtVal = function (x) { return x.valor === null ? 'sem dependentes' : (x.un === '%' ? pct(x.valor, 0) : numf(x.valor, 1) + x.un); };
    return {
      kpis: [
        { l: 'Saúde financeira', v: numf(r.nota, 0) + ' <span style="font-size:15px;color:var(--muted);font-weight:400">de 100</span>', s: r.faixa },
        { l: 'Ponto mais forte', v: numf(forte.score, 0), s: forte.nome },
        { l: 'Ponto mais fraco', v: numf(fraco.score, 0), s: fraco.nome }
      ],
      insight: 'Nota <b>' + numf(r.nota, 0) + ' de 100</b>. ' + (r.prioridades.length ? 'A prioridade agora é <b>' + esc(r.prioridades[0].nome.toLowerCase()) + '</b>' + (r.prioridades[1] ? ', seguida de ' + esc(r.prioridades[1].nome.toLowerCase()) : '') + '.' : 'Todos os indicadores estão no nível recomendado.'),
      chart: card('Os sete indicadores', 'Nota de 0 a 100 em cada um', barList(r.indicadores.map(function (x) { return { l: x.nome, sub: 'meta: ' + x.meta, v: x.score, t: fmtVal(x) }; }), { max: 100 })),
      blocks: r.prioridades.length ? [card('Plano de ação', '', table(['Prioridade', 'Nota'], r.prioridades.map(function (p, k) { return [(k + 1) + '. ' + esc(p.acao), numf(p.score, 0)]; })))] : []

  /* =====================================================================
     5. ARMAZENAMENTO — IndexedDB com wrapper em Promise e estado versionado
     ===================================================================== */
  function openDb() {
    return new Promise(function (resolve, reject) {
      let req;
      try { req = window.indexedDB.open(DB_NAME, DB_VERSION); } catch (e) { reject(e); return; }
      req.onupgradeneeded = function () { if (!req.result.objectStoreNames.contains(DB_STORE)) req.result.createObjectStore(DB_STORE); };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error); };
      req.onblocked = function () { reject(new Error('Banco de dados bloqueado')); };
    });
  }
  function idbRequest(mode, fn) {
    return new Promise(function (resolve, reject) {
      const tx = dbHandle.transaction(DB_STORE, mode);
      const req = fn(tx.objectStore(DB_STORE));
      tx.oncomplete = function () { resolve(req.result); };
      tx.onerror = function () { reject(tx.error); };
      tx.onabort = function () { reject(tx.error); };
    });
  }
  function idbGet(key) { return idbRequest('readonly', function (s) { return s.get(key); }); }
  function idbPut(key, value) { return idbRequest('readwrite', function (s) { return s.put(value, key); }); }

  function defaultState() {
    return {
      schemaVersion: CURRENT_SCHEMA_VERSION,
      settings: { empresa: BRAND_DEFAULT, tagline: TAGLINE_DEFAULT, consultor: '', registro: '', contato: '', premissas: Object.assign({}, DEFAULT_PREMISSAS) },
      clients: [], activeClientId: null, sandbox: { tools: {} }, reportSkip: {}
    };
  }
  function migrateState(s) {
    let v = num(s.schemaVersion, 1);
    while (v < CURRENT_SCHEMA_VERSION) {
      if (MIGRATIONS[v]) s = MIGRATIONS[v](s);
      v++;
    }
    s.schemaVersion = CURRENT_SCHEMA_VERSION;
    return s;
  }
  function normalizeState(s) {
    const d = defaultState();
    if (!s || typeof s !== 'object') return d;
    s = migrateState(s);
    s.settings = Object.assign({}, d.settings, s.settings || {});
    s.settings.premissas = Object.assign({}, DEFAULT_PREMISSAS, s.settings.premissas || {});
    s.clients = Array.isArray(s.clients) ? s.clients.filter(function (c) { return c && c.id; }) : [];
    s.clients.forEach(function (c) { if (!c.tools || typeof c.tools !== 'object') c.tools = {}; });
    if (!s.sandbox || typeof s.sandbox.tools !== 'object') s.sandbox = { tools: {} };
    if (!s.reportSkip || typeof s.reportSkip !== 'object') s.reportSkip = {};
    if (!s.clients.some(function (c) { return c.id === s.activeClientId; })) s.activeClientId = null;
    return s;
  }
  function loadState() {
    return openDb().then(function (db) { dbHandle = db; return idbGet(STATE_KEY); }).then(function (saved) {
      state = normalizeState(saved);
    }).catch(function () {

      state = defaultState();
    });
  }
  function persistNow() {
    saveQueued = false;

  }
  // Várias alterações na mesma rodada viram uma única gravação (microtask, sem setTimeout)

    saveQueued = true;
    Promise.resolve().then(persistNow);
  }

  function toolStore() { const c = activeClient(); return c ? c.tools : state.sandbox.tools; }
  function getEnv() { return { premissas: state.settings.premissas, facts: activeClient() || {} }; }
  function toolDef(id) { return TOOL_DEFS.filter(function (t) { return t.id === id; })[0] || null; }
  function clone(v) { return JSON.parse(JSON.stringify(v === undefined ? null : v)); }
  function buildDefaults(def, env) {
    const o = {};

  }
  function getInputs(id) {

  function parseNum(s, t) {
    if (typeof s === 'number') return s;
    s = String(s === null || s === undefined ? '' : s).replace(/[^\d,.\-]/g, '');
    if (!s) return 0;
    if (s.indexOf(',') >= 0) s = s.replace(/\./g, '').replace(',', '.');
    else if ((t === 'money' || t === 'int') && /^-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');

    return t === 'int' ? Math.round(v) : v;
  }
