  /* =====================================================================
   * 3. UTILITÁRIOS
   * ===================================================================== */

  function escapeHtml(value) {
    return String(value == null ? '' : value).replace(/[&<>"']/g, function (ch) { return HTML_ESCAPES[ch]; });
  }

  function normalizeText(value) {
    return String(value == null ? '' : value).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
  }

  function clamp(n, min, max) {
    return Math.max(min, Math.min(max, n));
  }

  function pad2(n) {
    return (n < 10 ? '0' : '') + n;
  }

  function formatClock(d) {
    return pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds()) + ' - ' +
      pad2(d.getDate()) + '/' + pad2(d.getMonth() + 1) + '/' + d.getFullYear();
  }

  function plural(n, one, many) {
    return n + ' ' + (n === 1 ? one : many);
  }

  function describeError(err) {
    return err && err.message ? err.message : String(err);
  }

  function isEditable(el) {
    return !!(el && el.closest && el.closest('input, textarea, select, [contenteditable="true"]'));
  }

  /* =====================================================================
   * 4. ARMAZENAMENTO — wrapper Promise para IndexedDB
   *    Toda leitura/gravação passa por aqui (as telas nunca tocam no IndexedDB
   *    diretamente), para que um dia dê para trocar por um servidor.
   * ===================================================================== */

  function openDatabase() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise(function (resolve, reject) {
      if (!window.indexedDB) {
        reject(new Error('IndexedDB não está disponível neste navegador.'));
        return;
      }
      let request;
      try {
        request = window.indexedDB.open(DB_NAME, DB_VERSION);
      } catch (err) {
        reject(err);
        return;
      }
      request.addEventListener('upgradeneeded', function (e) {
        const db = request.result;
        for (let v = e.oldVersion + 1; v <= DB_VERSION; v++) {
          if (DB_UPGRADES[v]) DB_UPGRADES[v](db, request.transaction);
        }
      });
      request.addEventListener('success', function () {
        const db = request.result;
        db.addEventListener('versionchange', function () {
          db.close();
          dbPromise = null;
          showToast('O sistema foi atualizado em outra aba. Recarregue esta página.', { type: 'warning' });
        });
        resolve(db);
      });
      request.addEventListener('error', function () {
        reject(request.error || new Error('Falha ao abrir o IndexedDB.'));
      });
      request.addEventListener('blocked', function () {
        showToast('Feche as outras abas do sistema para concluir a atualização do banco.', { type: 'warning' });
      });
    });
    dbPromise.catch(function () { dbPromise = null; });
    return dbPromise;
  }

  function idbTransaction(storeName, mode, operation) {
    return openDatabase().then(function (db) {
      return new Promise(function (resolve, reject) {
        let tx;
        try {
          tx = db.transaction(storeName, mode);
        } catch (err) {
          reject(err);
          return;
        }
        const request = operation(tx.objectStore(storeName));
        let result;
        request.addEventListener('success', function () { result = request.result; });
        tx.addEventListener('complete', function () { resolve(result); });
        tx.addEventListener('error', function () { reject(tx.error || request.error); });
        tx.addEventListener('abort', function () { reject(tx.error || new Error('Transação abortada.')); });
      });
    });
  }

  function idbGet(storeName, key) {
    return idbTransaction(storeName, 'readonly', function (store) { return store.get(key); });
  }

  function idbPut(storeName, value) {
    return idbTransaction(storeName, 'readwrite', function (store) { return store.put(value); });
  }

  function requestPersistentStorage() {
    if (navigator.storage && navigator.storage.persist) {
      navigator.storage.persist().catch(function () {});
    }
  }

  /* =====================================================================
   * 5. MODELO DE DADOS — configurações, migração, carga e gravação
   * ===================================================================== */

  function createDefaultSettings() {
    return {
      key: SETTINGS_KEY,
      schemaVersion: CURRENT_SCHEMA_VERSION,
      empresaNome: '',
      usuarioNome: '',
      favoritos: DEFAULT_FAVORITES.slice()
    };
  }

  function migrateSettings(raw) {
    let data = raw;
    let version = Number(data.schemaVersion) || 1;
    while (version < CURRENT_SCHEMA_VERSION) {
      const next = version + 1;
      if (!MIGRATIONS[next]) throw new Error('Migração ausente para a versão ' + next + '.');
      data = MIGRATIONS[next](data);
      version = next;
      data.schemaVersion = version;
    }
    return data;
  }

  function normalizeSettings(raw) {
    const out = createDefaultSettings();
    const src = raw && typeof raw === 'object' ? raw : {};
    out.empresaNome = typeof src.empresaNome === 'string' ? src.empresaNome.trim().slice(0, 120) : '';
    out.usuarioNome = typeof src.usuarioNome === 'string' ? src.usuarioNome.trim().slice(0, 60) : '';
    if (Array.isArray(src.favoritos)) {
      out.favoritos = src.favoritos.filter(function (id, i, arr) { return !!PROGRAMS[id] && arr.indexOf(id) === i; });
    }
    return out;
  }

  // Resolve { firstRun } — true quando ainda faltam empresa/usuário.
  function loadSettings() {
    return idbGet(STORE_CONFIG, SETTINGS_KEY).then(function (raw) {
      if (!raw) {
        settings = createDefaultSettings();
        return { firstRun: true };
      }
      const fromVersion = Number(raw.schemaVersion) || 1;
      if (fromVersion > CURRENT_SCHEMA_VERSION) {
        persistenceBlocked = true;
        settings = normalizeSettings(raw);
        return { firstRun: false };
      }
      settings = normalizeSettings(migrateSettings(raw));
      if (fromVersion < CURRENT_SCHEMA_VERSION) scheduleSave();
      return { firstRun: !settings.empresaNome || !settings.usuarioNome };
    }, function (err) {
      console.error(err);
      storageAvailable = false;
      settings = createDefaultSettings();
      return { firstRun: true };
    }).catch(function (err) {
      console.error(err);
      persistenceBlocked = true;
      if (!settings) settings = createDefaultSettings();
      showToast('Não foi possível ler os dados salvos: ' + describeError(err), { type: 'error' });
      return { firstRun: !settings.empresaNome };
    });
  }

  // Sem debounce de tempo: várias alterações na mesma rodada viram uma gravação só.
  function scheduleSave() {
    if (savePending) return;
    savePending = true;
    Promise.resolve().then(function () {
      savePending = false;
      persistNow();
    });
  }

  function persistNow() {
    if (!storageAvailable || persistenceBlocked) return Promise.resolve();
    return idbPut(STORE_CONFIG, settings).catch(function (err) {
      console.error(err);
      showToast('Não foi possível salvar: ' + describeError(err), { type: 'error' });
    });
  }

  /* =====================================================================
   * 6. TOASTS
   * ===================================================================== */

  function showToast(message, options) {
    const opts = options || {};
    const root = document.getElementById('toast-root');
    while (root.children.length >= TOAST_MAX) root.removeChild(root.firstChild);
    const el = document.createElement('div');
    el.className = 'toast toast-' + (opts.type || 'info');
    el.setAttribute('role', 'status');
    el.innerHTML = '<span class="toast-msg">' + escapeHtml(message) + '</span>' +
      '<button type="button" class="toast-close" aria-label="Fechar">✕</button>';
    let timer = null;
    function dismiss() {
      clearTimeout(timer);
      el.classList.remove('show');
      setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 200);
    }
    el.querySelector('.toast-close').addEventListener('click', dismiss);
    el.addEventListener('mouseenter', function () { clearTimeout(timer); });
    el.addEventListener('mouseleave', function () { timer = setTimeout(dismiss, TOAST_DURATION_MS); });
    root.appendChild(el);
    requestAnimationFrame(function () { el.classList.add('show'); });
    timer = setTimeout(dismiss, opts.duration || TOAST_DURATION_MS);
  }

  /* =====================================================================
   * 7. MODAIS
   * ===================================================================== */

  function syncInert() {
    document.getElementById('app').inert = sessionLocked || modalStack.length > 0;
  }

  // opts: { title, body (HTML), size: 'sm'|'lg', dismissible (padrão true),
  //         actions: [{ id, label, variant: 'primary'|'danger', submit }],
  //         onAction(id, modal) → false mantém aberto, onClose(reason) }
  function openModal(opts) {
    const root = document.getElementById('modal-root');
    const backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop';
    const dismissible = opts.dismissible !== false;
    const actionList = opts.actions || [];
    const actions = actionList.map(function (a) {
      const cls = a.variant === 'primary' ? 'btn btn-primary' : a.variant === 'danger' ? 'btn btn-danger' : 'btn';
      return '<button type="' + (a.submit ? 'submit' : 'button') + '" class="' + cls + '" data-modal-action="' + escapeHtml(a.id) + '">' + escapeHtml(a.label) + '</button>';
    }).join('');
    backdrop.innerHTML =
      '<form class="modal' + (opts.size ? ' modal-' + opts.size : '') + '" role="dialog" aria-modal="true" aria-label="' + escapeHtml(opts.title) + '" novalidate>' +
      '<header class="modal-header"><h2>' + escapeHtml(opts.title) + '</h2>' +
      (dismissible ? '<button type="button" class="icon-btn" data-modal-close aria-label="Fechar">✕</button>' : '') + '</header>' +
      '<div class="modal-body">' + (opts.body || '') + '</div>' +
      (actions ? '<footer class="modal-footer">' + actions + '</footer>' : '') +
      '</form>';
    const form = backdrop.querySelector('form');
    const modal = { el: form, dismissible: dismissible, closed: false, close: null };

    function close(reason) {
      if (modal.closed) return;
      modal.closed = true;
      const idx = modalStack.indexOf(modal);
      if (idx >= 0) modalStack.splice(idx, 1);
      syncInert();
      backdrop.classList.remove('show');
      setTimeout(function () { if (backdrop.parentNode) backdrop.parentNode.removeChild(backdrop); }, 150);
      if (opts.onClose) opts.onClose(reason || 'close');
    }
    modal.close = close;

    function runModalAction(id) {
      if (modal.closed) return;
      const result = opts.onAction ? opts.onAction(id, modal) : undefined;
      if (result !== false) close(id);
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      const primary = actionList.filter(function (a) { return a.submit; })[0];
      if (primary) runModalAction(primary.id);
    });
    form.addEventListener('click', function (e) {
      const btn = e.target.closest('[data-modal-action]');
      if (btn && btn.type !== 'submit') runModalAction(btn.getAttribute('data-modal-action'));
      if (e.target.closest('[data-modal-close]')) close('dismiss');
    });
    backdrop.addEventListener('pointerdown', function (e) {
      if (e.target === backdrop && modal.dismissible) close('dismiss');
    });

    root.appendChild(backdrop);
    modalStack.push(modal);
    syncInert();
    requestAnimationFrame(function () { backdrop.classList.add('show'); });
    const focusTarget = form.querySelector('.modal-body input') || form.querySelector('.modal-footer [type="submit"]') || form;
    focusTarget.focus();
    return modal;
  }

  function confirmDialog(opts) {
    return new Promise(function (resolve) {
      let answered = false;
      openModal({
        title: opts.title,
        size: 'sm',
        body: '<p>' + escapeHtml(opts.message) + '</p>',
        actions: [
          { id: 'cancel', label: 'Cancelar' },
          { id: 'ok', label: opts.confirmLabel || 'Confirmar', variant: opts.variant || 'primary', submit: true }
        ],
        onAction: function (id) {
          answered = true;
          resolve(id === 'ok');
        },
        onClose: function () { if (!answered) resolve(false); }
      });
    });
  }

  /* =====================================================================
   * 8. MENUS (barra, dropdowns, submenus, menu de contexto, teclado)
   * ===================================================================== */

  function accelHtml(label) {
    const i = label.indexOf('&');
    if (i < 0) return escapeHtml(label);
    return escapeHtml(label.slice(0, i)) + '<u>' + escapeHtml(label.charAt(i + 1)) + '</u>' + escapeHtml(label.slice(i + 2));
  }

  function plainLabel(label) {
    return label.replace('&', '');
  }

  function accelKey(label) {
    const i = label.indexOf('&');
    return i < 0 ? '' : normalizeText(label.charAt(i + 1));
  }

  function topIndexByAccel(letter) {
    for (let i = 0; i < MENU_TREE.length; i++) {
      if (accelKey(MENU_TREE[i].label) === letter) return i;
    }
    return -1;
  }

  function renderMenubar() {
    document.getElementById('menubar-items').innerHTML = MENU_TREE.map(function (top, idx) {
      return '<button type="button" class="menubar-btn" role="menuitem" data-top="' + idx + '" aria-haspopup="' + (top.action ? 'false' : 'true') + '" aria-expanded="false">' + accelHtml(top.label) + '</button>';
    }).join('');
  }

  function topButton(index) {
    return document.querySelector('#menubar-items [data-top="' + index + '"]');
  }

  function isSubmenu(item) {
    return !!(item.items || (item.pending && !item.note));
  }

  function isDisabled(item) {
    return !!(item.sep || item.note || item.disabled);
  }

  function menuItemLabel(item) {
    if (item.program) return PROGRAMS[item.program].title;
    return item.label || item.note || '';
  }

  function submenuItems(item) {
    if (item.items) return item.items;
    return [{ note: 'Aguardando o print deste submenu', pending: true }];
  }

  function topMenuItems(top) {
    if (top.dynamic === 'janela') return buildWindowMenuItems();
    if (top.pending) return [{ note: 'Aguardando o print deste menu', pending: true }];
    return top.items;
  }

  function buildWindowMenuItems() {
    const none = wins.length === 0;
    // Os 4 primeiros itens seguem o sistema atual; os seguintes são extras deste sistema.
    const items = [
      { action: 'win-close-all', label: 'Fechar Todas', disabled: none },
      { action: 'win-max-all', label: 'Maximizar Todas', disabled: none },
      MENU_SEP,
      { action: 'win-cascade', label: 'Cascata', disabled: none },
      { action: 'win-tile-v', label: 'Lado a Lado', disabled: none },
      { action: 'win-tile-h', label: 'Lado a Lado (em linhas)', disabled: none },
      MENU_SEP,
      { action: 'win-min-all', label: 'Minimizar Todas', disabled: none },
      { action: 'win-restore-all', label: 'Restaurar Todas', disabled: none },
      MENU_SEP
    ];
    if (none) items.push({ note: 'Nenhum programa aberto' });
    wins.forEach(function (w, i) {
      items.push({ action: 'win-focus', winId: w.id, label: (i + 1) + '  ' + PROGRAMS[w.programId].title, checked: w.id === activeWinId && !w.minimized });
    });
    return items;
  }

  function renderMenuPopup(items, level) {
    const pop = document.createElement('div');
    pop.className = 'menu-pop';
    pop.setAttribute('role', 'menu');
    pop.dataset.level = String(level);
    pop.innerHTML = items.map(function (item, idx) {
      if (item.sep) return '<div class="menu-sep" role="separator"></div>';
      const sub = isSubmenu(item);
      const fav = !!item.program && isFavorite(item.program);
      // ✓ = está nos Favoritos (como no sistema atual) ou, no menu Janela, a janela ativa.
      const mark = item.checked || fav ? '✓' : '';
      return '<button type="button" class="menu-item' + (item.note ? ' menu-note' : '') + '" role="menuitem" tabindex="-1" data-idx="' + idx + '"' +
        (isDisabled(item) ? ' aria-disabled="true"' : '') + (sub ? ' aria-haspopup="true"' : '') + '>' +
        '<span class="mi-check" title="' + (fav ? 'Nos Favoritos' : '') + '">' + mark + '</span>' +
        '<span class="mi-label">' + escapeHtml(menuItemLabel(item)) + '</span>' +
        '<span class="mi-hint">' + escapeHtml(item.hint || '') + '</span>' +
        '<span class="mi-arrow">' + (sub ? '›' : '') + '</span></button>';
    }).join('');
    document.getElementById('menu-layer').appendChild(pop);
    return pop;
  }

  // flipX: borda alternativa (à esquerda) usada quando o popup não cabe à direita.
  function placePopup(pop, x, y, flipX) {
    pop.style.left = '0px';
    pop.style.top = '0px';
    const w = pop.offsetWidth;
    const h = pop.offsetHeight;
    let left = x;
    let top = y;
    if (left + w > window.innerWidth - 4) left = flipX != null ? flipX - w : window.innerWidth - w - 4;
    if (top + h > window.innerHeight - 4) top = window.innerHeight - h - 4;
    pop.style.left = Math.max(0, left) + 'px';
    pop.style.top = Math.max(0, top) + 'px';
  }

  function menuIsOpen() {
    return menu.top !== -1 || menu.context;
  }

  function clearMenuTimer() {
    if (menu.timer) {
      clearTimeout(menu.timer);
      menu.timer = null;
    }
  }

  function closeMenuLevelsFrom(level) {
    while (menu.levels.length > level) menu.levels.pop().pop.remove();
  }

  function closeMenus() {
    clearMenuTimer();
    closeMenuLevelsFrom(0);
    document.querySelectorAll('#menubar-items .menubar-btn.open').forEach(function (b) {
      b.classList.remove('open');
      b.setAttribute('aria-expanded', 'false');
    });
    menu.top = -1;
    menu.context = false;
  }

  // mode: 'click' | 'key' (executam ações diretas como Sair) · 'hover' | 'nav' (só destacam)
  function openTopMenu(index, mode) {
    const top = MENU_TREE[index];
    if (!top) return;
    closeMenus();
    if (top.action && (mode === 'click' || mode === 'key')) {
      runAction(top.action);
      return;
    }
    menu.top = index;
    const btn = topButton(index);
    btn.classList.add('open');
    btn.setAttribute('aria-expanded', 'true');
    if (top.action) return;
    const items = topMenuItems(top);
    const pop = renderMenuPopup(items, 0);
    const r = btn.getBoundingClientRect();
    placePopup(pop, r.left, r.bottom, null);
    menu.levels.push({ pop: pop, items: items, active: -1, parentIdx: -1 });
    if (mode === 'key' || mode === 'nav') setMenuActive(0, nextEnabled(items, -1, 1), 'key');
  }

  function openContextMenu(x, y, items) {
    closeMenus();
    menu.context = true;
    const pop = renderMenuPopup(items, 0);
    placePopup(pop, x, y, x);
    menu.levels.push({ pop: pop, items: items, active: -1, parentIdx: -1 });
  }

  function nextEnabled(items, from, dir) {
    const n = items.length;
    const start = from < 0 ? (dir > 0 ? -1 : 0) : from;
    for (let step = 1; step <= n; step++) {
      const i = ((start + dir * step) % n + n) % n;
      if (!isDisabled(items[i])) return i;
    }
    return -1;
  }

  function markActive(level, idx) {
    const l = menu.levels[level];
    if (!l) return;
    const prev = l.pop.querySelector('.menu-item.active');
    if (prev) prev.classList.remove('active');
    l.active = idx;
    if (idx < 0) return;
    const el = l.pop.querySelector('[data-idx="' + idx + '"]');
    if (el) {
      el.classList.add('active');
      el.scrollIntoView({ block: 'nearest' });
    }
  }

  // Passar o mouse abre/fecha submenus com atraso (permite atravessar outros itens na diagonal).
  function setMenuActive(level, idx, mode) {
    if (!menu.levels[level]) return;
    clearMenuTimer();
    for (let k = level; k > 0; k--) markActive(k - 1, menu.levels[k].parentIdx);
    markActive(level, idx);
    if (mode === 'hover') {
      menu.timer = setTimeout(function () {
        menu.timer = null;
        syncSubmenu(level);
      }, SUBMENU_DELAY_MS);
    } else {
      closeMenuLevelsFrom(level + 1);
    }
  }

  function syncSubmenu(level) {
    const l = menu.levels[level];
    if (!l) return;
    const child = menu.levels[level + 1];
    if (child && child.parentIdx === l.active) return;
    closeMenuLevelsFrom(level + 1);
    const item = l.items[l.active];
    if (item && isSubmenu(item)) openSubmenu(level, l.active, false);
  }

  function openSubmenu(level, idx, focusFirst) {
    const l = menu.levels[level];
    const item = l.items[idx];
    closeMenuLevelsFrom(level + 1);
    const items = submenuItems(item);
    const pop = renderMenuPopup(items, level + 1);
    const anchor = l.pop.querySelector('[data-idx="' + idx + '"]').getBoundingClientRect();
    placePopup(pop, anchor.right - 2, anchor.top - 4, anchor.left + 2);
    menu.levels.push({ pop: pop, items: items, active: -1, parentIdx: idx });
    if (focusFirst) setMenuActive(level + 1, nextEnabled(items, -1, 1), 'key');
  }

  function activateItem(level, idx, viaKey) {
    const l = menu.levels[level];
    if (!l) return;
    const item = l.items[idx];
    if (!item || isDisabled(item)) return;
    if (isSubmenu(item)) {
      clearMenuTimer();
      markActive(level, idx);
      openSubmenu(level, idx, viaKey);
      return;
    }
    closeMenus();
    if (item.program) openProgram(item.program);
    else if (item.action) runAction(item.action, item);
  }

  function moveTop(dir) {
    const n = MENU_TREE.length;
    openTopMenu(((menu.top + dir) % n + n) % n, 'nav');
  }

  function typeAhead(level, ch) {
    const l = menu.levels[level];
    const c = normalizeText(ch);
    if (!l || !c) return;
    const n = l.items.length;
    for (let step = 1; step <= n; step++) {
      const i = (l.active + step + n) % n;
      const item = l.items[i];
      if (!isDisabled(item) && normalizeText(menuItemLabel(item)).charAt(0) === c) {
        setMenuActive(level, i, 'key');
        return;
      }
    }
  }

  // Retorna true quando a tecla foi consumida pelo menu aberto.
  function handleMenuKey(e) {
    if (!menuIsOpen()) return false;
    const key = e.key || '';
    if (key === 'Shift' || key === 'Control' || key === 'Alt' || key === 'Meta') return false;
    e.preventDefault();
    e.stopPropagation();
    const depth = menu.levels.length;
    const level = depth - 1;
    const cur = menu.levels[level];
    if (key === 'Escape') {
      if (depth > 1) closeMenuLevelsFrom(level);
      else closeMenus();
      return true;
    }
    if (!cur) {
      // Item de ação na barra (Sair) apenas destacado
      if (key === 'Enter' || key === ' ' || key === 'ArrowDown') {
        const top = MENU_TREE[menu.top];
        closeMenus();
        runAction(top.action);
      } else if (key === 'ArrowRight' || key === 'ArrowLeft') {
        moveTop(key === 'ArrowRight' ? 1 : -1);
      } else if (key === 'Tab') {
        closeMenus();
      }
      return true;
    }
    switch (key) {
      case 'ArrowDown':
        setMenuActive(level, nextEnabled(cur.items, cur.active, 1), 'key');
        break;
      case 'ArrowUp':
        setMenuActive(level, nextEnabled(cur.items, cur.active, -1), 'key');
        break;
      case 'Home':
        setMenuActive(level, nextEnabled(cur.items, -1, 1), 'key');
        break;
      case 'End':
        setMenuActive(level, nextEnabled(cur.items, -1, -1), 'key');
        break;
      case 'ArrowRight': {
        const item = cur.items[cur.active];
        if (item && isSubmenu(item)) openSubmenu(level, cur.active, true);
        else if (!menu.context) moveTop(1);
        break;
      }
      case 'ArrowLeft':
        if (level > 0) closeMenuLevelsFrom(level);
        else if (!menu.context) moveTop(-1);
        break;
      case 'Enter':
      case ' ':
        if (cur.active >= 0) activateItem(level, cur.active, true);
        break;
      case 'Tab':
        closeMenus();
        break;
      default:
        if (key.length === 1) typeAhead(level, key);
    }
    return true;
  }

  function popupLevel(el) {
    const pop = el.closest('.menu-pop');
    return pop ? Number(pop.dataset.level) : -1;
  }

  function onMenubarClick(e) {
    const btn = e.target.closest('[data-top]');
    if (!btn) return;
    const idx = Number(btn.dataset.top);
    if (menu.top === idx && !menu.context && !MENU_TREE[idx].action) {
      closeMenus();
      return;
    }
    openTopMenu(idx, 'click');
  }

  function onMenubarOver(e) {
    const btn = e.target.closest('[data-top]');
    if (!btn || menu.top === -1 || menu.context) return;
    const idx = Number(btn.dataset.top);
    if (idx !== menu.top) openTopMenu(idx, 'hover');
  }

  function onMenuLayerOver(e) {
    const itemEl = e.target.closest('.menu-item');
    if (!itemEl) return;
    const level = popupLevel(itemEl);
    const l = menu.levels[level];
    const idx = Number(itemEl.dataset.idx);
    if (!l || isDisabled(l.items[idx])) return;
    setMenuActive(level, idx, 'hover');
  }

  function onMenuLayerClick(e) {
    const itemEl = e.target.closest('.menu-item');
    if (!itemEl) return;
    activateItem(popupLevel(itemEl), Number(itemEl.dataset.idx), false);
  }

  // Botão direito num programa do menu: adiciona/remove dos Favoritos sem fechar o menu.
  function onMenuLayerContext(e) {
    e.preventDefault();
    const itemEl = e.target.closest('.menu-item');
    if (!itemEl || menu.context) return;
    const l = menu.levels[popupLevel(itemEl)];
    const item = l && l.items[Number(itemEl.dataset.idx)];
    if (!item || !item.program) return;
    toggleFavorite(item.program);
    itemEl.querySelector('.mi-check').textContent = isFavorite(item.program) ? '✓' : '';
  }

  function onDocPointerDown(e) {
    updateLockKeys(e);
    if (!menuIsOpen()) return;
    if (e.target.closest('#menu-layer .menu-pop') || e.target.closest('#menubar')) return;
    closeMenus();
  }

  /* =====================================================================
   * 9. JANELAS INTERNAS (MDI): abrir, focar, arrastar, redimensionar, organizar
   * ===================================================================== */

  function winArea() {
    return document.getElementById('win-area');
  }

  function areaSize() {
    const a = winArea();
    return { w: a.clientWidth, h: a.clientHeight };
  }

  function findWin(id) {
    for (let i = 0; i < wins.length; i++) if (wins[i].id === id) return wins[i];
    return null;
  }

  function findWinByProgram(programId) {
    for (let i = 0; i < wins.length; i++) if (wins[i].programId === programId) return wins[i];
    return null;
  }

  function clampWin(win) {
    const area = areaSize();
    win.w = clamp(win.w, WIN_MIN_W, Math.max(WIN_MIN_W, area.w));
    win.h = clamp(win.h, WIN_MIN_H, Math.max(WIN_MIN_H, area.h));
    win.x = clamp(win.x, WIN_KEEP_VISIBLE - win.w, area.w - WIN_KEEP_VISIBLE);
    win.y = clamp(win.y, 0, Math.max(0, area.h - WIN_TITLEBAR_H));
  }

  function createWinElement(win, program) {
    const el = document.createElement('section');
    el.className = 'mdi-win';
    el.dataset.win = win.id;
    el.setAttribute('role', 'dialog');
    el.setAttribute('aria-label', program.title);
    el.tabIndex = -1;
    el.innerHTML =
      '<header class="win-titlebar">' +
      '<span class="win-icon" aria-hidden="true">' + program.icon + '</span>' +
      '<span class="win-title">' + escapeHtml(program.title) + '</span>' +
      '<span class="win-buttons">' +
      '<button type="button" class="win-btn" data-win-cmd="fav"></button>' +
      '<button type="button" class="win-btn" data-win-cmd="min" title="Minimizar" aria-label="Minimizar">' + ICONS.min + '</button>' +
      '<button type="button" class="win-btn" data-win-cmd="max"></button>' +
      '<button type="button" class="win-btn win-btn-close" data-win-cmd="close" title="Fechar (Esc)" aria-label="Fechar">' + ICONS.close + '</button>' +
      '</span></header>' +
      '<div class="win-body"></div>' +
      '<span class="win-resize" data-resize="e"></span>' +
      '<span class="win-resize" data-resize="s"></span>' +
      '<span class="win-resize" data-resize="se"></span>';
    return el;
  }

  function applyWinGeometry(win) {
    const el = win.el;
    el.classList.toggle('maximized', win.maximized);
    el.hidden = win.minimized;
    el.style.left = win.x + 'px';
    el.style.top = win.y + 'px';
    el.style.width = win.w + 'px';
    el.style.height = win.h + 'px';
    el.style.zIndex = String(win.z);
    const maxBtn = el.querySelector('[data-win-cmd="max"]');
    maxBtn.innerHTML = win.maximized ? ICONS.restore : ICONS.max;
    maxBtn.title = win.maximized ? 'Restaurar' : 'Maximizar';
    maxBtn.setAttribute('aria-label', maxBtn.title);
  }

  function openProgram(programId) {
    const program = PROGRAMS[programId];
    if (!program || sessionLocked) return null;
    const existing = findWinByProgram(programId);
    if (existing) {
      focusWin(existing, false);
      return existing;
    }
    document.getElementById('workspace').classList.add('has-wins');
    const area = areaSize();
    const slot = wins.length % WIN_CASCADE_SLOTS;
    const win = {
      id: 'w' + (++winSeq),
      programId: programId,
      x: 14 + slot * WIN_CASCADE_STEP,
      y: 10 + slot * WIN_CASCADE_STEP,
      w: Math.min(program.w || WIN_DEFAULT_W, area.w - 28),
      h: Math.min(program.h || WIN_DEFAULT_H, area.h - 20),
      z: 0,
      minimized: false,
      maximized: false,
      el: null
    };
    clampWin(win);
    win.el = createWinElement(win, program);
    winArea().appendChild(win.el);
    wins.push(win);
    mountProgramView(win);
    focusWin(win, false);
    return win;
  }

  // fromPointer: o clique já leva o foco ao elemento certo; não roubar o foco dele.
  function focusWin(win, fromPointer) {
    win.minimized = false;
    if (win.z !== zTop) win.z = ++zTop;
    activeWinId = win.id;
    applyWinGeometry(win);
    if (!fromPointer && !win.el.contains(document.activeElement)) win.el.focus({ preventScroll: true });
    updateWindowChrome();
  }

  function activateTopmost() {
    let best = null;
    wins.forEach(function (w) { if (!w.minimized && (!best || w.z > best.z)) best = w; });
    if (best) {
      focusWin(best, false);
      return;
    }
    activeWinId = null;
    if (document.activeElement && winArea().contains(document.activeElement)) document.activeElement.blur();
    updateWindowChrome();
  }

  function minimizeWin(win) {
    win.minimized = true;
    applyWinGeometry(win);
    if (activeWinId === win.id) activateTopmost();
    else updateWindowChrome();
  }

  function toggleMaximize(win) {
    win.maximized = !win.maximized;
    if (!win.maximized) clampWin(win);
    focusWin(win, false);
  }

  function closeWin(win) {
    const idx = wins.indexOf(win);
    if (idx < 0) return;
    wins.splice(idx, 1);
    win.el.remove();
    if (activeWinId === win.id) activateTopmost();
    else updateWindowChrome();
  }

  function closeAllWins() {
    wins.forEach(function (w) { w.el.remove(); });
    wins.length = 0;
    activeWinId = null;
    updateWindowChrome();
  }

  function minimizeAllWins() {
    wins.forEach(function (w) {
      w.minimized = true;
      applyWinGeometry(w);
    });
    activateTopmost();
  }

  function maximizeAllWins() {
    wins.forEach(function (w) {
      w.minimized = false;
      w.maximized = true;
      applyWinGeometry(w);
    });
    activateTopmost();
  }

  function restoreAllWins() {
    wins.forEach(function (w) {
      w.minimized = false;
      applyWinGeometry(w);
    });
    activateTopmost();
  }

  // mode: 'cascade' | 'tile-v' (colunas) | 'tile-h' (linhas)
  function arrangeWindows(mode) {
    const list = wins.filter(function (w) { return !w.minimized; }).sort(function (a, b) { return a.z - b.z; });
    if (!list.length) return;
    const area = areaSize();
    const n = list.length;
    if (mode === 'cascade') {
      list.forEach(function (w, i) {
        const slot = i % WIN_CASCADE_SLOTS;
        w.maximized = false;
        w.x = 14 + slot * WIN_CASCADE_STEP;
        w.y = 10 + slot * WIN_CASCADE_STEP;
        w.w = Math.min(w.w, area.w - w.x - 14);
        w.h = Math.min(w.h, area.h - w.y - 10);
        clampWin(w);
      });
    } else {
      const lines = n <= 3 ? n : Math.ceil(Math.sqrt(n));
      const cols = mode === 'tile-v' ? lines : Math.ceil(n / lines);
      const rows = mode === 'tile-v' ? Math.ceil(n / lines) : lines;
      const cellW = Math.floor(area.w / cols);
      const cellH = Math.floor(area.h / rows);
      list.forEach(function (w, i) {
        const col = mode === 'tile-v' ? i % cols : Math.floor(i / rows);
        const row = mode === 'tile-v' ? Math.floor(i / cols) : i % rows;
        w.maximized = false;
        w.x = col * cellW;
        w.y = row * cellH;
        w.w = cellW;
        w.h = cellH;
        clampWin(w);
      });
    }
    list.forEach(applyWinGeometry);
    updateWindowChrome();
  }

  function updateWindowChrome() {
    wins.forEach(function (w) {
      w.el.classList.toggle('active', w.id === activeWinId && !w.minimized);
      const fav = w.el.querySelector('[data-win-cmd="fav"]');
      const on = isFavorite(w.programId);
      fav.textContent = on ? '★' : '☆';
      fav.title = on ? 'Remover dos Favoritos' : 'Adicionar aos Favoritos';
      fav.setAttribute('aria-label', fav.title);
      fav.classList.toggle('on', on);
    });
    document.getElementById('workspace').classList.toggle('has-wins', wins.length > 0);
    document.getElementById('open-count').textContent = String(wins.length);
    renderTaskbar();
  }

  function renderTaskbar() {
    document.getElementById('win-taskbar').innerHTML = wins.map(function (w) {
      const p = PROGRAMS[w.programId];
      const cls = 'task-btn' + (w.id === activeWinId && !w.minimized ? ' active' : '') + (w.minimized ? ' minimized' : '');
      return '<button type="button" class="' + cls + '" data-task="' + w.id + '" title="' + escapeHtml(p.title) + '">' +
        '<span aria-hidden="true">' + p.icon + '</span><span class="task-label">' + escapeHtml(p.title) + '</span></button>';
    }).join('');
  }

  function onWinPointerDown(e) {
    const winEl = e.target.closest('.mdi-win');
    if (!winEl) return;
    const win = findWin(winEl.dataset.win);
    if (!win) return;
    if (activeWinId !== win.id) focusWin(win, true);
    if (e.button !== 0) return;
    const handle = e.target.closest('.win-resize');
    const title = e.target.closest('.win-titlebar');
    if (handle && !win.maximized) {
      gesture = { type: 'resize', dir: handle.dataset.resize, win: win, sx: e.clientX, sy: e.clientY, ow: win.w, oh: win.h };
    } else if (title && !e.target.closest('.win-btn') && !win.maximized) {
      gesture = { type: 'move', win: win, sx: e.clientX, sy: e.clientY, ox: win.x, oy: win.y };
    } else {
      return;
    }
    // preventDefault impede o foco nativo: sem isso o foco ficaria preso, por exemplo, na busca.
    e.preventDefault();
    if (!win.el.contains(document.activeElement)) win.el.focus({ preventScroll: true });
    (handle || title).setPointerCapture(e.pointerId);
    document.body.classList.add('gesturing', gesture.type === 'move' ? 'gesture-move' : 'gesture-resize-' + gesture.dir);
  }

  function onWinPointerMove(e) {
    if (!gesture) return;
    const g = gesture;
    const win = g.win;
    const area = areaSize();
    const dx = e.clientX - g.sx;
    const dy = e.clientY - g.sy;
    if (g.type === 'move') {
      win.x = g.ox + dx;
      win.y = g.oy + dy;
    } else {
      if (g.dir.indexOf('e') >= 0) win.w = Math.max(WIN_MIN_W, Math.min(g.ow + dx, area.w - win.x));
      if (g.dir.indexOf('s') >= 0) win.h = Math.max(WIN_MIN_H, Math.min(g.oh + dy, area.h - win.y));
    }
    clampWin(win);
    applyWinGeometry(win);
  }

  function endGesture() {
    if (!gesture) return;
    gesture = null;
    document.body.classList.remove('gesturing', 'gesture-move', 'gesture-resize-e', 'gesture-resize-s', 'gesture-resize-se');
  }

  function onWinClick(e) {
    const cmdBtn = e.target.closest('[data-win-cmd]');
    if (cmdBtn) {
      const win = findWin(cmdBtn.closest('.mdi-win').dataset.win);
      if (!win) return;
      const cmd = cmdBtn.dataset.winCmd;
      if (cmd === 'close') closeWin(win);
      else if (cmd === 'min') minimizeWin(win);
      else if (cmd === 'max') toggleMaximize(win);
      else if (cmd === 'fav') toggleFavorite(win.programId);
      return;
    }
    const favCmd = e.target.closest('[data-fav-cmd]');
    if (favCmd) {
      runFavoriteCommand(favCmd);
      return;
    }
    const openBtn = e.target.closest('[data-open-program]');
    if (openBtn) openProgram(openBtn.dataset.openProgram);
  }

  function onWinChange(e) {
    const select = e.target.closest('[data-fav-add]');
    if (!select || !select.value) return;
    const winEl = select.closest('.mdi-win');
    toggleFavorite(select.value);
    const again = winEl.querySelector('[data-fav-add]');
    if (again) again.focus();
  }

  function onWinDblClick(e) {
    const title = e.target.closest('.win-titlebar');
    if (!title || e.target.closest('.win-btn')) return;
    const win = findWin(title.closest('.mdi-win').dataset.win);
    if (win) toggleMaximize(win);
  }

  function onTaskbarClick(e) {
    const btn = e.target.closest('[data-task]');
    if (!btn) return;
    const win = findWin(btn.dataset.task);
    if (!win) return;
    if (win.id === activeWinId && !win.minimized) minimizeWin(win);
    else focusWin(win, false);
  }

  function onWindowResize() {
    closeMenus();
    wins.forEach(function (w) {
      clampWin(w);
      applyWinGeometry(w);
    });
  }

  /* =====================================================================
   * 10. PROGRAMAS (conteúdo das janelas)
   * ===================================================================== */

  // Percorre todos os itens dos menus (com submenus), passando o caminho de rótulos até o item.
  function forEachMenuItem(callback) {
    function visit(items, trail) {
      items.forEach(function (item) {
        callback(item, trail);
        if (item.items) visit(item.items, trail.concat(item.label));
      });
    }
    MENU_TREE.forEach(function (top) {
      if (top.items) visit(top.items, [plainLabel(top.label)]);
    });
  }

  function buildProgramPaths() {
    const out = {};
    forEachMenuItem(function (item, trail) {
      if (item.program && !out[item.program]) out[item.program] = trail.concat(PROGRAMS[item.program].title);
    });
    return out;
  }

  // hint 'Ctrl+L' → 'ctrl+l' (escrever os modificadores na ordem Ctrl+Alt+Shift+tecla).
  function buildProgramHotkeys() {
    const out = {};
    forEachMenuItem(function (item) {
      if (item.program && item.hint) out[normalizeText(item.hint).replace(/\s+/g, '')] = item.program;
    });
    return out;
  }

  function eventHotkey(e) {
    if (!(e.ctrlKey || e.metaKey) || !ACCEL_CODE_RE.test(e.code || '')) return '';
    return 'ctrl+' + (e.altKey ? 'alt+' : '') + (e.shiftKey ? 'shift+' : '') + e.code.charAt(3).toLowerCase();
  }

  function programPathLabel(programId) {
    const path = programPaths[programId];
    return path ? path.join(' › ') : '';
  }

  function programStatus(programId) {
    return PROGRAMS[programId].status || 'pendente';
  }

  function mountProgramView(win) {
    const program = PROGRAMS[win.programId];
    const body = win.el.querySelector('.win-body');
    if (program.view === 'mapa') body.innerHTML = renderSystemMap();
    else if (program.view === 'favoritos') body.innerHTML = renderFavoritesManager();
    else body.innerHTML = renderPlaceholder(win.programId);
  }

  // Janelas cujo conteúdo depende da lista de favoritos são redesenhadas quando ela muda.
  function refreshFavoriteViews() {
    wins.forEach(function (w) {
      if (PROGRAMS[w.programId].view === 'favoritos') mountProgramView(w);
    });
  }

  function renderFavoritesManager() {
    const list = settings.favoritos;
    const rows = list.map(function (id, i) {
      const p = PROGRAMS[id];
      return '<li><span class="favman-num">' + (i + 1) + '</span><span aria-hidden="true">' + p.icon + '</span>' +
        '<span class="favman-name">' + escapeHtml(p.title) + '<small>' + escapeHtml(programPathLabel(id) || 'Local no menu ainda não mapeado') + '</small></span>' +
        '<button type="button" class="btn btn-sm" data-fav-cmd="up" data-target="' + id + '" title="Mover para cima" aria-label="Mover para cima"' + (i === 0 ? ' disabled' : '') + '>↑</button>' +
        '<button type="button" class="btn btn-sm" data-fav-cmd="down" data-target="' + id + '" title="Mover para baixo" aria-label="Mover para baixo"' + (i === list.length - 1 ? ' disabled' : '') + '>↓</button>' +
        '<button type="button" class="btn btn-sm" data-fav-cmd="remove" data-target="' + id + '">Remover</button></li>';
    }).join('');
    const available = Object.keys(PROGRAMS).filter(function (id) { return list.indexOf(id) < 0; }).sort(function (a, b) {
      return PROGRAMS[a].title.localeCompare(PROGRAMS[b].title, 'pt-BR');
    });
    return '<div class="favman">' +
      '<p class="map-intro">Programas que aparecem na lateral, nesta ordem. Também dá para usar ☆ na janela ou o botão direito no menu.</p>' +
      '<ol class="favman-list">' + (rows || '<li class="favman-empty">Nenhum favorito.</li>') + '</ol>' +
      '<div class="favman-bar"><select data-fav-add aria-label="Adicionar programa aos Favoritos"><option value="">Adicionar programa…</option>' +
      available.map(function (id) { return '<option value="' + id + '">' + escapeHtml(PROGRAMS[id].title) + '</option>'; }).join('') +
      '</select><button type="button" class="btn btn-sm" data-fav-cmd="reset">Restaurar padrão</button></div></div>';
  }

  function runFavoriteCommand(btn) {
    const cmd = btn.dataset.favCmd;
    const id = btn.dataset.target;
    const winEl = btn.closest('.mdi-win');
    if (cmd === 'up') moveFavorite(id, -1);
    else if (cmd === 'down') moveFavorite(id, 1);
    else if (cmd === 'remove') toggleFavorite(id);
    else if (cmd === 'reset') resetFavorites();
    // O conteúdo foi redesenhado: devolve o foco ao mesmo botão (bom para quem usa o teclado).
    const again = winEl.querySelector('[data-fav-cmd="' + cmd + '"]' + (id ? '[data-target="' + id + '"]' : ''));
    if (again && !again.disabled) again.focus();
    else winEl.focus({ preventScroll: true });
  }

  function renderPlaceholder(programId) {
    const program = PROGRAMS[programId];
    const path = programPathLabel(programId);
    return '<div class="ph">' +
      '<div class="ph-icon" aria-hidden="true">' + program.icon + '</div>' +
      '<h2>' + escapeHtml(program.title) + '</h2>' +
      '<p class="ph-path">' + (path ? 'Menu: ' + escapeHtml(path) : 'Local no menu ainda não mapeado (aparece nos seus Favoritos)') + '</p>' +
      '<span class="badge st-pendente">' + STATUS_LABELS.pendente + '</span>' +
      '<div class="ph-box"><strong>Esta tela ainda não foi construída.</strong> Para construí-la, mande:<ul>' +
      '<li>Os prints desta tela no sistema atual (vazia e preenchida; pode borrar dados de clientes)</li>' +
      '<li>Para que você usa e o que mais usa nela</li>' +
      '<li>Quais campos são obrigatórios e quais botões ou atalhos você usa</li>' +
      '<li>O que ela imprime ou gera (relatórios, etiquetas, cheques…)</li>' +
      '</ul></div></div>';
  }

  function programLinkHtml(programId) {
    const p = PROGRAMS[programId];
    const st = programStatus(programId);
    return '<button type="button" class="map-link" data-open-program="' + programId + '"><span aria-hidden="true">' + p.icon + '</span>' + escapeHtml(p.title) + '</button> ' +
      '<span class="badge ' + (st === 'pronto' ? 'st-pronto' : 'st-pendente') + '">' + STATUS_LABELS[st] + '</span>';
  }

  function renderSystemMap() {
    const counts = { programas: 0, prontos: 0, aguardando: 0 };
    function countProgram(id) {
      if (PROGRAMS[id].own) return;
      counts.programas++;
      if (programStatus(id) === 'pronto') counts.prontos++;
    }
    function itemHtml(item) {
      if (item.sep) return '';
      if (item.program) {
        countProgram(item.program);
        return '<li>' + programLinkHtml(item.program) + '</li>';
      }
      if (item.note) {
        if (item.pending) counts.aguardando++;
        return '<li class="map-note">' + escapeHtml(item.note) + (item.pending ? ' <span class="badge st-print">aguardando print</span>' : '') + '</li>';
      }
      if (item.action) return '<li class="map-action">' + escapeHtml(item.label) + '</li>';
      if (item.items) return '<li class="map-sub">' + escapeHtml(item.label) + ' ›<ul>' + item.items.map(itemHtml).join('') + '</ul></li>';
      if (item.pending) {
        counts.aguardando++;
        return '<li class="map-sub">' + escapeHtml(item.label) + ' › <span class="badge st-print">aguardando print</span></li>';
      }
      return '';
    }
    const sections = MENU_TREE.filter(function (top) { return !top.action && !top.dynamic; }).map(function (top) {
      let body;
      if (top.pending) {
        counts.aguardando++;
        body = '<ul><li class="map-note">Menu inteiro <span class="badge st-print">aguardando print</span></li></ul>';
      } else {
        body = '<ul>' + top.items.map(itemHtml).join('') + '</ul>';
      }
      return '<section class="map-top"><h3>' + escapeHtml(plainLabel(top.label)) + '</h3>' + body + '</section>';
    }).join('');
    const orphans = Object.keys(PROGRAMS).filter(function (id) { return !programPaths[id] && !PROGRAMS[id].own; });
    orphans.forEach(countProgram);
    const orphanHtml = orphans.length
      ? '<section class="map-top"><h3>Vistos só nos Favoritos — local no menu a descobrir</h3><ul>' +
        orphans.map(function (id) { return '<li>' + programLinkHtml(id) + '</li>'; }).join('') + '</ul></section>'
      : '';
    function stat(n, label) {
      return '<div class="map-stat"><strong>' + n + '</strong>' + escapeHtml(label) + '</div>';
    }
    return '<div class="map">' +
      '<p class="map-intro">Tudo o que já foi mapeado do sistema atual. Clique num programa para abrir.</p>' +
      '<div class="map-summary">' +
      stat(counts.programas, 'programas conhecidos') +
      stat(counts.prontos, 'prontos') +
      stat(counts.programas - counts.prontos, 'a construir') +
      stat(counts.aguardando, 'menus/submenus aguardando print') +
      '</div>' + sections + orphanHtml + '</div>';
  }

  /* =====================================================================
   * 11. FAVORITOS E BUSCA DE PROGRAMAS
   * ===================================================================== */

  function isFavorite(programId) {
    return !!settings && settings.favoritos.indexOf(programId) >= 0;
  }

  function toggleFavorite(programId) {
    const list = settings.favoritos;
    const idx = list.indexOf(programId);
    if (idx >= 0) list.splice(idx, 1);
    else list.push(programId);
    scheduleSave();
    renderFavorites();
    updateWindowChrome();
    refreshFavoriteViews();
    showToast((idx >= 0 ? 'Removido dos Favoritos: ' : 'Adicionado aos Favoritos: ') + PROGRAMS[programId].title, { type: idx >= 0 ? 'info' : 'success' });
  }

  function moveFavorite(programId, dir) {
    const list = settings.favoritos;
    const i = list.indexOf(programId);
    const j = i + dir;
    if (i < 0 || j < 0 || j >= list.length) return;
    list[i] = list[j];
    list[j] = programId;
    scheduleSave();
    renderFavorites();
    refreshFavoriteViews();
  }

  function resetFavorites() {
    settings.favoritos = DEFAULT_FAVORITES.slice();
    scheduleSave();
    renderFavorites();
    updateWindowChrome();
    refreshFavoriteViews();
    showToast('Favoritos restaurados para o padrão.', { type: 'success' });
  }

  // null quando a busca está vazia (mostra os Favoritos).
  function currentSearchResults() {
    const q = normalizeText(document.getElementById('fav-search').value);
    if (!q) return null;
    const words = q.split(/\s+/);
    const found = [];
    Object.keys(PROGRAMS).forEach(function (id) {
      const title = normalizeText(PROGRAMS[id].title);
      const hay = title + ' ' + normalizeText(programPathLabel(id));
      if (!words.every(function (w) { return hay.indexOf(w) >= 0; })) return;
      const pos = title.indexOf(words[0]);
      found.push({ id: id, score: pos === 0 ? 0 : pos > 0 ? 1 : 2 });
    });
    found.sort(function (a, b) {
      return a.score - b.score || PROGRAMS[a.id].title.localeCompare(PROGRAMS[b.id].title, 'pt-BR');
    });
    return found.slice(0, SEARCH_MAX_RESULTS).map(function (f) { return f.id; });
  }

  function renderFavorites() {
    const list = document.getElementById('fav-list');
    const results = currentSearchResults();
    const ids = results || settings.favoritos;
    if (results) searchActive = clamp(searchActive, 0, Math.max(0, ids.length - 1));
    if (!ids.length) {
      list.innerHTML = '<p class="fav-empty">' + (results
        ? 'Nenhum programa encontrado.'
        : 'Nenhum favorito. Abra um programa e clique em ☆ na barra da janela, ou clique com o botão direito num item do menu.') + '</p>';
      return;
    }
    list.innerHTML = ids.map(function (id, i) {
      const p = PROGRAMS[id];
      return '<button type="button" class="fav-item' + (results && i === searchActive ? ' active' : '') + '" data-program="' + id + '" role="option" title="' + escapeHtml(p.title) + '">' +
        '<span class="fav-icon" aria-hidden="true">' + p.icon + '</span>' +
        '<span class="fav-text"><span class="fav-label">' + escapeHtml(p.title) + '</span>' +
        (results ? '<span class="fav-path">' + escapeHtml(programPathLabel(id) || 'Favoritos') + '</span>' : '') +
        '</span></button>';
    }).join('');
  }

  function focusSearch() {
    const input = document.getElementById('fav-search');
    input.focus();
    input.select();
  }

  function clearSearch(keepFocus) {
    const input = document.getElementById('fav-search');
    input.value = '';
    searchActive = 0;
    renderFavorites();
    if (keepFocus) input.focus();
  }

  function onSearchInput() {
    searchActive = 0;
    renderFavorites();
  }

  function onSearchKeydown(e) {
    const results = currentSearchResults();
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      if (!results || !results.length) return;
      e.preventDefault();
      searchActive = clamp(searchActive + (e.key === 'ArrowDown' ? 1 : -1), 0, results.length - 1);
      renderFavorites();
      const act = document.querySelector('#fav-list .fav-item.active');
      if (act) act.scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter') {
      if (!results || !results.length) return;
      e.preventDefault();
      const id = results[clamp(searchActive, 0, results.length - 1)];
      clearSearch(false);
      e.target.blur();
      openProgram(id);
    } else if (e.key === 'Escape') {
      e.preventDefault();
      if (e.target.value) clearSearch(true);
      else e.target.blur();
    }
  }

  function onFavClick(e) {
    const btn = e.target.closest('[data-program]');
    if (btn) openProgram(btn.dataset.program);
  }

  function onFavContext(e) {
    const btn = e.target.closest('[data-program]');
    if (!btn) return;
    e.preventDefault();
    const id = btn.dataset.program;
    const list = settings.favoritos;
    const pos = list.indexOf(id);
    const items = [{ action: 'fav-open', target: id, label: 'Abrir' }];
    if (!currentSearchResults() && pos >= 0) {
      items.push({ action: 'fav-up', target: id, label: 'Mover para cima', disabled: pos === 0 });
      items.push({ action: 'fav-down', target: id, label: 'Mover para baixo', disabled: pos === list.length - 1 });
    }
    items.push(MENU_SEP);
    items.push({ action: 'fav-toggle', target: id, label: pos >= 0 ? 'Remover dos Favoritos' : 'Adicionar aos Favoritos' });
    openContextMenu(e.clientX, e.clientY, items);
  }

  /* =====================================================================
   * 12. AVISOS, IDENTIFICAÇÃO E BARRA DE STATUS
   * ===================================================================== */

  // Cada aviso é uma frase. Futuro: certidões vencendo, NF-e pendentes na SEFAZ, títulos vencidos…
  function collectAlerts() {
    const out = [];
    if (!storageAvailable) out.push('Armazenamento indisponível neste navegador: nada será salvo ao fechar.');
    if (persistenceBlocked) out.push('Os dados salvos vieram de uma versão mais nova do sistema. Esta versão não vai gravar nada.');
    return out;
  }

  function renderAlerts() {
    const alerts = collectAlerts();
    document.getElementById('alerts-box').innerHTML = alerts.length
      ? alerts.map(function (a) { return '<p>' + escapeHtml(a) + '</p>'; }).join('')
      : '<p class="alert-none">Nenhum aviso no momento.</p>';
  }

  function renderIdentity() {
    const empresa = settings.empresaNome || 'Empresa não informada';
    const usuario = settings.usuarioNome || 'Usuário';
    document.title = APP_NAME + ' - Licenciado para ' + empresa + ' - ' + usuario;
    document.getElementById('st-user').textContent = 'Usuário: ' + usuario;
    document.getElementById('st-empresa').textContent = empresa;
    document.getElementById('bg-license').textContent = 'Licenciado para ' + empresa;
  }

  function updateClock() {
    document.getElementById('st-clock').textContent = formatClock(new Date());
  }

  function updateLockKeys(e) {
    if (!e || typeof e.getModifierState !== 'function') return;
    document.getElementById('st-caps').classList.toggle('on', e.getModifierState('CapsLock'));
    document.getElementById('st-num').classList.toggle('on', e.getModifierState('NumLock'));
  }

  /* =====================================================================
   * 13. AÇÕES E DIÁLOGOS
   * ===================================================================== */

  function runAction(id, item) {
    switch (id) {
      case 'empresa-usuario': openCompanyUserDialog(false); break;
      case 'atalhos': openShortcutsDialog(); break;
      case 'sobre': openAboutDialog(); break;
      case 'sair': requestExit(); break;
      case 'atualizar':
        renderAlerts();
        showToast('Avisos atualizados.');
        break;
      case 'win-cascade': arrangeWindows('cascade'); break;
      case 'win-tile-v': arrangeWindows('tile-v'); break;
      case 'win-tile-h': arrangeWindows('tile-h'); break;
      case 'win-min-all': minimizeAllWins(); break;
      case 'win-restore-all': restoreAllWins(); break;
      case 'win-close-all': closeAllWins(); break;
      case 'win-max-all': maximizeAllWins(); break;
      case 'win-focus': {
        const w = findWin(item.winId);
        if (w) focusWin(w, false);
        break;
      }
      case 'fav-open': openProgram(item.target); break;
      case 'fav-toggle': toggleFavorite(item.target); break;
      case 'fav-up': moveFavorite(item.target, -1); break;
      case 'fav-down': moveFavorite(item.target, 1); break;
      default: console.warn('Ação desconhecida: ' + id);
    }
  }

  function openCompanyUserDialog(firstRun) {
    const body =
      (firstRun ? '<p class="modal-lead">Antes de começar, informe a empresa e o seu nome. Eles aparecem no título da janela e na barra de status. Dá para mudar depois em Sistema › Empresa e usuário.</p>' : '') +
      '<label class="field"><span>Empresa (Licenciado para)</span><input type="text" name="empresa" maxlength="120" autocomplete="organization" placeholder="Ex.: Minha Empresa Ltda" value="' + escapeHtml(settings.empresaNome) + '"></label>' +
      '<label class="field"><span>Usuário</span><input type="text" name="usuario" maxlength="60" autocomplete="name" placeholder="Seu nome" value="' + escapeHtml(settings.usuarioNome) + '"></label>' +
      '<p class="field-error" data-error hidden></p>';
    openModal({
      title: firstRun ? 'Bem-vindo! Vamos começar' : 'Empresa e usuário',
      dismissible: !firstRun,
      body: body,
      actions: firstRun
        ? [{ id: 'save', label: 'Começar', variant: 'primary', submit: true }]
        : [{ id: 'cancel', label: 'Cancelar' }, { id: 'save', label: 'Salvar', variant: 'primary', submit: true }],
      onAction: function (id, modal) {
        if (id !== 'save') return;
        const empresa = modal.el.querySelector('[name="empresa"]').value.trim();
        const usuario = modal.el.querySelector('[name="usuario"]').value.trim();
        const error = modal.el.querySelector('[data-error]');
        if (!empresa || !usuario) {
          error.textContent = 'Preencha a empresa e o usuário.';
          error.hidden = false;
          modal.el.querySelector(!empresa ? '[name="empresa"]' : '[name="usuario"]').focus();
          return false;
        }
        settings.empresaNome = empresa;
        settings.usuarioNome = usuario;
        scheduleSave();
        renderIdentity();
        showToast(firstRun ? 'Tudo pronto. Bom trabalho, ' + usuario.split(' ')[0] + '!' : 'Dados salvos.', { type: 'success' });
      }
    });
  }

  function formatHotkey(key) {
    return key.split('+').map(function (p) { return p.length === 1 ? p.toUpperCase() : p.charAt(0).toUpperCase() + p.slice(1); }).join(' + ');
  }

  function openShortcutsDialog() {
    const rows = SHORTCUTS.concat(Object.keys(programHotkeys).map(function (key) {
      return [formatHotkey(key), 'Abre ' + PROGRAMS[programHotkeys[key]].title];
    }));
    openModal({
      title: 'Atalhos de teclado',
      size: 'lg',
      body: '<table class="kbd-table"><tbody>' + rows.map(function (row) {
        return '<tr><td><kbd>' + escapeHtml(row[0]) + '</kbd></td><td>' + escapeHtml(row[1]) + '</td></tr>';
      }).join('') + '</tbody></table>',
      actions: [{ id: 'ok', label: 'Fechar', variant: 'primary', submit: true }]
    });
  }

  function openAboutDialog() {
    const storage = !storageAvailable ? 'indisponível — nada está sendo salvo'
      : persistenceBlocked ? 'somente leitura (dados de uma versão mais nova)'
      : 'IndexedDB deste navegador, neste computador';
    openModal({
      title: 'Sobre o sistema',
      size: 'sm',
      body: '<p><strong>' + escapeHtml(APP_NAME) + '</strong> — versão ' + APP_VERSION + ' (' + APP_BUILD_DATE + ')</p>' +
        '<ul class="about-list">' +
        '<li>Licenciado para: ' + escapeHtml(settings.empresaNome || '—') + '</li>' +
        '<li>Usuário: ' + escapeHtml(settings.usuarioNome || '—') + '</li>' +
        '<li>Dados: ' + escapeHtml(storage) + '</li>' +
        '<li>Formato dos dados: v' + CURRENT_SCHEMA_VERSION + '</li>' +
        '</ul>',
      actions: [{ id: 'ok', label: 'Fechar', variant: 'primary', submit: true }]
    });
  }

  function requestExit() {
    const n = wins.length;
    confirmDialog({
      title: 'Sair do sistema',
      message: n ? 'Fechar ' + plural(n, 'programa aberto', 'programas abertos') + ' e sair?' : 'Deseja sair do sistema?',
      confirmLabel: 'Sair',
      variant: 'danger'
    }).then(function (ok) { if (ok) lockSession(); });
  }

  function lockSession() {
    closeMenus();
    closeAllWins();
    sessionLocked = true;
    syncInert();
    const nome = (settings.usuarioNome || '').split(' ')[0];
    document.getElementById('lock-msg').textContent = (nome ? 'Até logo, ' + nome + '. ' : '') + 'Sessão encerrada.';
    document.getElementById('lock-screen').hidden = false;
    document.getElementById('lock-enter').focus();
  }

  function unlockSession() {
    sessionLocked = false;
    document.getElementById('lock-screen').hidden = true;
    syncInert();
  }

  /* =====================================================================
   * 14. EVENTOS GLOBAIS (registrados uma única vez)
   * ===================================================================== */

  // Fase de captura: o menu aberto e os modais têm prioridade sobre os campos da página.
  function onKeyDown(e) {
    updateLockKeys(e);
    if (sessionLocked) return;
    if (modalStack.length) {
      const top = modalStack[modalStack.length - 1];
      if (e.key === 'Escape' && top.dismissible) {
        e.preventDefault();
        e.stopPropagation();
        top.close('escape');
      }
      return;
    }
    if (handleMenuKey(e)) return;
    if (e.altKey && !e.ctrlKey && !e.metaKey && !e.shiftKey && ACCEL_CODE_RE.test(e.code || '')) {
      const idx = topIndexByAccel(e.code.charAt(3).toLowerCase());
      if (idx >= 0) {
        e.preventDefault();
        openTopMenu(idx, 'key');
      }
      return;
    }
    if (e.key === 'F10' && !e.shiftKey && !e.ctrlKey && !e.altKey) {
      e.preventDefault();
      openTopMenu(0, 'key');
      return;
    }
    const hotkeyProgram = programHotkeys[eventHotkey(e)];
    if (hotkeyProgram) {
      e.preventDefault();
      openProgram(hotkeyProgram);
      return;
    }
    if ((e.ctrlKey || e.metaKey) && !e.altKey && !e.shiftKey && String(e.key).toLowerCase() === 'k') {
      e.preventDefault();
      focusSearch();
      return;
    }
    if (e.key === 'Escape' && activeWinId && !isEditable(e.target)) {
      const w = findWin(activeWinId);
      if (w) {
        e.preventDefault();
        closeWin(w);
      }
    }
  }

  function onSidebarAction(e) {
    const btn = e.target.closest('[data-action]');
    if (btn) runAction(btn.dataset.action);
  }

  function bindGlobalEvents() {
    const menubar = document.getElementById('menubar-items');
    menubar.addEventListener('click', onMenubarClick);
    menubar.addEventListener('mouseover', onMenubarOver);

    const layer = document.getElementById('menu-layer');
    layer.addEventListener('mouseover', onMenuLayerOver);
    layer.addEventListener('click', onMenuLayerClick);
    layer.addEventListener('contextmenu', onMenuLayerContext);

    document.addEventListener('pointerdown', onDocPointerDown, true);
    document.addEventListener('keydown', onKeyDown, true);
    document.addEventListener('keyup', updateLockKeys);

    const area = winArea();
    area.addEventListener('pointerdown', onWinPointerDown);
    area.addEventListener('pointermove', onWinPointerMove);
    area.addEventListener('pointerup', endGesture);
    area.addEventListener('pointercancel', endGesture);
    area.addEventListener('lostpointercapture', endGesture);
    area.addEventListener('click', onWinClick);
    area.addEventListener('dblclick', onWinDblClick);
    area.addEventListener('change', onWinChange);
    document.getElementById('win-taskbar').addEventListener('click', onTaskbarClick);

    const favList = document.getElementById('fav-list');
    favList.addEventListener('click', onFavClick);
    favList.addEventListener('contextmenu', onFavContext);
    const search = document.getElementById('fav-search');
    search.addEventListener('input', onSearchInput);
    search.addEventListener('keydown', onSearchKeydown);
    document.getElementById('fav-clear').addEventListener('click', function () { clearSearch(true); });
    document.getElementById('sidebar').addEventListener('click', onSidebarAction);
    document.getElementById('lock-enter').addEventListener('click', unlockSession);

    window.addEventListener('resize', onWindowResize);
    window.addEventListener('blur', closeMenus);
  }

  /* =====================================================================
   * 15. INICIALIZAÇÃO (ponto único, chamado uma vez)
   * ===================================================================== */

  function init() {
    programPaths = buildProgramPaths();
    programHotkeys = buildProgramHotkeys();
    renderMenubar();
    bindGlobalEvents();
    document.getElementById('sb-version').textContent = 'Versão ' + APP_VERSION + ' · ' + APP_BUILD_DATE;
    updateClock();
    setInterval(updateClock, CLOCK_INTERVAL_MS);
    requestPersistentStorage();
    loadSettings().then(function (result) {
      renderIdentity();
      renderFavorites();
      renderAlerts();
      updateWindowChrome();
      if (result.firstRun) openCompanyUserDialog(true);
    });
  }

  document.addEventListener('DOMContentLoaded', init);
})();
</script>
</body>
</html>
