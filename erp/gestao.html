<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestão Empresarial</title>
<style>
  :root {
    --bg: #e8edf5;
    --surface: #ffffff;
    --surface-2: #f5f7fb;
    --surface-3: #eceff4;
    --text: #1d2433;
    --text-muted: #5d6779;
    --border: #cfd6e3;
    --border-strong: #b6bfcc;
    --accent: #1d4ed8;
    --accent-hover: #1e40af;
    --accent-soft: #dbe7fd;
    --focus: #2563eb;
    --success: #15803d;
    --warning: #b45309;
    --danger: #dc2626;
    --menu-hover: #d4e5fb;
    --menu-hover-border: #9cc3f5;
    --side-bg: linear-gradient(180deg, #0d47c9 0%, #0a38a8 55%, #0a2f8f 100%);
    --side-text: #ffffff;
    --alert-text: #ffe066;
    --side-foot: linear-gradient(135deg, #0b3a9c 0%, #137f9e 55%, #1fb3a1 100%);
    --title-active: linear-gradient(180deg, #2a5fdc 0%, #1b46b3 100%);
    --title-inactive: #dfe5ee;
    --win-border: #8ea0bd;
    --win-shadow: 0 10px 28px rgba(15, 30, 60, 0.22), 0 2px 6px rgba(15, 30, 60, 0.12);
    --taskbar-h: 34px;
    --font: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 13px;
    line-height: 1.4;
    min-width: 960px;
    min-height: 560px;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  h1, h2, h3, p { margin: 0; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .sprite { position: absolute; width: 0; height: 0; overflow: hidden; }

  body.gesturing { user-select: none; }
  body.gesture-move, body.gesture-move * { cursor: move !important; }
  body.gesture-resize-e, body.gesture-resize-e * { cursor: ew-resize !important; }
  body.gesture-resize-s, body.gesture-resize-s * { cursor: ns-resize !important; }
  body.gesture-resize-se, body.gesture-resize-se * { cursor: nwse-resize !important; }

  /* ---------- Estrutura principal ---------- */
  #app { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100vh; min-height: 560px; overflow: hidden; }
  #main { display: grid; grid-template-columns: 268px minmax(0, 1fr); min-height: 0; }

  /* ---------- Barra de menus ---------- */
  #menubar {
    display: flex; align-items: stretch; height: 28px; padding: 0 4px;
    background: linear-gradient(180deg, #fbfbfc 0%, #eef0f3 100%);
    border-bottom: 1px solid #c9ced8;
  }
  #menubar-items { display: flex; align-items: stretch; }
  .menubar-btn {
    margin: 2px 0; padding: 0 9px; border: 1px solid transparent; border-radius: 3px;
    background: transparent; cursor: default; white-space: nowrap;
  }
  .menubar-btn:hover, .menubar-btn.open { background: var(--menu-hover); border-color: var(--menu-hover-border); }
  .menubar-btn u, .menu-item u { text-decoration-thickness: 1px; text-underline-offset: 2px; }

  #menu-layer { position: fixed; inset: 0; pointer-events: none; z-index: 1000; }
  .menu-pop {
    position: fixed; pointer-events: auto; min-width: 230px; max-height: calc(100vh - 8px); overflow-y: auto;
    padding: 3px; background: var(--surface); border: 1px solid var(--border-strong);
    box-shadow: 2px 5px 14px rgba(15, 30, 60, 0.2);
  }
  .menu-item {
    display: grid; grid-template-columns: 22px minmax(0, 1fr) auto 16px; align-items: center;
    width: 100%; height: 26px; padding: 0 6px 0 4px; border: 1px solid transparent; border-radius: 3px;
    background: none; text-align: left; white-space: nowrap; cursor: default;
  }
  .menu-item.active { background: var(--menu-hover); border-color: var(--menu-hover-border); }
  .menu-item[aria-disabled="true"] { color: #8b93a1; }
  .menu-item[aria-disabled="true"].active { background: var(--surface-3); border-color: transparent; }
  .menu-note { font-style: italic; }
  .mi-check { text-align: center; color: var(--accent); font-size: 12px; font-weight: 700; }
  .mi-label { overflow: hidden; text-overflow: ellipsis; }
  .mi-hint { padding-left: 24px; color: var(--text-muted); font-size: 12px; }
  .mi-arrow { text-align: right; font-size: 15px; line-height: 1; color: #4b5567; }
  .menu-sep { height: 1px; margin: 4px 6px 4px 28px; background: #e1e5eb; }

  /* ---------- Lateral: Favoritos, avisos, rodapé ---------- */
  #sidebar {
    display: flex; flex-direction: column; min-height: 0;
    background: var(--side-bg); color: var(--side-text); border-right: 1px solid #082a7a;
  }
  .sb-head { padding: 4px 8px; background: #e9edf3; color: #4b5567; font-size: 12px; border-bottom: 1px solid #c9ced8; }
  .fav-search-wrap { position: relative; padding: 6px 8px; }
  #fav-search {
    width: 100%; height: 28px; padding: 0 30px 0 8px; border: 1px solid #7f9bd6; border-radius: 3px;
    background: #ffffff; color: #111827;
  }
  #fav-search::-webkit-search-cancel-button { display: none; }
  #fav-clear {
    position: absolute; right: 12px; top: 10px; width: 22px; height: 20px; padding: 0;
    border: 0; border-radius: 3px; background: transparent; color: #374151; cursor: pointer; font-size: 15px; line-height: 1;
  }
  #fav-clear:hover { background: #e5e9f0; }
  #fav-list { flex: 1 1 auto; min-height: 60px; overflow-y: auto; padding: 0 6px 6px; }
  .fav-item {
    display: flex; align-items: center; gap: 8px; width: 100%; padding: 4px 6px; border: 0; border-radius: 4px;
    background: transparent; color: var(--side-text); font-weight: 600; font-size: 12.5px; text-align: left; cursor: pointer;
  }
  .fav-item:hover, .fav-item.active { background: rgba(255, 255, 255, 0.15); }
  .fav-icon {
    flex: 0 0 22px; height: 22px; display: grid; place-items: center; border-radius: 50%;
    background: rgba(255, 255, 255, 0.18); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.25); font-size: 11px;
  }
  .fav-text { display: flex; flex-direction: column; min-width: 0; }
  .fav-label { line-height: 1.2; }
  .fav-path { font-size: 11px; font-weight: 400; opacity: 0.78; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fav-empty { padding: 8px; font-size: 12px; opacity: 0.88; }

  .alerts { margin: 0 6px 6px; border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 4px; background: rgba(0, 0, 30, 0.22); }
  .alerts h2 { margin: 4px 0 2px; color: var(--alert-text); font-size: 13px; text-align: center; letter-spacing: 0.6px; }
  #alerts-box { min-height: 26px; max-height: 84px; overflow-y: auto; padding: 2px 10px 8px; color: var(--alert-text); font-weight: 700; font-size: 12px; text-align: center; line-height: 1.35; }
  #alerts-box p + p { margin-top: 6px; }
  .alert-none { color: rgba(255, 255, 255, 0.78); font-weight: 400; }

  .sb-foot { padding: 7px 12px 9px; background: var(--side-foot); }
  .open-count { display: flex; align-items: center; justify-content: flex-end; gap: 10px; font-weight: 700; font-size: 12px; }
  .open-count strong { font-size: 22px; line-height: 1; }
  .sb-actions { display: flex; justify-content: space-around; margin-top: 6px; }
  .round-btn {
    width: 40px; height: 40px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 50%; cursor: pointer;
    box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.18), 0 2px 6px rgba(0, 0, 0, 0.25);
  }
  .round-btn:hover { filter: brightness(1.08); }
  .round-btn:active { transform: translateY(1px); }
  .round-btn-key { background: radial-gradient(circle at 35% 30%, #ffe08a, #e0a91f); color: #5a3b00; }
  .round-btn-refresh { background: radial-gradient(circle at 35% 30%, #8fb2ff, #2f5fd0); color: #ffffff; }
  .round-btn-power { background: radial-gradient(circle at 35% 30%, #ff8a80, #c62828); color: #ffffff; }
  .sb-version { padding: 5px 10px; background: #0a2f8f; font-size: 11px; font-weight: 700; }

  /* ---------- Área de trabalho e janelas internas ---------- */
  #workspace { position: relative; overflow: hidden; background: radial-gradient(ellipse at 50% 42%, #ffffff 0%, #eef2f8 55%, #e3e9f2 100%); }
  #workspace-bg {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; pointer-events: none; user-select: none;
  }
  .bg-logo { width: 180px; height: 180px; filter: drop-shadow(0 10px 18px rgba(30, 64, 175, 0.25)); }
  .bg-name {
    font-size: 46px; font-weight: 800; letter-spacing: -0.5px;
    background: linear-gradient(90deg, #1e3a8a, #0e7490); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .bg-license { color: #64748b; font-size: 13px; letter-spacing: 3px; text-transform: uppercase; }

  #win-area { position: absolute; inset: 0; z-index: 0; }
  #workspace.has-wins #win-area { bottom: var(--taskbar-h); }
  .mdi-win {
    position: absolute; display: flex; flex-direction: column; overflow: hidden;
    min-width: 300px; min-height: 160px;
    background: var(--surface); border: 1px solid var(--win-border); border-radius: 7px; box-shadow: var(--win-shadow);
  }
  .mdi-win:focus { outline: none; }
  .mdi-win.maximized { left: 0 !important; top: 0 !important; width: 100% !important; height: 100% !important; border-width: 0; border-radius: 0; }
  .mdi-win.maximized .win-resize { display: none; }
  .win-titlebar {
    flex: 0 0 30px; display: flex; align-items: center; gap: 8px; padding: 0 3px 0 10px;
    background: var(--title-inactive); color: #4b5567; user-select: none; touch-action: none;
  }
  .mdi-win.active .win-titlebar { background: var(--title-active); color: #ffffff; }
  .win-icon { font-size: 14px; }
  .win-title { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  .win-buttons { display: flex; gap: 1px; }
  .win-btn {
    width: 30px; height: 24px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 3px;
    background: transparent; color: inherit; cursor: pointer; font-size: 14px; line-height: 1;
  }
  .win-btn:hover { background: rgba(127, 140, 160, 0.25); }
  .mdi-win.active .win-btn:hover { background: rgba(255, 255, 255, 0.2); }
  .win-btn.on { color: #f59e0b; }
  .mdi-win.active .win-btn.on { color: #ffd34d; }
  .win-btn-close:hover, .mdi-win.active .win-btn-close:hover { background: #e81123; color: #ffffff; }
  .win-body { flex: 1 1 auto; min-height: 0; overflow: auto; background: var(--surface); }
  .win-resize { position: absolute; z-index: 2; }
  .win-resize[data-resize="e"] { top: 30px; right: 0; bottom: 12px; width: 6px; cursor: ew-resize; }
  .win-resize[data-resize="s"] { left: 0; right: 12px; bottom: 0; height: 6px; cursor: ns-resize; }
  .win-resize[data-resize="se"] {
    right: 0; bottom: 0; width: 14px; height: 14px; cursor: nwse-resize;
    background: linear-gradient(135deg, transparent 50%, rgba(100, 116, 139, 0.45) 50%, rgba(100, 116, 139, 0.45) 60%, transparent 60%, transparent 72%, rgba(100, 116, 139, 0.45) 72%, rgba(100, 116, 139, 0.45) 82%, transparent 82%);
  }

  #win-taskbar {
    position: absolute; left: 0; right: 0; bottom: 0; height: var(--taskbar-h); display: none; gap: 4px; padding: 4px 6px;
    overflow-x: auto; background: rgba(248, 250, 253, 0.97); border-top: 1px solid var(--border);
  }
  #workspace.has-wins #win-taskbar { display: flex; }
  .task-btn {
    flex: 0 1 210px; min-width: 110px; height: 26px; display: flex; align-items: center; gap: 6px; padding: 0 8px;
    border: 1px solid #c7cfdc; border-radius: 4px; background: var(--surface); cursor: pointer; font-size: 12px; text-align: left;
  }
  .task-btn:hover { background: var(--surface-2); }
  .task-btn.active { background: var(--accent-soft); border-color: #8db5ee; font-weight: 600; }
  .task-btn.minimized { color: var(--text-muted); font-style: italic; }
  .task-label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ---------- Barra de status ---------- */
  #statusbar {
    display: flex; height: 24px; background: #eceef2; border-top: 1px solid #c4c9d2; font-size: 12px; color: #2d3442;
  }
  .st-cell {
    padding: 0 10px; line-height: 23px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    border-left: 1px solid #c9ced6; box-shadow: inset 1px 0 0 #ffffff;
  }
  .st-cell:first-child { border-left: 0; box-shadow: none; }
  .st-grow { flex: 1 1 auto; }
  .st-key { color: #a2a9b5; font-weight: 600; }
  .st-key.on { color: #111827; }

  /* ---------- Conteúdo dos programas ---------- */
  .badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; white-space: nowrap; }
  .st-pendente { background: #fff1cc; color: #8a5a00; }
  .st-pronto { background: #dcf5e3; color: #146c2e; }
  .st-print { background: #e8ecff; color: #3743a5; }

  .ph { max-width: 580px; margin: 0 auto; padding: 26px 24px 30px; text-align: center; }
  .ph-icon { font-size: 42px; line-height: 1.1; }
  .ph h2 { margin-top: 6px; font-size: 18px; }
  .ph-path { margin: 4px 0 10px; color: var(--text-muted); }
  .ph-box { margin-top: 18px; padding: 14px 18px; text-align: left; background: var(--surface-2); border: 1px solid #dfe5ef; border-radius: 8px; }
  .ph-box ul { margin: 8px 0 0; padding-left: 20px; }
  .ph-box li + li { margin-top: 3px; }

  .map { padding: 14px 18px 22px; }
  .map-intro { color: var(--text-muted); }
  .map-summary { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 4px; }
  .map-stat { padding: 7px 12px; background: var(--surface-2); border: 1px solid #e1e6ee; border-radius: 6px; color: var(--text-muted); font-size: 12px; }
  .map-stat strong { display: block; color: var(--text); font-size: 18px; line-height: 1.2; }
  .map-top h3 {
    margin: 16px 0 6px; padding-bottom: 4px; border-bottom: 1px solid #e3e8f0;
    color: var(--accent); font-size: 12px; letter-spacing: 0.5px; text-transform: uppercase;
  }
  .map ul { margin: 0; padding-left: 16px; list-style: none; }
  .map-top > ul { padding-left: 2px; }
  .map li { padding: 2px 0; }
  .map-sub { color: #374151; }
  .map-note, .map-action { color: var(--text-muted); font-style: italic; }
  .map-link {
    display: inline-flex; align-items: center; gap: 6px; padding: 0; border: 0; background: none;
    color: var(--accent); cursor: pointer; text-align: left;
  }
  .map-link:hover { text-decoration: underline; }

  .favman { padding: 14px 18px 18px; }
  .favman-list { margin: 10px 0 12px; padding: 0; list-style: none; border: 1px solid #e1e6ee; border-radius: 6px; }
  .favman-list li { display: flex; align-items: center; gap: 8px; padding: 4px 6px 4px 10px; }
  .favman-list li + li { border-top: 1px solid #eef1f5; }
  .favman-num { flex: 0 0 18px; color: var(--text-muted); font-size: 12px; text-align: right; }
  .favman-name { flex: 1 1 auto; min-width: 0; }
  .favman-name small { display: block; color: var(--text-muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .favman-empty { padding: 10px; color: var(--text-muted); }
  .btn.btn-sm { height: 26px; padding: 0 9px; font-size: 12px; }
  .favman-bar { display: flex; gap: 8px; align-items: center; }
  .favman-bar select { flex: 1 1 auto; min-width: 0; height: 30px; padding: 0 6px; border: 1px solid #c3cad6; border-radius: 6px; background: var(--surface); }

  /* ---------- Modais ---------- */
  .modal-backdrop {
    position: fixed; inset: 0; z-index: 2000; display: grid; place-items: center; padding: 20px;
    background: rgba(15, 23, 42, 0.4); opacity: 0; transition: opacity 0.14s ease;
  }
  .modal-backdrop.show { opacity: 1; }
  .modal { width: min(500px, 100%); max-height: calc(100vh - 40px); display: flex; flex-direction: column; background: var(--surface); border-radius: 10px; box-shadow: 0 24px 60px rgba(15, 23, 42, 0.35); }
  .modal-sm { width: min(400px, 100%); }
  .modal-lg { width: min(640px, 100%); }
  .modal-header { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 13px 18px; border-bottom: 1px solid var(--border); }
  .modal-header h2 { font-size: 15px; }
  .modal-body { padding: 16px 18px; overflow-y: auto; }
  .modal-footer { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--border); background: #f8fafc; border-radius: 0 0 10px 10px; }
  .modal-lead { margin-bottom: 14px; color: var(--text-muted); }
  .icon-btn { width: 28px; height: 28px; padding: 0; border: 0; border-radius: 6px; background: transparent; cursor: pointer; color: var(--text-muted); }
  .icon-btn:hover { background: var(--surface-3); color: var(--text); }
  .btn { height: 32px; padding: 0 14px; border: 1px solid #c3cad6; border-radius: 6px; background: var(--surface); font-weight: 600; white-space: nowrap; cursor: pointer; }
  .btn:disabled { opacity: 0.45; cursor: default; }
  .btn:hover { background: var(--surface-2); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #ffffff; }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-danger { background: var(--danger); border-color: var(--danger); color: #ffffff; }
  .btn-danger:hover { background: #b91c1c; }
  .field { display: block; margin-bottom: 12px; }
  .field > span { display: block; margin-bottom: 4px; color: #374151; font-size: 12px; font-weight: 600; }
  .field input { width: 100%; height: 34px; padding: 0 10px; border: 1px solid #c3cad6; border-radius: 6px; background: var(--surface); }
  .field input:focus { outline: 2px solid #93b4f5; outline-offset: 0; border-color: var(--focus); }
  .field-error { color: var(--danger); font-size: 12px; font-weight: 600; }
  .kbd-table { width: 100%; border-collapse: collapse; }
  .kbd-table td { padding: 6px 0; border-bottom: 1px solid #eef1f5; vertical-align: top; }
  .kbd-table td:first-child { width: 42%; padding-right: 12px; }
  kbd { display: inline-block; padding: 1px 6px; border: 1px solid #cbd2dd; border-bottom-width: 2px; border-radius: 4px; background: var(--surface-2); font-family: inherit; font-size: 12px; white-space: nowrap; }
  .about-list { margin: 10px 0 0; padding-left: 18px; }
  .about-list li + li { margin-top: 4px; }

  /* ---------- Toasts ---------- */
  #toast-root { position: fixed; right: 16px; bottom: 36px; z-index: 2500; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
  .toast {
    display: flex; align-items: flex-start; gap: 10px; min-width: 240px; max-width: 380px; padding: 10px 12px;
    background: #1f2937; color: #ffffff; border-left: 4px solid #60a5fa; border-radius: 8px; box-shadow: 0 8px 22px rgba(0, 0, 0, 0.25);
    pointer-events: auto; opacity: 0; transform: translateY(8px); transition: opacity 0.18s ease, transform 0.18s ease;
  }
  .toast.show { opacity: 1; transform: none; }
  .toast-success { border-left-color: #22c55e; }
  .toast-warning { border-left-color: #f59e0b; }
  .toast-error { border-left-color: #ef4444; }
  .toast-close { margin-left: auto; padding: 0 2px; border: 0; background: none; color: inherit; opacity: 0.7; cursor: pointer; }
  .toast-close:hover { opacity: 1; }

  /* ---------- Tela de saída ---------- */
  #lock-screen { position: fixed; inset: 0; z-index: 3000; display: grid; place-items: center; background: linear-gradient(135deg, #0a2f8f 0%, #137f9e 100%); }
  .lock-card { width: 360px; padding: 30px 28px; text-align: center; background: var(--surface); border-radius: 14px; box-shadow: 0 30px 70px rgba(0, 0, 0, 0.35); }
  .lock-card svg { width: 72px; height: 72px; }
  .lock-card h1 { margin-top: 10px; font-size: 20px; }
  .lock-card p { margin: 6px 0 18px; color: var(--text-muted); }
</style>
</head>
<body>
<svg class="sprite" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="logo-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e40af"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>
  <symbol id="logo" viewBox="0 0 120 120">
    <rect x="6" y="6" width="108" height="108" rx="26" fill="url(#logo-grad)"/>
    <rect x="28" y="64" width="16" height="28" rx="3" fill="#ffffff" opacity="0.72"/>
    <rect x="52" y="47" width="16" height="45" rx="3" fill="#ffffff" opacity="0.86"/>
    <rect x="76" y="29" width="16" height="63" rx="3" fill="#ffffff"/>
  </symbol>
</svg>

<div id="app">
  <nav id="menubar" aria-label="Menu principal">
    <div id="menubar-items" role="menubar"></div>
  </nav>

  <div id="main">
    <aside id="sidebar" aria-label="Favoritos e avisos">
      <div class="sb-head">Favoritos</div>
      <div class="fav-search-wrap">
        <input id="fav-search" type="search" placeholder="Buscar programa… (Ctrl+K)" autocomplete="off" spellcheck="false" aria-label="Buscar programa">
        <button type="button" id="fav-clear" title="Limpar busca" aria-label="Limpar busca">↶</button>

  // Formato dos dados salvos: MIGRATIONS[n] converte um registro da versão n-1 para a versão n.
  const MIGRATIONS = {};

  /* =====================================================================

  let dbPromise = null;

  let persistenceBlocked = false;
  let settings = null;

  let programHotkeys = {};

  let zTop = 10;

  let searchActive = 0;
