<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GoalQuest</title>
<style>
  :root,
  [data-theme="dark"] {
    --bg: #0e1016;
    --surface: #161922;
    --surface-2: #1d212d;
    --surface-3: #262b3a;
    --text: #e8eaf0;
    --text-muted: #9aa1b4;
    --border: #2a3040;
    --accent: #7c5cff;
    --accent-hover: #8f74ff;
    --accent-contrast: #ffffff;
    --accent-soft: rgba(124, 92, 255, 0.16);
    --secondary: #22d3ee;
    --success: #22c55e;
    --warning: #f59e0b;
    --danger: #ef4444;
    --info: #3b82f6;
    --progress: #7c5cff;
    --xp: #fbbf24;
    --selection: rgba(124, 92, 255, 0.35);
    --overlay: rgba(5, 6, 10, 0.66);
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    --glow: 0 0 0 1px rgba(124, 92, 255, 0.35), 0 0 22px rgba(124, 92, 255, 0.18);
    --radius: 12px;
    --radius-sm: 8px;
    --font-scale: 1;
    color-scheme: dark;
  }
  [data-theme="light"] {
    --bg: #f3f4f8;
    --surface: #ffffff;
    --surface-2: #f6f7fb;
    --surface-3: #eceef5;
    --text: #1b1e27;
    --text-muted: #5f6678;
    --border: #dfe2ec;
    --accent: #6645f0;
    --accent-hover: #5534e0;
    --accent-contrast: #ffffff;
    --accent-soft: rgba(102, 69, 240, 0.1);
    --secondary: #0891b2;
    --success: #16a34a;
    --warning: #d97706;
    --danger: #dc2626;
    --info: #2563eb;
    --progress: #6645f0;
    --xp: #d97706;
    --selection: rgba(102, 69, 240, 0.22);
    --overlay: rgba(20, 22, 30, 0.45);
    --shadow: 0 10px 30px rgba(20, 24, 40, 0.12);
    --glow: 0 0 0 1px rgba(102, 69, 240, 0.25), 0 0 18px rgba(102, 69, 240, 0.1);
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  ::selection { background: var(--selection); }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: calc(14px * var(--font-scale));
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, h4 { margin: 0; line-height: 1.25; }
  p { margin: 0; }
  a { color: var(--accent); }
  button, input, select, textarea { font: inherit; color: inherit; }

  /* ---------- Shell ---------- */
  #app { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh; }
  .sidebar {
    position: sticky; top: 0; height: 100vh; overflow-y: auto;
    background: var(--surface); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 20px; padding: 20px 14px;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px; }
  .brand-logo {
    width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center;
    background: linear-gradient(135deg, var(--accent), var(--secondary)); color: #fff; font-weight: 800; font-size: 16px;
    box-shadow: var(--glow);
  }
  .brand-name { font-weight: 800; font-size: 17px; letter-spacing: 0.2px; }
  .brand-sub { font-size: 11px; color: var(--text-muted); }
  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav-item {
    display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 12px; border-radius: var(--radius-sm);
    background: transparent; border: 0; cursor: pointer; text-align: left; color: var(--text-muted); font-weight: 500;
  }
  .nav-item:hover { background: var(--surface-2); color: var(--text); }
  .nav-item.active { background: var(--accent-soft); color: var(--text); box-shadow: inset 3px 0 0 var(--accent); }
  .nav-icon { width: 20px; text-align: center; }
  .sidebar-section-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-muted); padding: 0 10px; margin-bottom: 6px; }
  .player-mini { margin-top: auto; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; }
  .player-mini-top { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .player-mini-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .player-mini-level { font-size: 12px; color: var(--text-muted); }
  .player-mini-foot { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-muted); margin-top: 6px; }

  .main { min-width: 0; display: flex; flex-direction: column; }
  .topbar {
    position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 12px;
    padding: 14px 32px; background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(8px); border-bottom: 1px solid var(--border);
  }
  .topbar-title { font-size: 18px; font-weight: 700; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topbar-actions { display: flex; align-items: center; gap: 8px; }
  .save-indicator { font-size: 12px; color: var(--text-muted); padding: 4px 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); white-space: nowrap; }
  .save-indicator.error { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, var(--border)); }
  .save-indicator.warn { color: var(--warning); }
  .view { padding: 24px 32px 64px; width: 100%; max-width: 1440px; }

  /* ---------- Componentes base ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 14px;
    border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface-2); color: var(--text);
    cursor: pointer; font-weight: 500; white-space: nowrap; transition: background 0.15s, border-color 0.15s, box-shadow 0.15s;
  }
  .btn:hover { background: var(--surface-3); }
  .btn:disabled, .btn:disabled:hover { opacity: 0.45; cursor: not-allowed; background: var(--surface-2); box-shadow: none; }
  .btn-primary:disabled, .btn-primary:disabled:hover { background: var(--accent); }
  .btn:focus-visible, .icon-btn:focus-visible, .nav-item:focus-visible, .check-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-contrast); }
  .btn-primary:hover { background: var(--accent-hover); box-shadow: var(--glow); }
  .btn-danger { background: transparent; color: var(--danger); border-color: color-mix(in srgb, var(--danger) 45%, var(--border)); }
  .btn-danger:hover { background: color-mix(in srgb, var(--danger) 12%, transparent); }
  .btn-danger-solid { background: var(--danger); border-color: var(--danger); color: #fff; }
  .btn-danger-solid:hover { background: color-mix(in srgb, var(--danger) 85%, #000); }
  .btn-ghost { background: transparent; border-color: transparent; }
  .btn-ghost:hover { background: var(--surface-2); }
  .btn-sm { padding: 5px 10px; font-size: 13px; }
  .icon-btn {
    display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: var(--radius-sm);
    border: 1px solid transparent; background: transparent; cursor: pointer; color: var(--text-muted);
  }
  .icon-btn:hover { background: var(--surface-2); color: var(--text); border-color: var(--border); }
  .icon-btn:disabled { opacity: 0.35; cursor: not-allowed; background: transparent; border-color: transparent; }
  .icon-btn.danger:hover { color: var(--danger); }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; }
  .card-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 14px; }
  .card-title h3 { font-size: 15px; }
  .muted { color: var(--text-muted); }
  .small { font-size: 12px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .row-wrap { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .spacer { flex: 1; }
  .section-head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .section-head h2 { font-size: 20px; }

  .badge {
    display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600;
    background: var(--surface-3); color: var(--text-muted); white-space: nowrap; border: 1px solid transparent;
  }
  .badge-status-todo { color: var(--text-muted); }
  .badge-status-doing { color: var(--info); background: color-mix(in srgb, var(--info) 14%, transparent); }
  .badge-status-paused { color: var(--warning); background: color-mix(in srgb, var(--warning) 14%, transparent); }
  .badge-status-done { color: var(--success); background: color-mix(in srgb, var(--success) 14%, transparent); }
  .badge-priority-low { color: var(--text-muted); }
  .badge-priority-medium { color: var(--info); }
  .badge-priority-high { color: var(--warning); }
  .badge-priority-critical { color: var(--danger); background: color-mix(in srgb, var(--danger) 12%, transparent); }
  .badge-diff-easy { color: var(--success); }
  .badge-diff-medium { color: var(--info); }
  .badge-diff-hard { color: var(--warning); }
  .badge-diff-epic { color: #c084fc; background: rgba(192, 132, 252, 0.14); }
  .badge-xp { color: var(--xp); background: color-mix(in srgb, var(--xp) 14%, transparent); }
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 12px; background: var(--surface-2); border: 1px solid var(--border); color: var(--text-muted); }
  .chip-danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, var(--border)); }
  .chip-warning { color: var(--warning); border-color: color-mix(in srgb, var(--warning) 40%, var(--border)); }
  .chip-success { color: var(--success); }
  .tag { font-size: 11.5px; color: var(--secondary); }

  .progress { height: 8px; background: var(--surface-3); border-radius: 999px; overflow: hidden; }
  .progress > span { display: block; height: 100%; background: var(--progress); border-radius: 999px; transition: width 0.3s ease; }
  .progress.done > span { background: var(--success); }
  .progress.xp > span { background: linear-gradient(90deg, var(--xp), color-mix(in srgb, var(--xp) 60%, var(--accent))); }
  .progress-lg { height: 10px; }

  .empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); }
  .empty-state .empty-icon { font-size: 40px; margin-bottom: 8px; }
  .empty-state h3 { color: var(--text); margin-bottom: 6px; font-size: 16px; }
  .empty-state .btn { margin-top: 14px; }
  .empty-inline { color: var(--text-muted); font-size: 13px; padding: 10px 0; }

  /* ---------- Formulários ---------- */
  .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 16px; }
  .form-grid .full { grid-column: 1 / -1; }
  .form-grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px 16px; }
  .field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .field > span, .field-label { font-size: 12.5px; font-weight: 600; color: var(--text-muted); }
  .field .req { color: var(--danger); }
  .input, .select, .textarea {
    width: 100%; padding: 8px 10px; border-radius: var(--radius-sm); border: 1px solid var(--border);
    background: var(--surface-2); color: var(--text); outline: none; transition: border-color 0.15s, box-shadow 0.15s;
  }
  .input:focus, .select:focus, .textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .textarea { resize: vertical; min-height: 70px; }
  .select-sm { padding: 4px 8px; font-size: 12.5px; width: auto; }
  .field.invalid .input, .field.invalid .select, .field.invalid .textarea { border-color: var(--danger); }
  .field-error { color: var(--danger); font-size: 12px; min-height: 0; }
  .hint { font-size: 12px; color: var(--text-muted); }
  .fieldset { border: 1px dashed var(--border); border-radius: var(--radius); padding: 14px; }
  .fieldset-title { font-size: 12.5px; font-weight: 700; color: var(--text); margin-bottom: 10px; }
  .icon-picker { display: flex; flex-wrap: wrap; gap: 6px; }
  .icon-option, .color-option {
    width: 34px; height: 34px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface-2);
    cursor: pointer; display: grid; place-items: center; font-size: 17px; padding: 0;
  }
  .icon-option.selected, .color-option.selected { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  .color-option { border-radius: 50%; width: 28px; height: 28px; }
  .color-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .color-input { width: 40px; height: 30px; padding: 0; border: 1px solid var(--border); border-radius: var(--radius-sm); background: none; cursor: pointer; }
  .cover-preview { width: 100%; height: 140px; border-radius: var(--radius-sm); border: 1px dashed var(--border); background: var(--surface-2) center / cover no-repeat; display: grid; place-items: center; color: var(--text-muted); font-size: 12.5px; overflow: hidden; }
  .cover-preview img { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* ---------- Modais ---------- */
  .modal-backdrop {
    position: fixed; inset: 0; z-index: 100; background: var(--overlay); display: flex; align-items: flex-start; justify-content: center;
    padding: 6vh 20px 20px; overflow-y: auto; opacity: 0; transition: opacity 0.15s ease;
  }
  .modal-backdrop.show { opacity: 1; }
  .modal {
    width: 100%; max-width: 560px; background: var(--surface); border: 1px solid var(--border); border-radius: calc(var(--radius) + 4px);
    box-shadow: var(--shadow); transform: translateY(8px) scale(0.99); transition: transform 0.15s ease; display: flex; flex-direction: column; margin: 0;
  }
  .modal-backdrop.show .modal { transform: none; }
  .modal-lg { max-width: 780px; }
  .modal-sm { max-width: 440px; }
  .modal-header { display: flex; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--border); }
  .modal-header h2 { font-size: 17px; flex: 1; }
  .modal-body { padding: 18px 20px; }
  .modal-footer { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--border); }
  .modal-message { color: var(--text-muted); white-space: pre-line; }

  /* ---------- Toasts ---------- */
  #toast-root { position: fixed; right: 20px; bottom: 20px; z-index: 200; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; pointer-events: none; }
  .toast {
    pointer-events: auto; display: flex; align-items: center; gap: 10px; min-width: 260px; max-width: 420px; padding: 10px 12px 10px 14px;
    background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--info); border-radius: var(--radius-sm);
    box-shadow: var(--shadow); opacity: 0; transform: translateY(10px); transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .toast.show { opacity: 1; transform: none; }
  .toast-success { border-left-color: var(--success); }
  .toast-error { border-left-color: var(--danger); }
  .toast-warning { border-left-color: var(--warning); }
  .toast-xp { border-left-color: var(--xp); }
  .toast-msg { flex: 1; font-size: 13.5px; }
  .toast-action { background: none; border: 0; color: var(--accent); font-weight: 700; cursor: pointer; padding: 4px 6px; border-radius: 6px; }
  .toast-action:hover { background: var(--accent-soft); }
  .toast-close { background: none; border: 0; color: var(--text-muted); cursor: pointer; padding: 2px 4px; }

  /* ---------- Dashboard ---------- */
  .hero { display: grid; grid-template-columns: auto 1fr auto; gap: 20px; align-items: center; padding: 22px; background: linear-gradient(135deg, var(--accent-soft), transparent 60%), var(--surface); margin-bottom: 18px; }
  .avatar {
    width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 22px; color: #fff;
    background: linear-gradient(135deg, var(--accent), var(--secondary)); box-shadow: var(--glow); flex-shrink: 0;
  }
  .avatar-sm { width: 36px; height: 36px; font-size: 14px; }
  .hero-name { font-size: 20px; font-weight: 800; }
  .hero-sub { color: var(--text-muted); margin-bottom: 10px; }
  .hero-xp-line { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--text-muted); margin-top: 6px; }
  .hero-level { text-align: center; padding: 0 10px; }
  .hero-level-num { font-size: 36px; font-weight: 900; line-height: 1; background: linear-gradient(135deg, var(--accent), var(--secondary)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hero-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .stats-grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 14px; margin-bottom: 18px; }
  .stat-card { padding: 14px 16px; }
  .stat-label { font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
  .stat-value { font-size: 24px; font-weight: 800; margin-top: 4px; }
  .stat-sub { font-size: 12px; color: var(--text-muted); }
  .stat-card.danger .stat-value { color: var(--danger); }
  .dash-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
  .list { display: flex; flex-direction: column; }
  .list-item { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border); min-width: 0; }
  .list-item:last-child { border-bottom: 0; }
  .list-item-main { flex: 1; min-width: 0; }
  .list-item-title { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .list-item-sub { font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .clickable { cursor: pointer; }
  .clickable:hover .list-item-title { color: var(--accent); }
  .activity-icon { width: 28px; height: 28px; border-radius: 8px; background: var(--surface-2); display: grid; place-items: center; flex-shrink: 0; }
  .recent-projects { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .mini-project { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px; background: var(--surface-2); cursor: pointer; border-top: 3px solid var(--project-color, var(--accent)); }
  .mini-project:hover { border-color: var(--project-color, var(--accent)); }
  .mini-project-title { font-weight: 600; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ---------- Projetos ---------- */
  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
  .toolbar .input { width: 240px; }
  .toolbar .select { width: auto; }
  .project-list { display: flex; flex-direction: column; gap: 10px; }
  .project-row {
    display: grid; grid-template-columns: 64px minmax(0, 1fr) 180px auto; gap: 16px; align-items: center; padding: 12px 14px;
    background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--project-color, var(--accent)); border-radius: var(--radius); cursor: pointer;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .project-row:hover { box-shadow: var(--glow); }
  .project-thumb { width: 64px; height: 48px; border-radius: var(--radius-sm); background: color-mix(in srgb, var(--project-color, var(--accent)) 18%, var(--surface-2)); display: grid; place-items: center; font-size: 24px; overflow: hidden; }
  .project-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .project-row-title { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-weight: 600; font-size: 15px; }
  .project-row-desc { color: var(--text-muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .project-row-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  .project-row-progress .small { display: flex; justify-content: space-between; margin-bottom: 4px; }
  .project-row-actions { display: flex; gap: 2px; }

  .project-header { overflow: hidden; padding: 0; margin-bottom: 18px; border-top: 4px solid var(--project-color, var(--accent)); }
  .project-cover { height: 170px; background: color-mix(in srgb, var(--project-color, var(--accent)) 20%, var(--surface-2)); }
  .project-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .project-header-body { padding: 18px 22px 20px; display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 24px; }
  .project-title-line { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  .project-title-icon { font-size: 30px; }
  .project-title-line h2 { font-size: 22px; }
  .motivation { margin-top: 10px; padding: 10px 14px; border-left: 3px solid var(--project-color, var(--accent)); background: var(--surface-2); border-radius: 0 var(--radius-sm) var(--radius-sm) 0; font-style: italic; color: var(--text-muted); }
  .project-side { display: flex; flex-direction: column; gap: 10px; }
  .big-percent { font-size: 30px; font-weight: 900; }
  .back-link { display: inline-flex; margin-bottom: 12px; }

  .tabs { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--border); padding: 4px; border-radius: var(--radius); width: fit-content; }
  .tab { border: 0; background: transparent; padding: 6px 12px; border-radius: var(--radius-sm); cursor: pointer; color: var(--text-muted); font-weight: 500; }
  .tab:hover { color: var(--text); }
  .tab.active { background: var(--accent-soft); color: var(--text); }
  .tab .count { font-size: 11px; margin-left: 4px; opacity: 0.8; }

  /* ---------- Metas ---------- */
  .goal-list { display: flex; flex-direction: column; gap: 10px; }
  .goal-card { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 14px; padding: 14px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
  .goal-card.is-done { opacity: 0.78; }
  .goal-card.is-done .goal-title { text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--text) 40%, transparent); }
  .goal-card.is-overdue { border-color: color-mix(in srgb, var(--danger) 45%, var(--border)); }
  .goal-lead { display: flex; justify-content: center; padding-top: 2px; }
  .check-btn {
    width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--border); background: transparent; cursor: pointer;

  .check-btn:hover { border-color: var(--success); }
  .check-btn.checked { background: var(--success); border-color: var(--success); }
  .goal-ring {
    --p: 0; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center;
    background: conic-gradient(var(--progress) calc(var(--p) * 1%), var(--surface-3) 0);
  }
  .goal-ring.done { background: conic-gradient(var(--success) calc(var(--p) * 1%), var(--surface-3) 0); }
  .goal-ring span { width: 34px; height: 34px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; font-size: 10.5px; font-weight: 700; }

  .goal-title { font-weight: 600; font-size: 15px; }
  .goal-desc { color: var(--text-muted); font-size: 13px; margin-top: 3px; }
  .goal-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; align-items: center; }
  .goal-progress { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
  .goal-progress .progress { flex: 1; max-width: 420px; }
  .goal-value { font-size: 12.5px; color: var(--text-muted); white-space: nowrap; }
  .next-action { margin-top: 8px; font-size: 13px; padding: 6px 10px; background: var(--surface-2); border-radius: var(--radius-sm); border: 1px solid var(--border); }
  .next-action b { color: var(--secondary); font-weight: 600; }
  .goal-side { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .goal-side-actions { display: flex; gap: 2px; align-items: center; }
  .goal-history { grid-column: 2 / -1; border-top: 1px dashed var(--border); padding-top: 10px; }
  .history-item { display: grid; grid-template-columns: 110px 160px minmax(0, 1fr); gap: 10px; font-size: 12.5px; padding: 4px 0; color: var(--text-muted); }
  .history-item b { color: var(--text); font-weight: 600; }
  .project-link { background: none; border: 0; padding: 0; color: var(--text-muted); cursor: pointer; font-size: 12px; }

  .settings-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
  .theme-options { display: flex; gap: 10px; }

  .theme-swatch { height: 40px; border-radius: var(--radius-sm); margin-bottom: 8px; border: 1px solid var(--border); }
  .kv { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: 6px 12px; font-size: 13px; }
  .kv dt { color: var(--text-muted); }
  .kv dd { margin: 0; }

  .loading { padding: 60px; text-align: center; color: var(--text-muted); }

  /* ---------- Vitalidade, streak e jogador ---------- */

  .hero-bar-line { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--text-muted); margin-bottom: 8px; }
  .hero-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .chip-accent { color: var(--xp); border-color: color-mix(in srgb, var(--xp) 40%, var(--border)); }
  .chip-ice { color: var(--secondary); border-color: color-mix(in srgb, var(--secondary) 40%, var(--border)); }
  .banner { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface-2); margin-bottom: 14px; font-size: 13.5px; }
  .banner-danger { border-color: color-mix(in srgb, var(--danger) 45%, var(--border)); background: color-mix(in srgb, var(--danger) 10%, var(--surface)); }
  .banner-info { border-color: color-mix(in srgb, var(--secondary) 40%, var(--border)); }
  .banner .spacer { flex: 1; }
  .player-mini-bars { display: flex; flex-direction: column; gap: 5px; }
  .player-mini-bars .progress { height: 6px; }

  /* ---------- Heatmap de atividade ---------- */
  .heatmap-wrap { --hm-cell: 16px; overflow-x: auto; padding: 2px 2px 6px; }
  .hm-footer { --hm-cell: 13px; }
  .heatmap { display: grid; grid-template-columns: 30px auto; column-gap: 6px; row-gap: 4px; width: max-content; }
  .hm-months { grid-column: 2; display: grid; grid-template-columns: repeat(var(--weeks), var(--hm-cell)); column-gap: 3px; height: 15px; font-size: 11px; color: var(--text-muted); }
  .hm-months span { grid-row: 1; white-space: nowrap; }
  .hm-days { display: grid; grid-template-rows: repeat(7, var(--hm-cell)); row-gap: 3px; font-size: 10.5px; line-height: var(--hm-cell); color: var(--text-muted); }
  .hm-grid { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, var(--hm-cell)); grid-auto-columns: var(--hm-cell); gap: 3px; }
  .hm-cell { width: var(--hm-cell); height: var(--hm-cell); border-radius: 3px; background: var(--surface-3); }
  .hm-cell.l1 { background: color-mix(in srgb, var(--accent) 32%, var(--surface-3)); }
  .hm-cell.l2 { background: color-mix(in srgb, var(--accent) 56%, var(--surface-3)); }
  .hm-cell.l3 { background: color-mix(in srgb, var(--accent) 78%, var(--surface-3)); }
  .hm-cell.l4 { background: var(--accent); }
  .hm-cell.frozen { box-shadow: inset 0 0 0 2px var(--secondary); }
  .hm-cell.today { outline: 1.5px solid var(--text); outline-offset: 1px; }

  .hm-footer { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-top: 10px; font-size: 12px; color: var(--text-muted); }
  .hm-legend { display: flex; align-items: center; gap: 3px; }
  .hm-legend .hm-cell { cursor: default; }
  .hm-legend-label { margin: 0 4px; }
  .dash-full { grid-column: 1 / -1; margin-bottom: 18px; }

  /* ---------- Áreas da vida ---------- */
  .area-row { display: grid; grid-template-columns: 32px minmax(0, 1fr) 56px; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--border); cursor: pointer; }
  .area-row:last-child { border-bottom: 0; }
  .area-row:hover .area-name { color: var(--accent); }
  .area-icon { width: 32px; height: 32px; border-radius: 8px; background: var(--surface-2); display: grid; place-items: center; font-size: 16px; }
  .area-name { font-weight: 600; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .area-sub { font-size: 12px; color: var(--text-muted); margin: 2px 0 5px; }
  .area-pct { text-align: right; font-weight: 800; font-size: 15px; }

  /* ---------- Paleta de comandos ---------- */
  .search-btn { display: inline-flex; align-items: center; gap: 10px; padding: 6px 8px 6px 12px; min-width: 220px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface-2); color: var(--text-muted); cursor: pointer; }
  .search-btn:hover { border-color: var(--accent); color: var(--text); }
  .search-btn .spacer { flex: 1; }
  kbd { font-family: inherit; font-size: 11px; padding: 1px 6px; border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 5px; background: var(--surface); color: var(--text-muted); white-space: nowrap; }
  .modal-palette { max-width: 620px; }
  .modal-palette .modal-header { display: none; }
  .modal-palette .modal-body { padding: 12px; }
  .palette-input { font-size: 15px; padding: 11px 12px; }
  .palette-list { margin-top: 8px; max-height: 56vh; overflow-y: auto; }
  .palette-group { font-size: 11px; text-transform: uppercase; letter-spacing: 0.7px; color: var(--text-muted); padding: 10px 10px 4px; }
  .palette-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--radius-sm); cursor: pointer; min-width: 0; }
  .palette-item.active { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
  .palette-item-icon { width: 22px; text-align: center; flex-shrink: 0; }
  .palette-item-label { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .palette-item-hint { font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 45%; }
  .palette-foot { display: flex; gap: 14px; margin-top: 10px; padding: 8px 4px 0; border-top: 1px solid var(--border); font-size: 12px; color: var(--text-muted); }
  .palette-empty { padding: 18px 10px; color: var(--text-muted); text-align: center; }

  /* ---------- Tooltip e destaque ---------- */
  #tooltip {
    position: fixed; z-index: 300; pointer-events: none; max-width: 260px; padding: 7px 10px; border-radius: var(--radius-sm);
    background: var(--surface); color: var(--text); border: 1px solid var(--border); box-shadow: var(--shadow);
    font-size: 12.5px; white-space: pre-line; opacity: 0; transition: opacity 0.1s ease;
  }
  #tooltip.show { opacity: 1; }
  @keyframes goal-flash { 0%, 100% { box-shadow: none; } 30% { box-shadow: 0 0 0 3px var(--accent), var(--glow); } }
  .goal-card.flash { animation: goal-flash 1.6s ease 2; }

  /* Responsividade básica (bônus, desktop é o foco) */
  @media (max-width: 1200px) {
    .stats-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }
  @media (max-width: 960px) {
    #app { grid-template-columns: 1fr; }
    .sidebar { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; }
    .nav { flex-direction: row; flex-wrap: wrap; }
    .player-mini, .sidebar-section-title { display: none; }
    .dash-grid, .settings-grid, .recent-projects { grid-template-columns: 1fr; }
    .project-row { grid-template-columns: 48px minmax(0, 1fr); }
    .project-row-progress, .project-row-actions { grid-column: 2; }
    .project-header-body { grid-template-columns: 1fr; }
    .form-grid, .form-grid-3 { grid-template-columns: 1fr; }
    .view, .topbar { padding-left: 16px; padding-right: 16px; }
  }
</style>
</head>
