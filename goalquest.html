      '<div class="activity-icon">' + (isGoal ? '🎯' : escapeHtml(item.icon)) + '</div>' +
      '<div class="list-item-main"><div class="list-item-title">' + escapeHtml(title) + '</div><div class="list-item-sub">' + escapeHtml(sub) + '</div></div>' +
      deadlineChip(item.deadline, item.status) + '</div>';
  }

  function upcomingListHtml(today) {
    const limit = addDaysISO(today, UPCOMING_DAYS);
    const inWindow = function (x) { return x.deadline && x.status !== 'done' && x.deadline >= today && x.deadline <= limit; };
    const items = state.goals.filter(inWindow).map(function (g) { return { kind: 'goal', item: g }; })
      .concat(state.projects.filter(inWindow).map(function (p) { return { kind: 'project', item: p }; }))
      .sort(function (a, b) { return a.item.deadline < b.item.deadline ? -1 : a.item.deadline > b.item.deadline ? 1 : 0; })
      .slice(0, DASHBOARD_LIST_LIMIT);
    if (!items.length) return '<div class="empty-inline">Nenhum prazo nos próximos ' + UPCOMING_DAYS + ' dias. 🎉</div>';
    return '<div class="list">' + items.map(function (x) { return deadlineItemHtml(x.kind, x.item); }).join('') + '</div>';
  }

  function overdueListHtml(goals, projects) {
    const items = goals.map(function (g) { return { kind: 'goal', item: g }; })
      .concat(projects.map(function (p) { return { kind: 'project', item: p }; }))
      .sort(function (a, b) { return a.item.deadline < b.item.deadline ? -1 : 1; })
      .slice(0, DASHBOARD_LIST_LIMIT);
    if (!items.length) return '<div class="empty-inline">Nada atrasado. Continue assim!</div>';
    return '<div class="list">' + items.map(function (x) { return deadlineItemHtml(x.kind, x.item); }).join('') + '</div>';
  }

  function nextActionsHtml(openGoals) {
    const items = openGoals.filter(function (g) { return g.nextAction && g.status !== 'paused' && !isGoalBlocked(state.goals, g); })
      .sort(function (a, b) {
        const pa = optionOf(PRIORITIES, a.priority).weight;
        const pb = optionOf(PRIORITIES, b.priority).weight;
        if (pa !== pb) return pb - pa;
        if (a.status !== b.status) return a.status === 'doing' ? -1 : 1;
        return b.updatedAt - a.updatedAt;
      }).slice(0, DASHBOARD_LIST_LIMIT);
    if (!items.length) return '<div class="empty-inline">Defina uma "próxima ação" nas suas metas para vê-las aqui.</div>';
    return '<div class="list">' + items.map(function (g) {
      const project = findProject(g.projectId);
      return '<div class="list-item clickable" data-action="goal-open" data-id="' + escapeHtml(g.id) + '">' +
        '<div class="activity-icon">➡️</div>' +
        '<div class="list-item-main"><div class="list-item-title">' + escapeHtml(g.nextAction) + '</div>' +
        '<div class="list-item-sub">' + escapeHtml(g.title) + (project ? ' · ' + escapeHtml(project.name) : '') + '</div></div>' +
        priorityBadge(g.priority) + '</div>';
    }).join('') + '</div>';
  }

  function recentProjectsHtml() {
    const items = state.projects.slice().sort(function (a, b) { return b.updatedAt - a.updatedAt; }).slice(0, 4);
    return '<div class="recent-projects">' + items.map(function (p) {
      const prog = projectProgress(p);
      return '<div class="mini-project" style="--project-color:' + p.color + '" data-action="open-project" data-id="' + escapeHtml(p.id) + '">' +
        '<div class="mini-project-title">' + escapeHtml(p.icon) + ' ' + escapeHtml(p.name) + '</div>' +
        progressBarHtml(prog) +
        '<div class="row small muted" style="margin-top:6px"><span>' + formatPercent(prog) + '</span><span class="spacer"></span>' + statusBadge(p.status) + '</div></div>';
    }).join('') + '</div>';
  }

  function activityListHtml() {
    const items = state.activity.slice(0, DASHBOARD_LIST_LIMIT + 2);
    if (!items.length) return '<div class="empty-inline">Nenhuma atividade ainda.</div>';
    return '<div class="list">' + items.map(function (a) {
      return '<div class="list-item"><div class="activity-icon">' + (ACTIVITY_ICONS[a.type] || '•') + '</div>' +
        '<div class="list-item-main"><div class="list-item-title" title="' + escapeHtml(a.text) + '">' + escapeHtml(a.text) + '</div>' +
        '<div class="list-item-sub">' + formatRelativeTime(a.ts) + '</div></div>' +
        (a.xp > 0 ? '<span class="badge badge-xp">+' + a.xp + ' XP</span>' : '') + '</div>';
    }).join('') + '</div>';
  }

  /* =====================================================================
   * 14. VIEW — Projetos (lista) e detalhe do projeto
   * ===================================================================== */

  function projectsViewHtml() {
    const f = ui.projectFilters;
    const statusOptions = [{ id: 'active', label: 'Ativos (não concluídos)' }, { id: 'all', label: 'Todos os status' }].concat(STATUSES);
    const categoryOptions = [{ id: 'all', label: 'Todas as categorias' }].concat(PROJECT_CATEGORIES.map(function (c) { return { id: c, label: c }; }));
    return '<div class="section-head"><h2>Projetos</h2><span class="muted" id="projects-count"></span><span class="spacer"></span>' +
      '<button type="button" class="btn btn-primary" data-action="new-project">+ Novo projeto</button></div>' +
      '<div class="toolbar">' +
      '<input class="input" type="search" placeholder="Filtrar por nome, descrição…" value="' + escapeHtml(f.text) + '" data-input="filter-projects" data-field="text">' +
      '<select class="select" data-change="filter-projects" data-field="status">' + optionsHtml(statusOptions, f.status) + '</select>' +
      '<select class="select" data-change="filter-projects" data-field="category">' + optionsHtml(categoryOptions, f.category) + '</select>' +
      '<select class="select" data-change="filter-projects" data-field="sort">' + optionsHtml(PROJECT_SORTS, f.sort) + '</select>' +
      '</div><div id="projects-list" class="project-list"></div>';
  }

  function filteredProjects() {
    const f = ui.projectFilters;
    const text = f.text.trim().toLowerCase();
    const list = state.projects.filter(function (p) {
      if (f.status === 'active' && p.status === 'done') return false;
      if (f.status !== 'active' && f.status !== 'all' && p.status !== f.status) return false;
      if (f.category !== 'all' && p.category !== f.category) return false;
      if (text && (p.name + ' ' + p.description + ' ' + p.motivation).toLowerCase().indexOf(text) < 0) return false;
      return true;
    });
    const cache = new Map(list.map(function (p) { return [p.id, projectProgress(p)]; }));
    list.sort(function (a, b) {
      switch (f.sort) {
        case 'name': return a.name.localeCompare(b.name, 'pt-BR');
        case 'priority': return optionOf(PRIORITIES, b.priority).weight - optionOf(PRIORITIES, a.priority).weight || b.updatedAt - a.updatedAt;
        case 'progress': return cache.get(b.id) - cache.get(a.id);
        case 'deadline':
          if (!a.deadline && !b.deadline) return b.updatedAt - a.updatedAt;
          if (!a.deadline) return 1;
          if (!b.deadline) return -1;
          return a.deadline < b.deadline ? -1 : a.deadline > b.deadline ? 1 : 0;
        default: return b.updatedAt - a.updatedAt;
      }
    });
    return list;
  }

  function renderProjectsList() {
    const container = document.getElementById('projects-list');
    if (!container) return;
    const list = filteredProjects();
    const count = document.getElementById('projects-count');
    if (count) count.textContent = list.length + ' de ' + state.projects.length;
    if (!state.projects.length) {
      container.innerHTML = '<div class="card">' + emptyStateHtml('🗂️', 'Nenhum projeto ainda', 'Projetos agrupam suas metas: estudos, carreira, saúde, finanças…', '<button type="button" class="btn btn-primary" data-action="new-project">+ Criar projeto</button>') + '</div>';
    } else if (!list.length) {
      container.innerHTML = '<div class="card">' + emptyStateHtml('🔎', 'Nenhum projeto encontrado', 'Ajuste os filtros para ver mais resultados.', '<button type="button" class="btn" data-action="clear-project-filters">Limpar filtros</button>') + '</div>';
    } else {
      container.innerHTML = list.map(projectRowHtml).join('');
    }
    hydrateMedia(container);
  }

  function projectRowHtml(p) {
    const goals = goalsOfProject(p.id);
    const done = goals.filter(function (g) { return g.status === 'done'; }).length;
    const prog = projectProgress(p);
    const id = escapeHtml(p.id);
    return '<article class="project-row" style="--project-color:' + p.color + '" data-action="open-project" data-id="' + id + '">' +
      '<div class="project-thumb">' + (p.coverId ? '<img data-media-id="' + escapeHtml(p.coverId) + '" alt="">' : escapeHtml(p.icon)) + '</div>' +
      '<div style="min-width:0"><div class="project-row-title">' + (p.coverId ? escapeHtml(p.icon) + ' ' : '') + escapeHtml(p.name) + ' ' + statusBadge(p.status) + '</div>' +
      (p.description ? '<div class="project-row-desc">' + escapeHtml(p.description) + '</div>' : '') +
      '<div class="project-row-meta"><span class="chip">' + escapeHtml(p.category) + '</span>' + priorityBadge(p.priority) + deadlineChip(p.deadline, p.status) + '</div></div>' +
      '<div class="project-row-progress"><div class="small muted"><span>' + done + '/' + goals.length + ' ' + plural(goals.length, 'meta', 'metas') + '</span><span>' + formatPercent(prog) + '</span></div>' + progressBarHtml(prog) + '</div>' +
      '<div class="project-row-actions">' +
      '<button type="button" class="icon-btn" data-action="edit-project" data-id="' + id + '" title="Editar projeto" aria-label="Editar projeto">✏️</button>' +
      '<button type="button" class="icon-btn danger" data-action="delete-project" data-id="' + id + '" title="Excluir projeto" aria-label="Excluir projeto">🗑️</button>' +
      '</div></article>';
  }

  function projectDetailHtml(projectId) {
    const p = findProject(projectId);
    if (!p) {
      setPageTitle('Projeto não encontrado');
      return '<div class="card">' + emptyStateHtml('🔍', 'Projeto não encontrado', 'Ele pode ter sido excluído.', '<button type="button" class="btn" data-action="navigate" data-route="projects">← Voltar para projetos</button>') + '</div>';
    }
    setPageTitle(p.name);
    const goals = goalsOfProject(p.id);
    const prog = projectProgress(p);
    const id = escapeHtml(p.id);
    const counts = { all: goals.length };
    STATUSES.forEach(function (s) { counts[s.id] = goals.filter(function (g) { return g.status === s.id; }).length; });
    if (ui.detailStatus !== 'all' && !isOneOf(STATUSES, ui.detailStatus)) ui.detailStatus = 'all';
    const tabs = [{ id: 'all', label: 'Todas' }].concat(STATUSES).map(function (t) {
      return '<button type="button" class="tab' + (ui.detailStatus === t.id ? ' active' : '') + '" data-action="detail-status" data-status="' + t.id + '">' + escapeHtml(t.label) + '<span class="count">' + counts[t.id] + '</span></button>';
    }).join('');
    const visible = sortGoals(goals.filter(function (g) { return ui.detailStatus === 'all' || g.status === ui.detailStatus; }), 'deadline');
    const xpEarnedHere = goals.reduce(function (a, g) { return a + g.xpAwarded; }, 0) + p.xpAwarded;

    const view = state.settings.projectView;
    let list;
    if (!goals.length && view !== 'board') {
      list = '<div class="card">' + emptyStateHtml('🎯', 'Nenhuma meta neste projeto', 'Quebre o projeto em metas mensuráveis para acompanhar o progresso.', '<button type="button" class="btn btn-primary" data-action="new-goal" data-project-id="' + id + '">+ Adicionar meta</button>') + '</div>';
    } else if (view === 'kanban') {
      list = kanbanHtml(goals, false);
    } else if (view === 'board') {
      list = boardHtml(p);
    } else if (!visible.length) {
      list = '<div class="card"><div class="empty-inline">Nenhuma meta com este status.</div></div>';
    } else {
      list = '<div class="goal-list">' + visible.map(function (g) { return goalCardHtml(g, { showProject: false }); }).join('') + '</div>';
    }

    return '<button type="button" class="btn btn-ghost btn-sm back-link" data-action="navigate" data-route="projects">← Projetos</button>' +
      '<section class="card project-header" style="--project-color:' + p.color + '">' +
      (p.coverId ? '<div class="project-cover"><img data-media-id="' + escapeHtml(p.coverId) + '" alt=""></div>' : '') +
      '<div class="project-header-body"><div>' +
      '<div class="project-title-line"><span class="project-title-icon">' + escapeHtml(p.icon) + '</span><h2>' + escapeHtml(p.name) + '</h2></div>' +
      '<div class="row-wrap">' + statusBadge(p.status) + priorityBadge(p.priority) + '<span class="chip">' + escapeHtml(p.category) + '</span>' + deadlineChip(p.deadline, p.status) + '</div>' +
      (p.description ? '<p style="margin-top:12px">' + escapeHtml(p.description) + '</p>' : '') +
      (p.motivation ? '<div class="motivation">“' + escapeHtml(p.motivation) + '”</div>' : '') +
      '</div><div class="project-side">' +
      '<div class="row"><span class="big-percent">' + formatPercent(prog) + '</span><span class="spacer"></span><span class="small muted">' + counts.done + '/' + goals.length + ' metas</span></div>' +
      progressBarHtml(prog, 'progress-lg') +
      '<div class="small muted">' + xpEarnedHere + ' XP conquistados neste projeto</div>' +
      '<label class="field"><span>Status do projeto</span><select class="select" data-change="project-status" data-id="' + id + '">' + optionsHtml(STATUSES, p.status) + '</select></label>' +
      '<div class="row"><button type="button" class="btn btn-sm" data-action="edit-project" data-id="' + id + '">✏️ Editar</button>' +
      '<button type="button" class="btn btn-sm btn-danger" data-action="delete-project" data-id="' + id + '">🗑️ Excluir</button></div>' +
      '</div></div></section>' +
      '<div class="section-head"><h2>Metas</h2>' + viewTabsHtml('project', view) + (view === 'list' ? '<div class="tabs">' + tabs + '</div>' : '') + '<span class="spacer"></span>' +
      '<button type="button" class="btn btn-primary" data-action="new-goal" data-project-id="' + id + '">+ Nova meta</button></div>' +
      list + projectGalleryHtml(p);
  }

  function projectGalleryHtml(p) {
    const photos = projectPhotos(p.id);
    if (!photos.length) return '';
    return '<section class="card" style="margin-top:18px"><div class="card-title"><h3>🖼️ Evidências</h3><span class="small muted">' + photos.length + ' ' + plural(photos.length, 'foto', 'fotos') + ' dos checkpoints</span></div>' +
      '<div class="photo-grid">' + photos.slice(0, PROJECT_GALLERY_PREVIEW).map(function (ph, i) { return photoThumbHtml(ph.mediaId, 'project', p.id, i); }).join('') + '</div>' +
      (photos.length > PROJECT_GALLERY_PREVIEW ? '<div class="row" style="margin-top:10px"><button type="button" class="btn btn-sm" data-action="open-photo" data-scope="project" data-id="' + escapeHtml(p.id) + '" data-index="' + PROJECT_GALLERY_PREVIEW + '">Ver todas (' + photos.length + ')</button></div>' : '') +
      '</section>';
  }

  /* =====================================================================
   * 15. VIEW — Metas (todas) e cartão de meta
   * ===================================================================== */

  function goalsViewHtml() {
    const f = ui.goalFilters;
    const statusOptions = [{ id: 'open', label: 'Em aberto' }, { id: 'all', label: 'Todos os status' }].concat(STATUSES);
    const projectOptions = [{ id: 'all', label: 'Todos os projetos' }].concat(state.projects.map(function (p) { return { id: p.id, label: p.icon + ' ' + p.name }; }));
    if (f.project !== 'all' && !findProject(f.project)) f.project = 'all';
    const kanban = state.settings.goalsView === 'kanban';
    return '<div class="section-head"><h2>Metas</h2>' + viewTabsHtml('goals', state.settings.goalsView) + '<span class="muted" id="goals-count"></span><span class="spacer"></span>' +
      '<button type="button" class="btn btn-primary" data-action="new-goal">+ Nova meta</button></div>' +
      '<div class="toolbar">' +
      '<input class="input" type="search" placeholder="Filtrar por título, tag…" value="' + escapeHtml(f.text) + '" data-input="filter-goals" data-field="text">' +
      (kanban ? '' : '<select class="select" data-change="filter-goals" data-field="status">' + optionsHtml(statusOptions, f.status) + '</select>') +
      '<select class="select" data-change="filter-goals" data-field="project">' + optionsHtml(projectOptions, f.project) + '</select>' +
      '<select class="select" data-change="filter-goals" data-field="difficulty">' + optionsHtml([{ id: 'all', label: 'Todas as dificuldades' }].concat(DIFFICULTIES), f.difficulty) + '</select>' +
      '<select class="select" data-change="filter-goals" data-field="type">' + optionsHtml([{ id: 'all', label: 'Todos os tipos' }].concat(TRACKING_TYPES), f.type) + '</select>' +
      (kanban ? '' : '<select class="select" data-change="filter-goals" data-field="sort">' + optionsHtml(GOAL_SORTS, f.sort) + '</select>') +
      '</div><div id="goals-list"></div>';
  }

  function sortGoals(list, sort) {
    return list.sort(function (a, b) {
      switch (sort) {
        case 'title': return a.title.localeCompare(b.title, 'pt-BR');
        case 'priority': return optionOf(PRIORITIES, b.priority).weight - optionOf(PRIORITIES, a.priority).weight || b.updatedAt - a.updatedAt;
        case 'progress': return goalProgress(b) - goalProgress(a);
        case 'updated': return b.updatedAt - a.updatedAt;
        default: {
          const ad = a.status === 'done';
          const bd = b.status === 'done';
          if (ad !== bd) return ad ? 1 : -1;
          if (!a.deadline && !b.deadline) return optionOf(PRIORITIES, b.priority).weight - optionOf(PRIORITIES, a.priority).weight;
          if (!a.deadline) return 1;
          if (!b.deadline) return -1;
          return a.deadline < b.deadline ? -1 : a.deadline > b.deadline ? 1 : 0;
        }
      }
    });
  }

  function filteredGoals() {
    const f = ui.goalFilters;
    const text = f.text.trim().toLowerCase();
    const kanban = state.settings.goalsView === 'kanban';
    return sortGoals(state.goals.filter(function (g) {
      if (!kanban && f.status === 'open' && g.status === 'done') return false;
      if (!kanban && f.status !== 'open' && f.status !== 'all' && g.status !== f.status) return false;
      if (f.project !== 'all' && g.projectId !== f.project) return false;
      if (f.difficulty !== 'all' && g.difficulty !== f.difficulty) return false;
      if (f.type !== 'all' && g.tracking.type !== f.type) return false;
      if (text && (g.title + ' ' + g.description + ' ' + g.nextAction + ' ' + g.tags.join(' ')).toLowerCase().indexOf(text) < 0) return false;
      return true;
    }), f.sort);
  }

  function renderGoalsList() {
    const container = document.getElementById('goals-list');
    if (!container) return;
    const list = filteredGoals();
    const count = document.getElementById('goals-count');
    if (count) count.textContent = list.length + ' de ' + state.goals.length;
    if (!state.projects.length) {
      container.innerHTML = '<div class="card">' + emptyStateHtml('🗂️', 'Crie um projeto primeiro', 'Toda meta pertence a um projeto.', '<button type="button" class="btn btn-primary" data-action="new-project">+ Criar projeto</button>') + '</div>';
    } else if (!state.goals.length) {
      container.innerHTML = '<div class="card">' + emptyStateHtml('🎯', 'Nenhuma meta ainda', 'Adicione metas mensuráveis aos seus projetos.', '<button type="button" class="btn btn-primary" data-action="new-goal">+ Nova meta</button>') + '</div>';
    } else if (!list.length) {
      container.innerHTML = '<div class="card">' + emptyStateHtml('🔎', 'Nenhuma meta encontrada', 'Ajuste os filtros para ver mais resultados.', '<button type="button" class="btn" data-action="clear-goal-filters">Limpar filtros</button>') + '</div>';
    } else if (state.settings.goalsView === 'kanban') {
      container.innerHTML = kanbanHtml(list, true);
    } else {
      container.innerHTML = '<div class="goal-list">' + list.map(function (g) { return goalCardHtml(g, { showProject: true }); }).join('') + '</div>';
    }
  }

  function goalCardHtml(g, opts) {
    const id = escapeHtml(g.id);
    const t = g.tracking;
    const done = g.status === 'done';
    const prog = goalProgress(g);
    const pct = Math.round(prog * 100);
    const overdue = isOverdue(g.deadline, g.status);
    const project = findProject(g.projectId);
    const expanded = ui.expandedGoals.has(g.id);
    const blocked = isGoalBlocked(state.goals, g);
    const dis = blocked ? ' disabled' : '';
    const sub = subtaskStats(g);
    const photos = photoCount(g);

    let lead;
    if (t.type === 'simple') {
      lead = '<button type="button" class="check-btn' + (done ? ' checked' : '') + '" data-action="goal-toggle-done" data-id="' + id + '" title="' + (blocked ? 'Bloqueada por dependência' : done ? 'Reabrir meta' : 'Concluir meta') + '" aria-label="' + (done ? 'Reabrir meta' : 'Concluir meta') + '"' + dis + '>' + (done ? '✓' : blocked ? '🔒' : '') + '</button>';
    } else {
      lead = '<div class="goal-ring' + (pct >= 100 ? ' done' : '') + '" style="--p:' + pct + '"><span>' + pct + '%</span></div>';
    }

    let quick = '';
    if (t.type === 'frequency') {
      quick = '<button type="button" class="btn btn-sm" data-action="goal-freq-inc" data-id="' + id + '" title="Registrar 1 ocorrência hoje"' + dis + '>+1</button>' +
        '<button type="button" class="btn btn-sm btn-ghost" data-action="goal-log" data-id="' + id + '"' + dis + '>Registrar…</button>';
    } else if (t.type !== 'simple') {
      quick = '<button type="button" class="btn btn-sm" data-action="goal-log" data-id="' + id + '"' + dis + '>📈 Registrar</button>';
    }
    if (!done) quick += '<button type="button" class="btn btn-sm btn-ghost" data-action="goal-checkpoint" data-id="' + id + '" title="Checkpoint com comentário e fotos"' + dis + '>📸</button>';

    const meta = [];
    if (opts.showProject && project) {
      meta.push('<button type="button" class="project-link" data-action="open-project" data-id="' + escapeHtml(project.id) + '">' + escapeHtml(project.icon) + ' ' + escapeHtml(project.name) + '</button>');
    }
    meta.push(difficultyBadge(g.difficulty));
    meta.push(priorityBadge(g.priority));
    meta.push('<span class="chip" title="Tipo de acompanhamento">' + escapeHtml(optionOf(TRACKING_TYPES, t.type).label) + '</span>');
    if (blocked) meta.push(lockChipHtml(g));
    if (g.recurrence) meta.push(recurrenceChipHtml(g));
    if (sub.total) meta.push('<span class="chip" title="Submetas feitas">☑️ ' + sub.done + '/' + sub.total + '</span>');
    if (photos) meta.push('<span class="chip" title="Fotos nos checkpoints">📸 ' + photos + '</span>');
    const cpChip = checkpointChipHtml(g);
    if (cpChip) meta.push(cpChip);
    if (g.startDate) meta.push('<span class="chip" title="Data de início">▶ ' + formatDate(g.startDate) + '</span>');
    if (g.focusMinutes) meta.push('<span class="chip" title="Tempo em sessões de foco">🍅 ' + formatMinutes(g.focusMinutes) + '</span>');
    if (g.deadline && !g.recurrence) meta.push(deadlineChip(g.deadline, g.status));
    g.tags.forEach(function (tag) { meta.push('<span class="tag">#' + escapeHtml(tag) + '</span>'); });

    const logCount = g.log.length;
    let history = '';
    if (expanded) {
      const entries = g.log.slice(-HISTORY_PREVIEW_LIMIT).reverse();
      history = '<div class="goal-history">' + (entries.length ? entries.map(function (e) {
        return '<div class="history-item"><span>' + formatDate(e.date) + '</span><b>' + escapeHtml(describeLogEntry(g, e)) + '</b><span>' + escapeHtml(e.note || '') + '</span></div>';
      }).join('') + (logCount > HISTORY_PREVIEW_LIMIT ? '<div class="small muted">Mostrando os ' + HISTORY_PREVIEW_LIMIT + ' registros mais recentes de ' + logCount + '.</div>' : '') : '<div class="small muted">Nenhum registro de progresso ainda.</div>') + '</div>';
    }

    return '<article class="goal-card' + (done ? ' is-done' : '') + (overdue ? ' is-overdue' : '') + (blocked ? ' is-blocked' : '') + '" data-goal-id="' + id + '">' +
      '<div class="goal-lead">' + lead + '</div>' +
      '<div style="min-width:0"><div class="goal-head"><button type="button" class="goal-title goal-title-btn" data-action="goal-open" data-id="' + id + '" title="Abrir detalhes: checklist, checkpoints e fotos">' + escapeHtml(g.title) + '</button>' + statusBadge(g.status) +
      (g.xpAwarded ? '<span class="badge badge-xp">+' + g.xpAwarded + ' XP</span>' : '') + '</div>' +
      (g.description ? '<div class="goal-desc">' + escapeHtml(g.description) + '</div>' : '') +
      '<div class="goal-meta">' + meta.join('') + '</div>' +
      (g.nextAction && !done ? '<div class="next-action"><b>Próxima ação:</b> ' + escapeHtml(g.nextAction) + '</div>' : '') +
      (t.type !== 'simple' ? '<div class="goal-progress">' + progressBarHtml(prog) + '<span class="goal-value">' + escapeHtml(goalValueText(g)) + '</span></div>' :
        sub.total ? '<div class="goal-progress">' + progressBarHtml(prog) + '<span class="goal-value">' + sub.done + '/' + sub.total + ' submetas</span></div>' : '') +
      reflectionHtml(g) +
      '</div>' +
      '<div class="goal-side"><div class="goal-side-actions">' + quick + '</div>' +
      '<select class="select select-sm" data-change="goal-status" data-id="' + id + '" aria-label="Status da meta">' + STATUSES.map(function (s) {
        return '<option value="' + s.id + '"' + (s.id === g.status ? ' selected' : '') + (blocked && (s.id === 'doing' || s.id === 'done') && s.id !== g.status ? ' disabled' : '') + '>' + escapeHtml(s.label) + '</option>';
      }).join('') + '</select>' +
      '<div class="goal-side-actions">' +
      (done ? '<button type="button" class="icon-btn" data-action="goal-reflect" data-id="' + id + '" title="' + (g.reflection ? 'Editar reflexão' : 'Escrever reflexão') + '" aria-label="Reflexão">💭</button>' :
        '<button type="button" class="icon-btn" data-action="goal-focus" data-id="' + id + '" title="Sessão de foco nesta meta" aria-label="Sessão de foco"' + dis + '>🍅</button>') +
      (t.type !== 'simple' ? '<button type="button" class="icon-btn" data-action="goal-toggle-history" data-id="' + id + '" title="Histórico de progresso (' + logCount + ')" aria-label="Histórico">' + (expanded ? '▴' : '🕘') + '</button>' : '') +
      '<button type="button" class="icon-btn" data-action="edit-goal" data-id="' + id + '" title="Editar meta" aria-label="Editar meta">✏️</button>' +
      '<button type="button" class="icon-btn danger" data-action="delete-goal" data-id="' + id + '" title="Excluir meta" aria-label="Excluir meta">🗑️</button>' +
      '</div></div>' + history + '</article>';
  }

  /* =====================================================================
   * 15b. PALETA DE COMANDOS (Ctrl/Cmd+K) — busca global + ações
   * ===================================================================== */

  function modShortcut(keys) {
    return isMacPlatform() ? keys.replace('Ctrl ', '⌘') : keys;
  }

  function matchesQuery(tokens, haystack) {
    for (let i = 0; i < tokens.length; i++) {
      if (haystack.indexOf(tokens[i]) < 0) return false;
    }
    return true;
  }

  // Monta a lista agrupada. Pontuação simples: título que começa com a busca vem antes.
  function paletteGroups(query) {
    const q = normalizeSearch(query).trim();
    const tokens = q.split(WHITESPACE_REGEX).filter(Boolean);
    const score = function (label) { return q && normalizeSearch(label).indexOf(q) === 0 ? 0 : 1; };
    const byScore = function (a, b) { return score(a.label) - score(b.label); };

    const commands = PALETTE_COMMANDS.filter(function (c) {
      return !tokens.length || matchesQuery(tokens, normalizeSearch(c.label + ' ' + (c.keywords || '')));
    }).map(function (c) {
      return { kind: 'command', id: c.id, icon: c.icon, label: c.label, hint: c.shortcut ? modShortcut(c.shortcut) : '' };
    });

    const projectsSource = tokens.length ? state.projects : state.projects.slice().sort(function (a, b) { return b.updatedAt - a.updatedAt; }).slice(0, 5);
    const projects = projectsSource.filter(function (p) {
      return !tokens.length || matchesQuery(tokens, normalizeSearch(p.name + ' ' + p.category + ' ' + p.description));
    }).map(function (p) {
      return { kind: 'project', id: p.id, icon: p.icon, label: p.name, hint: p.category + ' · ' + formatPercent(projectProgress(p)) };
    }).sort(byScore).slice(0, PALETTE_LIMIT_PER_GROUP);

    let goals = [];
    if (tokens.length) {
      state.goals.forEach(function (g) {
        const project = findProject(g.projectId);
        const hay = normalizeSearch(g.tags.join(' ') + ' ' + g.nextAction + ' ' + (project ? project.name : ''));
        const hint = (project ? project.name + ' · ' : '') + optionOf(STATUSES, g.status).label;
        const candidates = [{ kind: 'goal', id: g.id, icon: g.status === 'done' ? '✅' : '🎯', label: g.title, hint: hint }];
        if (g.status !== 'done') {
          const isSimple = g.tracking.type === 'simple';
          candidates.push({ kind: 'goal-log', id: g.id, icon: isSimple ? '✔️' : '📈', label: (isSimple ? 'Concluir: ' : 'Registrar progresso: ') + g.title, hint: hint });
          candidates.push({ kind: 'goal-focus', id: g.id, icon: '🍅', label: 'Focar em: ' + g.title, hint: hint });
        }
        // Cada item casa com o próprio rótulo (ex.: "focar 78" ou "registrar peso") + dados da meta.
        candidates.forEach(function (item) {
          if (matchesQuery(tokens, normalizeSearch(item.label) + ' ' + hay)) goals.push(item);
        });
      });
      goals = goals.sort(byScore).slice(0, PALETTE_LIMIT_PER_GROUP);
    }

    return [
      { title: 'Ações', items: commands },
      { title: tokens.length ? 'Projetos' : 'Projetos recentes', items: projects },
      { title: 'Metas', items: goals }
    ].filter(function (g) { return g.items.length; });
  }

  function openCommandPalette() {
    if (paletteModal) {
      paletteModal.close('toggle');
      return;
    }
    let flat = [];
    let active = 0;
    paletteModal = openModal({
      title: 'Buscar ou executar',
      className: 'modal-palette',
      body: '<input class="input palette-input" type="search" placeholder="Buscar projetos, metas ou ações…" aria-label="Buscar projetos, metas ou ações" autocomplete="off" autofocus>' +
        '<div class="palette-list" role="listbox"></div>' +
        '<div class="palette-foot"><span><kbd>↑</kbd> <kbd>↓</kbd> navegar</span><span><kbd>Enter</kbd> abrir</span><span><kbd>Esc</kbd> fechar</span><span><kbd>?</kbd> atalhos</span><span class="spacer" style="flex:1"></span><span><kbd>' + modShortcut('Ctrl K') + '</kbd> abre de qualquer lugar</span></div>',
      onOpen: function (modal) {
        const input = modal.el.querySelector('.palette-input');
        const listEl = modal.el.querySelector('.palette-list');
        function render() {
          const groups = paletteGroups(input.value);
          flat = [];
          if (!groups.length) {
            listEl.innerHTML = '<div class="palette-empty">Nada encontrado para "' + escapeHtml(input.value) + '".</div>';
            return;
          }
          listEl.innerHTML = groups.map(function (g) {
            return '<div class="palette-group">' + escapeHtml(g.title) + '</div>' + g.items.map(function (item) {
              const idx = flat.push(item) - 1;
              return '<div class="palette-item' + (idx === active ? ' active' : '') + '" role="option" data-palette-index="' + idx + '">' +
                '<span class="palette-item-icon">' + escapeHtml(item.icon) + '</span><span class="palette-item-label">' + escapeHtml(item.label) + '</span>' +
                (item.hint ? (item.kind === 'command' ? '<kbd>' + escapeHtml(item.hint) + '</kbd>' : '<span class="palette-item-hint">' + escapeHtml(item.hint) + '</span>') : '') + '</div>';
            }).join('');
          }).join('');
        }
        function setActive(idx) {
          if (!flat.length) return;
          active = (idx + flat.length) % flat.length;
          listEl.querySelectorAll('.palette-item').forEach(function (el) {
            el.classList.toggle('active', Number(el.getAttribute('data-palette-index')) === active);
          });
          const el = listEl.querySelector('.palette-item.active');
          if (el) el.scrollIntoView({ block: 'nearest' });
        }
        function run(idx) {
          const item = flat[idx];
          if (!item) return;
          modal.close('run');
          runPaletteItem(item);
        }
        input.addEventListener('input', function () { active = 0; render(); });
        input.addEventListener('keydown', function (e) {
          if (e.key === 'ArrowDown') { e.preventDefault(); setActive(active + 1); }
          else if (e.key === 'ArrowUp') { e.preventDefault(); setActive(active - 1); }
          else if (e.key === 'Enter') { e.preventDefault(); run(active); }
        });
        listEl.addEventListener('mousemove', function (e) {
          const el = e.target.closest('[data-palette-index]');
          if (el && Number(el.getAttribute('data-palette-index')) !== active) setActive(Number(el.getAttribute('data-palette-index')));
        });
        listEl.addEventListener('click', function (e) {
          const el = e.target.closest('[data-palette-index]');
          if (el) run(Number(el.getAttribute('data-palette-index')));
        });
        render();
      },
      onClose: function () { paletteModal = null; }
    });
  }

  function runPaletteItem(item) {
    switch (item.kind) {
      case 'project':
        navigate('project/' + encodeURIComponent(item.id));
        return;
      case 'goal':
        revealGoal(item.id);
        return;
      case 'goal-log':
        openProgressLog(item.id);
        return;
      case 'goal-focus':
        openFocusSetup(item.id);
        return;
      default:
        runCommand(item.id);
    }
  }

  function runCommand(id) {
    switch (id) {
      case 'go-dashboard': navigate('dashboard'); break;
      case 'go-projects': navigate('projects'); break;
      case 'go-goals': navigate('goals'); break;
      case 'go-settings': navigate('settings'); break;
      case 'new-project': openProjectForm(null); break;
      case 'new-goal': openGoalForm(null, null); break;
      case 'toggle-theme': toggleTheme(); break;
      case 'undo': performUndo(); break;
      case 'redo': performRedo(); break;
      case 'buy-freeze': buyFreeze(); break;
      case 'repair-streak': repairStreak(); break;
      case 'toggle-rest': toggleRest(); break;
      case 'start-focus': openFocusSetup(null); break;
      case 'show-shortcuts': openShortcutsHelp(); break;
      case 'export-data': goToExport(); break;
      case 'project-board':
        if (ui.route.name === 'project' && findProject(ui.route.id)) setGoalView('project', 'board');
        else showToast('Abra um projeto para ver o quadro visual dele.', { type: 'info' });
        break;
      case 'goals-kanban':
        setGoalView('goals', 'kanban');
        navigate('goals');
        break;
      default: break;
    }
  }

  // Abre o projeto da meta, rola até o cartão e o destaca.
  function revealGoal(goalId) {
    const g = findGoal(goalId);
    if (!g) return;
    ui.highlightGoal = goalId;
    ui.detailStatus = 'all';
    navigate('project/' + encodeURIComponent(g.projectId));
  }

  function applyGoalHighlight() {
    const id = ui.highlightGoal;
    if (!id) return;
    ui.highlightGoal = null;
    const card = document.querySelector('[data-goal-id="' + id + '"]');
    if (!card) return;
    card.scrollIntoView({ block: 'center' });
    card.classList.add('flash');
    card.addEventListener('animationend', function () { card.classList.remove('flash'); }, { once: true });
  }

  /* =====================================================================
   * 15c. MODO FOCO (Pomodoro vinculado a uma meta)
   * ===================================================================== */

  function focusElapsedMs(f, now) {
    const end = f.pausedAt || now;
    return Math.max(0, end - f.startedAt - f.pausedTotal);
  }

  function focusRemainingMs(f, now) {
    return f.durationMin * 60000 - focusElapsedMs(f, now);
  }

  function formatClock(ms) {
    const total = Math.max(0, Math.ceil(ms / 1000));
    const m = Math.floor(total / 60);
    const sec = total % 60;
    return String(m).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
  }

  function openFocusSetup(goalId) {
    if (state.focus) {
      showToast('Já existe uma sessão ' + (state.focus.kind === 'break' ? 'de pausa' : 'de foco') + ' em andamento.', { type: 'warning' });
      return;
    }
    const openGoals = state.goals.filter(function (g) { return g.status !== 'done' && !isGoalBlocked(state.goals, g); });
    const goalOptions = [{ id: '', label: '— Sem meta específica —' }].concat(openGoals.map(function (g) {
      const p = findProject(g.projectId);
      return { id: g.id, label: (p ? p.icon + ' ' : '') + g.title };
    }));
    const selected = goalId && findGoal(goalId) ? goalId : '';
    const minutes = state.settings.focusMinutes;
    openModal({
      title: '🍅 Sessão de foco',
      size: 'md',
      body: '<div class="form-grid">' +
        '<label class="field full"><span>Meta</span><select class="select" name="goalId">' + optionsHtml(goalOptions, selected) + '</select></label>' +
        '<div class="field full"><span class="field-label">Duração</span><div class="duration-options">' +
        FOCUS_DURATIONS.map(function (m) { return '<button type="button" class="duration-option' + (m === minutes ? ' selected' : '') + '" data-duration="' + m + '">' + m + ' min</button>'; }).join('') +
        '<input class="input" type="number" name="minutes" min="1" max="' + FOCUS_MAX_MINUTES + '" step="1" value="' + minutes + '" style="width:90px" aria-label="Minutos"><span class="muted">min</span></div></div>' +
        '<p class="hint full">Ao terminar: +1 XP a cada ' + Math.round(1 / XP_FOCUS_PER_MINUTE) + ' min focados e +' + HP_HEAL_FOCUS + ' HP. Em metas de duração, o tempo entra direto no progresso. Pode pausar, encerrar antes (registra o tempo feito) ou descartar.</p>' +
        '</div>',
      actions: [
        { id: 'cancel', label: 'Cancelar' },
        { id: 'start', label: 'Iniciar foco', variant: 'primary', submit: true }
      ],
      onOpen: function (modal) {
        const input = modal.el.querySelector('[name="minutes"]');
        function sync() {
          modal.el.querySelectorAll('[data-duration]').forEach(function (b) {
            b.classList.toggle('selected', Number(b.getAttribute('data-duration')) === Number(input.value));
          });
        }
        modal.el.addEventListener('click', function (e) {
          const b = e.target.closest('[data-duration]');
          if (!b) return;
          input.value = b.getAttribute('data-duration');
          sync();
        });
        input.addEventListener('input', sync);
      },
      onAction: function (action, modal) {
        if (action !== 'start') return true;
        const value = parseNumber(modal.el.querySelector('[name="minutes"]').value);
        if (!isFiniteNumber(value) || value < 1 || value > FOCUS_MAX_MINUTES || Math.round(value) !== value) {
          showFormErrors(modal.el, { minutes: 'Use um número inteiro entre 1 e ' + FOCUS_MAX_MINUTES + '.' });
          return false;
        }
        startFocus(modal.el.querySelector('[name="goalId"]').value || null, value);
        return true;
      }
    });
  }

  function startFocus(goalId, minutes) {
    if (state.focus) return;
    const g = goalId ? findGoal(goalId) : null;
    commit('Iniciar foco', function (s) {
      s.focus = { kind: 'focus', goalId: g ? g.id : null, startedAt: Date.now(), durationMin: minutes, pausedAt: null, pausedTotal: 0 };
      s.settings.focusMinutes = minutes;
    }, { undoable: false });
    ensureFocusTimer();
    showToast('🍅 Foco de ' + minutes + ' min iniciado' + (g ? ' em "' + g.title + '"' : '') + '. Bom trabalho!', { type: 'info' });
  }

  function startBreak(goalId) {
    if (state.focus) return;
    commit('Iniciar pausa', function (s) {
      s.focus = { kind: 'break', goalId: goalId || null, startedAt: Date.now(), durationMin: FOCUS_BREAK_MINUTES, pausedAt: null, pausedTotal: 0 };
    }, { undoable: false });
    ensureFocusTimer();
  }

  function toggleFocusPause() {
    if (!state.focus) return;
    commit('Pausar foco', function (s) {
      const f = s.focus;
      if (f.pausedAt) {
        f.pausedTotal += Date.now() - f.pausedAt;
        f.pausedAt = null;
      } else {
        f.pausedAt = Date.now();
      }
    }, { undoable: false });
  }

  // full = o tempo acabou; senão, encerrado antes e credita só os minutos feitos.
  function finishFocus(full) {
    const f = state.focus;
    if (!f) return;
    if (f.kind === 'break') {
      commit('Fim da pausa', function (s) { s.focus = null; }, { undoable: false });
      if (full) playChime();
      showToast('☕ Pausa encerrada. Pronto para mais uma rodada?', { type: 'info', action: { label: 'Novo foco', onClick: function () { openFocusSetup(f.goalId); } } });
      return;
    }
    const minutes = full ? f.durationMin : Math.floor(focusElapsedMs(f, Date.now()) / 60000);
    if (minutes < FOCUS_MIN_CREDIT_MINUTES) {
      commit('Encerrar foco', function (s) { s.focus = null; }, { undoable: false });
      showToast('Sessão encerrada antes de 1 minuto — nada foi registrado.', { type: 'info' });
      return;
    }
    commit('Sessão de foco', function (s) {
      s.focus = null;
      creditFocus(s, f.goalId, minutes);
    });
    if (full) playChime();
  }

  function cancelFocus() {
    const f = state.focus;
    if (!f) return;
    if (f.kind === 'break') {
      commit('Encerrar pausa', function (s) { s.focus = null; }, { undoable: false });
      return;
    }
    confirmDialog({
      title: 'Descartar sessão de foco',
      message: 'Descartar esta sessão? O tempo feito (' + formatMinutes(Math.floor(focusElapsedMs(f, Date.now()) / 60000)) + ') não será registrado.\nPara registrar o tempo feito, use ✓ (concluir agora).',
      confirmLabel: 'Descartar',
      danger: true
    }).then(function (ok) {
      if (ok && state.focus) commit('Descartar foco', function (s) { s.focus = null; }, { undoable: false });
    });
  }

  function ensureFocusTimer() {
    if (state.focus && !focusTimer) focusTimer = setInterval(tickFocus, FOCUS_TICK_MS);
    tickFocus();
  }

  function tickFocus() {
    const f = state && state.focus;
    if (!f) {
      if (focusTimer) {
        clearInterval(focusTimer);
        focusTimer = null;
      }
      document.title = baseDocTitle;
      return;
    }
    const remaining = focusRemainingMs(f, Date.now());
    if (!f.pausedAt && remaining <= 0) {
      finishFocus(true);
      return;
    }
    const clock = formatClock(remaining);
    const el = document.getElementById('focus-time');
    if (el && el.textContent !== clock) el.textContent = clock;
    document.title = (f.pausedAt ? '⏸ ' : f.kind === 'break' ? '☕ ' : '🍅 ') + clock + ' · ' + baseDocTitle;
  }

  function renderFocusPill() {
    const slot = document.getElementById('focus-slot');
    const f = state.focus;
    if (!f) {
      slot.innerHTML = '';
      return;
    }
    const isBreak = f.kind === 'break';
    const g = f.goalId ? findGoal(f.goalId) : null;
    const label = isBreak ? 'Pausa' : g ? g.title : 'Foco livre';
    slot.innerHTML = '<div class="focus-pill' + (isBreak ? ' is-break' : '') + (f.pausedAt ? ' is-paused' : '') + '" data-tip="' + escapeHtml((isBreak ? 'Pausa de ' : 'Sessão de ') + f.durationMin + ' min' + (g ? ' · ' + g.title : '') + (f.pausedAt ? '\n(pausada)' : '')) + '">' +
      '<span>' + (isBreak ? '☕' : '🍅') + '</span><span class="focus-time" id="focus-time">' + formatClock(focusRemainingMs(f, Date.now())) + '</span>' +
      '<span class="focus-goal">' + escapeHtml(label) + '</span>' +
      '<button type="button" class="icon-btn" data-action="focus-pause" title="' + (f.pausedAt ? 'Retomar' : 'Pausar') + '" aria-label="' + (f.pausedAt ? 'Retomar' : 'Pausar') + '">' + (f.pausedAt ? '▶' : '⏸') + '</button>' +
      '<button type="button" class="icon-btn" data-action="focus-finish" title="' + (isBreak ? 'Encerrar pausa' : 'Concluir agora e registrar o tempo feito') + '" aria-label="Concluir">✓</button>' +
      (isBreak ? '' : '<button type="button" class="icon-btn danger" data-action="focus-cancel" title="Descartar sessão" aria-label="Descartar">✕</button>') +
      '</div>';
  }

  // Três notas curtas via WebAudio (sem arquivos externos).
  function playChime() {
    if (!state.settings.focusSound) return;
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      const ctx = new Ctx();
      [660, 880, 1320].forEach(function (freq, i) {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        const t = ctx.currentTime + i * 0.18;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.2, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(t);
        osc.stop(t + 0.32);
      });
      setTimeout(function () { ctx.close(); }, 1200);
    } catch (err) {
      // Som é um extra; falhar em silêncio.
    }
  }

  /* =====================================================================
   * 15d. REFLEXÃO AO CONCLUIR
   * ===================================================================== */

  function maybePromptReflection() {
    const ids = pendingReflections;
    pendingReflections = [];
    if (!ids.length || !state.settings.reflectOnComplete) return;
    const id = ids[ids.length - 1];
    setTimeout(function () {
      const g = findGoal(id);
      if (!g || g.status !== 'done' || g.reflection) return;
      if (modalStack.some(function (m) { return m.kind === 'reflection'; })) return;
      openReflectionForm(id, true);
    }, 260);
  }

  function openReflectionForm(goalId, afterComplete) {
    const g = findGoal(goalId);
    if (!g) return;
    const r = g.reflection || { mood: 0, worked: '', different: '' };
    const actions = [{ id: 'skip', label: afterComplete ? 'Pular' : 'Cancelar' }];
    if (g.reflection && !afterComplete) actions.push({ id: 'clear', label: 'Apagar reflexão' });
    actions.push({ id: 'save', label: 'Salvar reflexão', variant: 'primary', submit: true });
    const modal = openModal({
      title: '💭 Reflexão — ' + g.title,
      size: 'md',
      body: (afterComplete ? '<p class="modal-message" style="margin-bottom:14px">🎉 Meta concluída! Um minuto de reflexão ajuda a repetir o que deu certo na próxima.</p>' : '') +
        '<div class="form-grid">' +
        '<div class="field full"><span class="field-label">Como foi?</span><div class="mood-picker">' +
        MOODS.map(function (m) { return '<button type="button" class="mood-option' + (m.value === r.mood ? ' selected' : '') + '" data-mood="' + m.value + '" title="' + escapeHtml(m.label) + '" aria-label="' + escapeHtml(m.label) + '">' + m.icon + '</button>'; }).join('') +
        '</div><input type="hidden" name="mood" value="' + (r.mood || '') + '"></div>' +
        '<label class="field full"><span>O que funcionou?</span><textarea class="textarea" name="worked" maxlength="500" placeholder="Ex.: estudar 25 min toda manhã antes do trabalho">' + escapeHtml(r.worked) + '</textarea></label>' +
        '<label class="field full"><span>O que você faria diferente?</span><textarea class="textarea" name="different" maxlength="500" placeholder="Ex.: começar os simulados mais cedo">' + escapeHtml(r.different) + '</textarea></label>' +
        (afterComplete ? '<label class="check-row full"><input type="checkbox" name="stop-asking"> Não perguntar mais ao concluir metas (dá para religar em Configurações)</label>' : '') +
        '</div>',
      actions: actions,
      onOpen: function (m) {
        const hidden = m.el.querySelector('[name="mood"]');
        m.el.addEventListener('click', function (e) {
          const b = e.target.closest('[data-mood]');
          if (!b) return;
          const v = b.getAttribute('data-mood');
          hidden.value = hidden.value === v ? '' : v;
          m.el.querySelectorAll('[data-mood]').forEach(function (x) { x.classList.toggle('selected', x.getAttribute('data-mood') === hidden.value); });
        });
      },
      onAction: function (action, m) {
        const stopEl = m.el.querySelector('[name="stop-asking"]');
        const stopAsking = Boolean(stopEl && stopEl.checked);
        if (action === 'save') {
          const reflection = normalizeReflection({
            mood: m.el.querySelector('[name="mood"]').value,
            worked: m.el.querySelector('[name="worked"]').value.trim(),
            different: m.el.querySelector('[name="different"]').value.trim(),
            ts: Date.now()
          });
          commit('Registrar reflexão', function (s) {
            const t = findById(s.goals, goalId);
            if (!t) throw new Error('Meta não encontrada.');
            t.reflection = reflection;
            if (reflection) addActivity(s, 'reflection', 'Reflexão registrada: "' + t.title + '"', { goalId: t.id, projectId: t.projectId });
            if (stopAsking) s.settings.reflectOnComplete = false;
          });
          showToast(reflection ? '💭 Reflexão salva.' : 'Reflexão vazia — nada salvo.', { type: reflection ? 'success' : 'info' });
        } else if (action === 'clear') {
          commit('Apagar reflexão', function (s) {
            const t = findById(s.goals, goalId);
            if (t) t.reflection = null;
          });
        } else if (stopAsking) {
          commit('Desativar reflexões', function (s) { s.settings.reflectOnComplete = false; }, { undoable: false });
          showToast('Tudo bem, não vou mais perguntar. Dá para religar em Configurações.', { type: 'info' });
        }
        return true;
      }
    });
    modal.kind = 'reflection';
  }

  function reflectionHtml(g) {
    const r = g.reflection;
    if (!r) return '';
    const mood = r.mood ? optionOf(MOODS.map(function (m) { return { id: m.value, icon: m.icon, label: m.label }; }), r.mood) : null;
    return '<div class="reflection">' +
      (mood ? '<p>' + mood.icon + ' <b>' + escapeHtml(mood.label) + '</b></p>' : '') +
      (r.worked ? '<p><b>Funcionou:</b> ' + escapeHtml(r.worked) + '</p>' : '') +
      (r.different ? '<p><b>Faria diferente:</b> ' + escapeHtml(r.different) + '</p>' : '') +
      '</div>';
  }

  /* =====================================================================
   * 15e. PLACAR, MELHOR DIA DA SEMANA E AVATAR
   * ===================================================================== */

  // Período atual (até hoje) vs. o mesmo trecho do período anterior — comparação justa.
  function periodBounds(period, today) {
    const start = periodStartISO(period, today);
    const days = diffDays(start, today) + 1;
    let prevStart;
    if (period === 'week') {
      prevStart = addDaysISO(start, -7);
    } else {
      const d = parseISODate(start);
      d.setMonth(d.getMonth() - 1);
      prevStart = toISODate(d);
    }
    const prevPeriodEnd = addDaysISO(start, -1);
    let prevEnd = addDaysISO(prevStart, days - 1);
    if (prevEnd > prevPeriodEnd) prevEnd = prevPeriodEnd;
    return { start: start, end: today, prevStart: prevStart, prevEnd: prevEnd, days: days };
  }

  function periodTotals(start, end) {
    const t = { xp: 0, actions: 0, focus: 0, activeDays: 0, completed: 0 };
    const active = new Set(state.player.activeDays);
    for (let d = start; d <= end; d = addDaysISO(d, 1)) {
      const e = state.player.daily[d];
      if (e) {
        t.xp += e.xp;
        t.actions += e.actions;
        t.focus += e.focus || 0;
      }
      if (active.has(d)) t.activeDays++;
    }
    state.goals.forEach(function (g) {
      if (g.status !== 'done' || !g.completedAt) return;
      const d = toISODate(new Date(g.completedAt));
      if (d >= start && d <= end) t.completed++;
    });
    return t;
  }

  function deltaHtml(cur, prev) {
    if (!prev && !cur) return '<span class="delta flat">= igual</span>';
    if (!prev) return '<span class="delta up">▲ novo</span>';
    const pct = Math.round((cur - prev) / prev * 100);
    if (pct === 0) return '<span class="delta flat">= igual</span>';
    return '<span class="delta ' + (pct > 0 ? 'up' : 'down') + '">' + (pct > 0 ? '▲ +' : '▼ −') + Math.abs(pct) + '%</span>';
  }

  function scoreboardHtml() {
    const period = ui.scorePeriod === 'month' ? 'month' : 'week';
    const b = periodBounds(period, todayISO());
    const cur = periodTotals(b.start, b.end);
    const prev = periodTotals(b.prevStart, b.prevEnd);
    const items = [
      { label: '⭐ XP ganho', cur: cur.xp, prev: prev.xp, fmt: String },
      { label: '📅 Dias ativos', cur: cur.activeDays, prev: prev.activeDays, fmt: String },
      { label: '✅ Metas concluídas', cur: cur.completed, prev: prev.completed, fmt: String },
      { label: '⚡ Ações', cur: cur.actions, prev: prev.actions, fmt: String },
      { label: '🍅 Foco', cur: cur.focus, prev: prev.focus, fmt: formatMinutes }
    ];
    const tabs = [{ id: 'week', label: 'Semana' }, { id: 'month', label: 'Mês' }].map(function (t) {
      return '<button type="button" class="tab' + (period === t.id ? ' active' : '') + '" data-action="score-period" data-period="' + t.id + '">' + t.label + '</button>';
    }).join('');
    return '<div class="row score-tabs"><div class="tabs">' + tabs + '</div><span class="spacer"></span>' +
      '<span class="small muted">' + b.days + ' ' + plural(b.days, 'dia', 'dias') + ' vs. mesmo trecho ' + (period === 'week' ? 'da semana passada' : 'do mês passado') + '</span></div>' +
      '<div class="score-grid">' + items.map(function (i) {
        return '<div class="score-item"><div class="score-label">' + i.label + '</div><div class="score-value">' + escapeHtml(i.fmt(i.cur)) + '</div>' +
          deltaHtml(i.cur, i.prev) + '<div class="score-prev">antes: ' + escapeHtml(i.fmt(i.prev)) + '</div></div>';
      }).join('') + '</div>' + bestWeekdayHtml();
  }

  // Média de XP por dia da semana nas últimas semanas; destaca o dia mais forte.
  function bestWeekdayHtml() {
    const today = todayISO();
    const sums = [0, 0, 0, 0, 0, 0, 0];
    for (let i = 0; i < BEST_WEEKDAY_WEEKS * 7; i++) {
      const d = addDaysISO(today, -i);
      const e = state.player.daily[d];
      if (e) sums[(parseISODate(d).getDay() + 6) % 7] += e.xp;
    }
    const avgs = sums.map(function (v) { return v / BEST_WEEKDAY_WEEKS; });
    const max = Math.max.apply(null, avgs);
    if (!max) return '<div class="weekday-block"><div class="wd-headline muted">📆 Registre atividade por algumas semanas para descobrir seu dia da semana mais forte.</div></div>';
    const best = avgs.indexOf(max);
    const fmt = function (v) { return v.toLocaleString('pt-BR', { maximumFractionDigits: 1 }); };
    const bars = avgs.map(function (v, i) {
      const wd = (i + 1) % 7;
      const h = Math.max(2, Math.round(v / max * 100));
      return '<div class="wd-bar-col" data-tip="' + escapeHtml(WEEKDAY_NAMES[wd] + ': média de ' + fmt(v) + ' XP') + '">' +
        '<span class="wd-value">' + (i === best ? fmt(v) : '') + '</span>' +
        '<div class="wd-bar' + (i === best ? ' best' : '') + '" style="height:' + h + '%"></div></div>';
    }).join('');
    const labels = avgs.map(function (v, i) { return '<span>' + WEEKDAY_SHORT[(i + 1) % 7] + '</span>'; }).join('');
    return '<div class="weekday-block"><div class="wd-headline">📆 Seu dia mais forte: <b>' + WEEKDAY_NAMES[(best + 1) % 7] + '</b> — média de ' + fmt(max) + ' XP (últimas ' + BEST_WEEKDAY_WEEKS + ' semanas).</div>' +
      '<div class="wd-bars" role="img" aria-label="' + escapeHtml('Média de XP por dia da semana. Melhor dia: ' + WEEKDAY_NAMES[(best + 1) % 7]) + '">' + bars + '</div>' +
      '<div class="wd-labels">' + labels + '</div></div>';
  }

  function avatarHtml(small) {
    const level = levelFromXp(state.player.xpEarned);
    const frame = avatarFrameFor(level);
    const next = AVATAR_FRAMES.filter(function (f) { return f.min > level; })[0];
    const tip = 'Moldura: ' + frame.label + (next ? '\nPróxima: ' + next.label + ' no nível ' + next.min : '\nMoldura máxima!');
    return '<div class="avatar-wrap' + (small ? ' sm' : '') + '" data-frame="' + frame.id + '" style="--frame-color:' + (frame.color || 'transparent') + '" data-tip="' + escapeHtml(tip) + '">' +
      '<div class="avatar' + (small ? ' avatar-sm' : '') + '">' + escapeHtml(initials(state.profile.name)) + '</div>' +
      (frame.badge ? '<span class="avatar-badge">' + frame.badge + '</span>' : '') + '</div>';
  }

  /* =====================================================================
   * 15f. EXPORTAÇÃO (CSV para Excel e JSON)
   * ===================================================================== */

  function downloadFile(filename, content, mime) {
    const blob = new Blob([content], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
  }

  function csvCell(v) {
    if (v === null || v === undefined) return '';
    if (typeof v === 'number') return isFinite(v) ? String(Math.round(v * 100) / 100).replace('.', ',') : '';
    const text = String(v);
    return CSV_NEEDS_QUOTE_REGEX.test(text) ? '"' + text.replace(CSV_QUOTE_REGEX, '""') + '"' : text;
  }

  // BOM + ";" + vírgula decimal: abre direto no Excel em português com acentos corretos.
  function buildCsv(headers, rows) {
    return '\uFEFF' + [headers].concat(rows).map(function (r) { return r.map(csvCell).join(CSV_SEPARATOR); }).join('\r\n');
  }

  function goalValues(g) {
    const t = g.tracking;
    switch (t.type) {
      case 'numeric': return { current: t.current, target: t.target, unit: t.unit };
      case 'percentage': return { current: t.current, target: 100, unit: '%' };
      case 'frequency': return { current: t.count, target: t.target, unit: 'vezes' };
      case 'duration': return { current: t.logged / 60, target: t.target / 60, unit: 'h' };
      case 'scale': return { current: t.current, target: t.target, unit: 'nível' };
      default: return { current: g.status === 'done' ? 1 : 0, target: 1, unit: '' };
    }
  }

  function exportFileName(kind, ext) {
    return 'goalquest-' + kind + '-' + todayISO() + '.' + ext;
  }

  function exportGoalsCsv() {
    const headers = ['Área', 'Projeto', 'Meta', 'Status', 'Tipo', 'Dificuldade', 'Prioridade', 'Início', 'Prazo', 'Progresso (%)', 'Atual', 'Alvo', 'Unidade', 'XP ganho', 'Foco (min)', 'Tags', 'Próxima ação', 'Concluída em', 'Humor', 'O que funcionou', 'O que faria diferente', 'Recorrência', 'Sequência', 'Submetas feitas', 'Submetas total', 'Depende de', 'Bloqueada', 'Fotos'];
    const rows = state.goals.map(function (g) {
      const p = findProject(g.projectId);
      const v = goalValues(g);
      const r = g.reflection;
      const mood = r && r.mood ? MOODS[r.mood - 1].label : '';
      return [p ? p.category : '', p ? p.name : '', g.title, optionOf(STATUSES, g.status).label, optionOf(TRACKING_TYPES, g.tracking.type).label,
        optionOf(DIFFICULTIES, g.difficulty).label, optionOf(PRIORITIES, g.priority).label, g.startDate, g.deadline, Math.round(goalProgress(g) * 100),
        v.current, v.target, v.unit, g.xpAwarded, g.focusMinutes, g.tags.join(', '), g.nextAction, g.completedAt ? toISODate(new Date(g.completedAt)) : '',
        mood, r ? r.worked : '', r ? r.different : '',
        g.recurrence ? optionOf(RECURRENCE_OPTIONS, g.recurrence.period).adj : '', g.recurrence ? g.recurrence.streak : '',
        subtaskStats(g).done, g.subtasks.length,
        g.dependsOn.map(function (d) { const x = findGoal(d); return x ? x.title : ''; }).filter(Boolean).join(' | '),
        isGoalBlocked(state.goals, g) ? 'sim' : 'não', photoCount(g)];
    });
    downloadFile(exportFileName('metas', 'csv'), buildCsv(headers, rows), 'text/csv;charset=utf-8');
    return rows.length;
  }

  function exportProgressCsv() {
    const headers = ['Data', 'Área', 'Projeto', 'Meta', 'Tipo', 'Valor', 'Variação', 'Unidade', 'Comentário', 'Fotos'];
    const rows = [];
    state.goals.forEach(function (g) {
      const p = findProject(g.projectId);
      const t = g.tracking;
      const unit = t.type === 'duration' ? 'min' : t.type === 'percentage' ? '%' : t.type === 'frequency' ? 'vezes' : t.type === 'numeric' ? t.unit : t.type === 'scale' ? 'nível' : '';
      g.log.forEach(function (e) {
        rows.push([e.date, p ? p.category : '', p ? p.name : '', g.title, optionOf(TRACKING_TYPES, t.type).label, e.value === null ? null : Number(e.value), Number(e.delta), unit, e.note || '', e.photos.length]);
      });
    });
    rows.sort(function (a, b) { return a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0; });
    downloadFile(exportFileName('progresso', 'csv'), buildCsv(headers, rows), 'text/csv;charset=utf-8');
    return rows.length;
  }

  function exportDailyCsv() {
    const p = state.player;
    const active = new Set(p.activeDays);
    const frozen = new Set(p.frozenDays);
    const days = Array.from(new Set(Object.keys(p.daily).concat(p.activeDays, p.frozenDays))).filter(isValidISODate).sort();
    const headers = ['Data', 'Dia da semana', 'XP', 'Ações', 'Foco (min)', 'Ativo', 'Protegido'];
    const rows = days.map(function (d) {
      const e = p.daily[d] || { xp: 0, actions: 0, focus: 0 };
      return [d, WEEKDAY_NAMES[parseISODate(d).getDay()], e.xp, e.actions, e.focus || 0, active.has(d) ? 'sim' : 'não', frozen.has(d) ? 'sim' : 'não'];
    });
    downloadFile(exportFileName('atividade-diaria', 'csv'), buildCsv(headers, rows), 'text/csv;charset=utf-8');
    return rows.length;
  }

  function exportJson(withMedia) {
    const mediaPromise = withMedia && storageAvailable ? idbGetAll(STORE_MEDIA) : Promise.resolve([]);
    return mediaPromise.then(function (media) {
      const payload = {
        app: 'GoalQuest',
        appVersion: APP_VERSION,
        schemaVersion: CURRENT_SCHEMA_VERSION,
        kind: withMedia ? 'completo' : 'dados',
        exportedAt: new Date().toISOString(),
        data: state,
        media: (media || []).map(function (m) { return { id: m.id, dataUrl: m.dataUrl, createdAt: m.createdAt }; })
      };
      downloadFile(exportFileName(withMedia ? 'backup-completo' : 'backup-dados', 'json'), JSON.stringify(payload, null, 2), 'application/json');
      return payload.media.length;
    });
  }

  function runExport(kind) {
    try {
      if (kind === 'goals-csv') showToast('📄 ' + exportGoalsCsv() + ' metas exportadas.', { type: 'success' });
      else if (kind === 'progress-csv') showToast('📄 ' + exportProgressCsv() + ' registros de progresso exportados.', { type: 'success' });
      else if (kind === 'daily-csv') showToast('📄 ' + exportDailyCsv() + ' dias exportados.', { type: 'success' });
      else if (kind === 'json' || kind === 'json-full') {
        exportJson(kind === 'json-full').then(function (n) {
          showToast('💾 Backup gerado' + (kind === 'json-full' ? ' com ' + n + ' ' + plural(n, 'imagem', 'imagens') : ' (só dados)') + '.', { type: 'success' });
        }).catch(function (err) { showToast('Falha ao exportar: ' + describeError(err), { type: 'error' }); });
      }
    } catch (err) {
      console.error(err);
      showToast('Falha ao exportar: ' + describeError(err), { type: 'error' });
    }
  }

  function goToExport() {
    navigate('settings');
    setTimeout(function () {
      const card = document.getElementById('export-card');
      if (card) card.scrollIntoView({ block: 'center' });
    }, 60);
  }

  /* =====================================================================
   * 15g. ATALHOS DE TECLADO — ajuda e dica do "G"
   * ===================================================================== */

  function kbdHtml(keys) {
    return modShortcut(keys).split(' ').map(function (k) { return '<kbd>' + escapeHtml(k) + '</kbd>'; }).join(' ');
  }

  function openShortcutsHelp() {
    openModal({
      title: '⌨️ Atalhos de teclado',
      size: 'md',
      body: '<div class="shortcut-table">' + SHORTCUTS_HELP.map(function (row) {
        if (row.group) return '<div class="shortcut-group">' + escapeHtml(row.group) + '</div>';
        return '<span>' + kbdHtml(row.keys) + '</span><span>' + escapeHtml(row.text) + '</span>';
      }).join('') + '</div><p class="hint" style="margin-top:14px">Os atalhos de uma letra não funcionam enquanto você digita num campo de texto.</p>',
      actions: [{ id: 'ok', label: 'Fechar', variant: 'primary' }]
    });
  }

  function showKeyHint(html) {
    const el = document.getElementById('key-hint');
    el.innerHTML = html;
    el.classList.add('show');
    clearTimeout(keyHintTimer);
    keyHintTimer = setTimeout(hideKeyHint, G_SHORTCUT_TIMEOUT_MS);
  }

  function hideKeyHint() {
    clearTimeout(keyHintTimer);
    const el = document.getElementById('key-hint');
    if (el) el.classList.remove('show');
  }

  /* =====================================================================
   * 15h. FASE 2 — chips, checklist, checkpoints com fotos e visualizador
   * ===================================================================== */

  function lockChipHtml(g) {
    const blockers = blockingGoalsOf(state.goals, g);
    if (!blockers.length) return '';
    return '<span class="chip chip-lock" data-tip="' + escapeHtml('Bloqueada até concluir:\n' + blockers.map(function (d) { return '• ' + d.title; }).join('\n')) + '">🔒 Bloqueada (' + blockers.length + ')</span>';
  }

  function recurrenceChipHtml(g) {
    const r = g.recurrence;
    if (!r) return '';
    const opt = optionOf(RECURRENCE_OPTIONS, r.period);
    const tip = opt.label + ' · período atual até ' + formatDate(recurrencePeriodEnd(r)) + '\nSequência: ' + r.streak + ' · recorde: ' + r.best;
    return '<span class="chip" data-tip="' + escapeHtml(tip) + '">🔁 ' + escapeHtml(opt.adj) + (r.streak ? ' · 🔥 ' + r.streak : '') + '</span>' + deadlineChip(recurrencePeriodEnd(r), g.status);
  }

  function checkpointChipHtml(g) {
    const c = checkpointDue(g);
    if (!c) return '';
    let text;
    let cls = '';
    if (c.days < 0) { text = 'checkpoint atrasado ' + (-c.days) + 'd'; cls = ' chip-danger'; }
    else if (c.days === 0) { text = 'checkpoint hoje'; cls = ' chip-warning'; }
    else if (c.days <= CHECKPOINT_DUE_SOON_DAYS) { text = 'checkpoint em ' + c.days + 'd'; cls = ' chip-warning'; }
    else text = 'checkpoint ' + formatDate(c.due);
    return '<span class="chip' + cls + '" title="Lembrete ' + escapeHtml(optionOf(CHECKPOINT_OPTIONS, g.checkpointEvery).label.toLowerCase()) + '">📸 ' + text + '</span>';
  }

  function photoCount(g) {
    return g.log.reduce(function (a, e) { return a + e.photos.length; }, 0);
  }

  // --- Checklist (submetas) ---

  function toggleSubtask(goalId, subId) {
    commit('Marcar submeta', function (s) {
      const g = findById(s.goals, goalId);
      const st = g ? findById(g.subtasks, subId) : null;
      if (!st) return;
      if (!st.done && isGoalBlocked(s.goals, g)) throw userError(blockedMessage(s.goals, g));
      st.done = !st.done;
      g.updatedAt = Date.now();
      touchProject(s, g.projectId);
      if (st.done) {
        st.doneAt = Date.now();
        markActiveDay(s);
        st.xp = gainXp(s, XP_PER_SUBTASK);
        addActivity(s, 'subtask', 'Submeta feita em "' + g.title + '": ' + st.text, { goalId: g.id, projectId: g.projectId, xp: st.xp });
        if (g.status === 'todo' || g.status === 'paused') g.status = 'doing';
        const stats = subtaskStats(g);
        if (g.tracking.type === 'simple' && stats.done === stats.total && g.status !== 'done') setGoalStatus(s, g, 'done');
      } else {
        if (st.xp) awardXp(s, -st.xp);
        st.xp = 0;
        st.doneAt = null;
      }
    });
  }

  function addSubtask(goalId, text) {
    const clean = String(text || '').trim().slice(0, 200);
    if (!clean) return false;
    const g = findGoal(goalId);
    if (!g) return false;
    if (g.subtasks.length >= SUBTASK_LIMIT) {
      showToast('Limite de ' + SUBTASK_LIMIT + ' submetas por meta.', { type: 'warning' });
      return false;
    }
    return commit('Adicionar submeta', function (s) {
      const target = findById(s.goals, goalId);
      target.subtasks.push({ id: uid(), text: clean, done: false, doneAt: null, xp: 0 });
      target.updatedAt = Date.now();
    });
  }

  function deleteSubtask(goalId, subId) {
    commit('Remover submeta', function (s) {
      const g = findById(s.goals, goalId);
      if (g) g.subtasks = g.subtasks.filter(function (t) { return t.id !== subId; });
    });
  }

  // Remove um registro e recalcula o acompanhamento (o XP ganho fica).
  function deleteLogEntry(goalId, entryId) {
    confirmDialog({
      title: 'Excluir registro',
      message: 'Excluir este registro e suas fotos? O valor da meta é recalculado; o XP ganho é mantido.',
      confirmLabel: 'Excluir',
      danger: true
    }).then(function (ok) {
      if (!ok) return;
      commit('Excluir registro', function (s) {
        const g = findById(s.goals, goalId);
        if (!g) return;
        const entry = findById(g.log, entryId);
        if (!entry) return;
        const t = g.tracking;
        const isLatest = g.log.every(function (e) { return e.ts <= entry.ts; });
        g.log = g.log.filter(function (e) { return e.id !== entryId; });
        if (t.type === 'frequency') t.count = Math.max(0, t.count - (Number(entry.delta) || 0));
        else if (t.type === 'duration') t.logged = Math.max(0, t.logged - (Number(entry.delta) || 0));
        else if ((t.type === 'numeric' || t.type === 'percentage' || t.type === 'scale') && isLatest && isFiniteNumber(entry.value)) t.current = entry.value - (Number(entry.delta) || 0);
        g.updatedAt = Date.now();
      });
    });
  }

  // --- Seletor de fotos do checkpoint (comprime no navegador antes de salvar) ---

  function photoPickerHtml() {
    return '<div class="field full"><span class="field-label">Fotos / evidências</span>' +
      '<div class="row"><input type="file" accept="image/*" multiple name="photo-files" hidden>' +
      '<button type="button" class="btn btn-sm" data-photo-add>📷 Adicionar fotos</button>' +
      '<span class="hint">Até ' + PHOTO_LIMIT_PER_CHECKPOINT + ' fotos, redimensionadas para ' + IMAGE_MAX_SIDE + 'px.</span></div>' +
      '<div class="photo-previews" data-photo-previews></div></div>';
  }

  function bindPhotoPicker(modal, photos) {
    const input = modal.el.querySelector('[name="photo-files"]');
    const previews = modal.el.querySelector('[data-photo-previews]');
    let pending = 0;
    function renderPreviews() {
      previews.innerHTML = photos.map(function (url, i) {
        return '<div class="photo-preview"><img alt="" src="' + url + '"><button type="button" data-photo-remove="' + i + '" aria-label="Remover foto">✕</button></div>';
      }).join('') + (pending ? '<div class="photo-preview" style="display:grid;place-items:center">⏳</div>' : '');
    }
    modal.el.addEventListener('click', function (e) {
      if (e.target.closest('[data-photo-add]')) input.click();
      const rm = e.target.closest('[data-photo-remove]');
      if (rm) {
        photos.splice(Number(rm.getAttribute('data-photo-remove')), 1);
        renderPreviews();
      }
    });
    input.addEventListener('change', function () {
      const files = Array.from(input.files || []).slice(0, Math.max(0, PHOTO_LIMIT_PER_CHECKPOINT - photos.length));
      if (input.files && input.files.length > files.length) showToast('Limite de ' + PHOTO_LIMIT_PER_CHECKPOINT + ' fotos por checkpoint.', { type: 'warning' });
      input.value = '';
      files.forEach(function (file) {
        pending++;
        renderPreviews();
        compressImage(file).then(function (url) {
          photos.push(url);
        }).catch(function (err) {
          showToast(describeError(err), { type: 'error' });
        }).then(function () {
          pending--;
          renderPreviews();
        });
      });
    });
    return function isBusy() { return pending > 0; };
  }

  // --- Visualizador de fotos (lightbox) ---

  function openLightbox(photos, startIndex) {
    if (!photos.length) return;
    let index = clamp(startIndex || 0, 0, photos.length - 1);
    function onKey(e) {
      if (e.key === 'ArrowLeft') { e.preventDefault(); show(index - 1); }
      else if (e.key === 'ArrowRight') { e.preventDefault(); show(index + 1); }
    }
    const modal = openModal({
      title: 'Evidências',
      className: 'modal-lightbox',
      size: 'lg',
      body: '<div class="lightbox-stage"><img alt="" data-lb-img>' +
        (photos.length > 1 ? '<button type="button" class="lightbox-nav prev" data-lb="prev" aria-label="Anterior">‹</button><button type="button" class="lightbox-nav next" data-lb="next" aria-label="Próxima">›</button>' : '') +
        '</div><div class="lightbox-caption"><span data-lb-count></span><span data-lb-caption style="flex:1"></span><a data-lb-download download="evidencia.jpg" href="#">⬇ Baixar</a></div>',
      onOpen: function (m) {
        m.el.addEventListener('click', function (e) {
          const nav = e.target.closest('[data-lb]');
          if (nav) show(index + (nav.getAttribute('data-lb') === 'next' ? 1 : -1));
        });
        document.addEventListener('keydown', onKey);
      },
      onClose: function () { document.removeEventListener('keydown', onKey); }
    });
    modal.kind = 'lightbox';
    function show(i) {
      index = (i + photos.length) % photos.length;
      const photo = photos[index];
      const img = modal.el.querySelector('[data-lb-img]');
      const link = modal.el.querySelector('[data-lb-download]');
      img.removeAttribute('src');
      modal.el.querySelector('[data-lb-count]').textContent = (index + 1) + ' / ' + photos.length;
      modal.el.querySelector('[data-lb-caption]').textContent = photo.caption || '';
      loadMedia(photo.mediaId).then(function (url) {
        if (!url || photos[index] !== photo) return;
        img.src = url;
        link.href = url;
      });
    }
    show(index);
  }

  function openPhoto(scope, id, index) {
    if (scope === 'project') openLightbox(projectPhotos(id), index);
    else {
      const g = findGoal(id);
      if (g) openLightbox(goalPhotos(g), index);
    }
  }

  function photoThumbHtml(mediaId, scope, ownerId, index) {
    return '<button type="button" class="photo-thumb" data-action="open-photo" data-scope="' + scope + '" data-id="' + escapeHtml(ownerId) + '" data-index="' + index + '" aria-label="Abrir foto"><img alt="" data-media-id="' + escapeHtml(mediaId) + '"></button>';
  }

  /* =====================================================================
   * 15i. DETALHE DA META (janela com checklist, checkpoints, dependências)
   * ===================================================================== */

  function openGoalDetail(goalId) {
    const g = findGoal(goalId);
    if (!g) return;
    const existing = modalStack.filter(function (m) { return m.kind === 'goal-detail'; })[0];
    if (existing) existing.close('replace');
    const modal = openModal({
      title: g.title,
      size: 'xl',
      liveBody: function () {
        const current = findGoal(goalId);
        if (!current) return null;
        if (modal) modal.el.querySelector('.modal-header h2').textContent = current.title;
        return goalDetailHtml(current);
      },
      body: goalDetailHtml(g),
      actions: [{ id: 'close', label: 'Fechar' }],
      onOpen: function (m) {
        m.el.addEventListener('keydown', function (e) {
          const input = e.target.closest('[data-subtask-input]');
          if (input && e.key === 'Enter') {
            e.preventDefault();
            if (addSubtask(goalId, input.value)) {
              const again = m.el.querySelector('[data-subtask-input]');
              if (again) again.focus();
            }
          }
        });
        m.el.addEventListener('click', function (e) {
          const add = e.target.closest('[data-subtask-add]');
          if (!add) return;
          const input = m.el.querySelector('[data-subtask-input]');
          if (addSubtask(goalId, input.value)) {
            const again = m.el.querySelector('[data-subtask-input]');
            if (again) again.focus();
          }
        });
      }
    });
    modal.kind = 'goal-detail';
    modal.goalId = goalId;
  }

  function goalDetailHtml(g) {
    const id = escapeHtml(g.id);
    const t = g.tracking;
    const done = g.status === 'done';
    const blocked = isGoalBlocked(state.goals, g);

      if (t.type === 'simple') actions += '<button type="button" class="btn btn-sm btn-primary" data-action="goal-toggle-done" data-id="' + id + '"' + dis + '>✓ Concluir</button>';

    const checklist = '<div class="detail-section"><div class="detail-section-head"><h4>☑️ Checklist</h4><span class="small muted">' + (st.total ? st.done + '/' + st.total + ' · +' + XP_PER_SUBTASK + ' XP cada' : 'quebre a meta em passos') + '</span></div>' +
      (st.total ? progressBarHtml(st.done / st.total) : '') +
      '<div class="subtask-list" style="margin-top:6px">' + g.subtasks.map(function (sub) {

      }).join('') + '</div>' +

    const photos = goalPhotos(g);

    const photoIndexOf = {};

    const timeline = '<div class="detail-section"><div class="detail-section-head"><h4>📸 Checkpoints e evidências</h4><span class="small muted">' + g.log.length + ' ' + plural(g.log.length, 'registro', 'registros') + ' · ' + photos.length + ' ' + plural(photos.length, 'foto', 'fotos') + '</span></div>' +
      (entries.length ? '<div class="timeline">' + entries.map(function (e) {
        return '<div class="timeline-item"><span class="timeline-date">' + formatDate(e.date) + '</span><div style="min-width:0"><b>' + escapeHtml(describeLogEntry(g, e)) + '</b>' +
          (e.note ? '<div class="muted">' + escapeHtml(e.note) + '</div>' : '') +
          (e.photos.length ? '<div class="timeline-photos">' + e.photos.map(function (mid) { return photoThumbHtml(mid, 'goal', g.id, photoIndexOf[mid]); }).join('') + '</div>' : '') +
          '</div><button type="button" class="icon-btn danger" data-action="log-delete" data-id="' + id + '" data-entry="' + escapeHtml(e.id) + '" aria-label="Excluir registro" title="Excluir registro">🗑️</button></div>';
      }).join('') + '</div>' + (g.log.length > TIMELINE_LIMIT ? '<div class="small muted" style="margin-top:6px">Mostrando os ' + TIMELINE_LIMIT + ' mais recentes.</div>' : '')
        : '<div class="empty-inline">Nenhum registro ainda. Use "📸 Checkpoint" para anotar como está indo, com fotos se quiser.</div>') + '</div>';

    const deps = g.dependsOn.map(function (did) { return findGoal(did); }).filter(Boolean);
    const unlocks = state.goals.filter(function (x) { return x.dependsOn.indexOf(g.id) >= 0; });
    const goalLink = function (x) {
      return '<button type="button" class="project-link" data-action="goal-open" data-id="' + escapeHtml(x.id) + '">' + (x.status === 'done' ? '✅' : '⏳') + ' ' + escapeHtml(x.title) + '</button>';
    };
    const r = g.recurrence;
