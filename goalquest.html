    const min = Math.round(Math.max(0, total || 0));
    const h = Math.floor(min / 60);
    const m = min % 60;
    if (!h) return m + 'min';
    if (!m) return h + 'h';
    return h + 'h ' + m + 'min';
  }

  function plural(n, singular, pluralForm) {
    return n === 1 ? singular : pluralForm;
  }

  function normalizeHexColor(value, fallback) {
    const v = String(value || '').trim();
    if (!HEX_COLOR_REGEX.test(v)) return fallback;
    if (v.length === 4) return ('#' + v[1] + v[1] + v[2] + v[2] + v[3] + v[3]).toLowerCase();
    return v.toLowerCase();
  }

  function toISODate(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const d = String(date.getDate()).padStart(2, '0');
    return y + '-' + m + '-' + d;
  }

  function todayISO() {
    return toISODate(new Date());
  }

  function isValidISODate(value) {
    if (typeof value !== 'string' || !ISO_DATE_REGEX.test(value)) return false;
    const parts = value.split('-').map(Number);
    const d = new Date(parts[0], parts[1] - 1, parts[2]);
    return d.getFullYear() === parts[0] && d.getMonth() === parts[1] - 1 && d.getDate() === parts[2];
  }

  function parseISODate(value) {
    if (!isValidISODate(value)) return null;
    const parts = value.split('-').map(Number);
    return new Date(parts[0], parts[1] - 1, parts[2]);
  }

  function addDaysISO(iso, n) {
    const d = parseISODate(iso);
    d.setDate(d.getDate() + n);
    return toISODate(d);
  }

  function diffDays(fromIso, toIso) {
    const a = parseISODate(fromIso);
    const b = parseISODate(toIso);
    if (!a || !b) return 0;
    return Math.round((b.getTime() - a.getTime()) / DAY_MS);
  }

  function formatDate(iso) {
    const d = parseISODate(iso);
    if (!d) return '—';
    return d.getDate() + ' ' + MONTH_SHORT[d.getMonth()] + ' ' + d.getFullYear();
  }

  function formatLongToday() {
    const d = new Date();
    return WEEKDAY_NAMES[d.getDay()] + ', ' + d.getDate() + ' de ' + MONTH_NAMES[d.getMonth()] + ' de ' + d.getFullYear();
  }

  function formatRelativeTime(ts) {
    const diff = Date.now() - ts;
    if (diff < 60000) return 'agora';
    if (diff < 3600000) return 'há ' + Math.floor(diff / 60000) + ' min';
    if (diff < DAY_MS) return 'há ' + Math.floor(diff / 3600000) + ' h';
    const days = diffDays(toISODate(new Date(ts)), todayISO());
    if (days === 1) return 'ontem';
    if (days < 30) return 'há ' + days + ' dias';
    return formatDate(toISODate(new Date(ts)));
  }

  function periodStartISO(period, iso) {
    const d = parseISODate(iso);
    if (period === 'week') {
      d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
    } else if (period === 'month') {
      d.setDate(1);
    }
    return toISODate(d);
  }

  function findById(list, id) {
    for (let i = 0; i < list.length; i++) {
      if (list[i].id === id) return list[i];
    }
    return null;
  }

  function optionOf(list, id) {
    return findById(list, id) || list[0];
  }

  function isOneOf(list, id) {
    return list.some(function (item) { return item.id === id; });
  }

  function initials(name) {
    const parts = String(name || '').trim().split(WHITESPACE_REGEX).filter(Boolean);
    if (!parts.length) return '?';
    const first = parts[0].charAt(0);
    const last = parts.length > 1 ? parts[parts.length - 1].charAt(0) : '';
    return (first + last).toUpperCase();
  }

  function describeError(err) {
    if (!err) return 'erro desconhecido';
    if (err.name === 'QuotaExceededError') return 'espaço de armazenamento esgotado';
    return err.message || String(err);
  }

  function normalizeSearch(value) {
    return String(value || '').normalize('NFD').replace(DIACRITICS_REGEX, '').toLowerCase();
  }

  function isMacPlatform() {
    return MAC_PLATFORM_REGEX.test(navigator.platform || navigator.userAgent || '');
  }

  function isTypingTarget(el) {
    if (!el) return false;
    const tag = el.tagName;
    return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || el.isContentEditable;
  }

  function parseTags(value) {
    const seen = new Set();
    return String(value || '').split(',').map(function (t) { return t.trim(); }).filter(function (t) {
      const key = t.toLowerCase();
      if (!t || seen.has(key)) return false;
      seen.add(key);
      return true;
    });
  }

  /* =====================================================================
   * 4. ARMAZENAMENTO — wrapper Promise para IndexedDB
   * ===================================================================== */

  function openDatabase() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise(function (resolve, reject) {
      if (!window.indexedDB) {
        reject(new Error('IndexedDB não está disponível neste navegador.'));
        return;
      }
      let request;
      try {
        request = window.indexedDB.open(DB_NAME, DB_VERSION);
      } catch (err) {
        reject(err);
        return;
      }
      request.addEventListener('upgradeneeded', function () {
        const db = request.result;
        if (!db.objectStoreNames.contains(STORE_STATE)) db.createObjectStore(STORE_STATE, { keyPath: 'key' });
        if (!db.objectStoreNames.contains(STORE_MEDIA)) db.createObjectStore(STORE_MEDIA, { keyPath: 'id' });
      });
      request.addEventListener('success', function () {
        const db = request.result;
        db.addEventListener('versionchange', function () {
          db.close();
          dbPromise = null;
          showToast('O GoalQuest foi atualizado em outra aba. Recarregue esta página.', { type: 'warning' });
        });
        resolve(db);
      });
      request.addEventListener('error', function () {
        reject(request.error || new Error('Falha ao abrir o IndexedDB.'));
      });
      request.addEventListener('blocked', function () {
        showToast('Feche outras abas do GoalQuest para concluir a atualização do banco.', { type: 'warning' });
      });
    });
    dbPromise.catch(function () { dbPromise = null; });
    return dbPromise;
  }

  function idbTransaction(storeName, mode, operation) {
    return openDatabase().then(function (db) {
      return new Promise(function (resolve, reject) {
        let tx;
        try {
          tx = db.transaction(storeName, mode);
        } catch (err) {
          reject(err);
          return;
        }
        const request = operation(tx.objectStore(storeName));
        let result;
        request.addEventListener('success', function () { result = request.result; });
        tx.addEventListener('complete', function () { resolve(result); });
        tx.addEventListener('error', function () { reject(tx.error || request.error); });
        tx.addEventListener('abort', function () { reject(tx.error || new Error('Transação abortada.')); });
      });
    });
  }

  function idbGet(storeName, key) {
    return idbTransaction(storeName, 'readonly', function (store) { return store.get(key); });
  }

  function idbPut(storeName, value) {
    return idbTransaction(storeName, 'readwrite', function (store) { return store.put(value); });
  }

  function idbDelete(storeName, key) {
    return idbTransaction(storeName, 'readwrite', function (store) { return store.delete(key); });
  }

  function idbGetAll(storeName) {
    return idbTransaction(storeName, 'readonly', function (store) { return store.getAll(); });
  }

  function idbGetAllKeys(storeName) {
    return idbTransaction(storeName, 'readonly', function (store) { return store.getAllKeys(); });
  }

  /* =====================================================================
   * 5. MODELO DE DADOS — fábricas, normalização e migração
   * ===================================================================== */

  function createDefaultState() {
    const now = Date.now();
    return {
      schemaVersion: CURRENT_SCHEMA_VERSION,
      createdAt: now,
      updatedAt: now,
      profile: { name: 'Jogador', subtitle: 'Rumo ao próximo nível' },
      settings: { theme: 'dark', reflectOnComplete: true, focusMinutes: FOCUS_DEFAULT_MINUTES, focusSound: true, projectView: 'list', goalsView: 'list' },
      player: {
        xpEarned: 0,
        xpSpent: 0,
        activeDays: [],
        hp: HP_MAX,
        exhausted: false,
        resting: false,
        freezes: FREEZE_START,
        frozenDays: [],
        lastTickDate: todayISO(),
        daily: {},
        focusMinutes: 0
      },
      projects: [],
      goals: [],
      activity: [],
      focus: null
    };
  }

  // Reconstrói o histórico diário (XP e nº de ações por dia) a partir do log de atividades.
  function seedDailyFromHistory(activity, activeDays) {
    const daily = {};
    function entry(day) {
      if (!daily[day]) daily[day] = { xp: 0, actions: 0 };
      return daily[day];
    }
    (Array.isArray(activity) ? activity : []).forEach(function (a) {
      if (!a || !a.ts) return;
      const e = entry(toISODate(new Date(a.ts)));
      if (a.xp > 0) e.xp += a.xp;
      if (COUNTED_ACTIVITY_TYPES.indexOf(a.type) >= 0) e.actions++;
    });
    (Array.isArray(activeDays) ? activeDays : []).forEach(function (day) {
      if (!isValidISODate(day)) return;
      const e = entry(day);
      if (!e.actions) e.actions = 1;
    });
    return daily;
  }

  function normalizeDaily(raw) {
    const out = {};
    if (!raw || typeof raw !== 'object') return out;
    Object.keys(raw).forEach(function (day) {
      if (!isValidISODate(day) || !raw[day] || typeof raw[day] !== 'object') return;
      out[day] = { xp: Math.max(0, Number(raw[day].xp) || 0), actions: Math.max(0, Number(raw[day].actions) || 0), focus: Math.max(0, Number(raw[day].focus) || 0) };
    });
    return out;
  }

  function defaultTracking(type) {
    switch (type) {
      case 'numeric': return { type: 'numeric', start: 0, current: 0, target: 100, unit: '' };
      case 'percentage': return { type: 'percentage', current: 0 };
      case 'frequency': return { type: 'frequency', count: 0, target: 10, period: 'week' };
      case 'duration': return { type: 'duration', logged: 0, target: 600 };
      case 'scale': return { type: 'scale', min: 1, max: 10, current: 1, target: 8 };
      default: return { type: 'simple' };
    }
  }

  function normalizeTracking(raw) {
    const src = raw && typeof raw === 'object' ? raw : {};
    const type = isOneOf(TRACKING_TYPES, src.type) ? src.type : 'simple';
    const t = defaultTracking(type);
    Object.keys(t).forEach(function (key) {
      if (key === 'type') return;
      if (typeof t[key] === 'number') {
        const n = parseNumber(src[key]);
        if (isFiniteNumber(n)) t[key] = n;
      } else if (typeof src[key] === 'string') {
        t[key] = src[key];
      }
    });
    if (type === 'frequency' && !isOneOf(FREQUENCY_PERIODS, t.period)) t.period = 'week';
    if (type === 'scale' && t.max <= t.min) t.max = t.min + 1;
    return t;
  }

  function createProject(fields) {
    const now = Date.now();
    return normalizeProject(Object.assign({ id: uid(), createdAt: now, updatedAt: now }, fields || {}));
  }

  function normalizeProject(raw) {
    const p = raw && typeof raw === 'object' ? raw : {};
    const now = Date.now();
    return {
      id: p.id ? String(p.id) : uid(),
      name: String(p.name || 'Projeto sem nome'),
      icon: String(p.icon || DEFAULT_PROJECT_ICON),
      description: String(p.description || ''),
      category: PROJECT_CATEGORIES.indexOf(p.category) >= 0 ? p.category : 'Outro',
      priority: isOneOf(PRIORITIES, p.priority) ? p.priority : 'medium',
      color: normalizeHexColor(p.color, DEFAULT_PROJECT_COLOR),
      status: isOneOf(STATUSES, p.status) ? p.status : 'todo',
      deadline: isValidISODate(p.deadline) ? p.deadline : '',
      motivation: String(p.motivation || ''),
      coverId: p.coverId ? String(p.coverId) : null,
      board: normalizeBoard(p.board),
      xpAwarded: Number(p.xpAwarded) || 0,
      hpAwarded: Number(p.hpAwarded) || 0,
      completedAt: Number(p.completedAt) || null,
      createdAt: Number(p.createdAt) || now,
      updatedAt: Number(p.updatedAt) || now
    };
  }

  function createGoal(fields) {
    const now = Date.now();
    return normalizeGoal(Object.assign({ id: uid(), createdAt: now, updatedAt: now }, fields || {}));
  }

  function normalizeGoal(raw) {
    const g = raw && typeof raw === 'object' ? raw : {};
    const now = Date.now();
    return {
      id: g.id ? String(g.id) : uid(),
      projectId: String(g.projectId || ''),
      title: String(g.title || 'Meta sem título'),
      description: String(g.description || ''),
      tracking: normalizeTracking(g.tracking),
      difficulty: isOneOf(DIFFICULTIES, g.difficulty) ? g.difficulty : 'medium',
      priority: isOneOf(PRIORITIES, g.priority) ? g.priority : 'medium',
      status: isOneOf(STATUSES, g.status) ? g.status : 'todo',
      startDate: isValidISODate(g.startDate) ? g.startDate : '',
      deadline: isValidISODate(g.deadline) ? g.deadline : '',
      nextAction: String(g.nextAction || ''),
      tags: Array.isArray(g.tags) ? g.tags.map(String).filter(Boolean) : [],
      log: Array.isArray(g.log) ? g.log.filter(function (e) { return e && typeof e === 'object'; }).map(function (e) {
        return Object.assign({}, e, { photos: Array.isArray(e.photos) ? e.photos.map(String).filter(Boolean) : [] });
      }) : [],
      xpAwarded: Number(g.xpAwarded) || 0,
      hpAwarded: Number(g.hpAwarded) || 0,
      reflection: normalizeReflection(g.reflection),
      focusMinutes: Math.max(0, Number(g.focusMinutes) || 0),
      subtasks: normalizeSubtasks(g.subtasks),
      dependsOn: Array.isArray(g.dependsOn) ? Array.from(new Set(g.dependsOn.map(String).filter(Boolean))) : [],
      recurrence: normalizeRecurrence(g.recurrence),
      checkpointEvery: isOneOf(CHECKPOINT_OPTIONS, g.checkpointEvery) ? g.checkpointEvery : '',
      kanbanOrder: isFiniteNumber(Number(g.kanbanOrder)) && g.kanbanOrder !== null && g.kanbanOrder !== '' ? Number(g.kanbanOrder) : (Number(g.createdAt) || now),
      completedAt: Number(g.completedAt) || null,
      createdAt: Number(g.createdAt) || now,
      updatedAt: Number(g.updatedAt) || now
    };
  }

  function createEmptyBoard() {
    // y inicial deixa espaço para a barra de ferramentas sobreposta ao quadro.
    return { blocks: {}, connections: [], groups: [], viewport: { x: 40, y: 90, zoom: 1 }, showDeps: true, snap: true };
  }

  function boardNumber(v, fallback) {
    const n = Number(v);
    return isFinite(n) ? Math.round(n) : fallback;
  }

  function normalizeBoard(raw) {
    const base = createEmptyBoard();
    if (!raw || typeof raw !== 'object') return base;
    const blocks = {};
    if (raw.blocks && typeof raw.blocks === 'object') {
      Object.keys(raw.blocks).forEach(function (id) {
        const b = raw.blocks[id];
        if (!b || typeof b !== 'object') return;
        blocks[id] = {
          x: boardNumber(b.x, 0),
          y: boardNumber(b.y, 0),
          w: Math.max(BOARD_MIN_BLOCK_W, boardNumber(b.w, BOARD_BLOCK_W)),
          h: Math.max(BOARD_MIN_BLOCK_H, boardNumber(b.h, BOARD_BLOCK_H)),
          color: normalizeHexColor(b.color, ''),
          shape: isOneOf(BLOCK_SHAPES, b.shape) ? b.shape : 'rounded',
          locked: Boolean(b.locked),
          hidden: Boolean(b.hidden)
        };
      });
    }
    const vp = raw.viewport && typeof raw.viewport === 'object' ? raw.viewport : {};
    return {
      blocks: blocks,
      connections: (Array.isArray(raw.connections) ? raw.connections : []).filter(function (c) { return c && c.from && c.to && c.from !== c.to; }).map(function (c) {
        return { id: c.id ? String(c.id) : uid(), from: String(c.from), to: String(c.to), label: String(c.label || '').slice(0, BOARD_LABEL_MAX), color: normalizeHexColor(c.color, '') };
      }),
      groups: (Array.isArray(raw.groups) ? raw.groups : []).filter(function (g) { return g && typeof g === 'object'; }).map(function (g) {
        return {
          id: g.id ? String(g.id) : uid(),
          x: boardNumber(g.x, 0),
          y: boardNumber(g.y, 0),
          w: Math.max(BOARD_MIN_GROUP_W, boardNumber(g.w, 400)),
          h: Math.max(BOARD_MIN_GROUP_H, boardNumber(g.h, 260)),
          title: String(g.title || 'Grupo').slice(0, BOARD_LABEL_MAX),
          color: normalizeHexColor(g.color, BOARD_GROUP_DEFAULT_COLOR),
          locked: Boolean(g.locked)
        };
      }),
      viewport: {
        x: isFinite(Number(vp.x)) ? Number(vp.x) : base.viewport.x,
        y: isFinite(Number(vp.y)) ? Number(vp.y) : base.viewport.y,
        zoom: clamp(Number(vp.zoom) || 1, BOARD_ZOOM_MIN, BOARD_ZOOM_MAX)
      },
      showDeps: raw.showDeps !== false,
      snap: raw.snap !== false
    };
  }

  function normalizeSubtasks(raw) {
    if (!Array.isArray(raw)) return [];
    return raw.filter(function (t) { return t && typeof t === 'object' && String(t.text || '').trim(); }).slice(0, SUBTASK_LIMIT).map(function (t) {
      return {
        id: t.id ? String(t.id) : uid(),
        text: String(t.text).trim().slice(0, 200),
        done: Boolean(t.done),
        doneAt: t.done ? Number(t.doneAt) || null : null,
        xp: t.done ? Math.max(0, Number(t.xp) || 0) : 0
      };
    });
  }

  function normalizeRecurrence(raw) {
    if (!raw || typeof raw !== 'object' || !raw.period || !isOneOf(RECURRENCE_OPTIONS, raw.period)) return null;
    return {
      period: raw.period,
      periodStart: isValidISODate(raw.periodStart) ? raw.periodStart : periodStartISO(raw.period, todayISO()),
      streak: Math.max(0, Math.round(Number(raw.streak) || 0)),
      best: Math.max(0, Math.round(Number(raw.best) || 0)),
      history: (Array.isArray(raw.history) ? raw.history : []).filter(function (h) { return h && isValidISODate(h.start); }).slice(-RECURRENCE_HISTORY_LIMIT).map(function (h) {
        return { start: h.start, done: Boolean(h.done) };
      })
    };
  }

  function normalizeState(raw) {
    const base = createDefaultState();
    const s = raw && typeof raw === 'object' ? raw : {};
    const projects = (Array.isArray(s.projects) ? s.projects : []).map(normalizeProject);
    const projectIds = new Set(projects.map(function (p) { return p.id; }));
    const goals = (Array.isArray(s.goals) ? s.goals : []).map(normalizeGoal).filter(function (g) { return projectIds.has(g.projectId); });
    // Dependências só para metas que existem (e nunca para si mesma).
    const goalIds = new Set(goals.map(function (g) { return g.id; }));
    goals.forEach(function (g) {
      g.dependsOn = g.dependsOn.filter(function (id) { return id !== g.id && goalIds.has(id); });
    });
    // Quadro: só blocos/conexões de metas que ainda pertencem ao projeto.
    projects.forEach(function (p) {
      const own = new Set(goals.filter(function (g) { return g.projectId === p.id; }).map(function (g) { return g.id; }));
      Object.keys(p.board.blocks).forEach(function (id) { if (!own.has(id)) delete p.board.blocks[id]; });
      p.board.connections = p.board.connections.filter(function (c) { return own.has(c.from) && own.has(c.to); });
    });
    const player = Object.assign({}, base.player, s.player || {});
    player.xpEarned = Math.max(0, Number(player.xpEarned) || 0);
    player.xpSpent = Math.max(0, Number(player.xpSpent) || 0);
    player.activeDays = Array.isArray(player.activeDays) ? Array.from(new Set(player.activeDays.filter(isValidISODate))) : [];
    const hp = Number(player.hp);
    player.hp = isFiniteNumber(hp) ? clamp(Math.round(hp), 0, HP_MAX) : HP_MAX;
    player.exhausted = Boolean(player.exhausted);
    player.resting = Boolean(player.resting);
    player.freezes = clamp(Math.round(Number(player.freezes) || 0), 0, FREEZE_MAX);
    player.frozenDays = Array.isArray(player.frozenDays) ? Array.from(new Set(player.frozenDays.filter(isValidISODate))) : [];
    player.lastTickDate = isValidISODate(player.lastTickDate) ? player.lastTickDate : todayISO();
    player.daily = normalizeDaily(player.daily);
    player.focusMinutes = Math.max(0, Number(player.focusMinutes) || 0);
    const settings = Object.assign({}, base.settings, s.settings || {});
    if (!isOneOf(THEMES, settings.theme)) settings.theme = 'dark';
    settings.reflectOnComplete = settings.reflectOnComplete !== false;
    settings.focusSound = settings.focusSound !== false;
    settings.focusMinutes = clamp(Math.round(Number(settings.focusMinutes) || FOCUS_DEFAULT_MINUTES), 1, FOCUS_MAX_MINUTES);
    if (!isOneOf(PROJECT_VIEWS, settings.projectView)) settings.projectView = 'list';
    if (!isOneOf(GOAL_VIEWS, settings.goalsView)) settings.goalsView = 'list';
    return {
      schemaVersion: CURRENT_SCHEMA_VERSION,
      createdAt: Number(s.createdAt) || base.createdAt,
      updatedAt: Number(s.updatedAt) || base.updatedAt,
      profile: {
        name: String((s.profile && s.profile.name) || base.profile.name),
        subtitle: String((s.profile && s.profile.subtitle) || '')
      },
      settings: settings,
      player: player,
      projects: projects,
      goals: goals,
      activity: (Array.isArray(s.activity) ? s.activity : []).filter(function (a) { return a && a.ts; }).slice(0, ACTIVITY_LIMIT),
      focus: normalizeFocus(s.focus, goals)
    };
  }

  function normalizeReflection(raw) {
    if (!raw || typeof raw !== 'object') return null;
    const mood = Math.round(Number(raw.mood) || 0);
    const r = {
      mood: mood >= 1 && mood <= 5 ? mood : 0,
      worked: String(raw.worked || ''),
      different: String(raw.different || ''),
      ts: Number(raw.ts) || Date.now()
    };
    return r.mood || r.worked || r.different ? r : null;
  }

  // Sessão de foco em andamento (sobrevive a recarregar a página, pois é baseada em horários).
  function normalizeFocus(raw, goals) {
    if (!raw || typeof raw !== 'object') return null;
    const kind = raw.kind === 'break' ? 'break' : 'focus';
    const startedAt = Number(raw.startedAt);
    const durationMin = Number(raw.durationMin);
    if (!startedAt || !(durationMin > 0)) return null;
    const goalId = raw.goalId ? String(raw.goalId) : null;
    if (kind === 'focus' && goalId && !goals.some(function (g) { return g.id === goalId; })) return null;
    return {
      kind: kind,
      goalId: goalId,
      startedAt: startedAt,
      durationMin: clamp(durationMin, 1, FOCUS_MAX_MINUTES),
      pausedAt: Number(raw.pausedAt) || null,
      pausedTotal: Math.max(0, Number(raw.pausedTotal) || 0)
    };
  }

  function migrateState(raw) {
    let data = raw && typeof raw === 'object' ? deepClone(raw) : {};
    let version = Number(data.schemaVersion) || 0;
    if (version > CURRENT_SCHEMA_VERSION) {
      throw new Error('Os dados foram salvos por uma versão mais nova do GoalQuest (schema v' + version + ').');
    }
    while (version < CURRENT_SCHEMA_VERSION) {
      const next = version + 1;
      const migration = MIGRATIONS[next];
      if (typeof migration !== 'function') throw new Error('Migração para o schema v' + next + ' não encontrada.');
      data = migration(data);
      data.schemaVersion = next;
      version = next;
    }
    return normalizeState(data);
  }

  /* =====================================================================
   * 6. CONSULTAS E REGRAS DO JOGO
   * ===================================================================== */

  function findProject(id) {
    return findById(state.projects, id);
  }

  function findGoal(id) {
    return findById(state.goals, id);
  }

  function goalsOfProject(projectId) {
    return state.goals.filter(function (g) { return g.projectId === projectId; });
  }

  function goalMeasuredProgress(g) {
    const t = g.tracking;
    switch (t.type) {
      case 'numeric':
        if (t.target === t.start) return t.current === t.target ? 1 : 0;
        return clamp((t.current - t.start) / (t.target - t.start), 0, 1);
      case 'percentage':
        return clamp(t.current / 100, 0, 1);
      case 'frequency':
        return t.target > 0 ? clamp(t.count / t.target, 0, 1) : 0;
      case 'duration':
        return t.target > 0 ? clamp(t.logged / t.target, 0, 1) : 0;
      case 'scale':
        if (t.target === t.min) return t.current >= t.target ? 1 : 0;
        return clamp((t.current - t.min) / (t.target - t.min), 0, 1);
      default:
        return g.status === 'done' ? 1 : 0;
    }
  }

  function goalProgress(g) {
    if (g.status === 'done') return 1;
    // Meta simples com checklist: o progresso é a fração de submetas feitas.
    if (g.tracking.type === 'simple' && g.subtasks.length) return subtaskStats(g).done / g.subtasks.length;
    return goalMeasuredProgress(g);
  }

  function subtaskStats(g) {
    const done = g.subtasks.filter(function (t) { return t.done; }).length;
    return { done: done, total: g.subtasks.length };
  }

  // --- Dependências ---

  function blockingGoalsOf(goals, g) {
    return g.dependsOn.map(function (id) { return findById(goals, id); }).filter(function (d) { return d && d.status !== 'done'; });
  }

  function isGoalBlocked(goals, g) {
    return blockingGoalsOf(goals, g).length > 0;
  }

  // Todas as metas que dependem (direta ou indiretamente) de goalId — não podem virar dependência dela (evita ciclos).
  function dependentsClosure(goals, goalId) {
    const out = new Set();
    const queue = [goalId];
    while (queue.length) {
      const cur = queue.shift();
      goals.forEach(function (g) {
        if (g.dependsOn.indexOf(cur) >= 0 && !out.has(g.id)) {
          out.add(g.id);
          queue.push(g.id);
        }
      });
    }
    return out;
  }

  function blockedMessage(goals, g) {
    const names = blockingGoalsOf(goals, g).map(function (d) { return '"' + d.title + '"'; });
    return '🔒 "' + g.title + '" está bloqueada até concluir ' + names.join(', ') + '.';
  }

  // Erro "esperado" (regra do jogo): o commit desfaz a alteração e mostra só a mensagem.
  function userError(message) {
    const err = new Error(message);
    err.isUserError = true;
    return err;
  }

  // --- Recorrência ---

  function nextPeriodStartISO(start, period) {
    if (period === 'day') return addDaysISO(start, 1);
    if (period === 'week') return addDaysISO(start, 7);
    const d = parseISODate(start);
    d.setDate(1);
    d.setMonth(d.getMonth() + 1);
    return toISODate(d);
  }

  function recurrencePeriodEnd(r) {
    return addDaysISO(nextPeriodStartISO(r.periodStart, r.period), -1);
  }

  function newRecurrence(period, previous) {
    if (!period) return null;
    if (previous && previous.period === period) return previous;
    return { period: period, periodStart: periodStartISO(period, todayISO()), streak: 0, best: previous ? previous.best : 0, history: [] };
  }

  // Novo período: a meta volta a "a fazer" com o progresso zerado (o XP já ganho fica).
  function resetRecurringGoal(g) {
    const t = g.tracking;
    if (g.status !== 'paused') g.status = 'todo';
    g.completedAt = null;
    g.xpAwarded = 0;
    g.hpAwarded = 0;
    if (t.type === 'numeric') t.current = t.start;
    else if (t.type === 'percentage') t.current = 0;
    else if (t.type === 'frequency') t.count = 0;
    else if (t.type === 'duration') t.logged = 0;
    g.subtasks.forEach(function (st) {
      st.done = false;
      st.doneAt = null;
      st.xp = 0;
    });
    g.updatedAt = Date.now();
  }

  // --- Checkpoints ---

  function lastLogDate(g) {
    let last = '';
    g.log.forEach(function (e) { if (e.date > last) last = e.date; });
    return last;
  }

  // Próximo checkpoint = último registro (ou criação) + intervalo escolhido.
  function checkpointDue(g) {
    if (!g.checkpointEvery || g.status === 'done') return null;
    const base = lastLogDate(g) || toISODate(new Date(g.createdAt));
    let due;
    if (g.checkpointEvery === 'day') due = addDaysISO(base, 1);
    else if (g.checkpointEvery === 'week') due = addDaysISO(base, 7);
    else {
      const d = parseISODate(base);
      d.setMonth(d.getMonth() + 1);
      due = toISODate(d);
    }
    return { due: due, days: diffDays(todayISO(), due) };
  }

  function goalPhotos(g) {
    const out = [];
    g.log.slice().sort(function (a, b) { return b.ts - a.ts; }).forEach(function (e) {
      e.photos.forEach(function (mediaId) {
        out.push({ mediaId: mediaId, caption: g.title + ' · ' + formatDate(e.date) + (e.note ? ' — ' + e.note : '') });
      });
    });
    return out;
  }

  function projectPhotos(projectId) {
    const all = [];
    goalsOfProject(projectId).forEach(function (g) {
      g.log.forEach(function (e) {
        e.photos.forEach(function (mediaId) {
          all.push({ mediaId: mediaId, ts: e.ts, caption: g.title + ' · ' + formatDate(e.date) + (e.note ? ' — ' + e.note : '') });
        });
      });
    });
    return all.sort(function (a, b) { return b.ts - a.ts; });
  }

  function projectProgress(p) {
    const goals = goalsOfProject(p.id);
    if (!goals.length) return p.status === 'done' ? 1 : 0;
    const sum = goals.reduce(function (acc, g) { return acc + goalProgress(g); }, 0);
    return sum / goals.length;
  }

  function isOverdue(deadline, status) {
    return Boolean(deadline) && status !== 'done' && deadline < todayISO();
  }

  function frequencyCountInCurrentPeriod(g) {
    const start = periodStartISO(g.tracking.period, todayISO());
    return g.log.reduce(function (acc, e) {
      return e.date && e.date >= start && e.date <= todayISO() ? acc + (Number(e.delta) || 0) : acc;
    }, 0);
  }

  function goalValueText(g) {
    const t = g.tracking;
    switch (t.type) {
      case 'numeric': {
        const unit = t.unit ? ' ' + t.unit : '';
        return formatNumber(t.current) + unit + ' → meta ' + formatNumber(t.target) + unit + (t.start !== 0 ? ' (início ' + formatNumber(t.start) + ')' : '');
      }
      case 'percentage':
        return formatNumber(t.current) + '% concluído';
      case 'frequency': {
        const period = optionOf(FREQUENCY_PERIODS, t.period);
        return t.count + ' / ' + t.target + ' ' + plural(t.target, 'vez', 'vezes') + ' · ' + frequencyCountInCurrentPeriod(g) + ' ' + period.current;
      }
      case 'duration':
        return formatMinutes(t.logged) + ' / ' + formatMinutes(t.target);
      case 'scale':
        return 'Nível ' + formatNumber(t.current) + ' → meta ' + formatNumber(t.target) + ' (escala ' + formatNumber(t.min) + '–' + formatNumber(t.max) + ')';
      default:
        return g.status === 'done' ? 'Concluída' : 'Pendente';
    }
  }

  function xpThreshold(level) {
    return XP_LEVEL_BASE * level * (level - 1);
  }

  function levelFromXp(xp) {
    let level = 1;
    while (xpThreshold(level + 1) <= xp) level++;
    return level;
  }

  // --- Streak: dias ativos contam; dias protegidos (freeze) mantêm a sequência sem somar. ---

  function streakEndingAt(activeSet, frozenSet, day) {
    let cursor = day;
    let count = 0;
    while (activeSet.has(cursor) || frozenSet.has(cursor)) {
      if (activeSet.has(cursor)) count++;
      cursor = addDaysISO(cursor, -1);
    }
    return count;
  }

  function computeStreak(player) {
    const active = new Set(player.activeDays);
    const frozen = new Set(player.frozenDays);
    const today = todayISO();
    // Hoje ainda sem atividade não quebra o streak: conta até ontem.
    const start = active.has(today) ? today : addDaysISO(today, -1);
    return streakEndingAt(active, frozen, start);
  }

  function computeBestStreak(player) {
    const active = new Set(player.activeDays);
    const days = Array.from(new Set(player.activeDays.concat(player.frozenDays))).sort();
    let best = 0;
    let run = 0;
    for (let i = 0; i < days.length; i++) {
      if (i === 0 || diffDays(days[i - 1], days[i]) !== 1) run = 0;
      if (active.has(days[i])) run++;
      if (run > best) best = run;
    }
    return best;
  }

  function streakTier(streak) {
    for (let i = 0; i < STREAK_TIERS.length; i++) {
      if (streak >= STREAK_TIERS[i].min) return STREAK_TIERS[i];
    }
    return null;
  }

  function nextStreakTier(streak) {
    let next = null;
    STREAK_TIERS.forEach(function (t) { if (t.min > streak && (!next || t.min < next.min)) next = t; });
    return next;
  }

  function xpMultiplier(player) {
    if (player.exhausted) return EXHAUSTED_MULTIPLIER;
    const tier = streakTier(computeStreak(player));
    return tier ? tier.mult : 1;
  }

  function formatMultiplier(mult) {
    return '×' + mult.toLocaleString('pt-BR', { maximumFractionDigits: 2 });
  }

  function multipliedXp(player, base) {
    return Math.max(1, Math.round(base * xpMultiplier(player)));
  }

  // Streak perdido recentemente que ainda pode ser reparado (com proteções e/ou XP).
  function getStreakRepair(s) {
    const p = s.player;
    const active = new Set(p.activeDays);
    const frozen = new Set(p.frozenDays);
    const yesterday = addDaysISO(todayISO(), -1);
    if (active.has(yesterday) || frozen.has(yesterday)) return null;
    const days = [];
    let cursor = yesterday;
    while (!active.has(cursor) && !frozen.has(cursor) && days.length <= STREAK_REPAIR_MAX_DAYS) {
      days.push(cursor);
      cursor = addDaysISO(cursor, -1);
    }
    if (days.length > STREAK_REPAIR_MAX_DAYS || !(active.has(cursor) || frozen.has(cursor))) return null;
    const lostStreak = streakEndingAt(active, frozen, cursor);
    if (lostStreak < STREAK_REPAIR_MIN_STREAK) return null;
    const freezeUse = Math.min(p.freezes, days.length);
    const cost = (days.length - freezeUse) * STREAK_REPAIR_COST_PER_DAY;
    const available = Math.max(0, p.xpEarned - p.xpSpent);
    return { days: days.reverse(), lostStreak: lostStreak, freezeUse: freezeUse, cost: cost, affordable: available >= cost };
  }

  function getPlayerStats() {
    const p = state.player;
    const level = levelFromXp(p.xpEarned);
    const levelStart = xpThreshold(level);
    const levelEnd = xpThreshold(level + 1);
    const streak = computeStreak(p);
    return {
      earned: p.xpEarned,
      spent: p.xpSpent,
      available: Math.max(0, p.xpEarned - p.xpSpent),
      level: level,
      levelStart: levelStart,
      levelEnd: levelEnd,
      levelProgress: (p.xpEarned - levelStart) / (levelEnd - levelStart),
      toNext: levelEnd - p.xpEarned,
      streak: streak,
      bestStreak: computeBestStreak(p),
      tier: streakTier(streak),
      nextTier: nextStreakTier(streak),
      multiplier: xpMultiplier(p),
      hp: p.hp,
      exhausted: p.exhausted,
      resting: p.resting,
      freezes: p.freezes,
      activeToday: p.activeDays.indexOf(todayISO()) >= 0
    };
  }

  // --- Mutações (sempre chamadas dentro de commit, recebendo o estado s) ---

  function queueToast(message, type, action) {
    pendingToasts.push({ message: message, type: type || 'info', action: action || null });
  }

  function addActivity(s, type, text, extra) {
    s.activity.unshift(Object.assign({ id: uid(), ts: Date.now(), type: type, text: text }, extra || {}));
    if (s.activity.length > ACTIVITY_LIMIT) s.activity.length = ACTIVITY_LIMIT;
  }

  function dailyEntry(s, day) {
    if (!s.player.daily[day]) s.player.daily[day] = { xp: 0, actions: 0 };
    return s.player.daily[day];
  }

  // Registra uma ação no dia de hoje; no primeiro registro do dia, avança o streak.
  function markActiveDay(s) {
    const p = s.player;
    const today = todayISO();
    dailyEntry(s, today).actions++;
    if (p.activeDays.indexOf(today) >= 0) return;
    const before = computeStreak(p);
    p.activeDays.push(today);
    const streak = computeStreak(p);
    if (streak <= before) return;
    if (streak % FREEZE_EARN_EVERY === 0 && p.freezes < FREEZE_MAX) {
      p.freezes++;
      addActivity(s, 'freeze_earned', 'Ganhou uma proteção de streak por ' + streak + ' dias seguidos');
      queueToast('🧊 ' + streak + ' dias seguidos! Você ganhou uma proteção de streak.', 'success');
    }
    const tier = streakTier(streak);
    if (tier && tier.min === streak) {
      addActivity(s, 'streak_tier', 'Streak de ' + streak + ' dias: XP ' + formatMultiplier(tier.mult));
      queueToast('🔥 Streak de ' + streak + ' dias — "' + tier.label + '": todo XP agora vale ' + formatMultiplier(tier.mult) + '!', 'xp');
    }
  }

  // Soma/subtrai XP bruto (sem multiplicador). Usado também para estornos.
  function awardXp(s, amount) {
    if (!amount) return;
    const before = levelFromXp(s.player.xpEarned);
    s.player.xpEarned = Math.max(0, s.player.xpEarned + amount);
    const today = dailyEntry(s, todayISO());
    today.xp = Math.max(0, today.xp + amount);
    const after = levelFromXp(s.player.xpEarned);
    if (after > before) {
      addActivity(s, 'level_up', 'Subiu para o nível ' + after + '!');
      queueToast('⬆️ Nível ' + after + ' alcançado!', 'xp');
      const frame = avatarFrameFor(after);
      if (frame.id !== avatarFrameFor(before).id) {
        addActivity(s, 'frame', 'Nova moldura de avatar: ' + frame.label);
        queueToast('🖼️ Nova moldura de avatar desbloqueada: ' + frame.label + ' ' + frame.badge, 'xp');
      }
    }
  }

  // Ganho de XP com multiplicador (streak ou exaustão). Retorna o valor realmente creditado.
  function gainXp(s, base) {
    const amount = multipliedXp(s.player, base);
    awardXp(s, amount);
    return amount;
  }

  function multiplierSuffix(s) {
    const mult = xpMultiplier(s.player);
    if (mult === 1) return '';
    return ' (' + formatMultiplier(mult) + (s.player.exhausted ? ' exausto' : ' streak') + ')';
  }

  // Altera a vitalidade e trata a entrada/saída do estado de exaustão. Retorna a variação real.
  function changeHp(s, delta) {
    const p = s.player;
    const before = p.hp;
    p.hp = clamp(Math.round(p.hp + delta), 0, HP_MAX);
    if (p.hp === 0 && !p.exhausted) {
      p.exhausted = true;
      addActivity(s, 'exhausted', 'Vitalidade zerada: ficou exausto');
      queueToast('😵 Sua vitalidade zerou! Todo XP vale ' + formatMultiplier(EXHAUSTED_MULTIPLIER) + ' até você recuperar ' + EXHAUSTED_RECOVER_HP + ' HP agindo nas suas metas.', 'error');
    } else if (p.exhausted && p.hp >= EXHAUSTED_RECOVER_HP) {
      p.exhausted = false;
      addActivity(s, 'recovered', 'Recuperou-se da exaustão');
      queueToast('💪 Recuperado! Sua vitalidade voltou a ' + p.hp + ' HP e o XP voltou ao normal.', 'success');
    }
    return p.hp - before;
  }

  function avatarFrameFor(level) {
    let frame = AVATAR_FRAMES[0];
    AVATAR_FRAMES.forEach(function (f) { if (level >= f.min) frame = f; });
    return frame;
  }

  // Credita uma sessão de foco: XP por minuto, cura, histórico diário e, em metas de duração, o tempo em si.
  function creditFocus(s, goalId, minutes) {
    const g = goalId ? findById(s.goals, goalId) : null;
    markActiveDay(s);
    const suffix = multiplierSuffix(s);
    const xp = gainXp(s, Math.max(1, Math.round(minutes * XP_FOCUS_PER_MINUTE)));
    const hp = changeHp(s, HP_HEAL_FOCUS);
    s.player.focusMinutes += minutes;
    dailyEntry(s, todayISO()).focus = (dailyEntry(s, todayISO()).focus || 0) + minutes;
    if (g) {
      g.focusMinutes += minutes;
      g.updatedAt = Date.now();
      touchProject(s, g.projectId);
    }
    addActivity(s, 'focus', 'Foco de ' + formatMinutes(minutes) + (g ? ' em "' + g.title + '"' : ''), { goalId: g ? g.id : null, projectId: g ? g.projectId : null, xp: xp });
    queueToast('🍅 Sessão de foco concluída: ' + formatMinutes(minutes) + (g ? ' em ' + g.title : '') + ' — +' + xp + ' XP' + suffix + (hp ? ' · +' + hp + ' HP' : ''), 'xp', { label: 'Pausa de ' + FOCUS_BREAK_MINUTES + ' min', onClick: startBreak });
    if (g && g.tracking.type === 'duration' && g.status !== 'done') {
      applyProgressLog(s, g, { value: minutes, date: todayISO(), note: '🍅 Sessão de foco' });
    }
  }

  function touchProject(s, projectId) {
    const p = findById(s.projects, projectId);
    if (p) p.updatedAt = Date.now();
  }

  function setGoalStatus(s, g, status) {
    if (g.status === status) return;
    if ((status === 'doing' || status === 'done') && isGoalBlocked(s.goals, g)) throw userError(blockedMessage(s.goals, g));
    const wasDone = g.status === 'done';
    g.status = status;
    g.updatedAt = Date.now();
    touchProject(s, g.projectId);
    if (status === 'done' && !wasDone) {
      g.completedAt = Date.now();
      const diff = optionOf(DIFFICULTIES, g.difficulty);
      markActiveDay(s);
      const suffix = multiplierSuffix(s);
      if (!g.xpAwarded) g.xpAwarded = gainXp(s, diff.xp);
      if (!g.hpAwarded) g.hpAwarded = changeHp(s, diff.heal);
      addActivity(s, 'goal_complete', 'Meta concluída: "' + g.title + '"', { goalId: g.id, projectId: g.projectId, xp: g.xpAwarded });
      pendingReflections.push(g.id);
      s.goals.forEach(function (other) {
        if (other.status === 'done' || other.dependsOn.indexOf(g.id) < 0 || isGoalBlocked(s.goals, other)) return;
        addActivity(s, 'unlocked', 'Meta liberada: "' + other.title + '"', { goalId: other.id, projectId: other.projectId });
        queueToast('🔓 Liberada: "' + other.title + '" — já pode começar!', 'success');
      });
      queueToast('🎉 +' + g.xpAwarded + ' XP' + suffix + (g.hpAwarded ? ' · +' + g.hpAwarded + ' HP' : '') + ' — meta concluída: ' + g.title, 'xp');
    } else if (wasDone && status !== 'done') {
      g.completedAt = null;
      if (g.xpAwarded) {
        awardXp(s, -g.xpAwarded);
        g.xpAwarded = 0;
      }
      if (g.hpAwarded) {
        changeHp(s, -g.hpAwarded);
        g.hpAwarded = 0;
      }
      addActivity(s, 'goal_reopen', 'Meta reaberta: "' + g.title + '"', { goalId: g.id, projectId: g.projectId });
    }
  }

  function setProjectStatus(s, p, status) {
    if (p.status === status) return;
    const wasDone = p.status === 'done';
    p.status = status;
    p.updatedAt = Date.now();
    if (status === 'done' && !wasDone) {
      p.completedAt = Date.now();
      markActiveDay(s);
      const suffix = multiplierSuffix(s);
      if (!p.xpAwarded) p.xpAwarded = gainXp(s, XP_PROJECT_COMPLETE);
      if (!p.hpAwarded) p.hpAwarded = changeHp(s, HP_HEAL_PROJECT);
      addActivity(s, 'project_complete', 'Projeto concluído: "' + p.name + '"', { projectId: p.id, xp: p.xpAwarded });
      queueToast('🏁 +' + p.xpAwarded + ' XP' + suffix + (p.hpAwarded ? ' · +' + p.hpAwarded + ' HP' : '') + ' — projeto concluído: ' + p.name, 'xp');
    } else if (wasDone) {
      p.completedAt = null;
      if (p.xpAwarded) {
        awardXp(s, -p.xpAwarded);
        p.xpAwarded = 0;
      }
      if (p.hpAwarded) {
        changeHp(s, -p.hpAwarded);
        p.hpAwarded = 0;
      }
    }
  }

  // --- Virada do dia: proteções automáticas, streak perdido e dano de vitalidade ---

  function isGoalOverdueOn(s, g, day) {
    if (!g.deadline || g.deadline >= day || g.recurrence) return false;
    if (isGoalBlocked(s.goals, g)) return false;
    if (g.status === 'done' || g.status === 'paused') return false;
    if (toISODate(new Date(g.createdAt)) > day) return false;
    const project = findById(s.projects, g.projectId);
    return !project || (project.status !== 'paused' && project.status !== 'done');
  }

  function isProjectOverdueOn(p, day) {
    if (!p.deadline || p.deadline >= day) return false;
    if (p.status === 'done' || p.status === 'paused') return false;
    return toISODate(new Date(p.createdAt)) <= day;
  }

  // Avalia cada dia completo desde a última execução (de lastTickDate até ontem).
  function processDailyTick(s) {
    const p = s.player;
    const today = todayISO();
    if (!isValidISODate(p.lastTickDate) || p.lastTickDate > today) {
      p.lastTickDate = today;
      return;
    }
    if (p.lastTickDate === today) return;
    const earliest = addDaysISO(today, -TICK_MAX_DAYS);
    const start = p.lastTickDate < earliest ? earliest : p.lastTickDate;
    const active = new Set(p.activeDays);
    const frozen = new Set(p.frozenDays);
    const frozenNow = [];
    let lostStreak = 0;

    // 1) Sequências de dias sem atividade: usa proteções se cobrirem a sequência inteira.
    let day = start;
    while (day < today) {
      if (active.has(day) || frozen.has(day)) {
        day = addDaysISO(day, 1);
        continue;
      }
      const run = [];
      let cursor = day;
      while (cursor < today && !active.has(cursor) && !frozen.has(cursor)) {
        run.push(cursor);
        cursor = addDaysISO(cursor, 1);
      }
      const before = addDaysISO(day, -1);
      const alive = active.has(before) || frozen.has(before);
      if (alive && p.freezes >= run.length) {
        run.forEach(function (d) { frozen.add(d); p.frozenDays.push(d); frozenNow.push(d); });
        p.freezes -= run.length;
      } else if (alive) {
        const lost = streakEndingAt(active, frozen, before);
        if (lost >= STREAK_REPAIR_MIN_STREAK) lostStreak = Math.max(lostStreak, lost);
      }
      day = cursor;
    }

    // 2) Metas recorrentes: fecha os períodos que terminaram (streak da meta) e renova para o período atual.
    // Período não cumprido tira HP uma vez, no último dia dele (se estiver dentro da janela avaliada).
    const recurDamage = {};
    let renewed = 0;
    let missedPeriods = 0;
    s.goals.forEach(function (g) {
      const r = g.recurrence;
      if (!r) return;
      const current = periodStartISO(r.period, today);
      if (r.periodStart >= current) return;
      const project = findById(s.projects, g.projectId);
      const excused = p.resting || g.status === 'paused' || (project && (project.status === 'paused' || project.status === 'done')) || isGoalBlocked(s.goals, g);
      let ps = r.periodStart;
      let first = true;
      while (ps < current) {
        const done = first && g.status === 'done';
        const end = addDaysISO(nextPeriodStartISO(ps, r.period), -1);
        if (done) {
          r.streak++;
          r.best = Math.max(r.best, r.streak);
        } else if (!excused) {
          r.streak = 0;
          missedPeriods++;
          if (end >= start && end < today) recurDamage[end] = (recurDamage[end] || 0) + optionOf(DIFFICULTIES, g.difficulty).damage;
        }
        r.history.push({ start: ps, done: done });
        ps = nextPeriodStartISO(ps, r.period);
        first = false;
      }
      if (r.history.length > RECURRENCE_HISTORY_LIMIT) r.history.splice(0, r.history.length - RECURRENCE_HISTORY_LIMIT);
      r.periodStart = current;
      resetRecurringGoal(g);
      renewed++;
    });

    // 3) Dano de vitalidade por dia (desligado no modo descanso).
    let damage = 0;
    let overdueHits = 0;
    let idleDays = 0;
    let recurHits = 0;
    if (!p.resting) {
      for (day = start; day < today; day = addDaysISO(day, 1)) {
        let dmg = 0;
        if (recurDamage[day]) {
          dmg += recurDamage[day];
          recurHits++;
        }
        if (!active.has(day) && !frozen.has(day)) {
          dmg += HP_INACTIVITY_DAMAGE;
          idleDays++;
        }
        s.goals.forEach(function (g) {
          if (isGoalOverdueOn(s, g, day)) {
            dmg += optionOf(DIFFICULTIES, g.difficulty).damage;
            overdueHits++;
          }
        });
        s.projects.forEach(function (proj) {
          if (isProjectOverdueOn(proj, day)) {
            dmg += HP_PROJECT_OVERDUE_DAMAGE;
            overdueHits++;
          }
        });
        dmg = Math.min(dmg, HP_MAX_DAILY_DAMAGE);
        if (dmg) damage -= changeHp(s, -dmg);
      }
    }
    p.lastTickDate = today;

    if (frozenNow.length) {
      addActivity(s, 'streak_freeze', frozenNow.length + ' ' + plural(frozenNow.length, 'proteção usada', 'proteções usadas') + ' para manter o streak');
      queueToast('❄️ ' + frozenNow.length + ' ' + plural(frozenNow.length, 'proteção de streak foi usada', 'proteções de streak foram usadas') + ' — seu streak continua vivo.', 'info');
    }
    if (lostStreak) {
      addActivity(s, 'streak_lost', 'Streak de ' + lostStreak + ' ' + plural(lostStreak, 'dia', 'dias') + ' interrompido');
      const repair = getStreakRepair(s);
      queueToast('🥀 Seu streak de ' + lostStreak + ' ' + plural(lostStreak, 'dia', 'dias') + ' foi interrompido.' + (repair ? ' Dá para repará-lo.' : ''), 'warning', repair ? { label: 'Reparar', onClick: repairStreak } : null);
    }
    if (renewed) {
      addActivity(s, 'recurrence', renewed + ' ' + plural(renewed, 'meta recorrente renovada', 'metas recorrentes renovadas') + (missedPeriods ? ' (' + missedPeriods + ' ' + plural(missedPeriods, 'período não cumprido', 'períodos não cumpridos') + ')' : ''));
      queueToast('🔁 ' + renewed + ' ' + plural(renewed, 'meta recorrente renovada', 'metas recorrentes renovadas') + ' para o novo período' + (missedPeriods ? ' · ' + missedPeriods + ' não ' + plural(missedPeriods, 'cumprida', 'cumpridas') : '') + '.', missedPeriods ? 'warning' : 'info');
    }
    if (damage) {
      const reasons = [];
      if (idleDays) reasons.push(idleDays + ' ' + plural(idleDays, 'dia parado', 'dias parados'));
      if (overdueHits) reasons.push('atrasos');
      if (recurHits) reasons.push('recorrentes não cumpridas');
      addActivity(s, 'hp_damage', 'Perdeu ' + damage + ' HP (' + reasons.join(' e ') + ')');
      queueToast('💔 −' + damage + ' HP por ' + reasons.join(' e ') + '. Vitalidade: ' + p.hp + '/' + HP_MAX + '.', 'warning');
    }
  }

  function describeLogEntry(g, entry) {
    const t = g.tracking;
    const sign = entry.delta > 0 ? '+' : '';
    switch (t.type) {
      case 'numeric': return formatNumber(entry.value) + (t.unit ? ' ' + t.unit : '') + ' (' + sign + formatNumber(entry.delta) + ')';
      case 'percentage': return formatNumber(entry.value) + '% (' + sign + formatNumber(entry.delta) + ' p.p.)';
      case 'frequency': return sign + entry.delta + ' ' + plural(Math.abs(entry.delta), 'vez', 'vezes') + ' (total ' + entry.value + ')';
      case 'duration': return '+' + formatMinutes(entry.delta) + ' (total ' + formatMinutes(entry.value) + ')';
      case 'scale': return 'nível ' + formatNumber(entry.value) + ' (' + sign + formatNumber(entry.delta) + ')';
      default: return 'Checkpoint';
    }
  }

  function applyProgressLog(s, g, input) {
    if (isGoalBlocked(s.goals, g)) throw userError(blockedMessage(s.goals, g));
    const t = g.tracking;
    let value = input.value;
    let delta = 0;
    switch (t.type) {
      case 'numeric':
        delta = value - t.current;
        t.current = value;
        break;
      case 'percentage':
        value = clamp(value, 0, 100);
        delta = value - t.current;
        t.current = value;
        break;
      case 'scale':
        value = clamp(value, t.min, t.max);
        delta = value - t.current;
        t.current = value;
        break;
      case 'frequency':
        delta = Math.round(value);
        t.count = Math.max(0, t.count + delta);
        value = t.count;
        break;
      case 'duration':
        delta = value;
        t.logged = Math.max(0, t.logged + delta);
        value = t.logged;
        break;
      default:
        // Meta simples: checkpoint só com comentário/fotos, sem valor.
        value = null;
        delta = 0;
    }
    const photos = Array.isArray(input.photos) ? input.photos.slice(0, PHOTO_LIMIT_PER_CHECKPOINT) : [];
    const entry = { id: uid(), ts: Date.now(), date: isValidISODate(input.date) ? input.date : todayISO(), value: value, delta: delta, note: input.note || '', photos: photos };
    g.log.push(entry);
    if (g.log.length > GOAL_LOG_LIMIT) g.log.splice(0, g.log.length - GOAL_LOG_LIMIT);
    g.updatedAt = Date.now();
    touchProject(s, g.projectId);
    markActiveDay(s);
    const suffix = multiplierSuffix(s);
    const xp = gainXp(s, XP_PER_PROGRESS_LOG);
    const hp = changeHp(s, HP_HEAL_PROGRESS);
    const photoNote = photos.length ? ' · 📸 ' + photos.length + ' ' + plural(photos.length, 'foto', 'fotos') : '';
    addActivity(s, photos.length || t.type === 'simple' ? 'checkpoint' : 'progress', (t.type === 'simple' ? 'Checkpoint em "' + g.title + '"' : 'Progresso em "' + g.title + '": ' + describeLogEntry(g, entry)) + photoNote, { goalId: g.id, projectId: g.projectId, xp: xp });
    queueToast((photos.length || t.type === 'simple' ? '📸 ' : '📈 ') + '+' + xp + ' XP' + suffix + (hp ? ' · +' + hp + ' HP' : '') + ' — ' + g.title + ': ' + describeLogEntry(g, entry) + photoNote, 'xp');
    if (g.status === 'todo' || g.status === 'paused') g.status = 'doing';
    if (g.status !== 'done' && goalMeasuredProgress(g) >= 1) setGoalStatus(s, g, 'done');
  }

  /* =====================================================================
   * 7. COMMIT, UNDO/REDO E PERSISTÊNCIA
   * ===================================================================== */

  // Toda alteração de estado passa por aqui: snapshot → mutação → salvar → render.
  function commit(label, mutator, options) {
    const opts = options || {};
    const snapshot = JSON.stringify(state);
    pendingToasts = [];
    pendingReflections = [];
    try {
      mutator(state);
    } catch (err) {
      state = JSON.parse(snapshot);
      pendingToasts = [];
      pendingReflections = [];
      if (err && err.isUserError) {
        showToast(err.message, { type: 'warning' });
      } else {
        console.error(err);
        showToast('Erro ao aplicar alteração: ' + describeError(err), { type: 'error' });
      }
      renderApp();
      return false;
    }
    if (opts.undoable !== false) {
      undoHistory.undo.push({ label: label, snapshot: snapshot });
      if (undoHistory.undo.length > UNDO_LIMIT) undoHistory.undo.shift();
      undoHistory.redo.length = 0;
    }
    state.updatedAt = Date.now();
    scheduleSave();
    renderApp();
    flushPendingToasts();
    maybePromptReflection();
    return true;
  }

  function flushPendingToasts() {
    const list = pendingToasts;
    pendingToasts = [];
    list.forEach(function (t) { showToast(t.message, { type: t.type, action: t.action }); });
  }

  // Fora do desfazer/refazer: sessão de foco em andamento e a câmera (zoom/posição) de cada quadro.
  function keepAcrossHistory() {
    const cameras = {};
    state.projects.forEach(function (p) { cameras[p.id] = p.board.viewport; });
    return { focus: state.focus, cameras: cameras };
  }

  function restoreAcrossHistory(kept) {
    state.focus = kept.focus;
    state.projects.forEach(function (p) { if (kept.cameras[p.id]) p.board.viewport = kept.cameras[p.id]; });
  }

  function performUndo() {
    const entry = undoHistory.undo.pop();
    if (!entry) return;
    undoHistory.redo.push({ label: entry.label, snapshot: JSON.stringify(state) });
    const kept = keepAcrossHistory();
    state = JSON.parse(entry.snapshot);
    restoreAcrossHistory(kept);
    applyTheme(state.settings.theme);
    scheduleSave();
    renderApp();
    showToast('Desfeito: ' + entry.label, { type: 'info' });
  }

  function performRedo() {
    const entry = undoHistory.redo.pop();
    if (!entry) return;
    undoHistory.undo.push({ label: entry.label, snapshot: JSON.stringify(state) });
    const kept = keepAcrossHistory();
    state = JSON.parse(entry.snapshot);
    restoreAcrossHistory(kept);
    applyTheme(state.settings.theme);
    scheduleSave();
    renderApp();
    showToast('Refeito: ' + entry.label, { type: 'info' });
  }

  function setSaveStatus(status) {
    saveStatus = status;
    renderSaveIndicator();
  }

  function scheduleSave() {
    if (persistenceBlocked) { setSaveStatus('blocked'); return; }
    if (!storageAvailable) { setSaveStatus('memory'); return; }
    setSaveStatus('pending');
    if (saveQueued) return;
    // Sem debounce de tempo: a gravação começa ainda nesta rodada de eventos (fechar/recarregar logo
    // depois de uma ação não perde dados). Várias alterações na mesma rodada viram uma só gravação.
    saveQueued = true;
    Promise.resolve().then(persistNow);
  }

  function persistNow() {
    saveQueued = false;
    if (persistenceBlocked || !storageAvailable) return Promise.resolve();
    setSaveStatus('saving');
    savesInFlight++;
    return idbPut(STORE_STATE, { key: STATE_KEY, data: state, savedAt: Date.now() }).then(function () {
      savesInFlight--;
      if (!savesInFlight && !saveQueued) setSaveStatus('saved');
    }).catch(function (err) {
      savesInFlight--;
      console.error(err);
      setSaveStatus('error');
      showToast('Falha ao salvar: ' + describeError(err), { type: 'error' });
    });
  }

  function loadState() {
    return idbGet(STORE_STATE, STATE_KEY).then(function (record) {
      if (!record || !record.data) {
        state = createDefaultState();
        addActivity(state, 'system', 'Bem-vindo ao GoalQuest! Crie seu primeiro projeto.');
        return persistNow();
      }
      const raw = record.data;
      const fromVersion = Number(raw.schemaVersion) || 0;
      try {
        state = migrateState(raw);
      } catch (err) {
        console.error(err);
        persistenceBlocked = true;
        state = createDefaultState();
        openModal({
          title: 'Não foi possível carregar seus dados',
          size: 'sm',
          body: '<p class="modal-message">' + escapeHtml(describeError(err)) + '\n\nSeus dados originais continuam intactos no navegador. O salvamento foi desativado nesta sessão para não sobrescrevê-los.</p>',
          actions: [{ id: 'ok', label: 'Entendi', variant: 'primary' }]
        });
        return null;
      }
      if (fromVersion < CURRENT_SCHEMA_VERSION) {
        // Guarda uma cópia dos dados antigos antes de gravar o formato novo.
        return idbPut(STORE_STATE, { key: BACKUP_KEY_PREFIX + fromVersion + '-' + Date.now(), data: raw, savedAt: Date.now() }).then(function () {
          showToast('Dados atualizados para o formato v' + CURRENT_SCHEMA_VERSION + ' (cópia do formato antigo preservada).', { type: 'success' });
          return persistNow();
        });
      }
      return null;
    }).then(function () {
      return garbageCollectMedia();
    }).catch(function (err) {
      console.error(err);
      if (!state) state = createDefaultState();
      storageAvailable = false;
      showToast('Armazenamento indisponível (' + describeError(err) + '). Os dados desta sessão não serão salvos.', { type: 'error' });
    });
  }

  function requestPersistentStorage() {
    try {
      if (navigator.storage && navigator.storage.persist) {
        navigator.storage.persist().catch(function () { return false; });
      }
    } catch (err) {
      // Alguns navegadores bloqueiam a API em file://; não é crítico.
    }
  }

  /* =====================================================================
   * 8. IMAGENS (compressão + store de mídia)
   * ===================================================================== */

  function compressImage(file) {
    return new Promise(function (resolve, reject) {
      if (!file || !file.type || file.type.indexOf('image/') !== 0) {
        reject(new Error('O arquivo selecionado não é uma imagem.'));
        return;
      }
      const reader = new FileReader();
      reader.addEventListener('error', function () { reject(reader.error || new Error('Falha ao ler o arquivo.')); });
      reader.addEventListener('load', function () {
        const img = new Image();
        img.addEventListener('error', function () { reject(new Error('Não foi possível abrir esta imagem.')); });
        img.addEventListener('load', function () {
          const scale = Math.min(1, IMAGE_MAX_SIDE / Math.max(img.naturalWidth, img.naturalHeight));
          const w = Math.max(1, Math.round(img.naturalWidth * scale));
          const h = Math.max(1, Math.round(img.naturalHeight * scale));
          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', IMAGE_QUALITY));
        });
        img.src = reader.result;
      });
      reader.readAsDataURL(file);
    });
  }

  function saveMedia(dataUrl) {
    const id = 'm-' + uid();
    mediaCache.set(id, dataUrl);
    if (!storageAvailable || persistenceBlocked) return Promise.resolve(id);
    return idbPut(STORE_MEDIA, { id: id, dataUrl: dataUrl, createdAt: Date.now() }).then(function () { return id; });
  }

  function loadMedia(id) {
    if (mediaCache.has(id)) return Promise.resolve(mediaCache.get(id));
    if (!storageAvailable) return Promise.resolve(null);
    return idbGet(STORE_MEDIA, id).then(function (rec) {
      const url = rec ? rec.dataUrl : null;
      if (url) mediaCache.set(id, url);
      return url;
    }).catch(function () { return null; });
  }

  function hydrateMedia(root) {
    root.querySelectorAll('img[data-media-id]').forEach(function (img) {
      loadMedia(img.getAttribute('data-media-id')).then(function (url) {
        if (url) img.src = url;
        else img.remove();
      });
    });
  }

  // Remove do banco imagens que nenhum projeto referencia mais (roda só no carregamento,
  // assim um "desfazer" dentro da sessão sempre encontra a imagem).
  function garbageCollectMedia() {
    if (!storageAvailable || persistenceBlocked) return Promise.resolve();
    const referenced = new Set();
    state.projects.forEach(function (p) { if (p.coverId) referenced.add(p.coverId); });
    state.goals.forEach(function (g) { g.log.forEach(function (e) { e.photos.forEach(function (id) { referenced.add(id); }); }); });
    return idbGetAllKeys(STORE_MEDIA).then(function (keys) {
      const orphans = (keys || []).filter(function (k) { return !referenced.has(k); });
      return Promise.all(orphans.map(function (k) { return idbDelete(STORE_MEDIA, k); }));
    }).catch(function (err) { console.warn('GC de mídia falhou', err); });
  }

  /* =====================================================================
   * 9. TOASTS
   * ===================================================================== */

  function showToast(message, options) {
    const opts = options || {};
    const root = document.getElementById('toast-root');
    while (root.children.length >= TOAST_MAX) root.removeChild(root.firstChild);
    const el = document.createElement('div');
    el.className = 'toast toast-' + (opts.type || 'info');
    el.setAttribute('role', 'status');
    el.innerHTML = '<span class="toast-msg">' + escapeHtml(message) + '</span>' +
      (opts.action ? '<button type="button" class="toast-action">' + escapeHtml(opts.action.label) + '</button>' : '') +
      '<button type="button" class="toast-close" aria-label="Fechar">✕</button>';
    let timer = null;
    function dismiss() {
      clearTimeout(timer);
      el.classList.remove('show');
      setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 220);
    }
    el.querySelector('.toast-close').addEventListener('click', dismiss);
    if (opts.action) {
      el.querySelector('.toast-action').addEventListener('click', function () {
        dismiss();
        opts.action.onClick();
      });
    }
    root.appendChild(el);
    requestAnimationFrame(function () { el.classList.add('show'); });
    timer = setTimeout(dismiss, opts.duration || (opts.action ? TOAST_ACTION_DURATION_MS : TOAST_DURATION_MS));
    el.addEventListener('mouseenter', function () { clearTimeout(timer); });
    el.addEventListener('mouseleave', function () { timer = setTimeout(dismiss, TOAST_DURATION_MS); });
  }

  /* =====================================================================
   * 10. MODAIS REUTILIZÁVEIS
   * ===================================================================== */

  // opts: { title, body (HTML), size: 'sm'|'md'|'lg', actions: [{id,label,variant,submit}],
  //         onOpen(modal), onAction(id, modal) → false mantém aberto (aceita Promise), onClose(reason) }
  function openModal(opts) {
    const root = document.getElementById('modal-root');
    const backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop';
    const actions = (opts.actions || []).map(function (a) {
      const cls = a.variant === 'primary' ? 'btn btn-primary' : a.variant === 'danger' ? 'btn btn-danger-solid' : 'btn';
      return '<button type="' + (a.submit ? 'submit' : 'button') + '" class="' + cls + '" data-modal-action="' + escapeHtml(a.id) + '">' + escapeHtml(a.label) + '</button>';
    }).join('');
    backdrop.innerHTML =
      '<form class="modal modal-' + (opts.size || 'md') + (opts.className ? ' ' + opts.className : '') + '" role="dialog" aria-modal="true" novalidate>' +
      '<header class="modal-header"><h2>' + escapeHtml(opts.title || '') + '</h2>' +
      '<button type="button" class="icon-btn" data-modal-close aria-label="Fechar">✕</button></header>' +
      '<div class="modal-body">' + (opts.body || (opts.liveBody ? opts.liveBody() : '') || '') + '</div>' +
      (actions ? '<footer class="modal-footer">' + actions + '</footer>' : '') +
      '</form>';
    const form = backdrop.querySelector('form');
    const modal = { el: form, backdrop: backdrop, closed: false, busy: false, close: null, refresh: null };
    // Conteúdo "vivo": re-renderizado a cada mudança de estado (renderApp); null fecha a janela.
    if (opts.liveBody) {
      modal.refresh = function () {
        if (modal.closed) return;
        const html = opts.liveBody();
        if (html === null) {
          close('gone');
          return;
        }
        const body = form.querySelector('.modal-body');
        const active = document.activeElement;
        const refocus = active && form.contains(active) && active.hasAttribute('data-subtask-input');
        const scroll = backdrop.scrollTop;
        body.innerHTML = html;
        backdrop.scrollTop = scroll;
        hydrateMedia(body);
        if (refocus) {
          const again = body.querySelector('[data-subtask-input]');
          if (again) again.focus();
        }
      };
    }

    function close(reason) {
      if (modal.closed) return;
      modal.closed = true;
      const idx = modalStack.indexOf(modal);
      if (idx >= 0) modalStack.splice(idx, 1);
      backdrop.classList.remove('show');
      setTimeout(function () { if (backdrop.parentNode) backdrop.parentNode.removeChild(backdrop); }, 160);
      if (opts.onClose) opts.onClose(reason || 'close');
    }
    modal.close = close;

    function runAction(id) {
      if (modal.busy || modal.closed) return;
      if (!opts.onAction) { close(id); return; }
      let result;
      try {
        result = opts.onAction(id, modal);
      } catch (err) {
        console.error(err);
        showToast('Erro: ' + describeError(err), { type: 'error' });
        return;
      }
      if (result && typeof result.then === 'function') {
        modal.busy = true;
        form.querySelectorAll('.modal-footer button').forEach(function (b) { b.disabled = true; });
        result.then(function (r) {
          modal.busy = false;
          form.querySelectorAll('.modal-footer button').forEach(function (b) { b.disabled = false; });
          if (r !== false) close(id);
        }, function (err) {
          modal.busy = false;
          form.querySelectorAll('.modal-footer button').forEach(function (b) { b.disabled = false; });
          showToast('Erro: ' + describeError(err), { type: 'error' });
        });
      } else if (result !== false) {
        close(id);
      }
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      const primary = (opts.actions || []).filter(function (a) { return a.submit; })[0];
      if (primary) runAction(primary.id);
    });
    form.addEventListener('click', function (e) {
      const btn = e.target.closest('[data-modal-action]');
      if (btn && btn.type !== 'submit') runAction(btn.getAttribute('data-modal-action'));
      if (e.target.closest('[data-modal-close]')) close('dismiss');
    });
    let pressedOnBackdrop = false;
    backdrop.addEventListener('mousedown', function (e) { pressedOnBackdrop = e.target === backdrop; });
    backdrop.addEventListener('click', function (e) {
      if (pressedOnBackdrop && e.target === backdrop) close('dismiss');
      pressedOnBackdrop = false;
    });

    root.appendChild(backdrop);
    hydrateMedia(backdrop);
    modalStack.push(modal);
    requestAnimationFrame(function () { backdrop.classList.add('show'); });
    if (opts.onOpen) opts.onOpen(modal);
    const focusTarget = form.querySelector('[autofocus]') || form.querySelector('.modal-body input:not([type=hidden]):not([type=file]), .modal-body select, .modal-body textarea') || form.querySelector('.modal-footer .btn-primary, .modal-footer .btn-danger-solid');
    if (focusTarget) setTimeout(function () { focusTarget.focus(); }, 30);
    return modal;
  }

  function confirmDialog(opts) {
    return new Promise(function (resolve) {
      let answered = false;
      openModal({
        title: opts.title || 'Confirmar',
        size: 'sm',
        body: '<p class="modal-message">' + escapeHtml(opts.message || '') + '</p>',
        actions: [
          { id: 'cancel', label: opts.cancelLabel || 'Cancelar' },
          { id: 'confirm', label: opts.confirmLabel || 'Confirmar', variant: opts.danger ? 'danger' : 'primary' }
        ],
        onAction: function (id) {
          answered = true;
          resolve(id === 'confirm');
          return true;
        },
        onClose: function () { if (!answered) resolve(false); }
      });
    });
  }

  function clearFormErrors(root) {
    root.querySelectorAll('.field.invalid').forEach(function (f) { f.classList.remove('invalid'); });
    root.querySelectorAll('.field-error').forEach(function (e) { e.textContent = ''; });
  }

  function showFormErrors(root, errors) {
    clearFormErrors(root);
    const names = Object.keys(errors);
    names.forEach(function (name) {
      const input = root.querySelector('[name="' + name + '"]');
      const field = input ? input.closest('.field') : null;
      if (!field) return;
      field.classList.add('invalid');
      let msg = field.querySelector('.field-error');
      if (!msg) {
        msg = document.createElement('div');
        msg.className = 'field-error';
        field.appendChild(msg);
      }
      msg.textContent = errors[name];
    });
    if (names.length) {
      const first = root.querySelector('[name="' + names[0] + '"]');
      if (first) first.focus();
    }
    return names.length === 0;
  }

    return '<div class="progress ' + (extraClass || '') + (pct >= 100 ? ' done' : '') + '" role="progressbar" aria-valuenow="' + pct + '" aria-valuemin="0" aria-valuemax="100"><span style="width:' + pct + '%"></span></div>';

  function deadlineChip(deadline, status) {
    if (!deadline) return '';
    if (status === 'done') return '<span class="chip chip-success">📅 ' + formatDate(deadline) + '</span>';
    const n = diffDays(todayISO(), deadline);
    let text;
    let cls = '';
    if (n < 0) { text = 'Atrasado ' + (-n) + ' ' + plural(-n, 'dia', 'dias'); cls = 'chip-danger'; }
    else if (n === 0) { text = 'Vence hoje'; cls = 'chip-warning'; }
    else if (n === 1) { text = 'Vence amanhã'; cls = 'chip-warning'; }
    else if (n <= 7) { text = 'Em ' + n + ' dias'; cls = 'chip-warning'; }
    else { text = formatDate(deadline); }
    return '<span class="chip ' + cls + '" title="Prazo: ' + formatDate(deadline) + '">📅 ' + text + '</span>';
  }

  // Quanto de HP os atrasos atuais vão custar amanhã se nada mudar.
  function projectedOverdueDamage() {
    const tomorrow = addDaysISO(todayISO(), 1);
    let dmg = 0;
    state.goals.forEach(function (g) { if (isGoalOverdueOn(state, g, tomorrow)) dmg += optionOf(DIFFICULTIES, g.difficulty).damage; });
    state.projects.forEach(function (p) { if (isProjectOverdueOn(p, tomorrow)) dmg += HP_PROJECT_OVERDUE_DAMAGE; });
    return Math.min(dmg, HP_MAX_DAILY_DAMAGE);
  }

  // Grade estilo GitHub: colunas = semanas (seg→dom), intensidade = XP do dia (quartis).
  function heatmapHtml() {
    const p = state.player;
    const today = todayISO();
    const firstMonday = addDaysISO(periodStartISO('week', today), -7 * (HEATMAP_WEEKS - 1));
    const active = new Set(p.activeDays);
    const frozen = new Set(p.frozenDays);
    const values = [];
    let totalXp = 0;
    let activeCount = 0;
    let bestDay = null;
    for (let d = firstMonday; d <= today; d = addDaysISO(d, 1)) {
      const e = p.daily[d];
      if (e && e.xp > 0) values.push(e.xp);
      if (e) totalXp += e.xp;
      if (active.has(d)) activeCount++;
      if (e && e.xp > 0 && (!bestDay || e.xp > p.daily[bestDay].xp)) bestDay = d;
    }
    values.sort(function (a, b) { return a - b; });
    const q = function (f) { return values.length ? values[Math.min(values.length - 1, Math.floor(f * values.length))] : 0; };
    const q1 = q(0.25);
    const q2 = q(0.5);
    const q3 = q(0.75);
    function level(e, isActive) {
      if (!e || e.xp <= 0) return isActive || (e && e.actions > 0) ? 1 : 0;
      if (e.xp <= q1) return 1;
      if (e.xp <= q2) return 2;
      if (e.xp <= q3) return 3;
      return 4;
    }

    let months = '';
    let cells = '';
    let lastLabelCol = -10;
    for (let w = 0; w < HEATMAP_WEEKS; w++) {
      for (let dow = 0; dow < 7; dow++) {
        const d = addDaysISO(firstMonday, w * 7 + dow);
        const date = parseISODate(d);
        if (date.getDate() === 1 && w - lastLabelCol >= 3) {
          months += '<span style="grid-column:' + (w + 1) + ' / span 3">' + MONTH_SHORT[date.getMonth()] + '</span>';
          lastLabelCol = w;
        }
        if (d > today) {
          cells += '<span class="hm-cell future"></span>';
          continue;
        }
        const e = p.daily[d];
        const isActive = active.has(d);
        const isFrozen = frozen.has(d);
        let tip = WEEKDAY_SHORT[date.getDay()] + ', ' + formatDate(d) + '\n';
        tip += e && (e.xp > 0 || e.actions > 0) ? e.xp + ' XP · ' + e.actions + ' ' + plural(e.actions, 'ação', 'ações') + (e.focus ? ' · 🍅 ' + formatMinutes(e.focus) : '') : 'Sem atividade';
        if (isFrozen) tip += '\n❄️ Dia coberto por proteção de streak';
        if (d === today) tip += '\n(hoje)';
        cells += '<span class="hm-cell l' + level(e, isActive) + (isFrozen ? ' frozen' : '') + (d === today ? ' today' : '') + '" data-tip="' + escapeHtml(tip) + '"></span>';
      }
    }
    const dayLabels = ['seg', '', 'qua', '', 'sex', '', ''].map(function (l) { return '<span>' + l + '</span>'; }).join('');
    const summary = activeCount + ' ' + plural(activeCount, 'dia ativo', 'dias ativos') + ' · ' + totalXp + ' XP no período' + (bestDay ? ' · melhor dia: ' + formatDate(bestDay) + ' (' + p.daily[bestDay].xp + ' XP)' : '');
    return '<div class="heatmap-wrap"><div class="heatmap" style="--weeks:' + HEATMAP_WEEKS + '">' +
      '<div class="hm-months">' + months + '</div>' +
      '<div class="hm-days" aria-hidden="true">' + dayLabels + '</div>' +
      '<div class="hm-grid" role="img" aria-label="' + escapeHtml('Heatmap de atividade: ' + summary) + '">' + cells + '</div>' +
      '</div></div>' +
      '<div class="hm-footer"><span>' + escapeHtml(summary) + '</span><span class="spacer"></span>' +
      '<span class="hm-legend">Menos<span class="hm-legend-label"></span>' +
      [0, 1, 2, 3, 4].map(function (l) { return '<span class="hm-cell l' + l + '"></span>'; }).join('') +
      '<span class="hm-legend-label"></span>Mais</span>' +
      '<span class="hm-legend"><span class="hm-cell frozen"></span><span class="hm-legend-label">Protegido</span></span></div>';
  }

  // Cada categoria de projeto funciona como uma área da vida (rollup de projetos → metas).
  function areasHtml() {
    const rows = PROJECT_CATEGORIES.map(function (cat) {
      const projects = state.projects.filter(function (p) { return p.category === cat; });
      if (!projects.length) return '';
      let units = 0;
      let sum = 0;
      let goalCount = 0;
      let doneCount = 0;
      let xp = 0;
      let overdue = 0;
      projects.forEach(function (p) {
        const goals = goalsOfProject(p.id);
        xp += p.xpAwarded;
        if (isOverdue(p.deadline, p.status)) overdue++;
        if (!goals.length) {
          units++;
          sum += p.status === 'done' ? 1 : 0;
          return;
        }
        goals.forEach(function (g) {
          units++;
          sum += goalProgress(g);
          goalCount++;
          if (g.status === 'done') doneCount++;
          xp += g.xpAwarded;
          if (isOverdue(g.deadline, g.status)) overdue++;
        });
      });
      const prog = units ? sum / units : 0;
      const activeProjects = projects.filter(function (p) { return p.status !== 'done'; }).length;
      return '<div class="area-row" data-action="open-area" data-area="' + escapeHtml(cat) + '">' +
        '<div class="area-icon">' + (CATEGORY_ICONS[cat] || '🧩') + '</div>' +
        '<div style="min-width:0"><div class="area-name">' + escapeHtml(cat) + (overdue ? '<span class="chip chip-danger">' + overdue + ' ' + plural(overdue, 'atraso', 'atrasos') + '</span>' : '') + '</div>' +
        '<div class="area-sub">' + activeProjects + '/' + projects.length + ' ' + plural(projects.length, 'projeto ativo', 'projetos ativos') + ' · ' + doneCount + '/' + goalCount + ' metas · ' + xp + ' XP</div>' +
        progressBarHtml(prog) + '</div>' +
        '<div class="area-pct">' + formatPercent(prog) + '</div></div>';
    }).join('');
    return rows ? '<div class="list">' + rows + '</div>' : '<div class="empty-inline">Crie projetos para ver o progresso por área.</div>';
  }

  function dashCard(title, subtitle, body) {
    return '<section class="card"><div class="card-title"><h3>' + escapeHtml(title) + '</h3><span class="small muted">' + escapeHtml(subtitle) + '</span></div>' + body + '</section>';
  }
