  /* =====================================================================
   * 15b. PALETA DE COMANDOS (Ctrl/Cmd+K) — busca global + ações
   * ===================================================================== */

  function modShortcut(keys) {
    return isMacPlatform() ? keys.replace('Ctrl ', '⌘') : keys;
  }

  function matchesQuery(tokens, haystack) {
    for (let i = 0; i < tokens.length; i++) {
      if (haystack.indexOf(tokens[i]) < 0) return false;
    }
    return true;
  }

  // Monta a lista agrupada. Pontuação simples: título que começa com a busca vem antes.
  function paletteGroups(query) {
    const q = normalizeSearch(query).trim();
    const tokens = q.split(WHITESPACE_REGEX).filter(Boolean);
    const score = function (label) { return q && normalizeSearch(label).indexOf(q) === 0 ? 0 : 1; };
    const byScore = function (a, b) { return score(a.label) - score(b.label); };

    const commands = PALETTE_COMMANDS.filter(function (c) {
      return !tokens.length || matchesQuery(tokens, normalizeSearch(c.label + ' ' + (c.keywords || '')));
    }).map(function (c) {
      return { kind: 'command', id: c.id, icon: c.icon, label: c.label, hint: c.shortcut ? modShortcut(c.shortcut) : '' };
    });

    const projectsSource = tokens.length ? state.projects : state.projects.slice().sort(function (a, b) { return b.updatedAt - a.updatedAt; }).slice(0, 5);
    const projects = projectsSource.filter(function (p) {
      return !tokens.length || matchesQuery(tokens, normalizeSearch(p.name + ' ' + p.category + ' ' + p.description));
    }).map(function (p) {
      return { kind: 'project', id: p.id, icon: p.icon, label: p.name, hint: p.category + ' · ' + formatPercent(projectProgress(p)) };
    }).sort(byScore).slice(0, PALETTE_LIMIT_PER_GROUP);

    let goals = [];
    if (tokens.length) {
      state.goals.forEach(function (g) {
        const project = findProject(g.projectId);
        const hay = normalizeSearch(g.title + ' ' + g.tags.join(' ') + ' ' + g.nextAction + ' ' + (project ? project.name : ''));
        if (!matchesQuery(tokens, hay)) return;
        const hint = (project ? project.name + ' · ' : '') + optionOf(STATUSES, g.status).label;
        goals.push({ kind: 'goal', id: g.id, icon: g.status === 'done' ? '✅' : '🎯', label: g.title, hint: hint });
        if (g.status !== 'done') {
          const isSimple = g.tracking.type === 'simple';
          goals.push({ kind: 'goal-log', id: g.id, icon: isSimple ? '✔️' : '📈', label: (isSimple ? 'Concluir: ' : 'Registrar progresso: ') + g.title, hint: hint });
        }
      });
      goals = goals.sort(byScore).slice(0, PALETTE_LIMIT_PER_GROUP);
    }

    return [
      { title: 'Ações', items: commands },
      { title: tokens.length ? 'Projetos' : 'Projetos recentes', items: projects },
      { title: 'Metas', items: goals }
    ].filter(function (g) { return g.items.length; });
  }

  function openCommandPalette() {
    if (paletteModal) {
      paletteModal.close('toggle');
      return;
    }
    let flat = [];
    let active = 0;
    paletteModal = openModal({
      title: 'Buscar ou executar',
      className: 'modal-palette',
      body: '<input class="input palette-input" type="search" placeholder="Buscar projetos, metas ou ações…" aria-label="Buscar projetos, metas ou ações" autocomplete="off" autofocus>' +
        '<div class="palette-list" role="listbox"></div>' +
        '<div class="palette-foot"><span><kbd>↑</kbd> <kbd>↓</kbd> navegar</span><span><kbd>Enter</kbd> abrir</span><span><kbd>Esc</kbd> fechar</span><span class="spacer" style="flex:1"></span><span><kbd>' + modShortcut('Ctrl K') + '</kbd> abre de qualquer lugar</span></div>',
      onOpen: function (modal) {
        const input = modal.el.querySelector('.palette-input');
        const listEl = modal.el.querySelector('.palette-list');
        function render() {
          const groups = paletteGroups(input.value);
          flat = [];
          if (!groups.length) {
            listEl.innerHTML = '<div class="palette-empty">Nada encontrado para "' + escapeHtml(input.value) + '".</div>';
            return;
          }
          listEl.innerHTML = groups.map(function (g) {
            return '<div class="palette-group">' + escapeHtml(g.title) + '</div>' + g.items.map(function (item) {
              const idx = flat.push(item) - 1;
              return '<div class="palette-item' + (idx === active ? ' active' : '') + '" role="option" data-palette-index="' + idx + '">' +
                '<span class="palette-item-icon">' + escapeHtml(item.icon) + '</span><span class="palette-item-label">' + escapeHtml(item.label) + '</span>' +
                (item.hint ? (item.kind === 'command' ? '<kbd>' + escapeHtml(item.hint) + '</kbd>' : '<span class="palette-item-hint">' + escapeHtml(item.hint) + '</span>') : '') + '</div>';
            }).join('');
          }).join('');
        }
        function setActive(idx) {
          if (!flat.length) return;
          active = (idx + flat.length) % flat.length;
          listEl.querySelectorAll('.palette-item').forEach(function (el) {
            el.classList.toggle('active', Number(el.getAttribute('data-palette-index')) === active);
          });
          const el = listEl.querySelector('.palette-item.active');
          if (el) el.scrollIntoView({ block: 'nearest' });
        }
        function run(idx) {
          const item = flat[idx];
          if (!item) return;
          modal.close('run');
          runPaletteItem(item);
        }
        input.addEventListener('input', function () { active = 0; render(); });
        input.addEventListener('keydown', function (e) {
          if (e.key === 'ArrowDown') { e.preventDefault(); setActive(active + 1); }
          else if (e.key === 'ArrowUp') { e.preventDefault(); setActive(active - 1); }
          else if (e.key === 'Enter') { e.preventDefault(); run(active); }
        });
        listEl.addEventListener('mousemove', function (e) {
          const el = e.target.closest('[data-palette-index]');
          if (el && Number(el.getAttribute('data-palette-index')) !== active) setActive(Number(el.getAttribute('data-palette-index')));
        });
        listEl.addEventListener('click', function (e) {
          const el = e.target.closest('[data-palette-index]');
          if (el) run(Number(el.getAttribute('data-palette-index')));
        });
        render();
      },
      onClose: function () { paletteModal = null; }
    });
  }

  function runPaletteItem(item) {
    switch (item.kind) {
      case 'project':
        navigate('project/' + encodeURIComponent(item.id));
        return;
      case 'goal':
        revealGoal(item.id);
        return;
      case 'goal-log':
        openProgressLog(item.id);
        return;
      default:
        runCommand(item.id);
    }
  }

  function runCommand(id) {
    switch (id) {
      case 'go-dashboard': navigate('dashboard'); break;
      case 'go-projects': navigate('projects'); break;
      case 'go-goals': navigate('goals'); break;
      case 'go-settings': navigate('settings'); break;
      case 'new-project': openProjectForm(null); break;
      case 'new-goal': openGoalForm(null, null); break;
      case 'toggle-theme': toggleTheme(); break;
      case 'undo': performUndo(); break;
      case 'redo': performRedo(); break;
      case 'buy-freeze': buyFreeze(); break;
      case 'repair-streak': repairStreak(); break;
      case 'toggle-rest': toggleRest(); break;
      default: break;
    }
  }

    const g = findGoal(goalId);

    ui.highlightGoal = goalId;

    card.scrollIntoView({ block: 'center' });

  function fillStorageEstimate() {
    const el = document.getElementById('storage-estimate');
    if (!el || !navigator.storage || !navigator.storage.estimate) return;
    navigator.storage.estimate().then(function (est) {
      const mb = function (b) { return (b / 1048576).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' MB'; };
      const target = document.getElementById('storage-estimate');
      if (target) target.textContent = mb(est.usage || 0) + (est.quota ? ' de ~' + mb(est.quota) + ' disponíveis' : '');
    }).catch(function () { return null; });
  }

  function bindProjectForm(modal, coverState) {
    const root = modal.el;
    const iconInput = root.querySelector('[name="icon"]');
    const colorInput = root.querySelector('[name="color"]');
    const fileInput = root.querySelector('[name="cover-file"]');
    const preview = root.querySelector('[data-cover-preview]');
    const removeBtn = root.querySelector('[data-cover-remove]');

    function syncSelected(attr, value) {
      root.querySelectorAll('[' + attr + ']').forEach(function (b) {
        b.classList.toggle('selected', b.getAttribute(attr) === value);
      });
    }

    root.addEventListener('click', function (e) {
      const iconBtn = e.target.closest('[data-pick-icon]');
      if (iconBtn) {
        iconInput.value = iconBtn.getAttribute('data-pick-icon');
        syncSelected('data-pick-icon', iconInput.value);
      }
      const colorBtn = e.target.closest('[data-pick-color]');
      if (colorBtn) {
        colorInput.value = colorBtn.getAttribute('data-pick-color');
        syncSelected('data-pick-color', colorInput.value);
      }
      if (e.target.closest('[data-cover-choose]')) fileInput.click();
      if (e.target.closest('[data-cover-remove]')) {
        coverState.newDataUrl = null;
        coverState.removed = true;
        preview.innerHTML = 'Sem capa';
        removeBtn.hidden = true;
        fileInput.value = '';
      }
    });
    iconInput.addEventListener('input', function () { syncSelected('data-pick-icon', iconInput.value.trim()); });
    colorInput.addEventListener('input', function () { syncSelected('data-pick-color', colorInput.value.toLowerCase()); });
    fileInput.addEventListener('change', function () {
      const file = fileInput.files && fileInput.files[0];
      if (!file) return;
      preview.innerHTML = 'Processando imagem…';
      compressImage(file).then(function (dataUrl) {
        coverState.newDataUrl = dataUrl;
        coverState.removed = false;
        preview.innerHTML = '<img alt="" src="' + dataUrl + '">';
        removeBtn.hidden = false;
      }).catch(function (err) {
        preview.innerHTML = 'Sem capa';
        showToast(describeError(err), { type: 'error' });
      });
    });
    hydrateMedia(root);
  }

  function readProjectForm(root) {
    const get = function (name) { return root.querySelector('[name="' + name + '"]').value; };
    const errors = {};
    const data = {
      name: get('name').trim(),
      icon: get('icon').trim() || DEFAULT_PROJECT_ICON,
      description: get('description').trim(),
      category: get('category'),
      priority: get('priority'),
      status: get('status'),
      deadline: get('deadline'),
      color: normalizeHexColor(get('color'), DEFAULT_PROJECT_COLOR),
      motivation: get('motivation').trim()
    };
    if (!data.name) errors.name = 'Informe um nome para o projeto.';
    if (data.deadline && !isValidISODate(data.deadline)) errors.deadline = 'Data inválida.';
    return showFormErrors(root, errors) ? data : null;
  }

  function openProjectForm(projectId) {
    const existing = projectId ? findProject(projectId) : null;
    if (projectId && !existing) {
      showToast('Projeto não encontrado.', { type: 'error' });
      return;
    }
    const draft = existing ? deepClone(existing) : createProject({ name: '', color: PROJECT_COLORS[state.projects.length % PROJECT_COLORS.length] });
    const coverState = { newDataUrl: null, removed: false };
    openModal({
      title: existing ? 'Editar projeto' : 'Novo projeto',
      size: 'lg',
      body: projectFormHtml(draft),
      actions: [
        { id: 'cancel', label: 'Cancelar' },
        { id: 'save', label: existing ? 'Salvar alterações' : 'Criar projeto', variant: 'primary', submit: true }
      ],
      onOpen: function (modal) { bindProjectForm(modal, coverState); },
      onAction: function (action, modal) {
        if (action !== 'save') return true;
        const data = readProjectForm(modal.el);
        if (!data) return false;
        let coverPromise = Promise.resolve(draft.coverId);
        if (coverState.newDataUrl) coverPromise = saveMedia(coverState.newDataUrl);
        else if (coverState.removed) coverPromise = Promise.resolve(null);
        return coverPromise.then(function (coverId) {
          data.coverId = coverId;
          const status = data.status;
          delete data.status;
          if (existing) {
            commit('Editar projeto', function (s) {
              const p = findById(s.projects, existing.id);
              if (!p) throw new Error('Projeto não encontrado.');
              Object.assign(p, data);
              p.updatedAt = Date.now();
              setProjectStatus(s, p, status);
              addActivity(s, 'project_update', 'Projeto editado: "' + p.name + '"', { projectId: p.id });
            });
            showToast('Projeto atualizado.', { type: 'success' });
          } else {
            const created = createProject(data);
            commit('Criar projeto', function (s) {
              s.projects.push(created);
              setProjectStatus(s, created, status);
              markActiveDay(s);
              addActivity(s, 'project_create', 'Projeto criado: "' + created.name + '"', { projectId: created.id });
            });
            showToast('Projeto "' + created.name + '" criado.', {
              type: 'success',
              action: { label: 'Abrir', onClick: function () { navigate('project/' + encodeURIComponent(created.id)); } }
            });
          }
          return true;
        });
      }
    });
  }

  function deleteProject(projectId) {
    const p = findProject(projectId);
    if (!p) return;
    const goalCount = goalsOfProject(p.id).length;
    confirmDialog({
      title: 'Excluir projeto',
      message: 'Excluir "' + p.name + '"' + (goalCount ? ' e suas ' + goalCount + ' ' + plural(goalCount, 'meta', 'metas') : '') + '?\nO XP já conquistado é mantido. Você pode desfazer logo em seguida.',
      confirmLabel: 'Excluir',
      danger: true
    }).then(function (ok) {
      if (!ok) return;
      const name = p.name;
      const done = commit('Excluir projeto', function (s) {
        s.projects = s.projects.filter(function (x) { return x.id !== projectId; });
        s.goals = s.goals.filter(function (g) { return g.projectId !== projectId; });
        addActivity(s, 'project_delete', 'Projeto excluído: "' + name + '"');
      });
      if (!done) return;
      if (ui.route.name === 'project' && ui.route.id === projectId) navigate('projects');
      showToast('Projeto "' + name + '" excluído.', { type: 'info', action: { label: 'Desfazer', onClick: performUndo } });
    });
  }

  function numberField(label, name, value, attrs) {
    return '<label class="field"><span>' + label + '</span><input class="input" type="number" step="any" name="' + name + '" value="' + escapeHtml(isFiniteNumber(value) ? String(value) : '') + '" ' + (attrs || '') + '></label>';
  }

  function trackingFieldsHtml(t) {
    const hint = '<p class="hint full" style="grid-column:1/-1">' + escapeHtml(optionOf(TRACKING_TYPES, t.type).hint) + '</p>';
    switch (t.type) {
      case 'numeric':
        return '<div class="form-grid">' + hint +
          numberField('Valor inicial', 't_start', t.start) + numberField('Valor-alvo <span class="req">*</span>', 't_target', t.target) +
          numberField('Valor atual', 't_current', t.current) +
          '<label class="field"><span>Unidade</span><input class="input" name="t_unit" maxlength="16" value="' + escapeHtml(t.unit) + '" placeholder="kg, R$, páginas…"></label></div>';
      case 'percentage':
        return '<div class="form-grid">' + hint + numberField('Percentual atual (0–100)', 't_current', t.current, 'min="0" max="100"') + '</div>';
      case 'frequency':
        return '<div class="form-grid-3">' + hint +
          numberField('Total de vezes (meta) <span class="req">*</span>', 't_target', t.target, 'min="1" step="1"') +
          numberField('Já realizadas', 't_count', t.count, 'min="0" step="1"') +
          '<label class="field"><span>Período de referência</span><select class="select" name="t_period">' + optionsHtml(FREQUENCY_PERIODS, t.period) + '</select></label></div>';
      case 'duration':
        return '<div class="form-grid">' + hint +
          numberField('Meta em horas <span class="req">*</span>', 't_target_h', Math.round(t.target / 6) / 10, 'min="0" step="0.5"') +
          numberField('Horas já registradas', 't_logged_h', Math.round(t.logged / 6) / 10, 'min="0" step="0.5"') + '</div>';
      case 'scale':
        return '<div class="form-grid">' + hint +
          numberField('Mínimo da escala', 't_min', t.min) + numberField('Máximo da escala', 't_max', t.max) +
          numberField('Valor atual', 't_current', t.current) + numberField('Valor-alvo <span class="req">*</span>', 't_target', t.target) + '</div>';
      default:
        return '<div class="form-grid">' + hint + '</div>';
    }
  }

  function readTrackingFields(root, type, errors) {
    const num = function (name) {
      const el = root.querySelector('[name="' + name + '"]');
      return el ? parseNumber(el.value) : NaN;
    };
    const t = defaultTracking(type);
    switch (type) {
      case 'numeric': {
        t.start = num('t_start');
        t.target = num('t_target');
        t.current = num('t_current');
        t.unit = root.querySelector('[name="t_unit"]').value.trim();
        if (!isFiniteNumber(t.start)) t.start = 0;
        if (!isFiniteNumber(t.current)) t.current = t.start;
        if (!isFiniteNumber(t.target)) errors.t_target = 'Informe o valor-alvo.';
        else if (t.target === t.start) errors.t_target = 'O alvo precisa ser diferente do valor inicial.';
        break;
      }
      case 'percentage': {
        t.current = num('t_current');
        if (!isFiniteNumber(t.current)) t.current = 0;
        if (t.current < 0 || t.current > 100) errors.t_current = 'Use um valor entre 0 e 100.';
        break;
      }
      case 'frequency': {
        t.target = num('t_target');
        t.count = num('t_count');
        t.period = root.querySelector('[name="t_period"]').value;
        if (!isFiniteNumber(t.count) || t.count < 0) t.count = 0;
        t.count = Math.round(t.count);
        if (!isFiniteNumber(t.target) || t.target < 1 || Math.round(t.target) !== t.target) errors.t_target = 'Informe um número inteiro maior que zero.';
        break;
      }
      case 'duration': {
        const target = num('t_target_h');
        const logged = num('t_logged_h');
        if (!isFiniteNumber(target) || target <= 0) errors.t_target_h = 'Informe uma meta de horas maior que zero.';
        t.target = Math.round((target || 0) * 60);
        t.logged = Math.round((isFiniteNumber(logged) && logged > 0 ? logged : 0) * 60);
        break;
      }
      case 'scale': {
        t.min = num('t_min');
        t.max = num('t_max');
        t.current = num('t_current');
        t.target = num('t_target');
        if (!isFiniteNumber(t.min)) errors.t_min = 'Informe o mínimo.';
        if (!isFiniteNumber(t.max)) errors.t_max = 'Informe o máximo.';
        else if (isFiniteNumber(t.min) && t.max <= t.min) errors.t_max = 'O máximo precisa ser maior que o mínimo.';
        if (!isFiniteNumber(t.current)) t.current = t.min;
        if (!isFiniteNumber(t.target)) errors.t_target = 'Informe o valor-alvo.';
        else if (t.target < t.min || t.target > t.max) errors.t_target = 'O alvo precisa estar dentro da escala.';
        if (isFiniteNumber(t.current) && (t.current < t.min || t.current > t.max)) errors.t_current = 'O valor atual precisa estar dentro da escala.';
        break;
      }
      default:
        break;
    }
    return t;
  }

      '<label class="field"><span>Status</span><select class="select" name="status">' + optionsHtml(STATUSES, g.status) + '</select></label>' +
      '<label class="field full"><span>Descrição</span><textarea class="textarea" name="description" maxlength="600">' + escapeHtml(g.description) + '</textarea></label>' +

  function openGoalForm(goalId, presetProjectId) {
    if (!state.projects.length) {
      showToast('Crie um projeto antes de adicionar metas.', { type: 'warning', action: { label: 'Criar projeto', onClick: function () { openProjectForm(null); } } });
      return;
    }
    const existing = goalId ? findGoal(goalId) : null;
    if (goalId && !existing) {
      showToast('Meta não encontrada.', { type: 'error' });
      return;
    }
    let defaultProject = presetProjectId && findProject(presetProjectId) ? presetProjectId : null;
    if (!defaultProject && ui.route.name === 'project' && findProject(ui.route.id)) defaultProject = ui.route.id;
    if (!defaultProject && ui.goalFilters.project !== 'all' && findProject(ui.goalFilters.project)) defaultProject = ui.goalFilters.project;
    if (!defaultProject) defaultProject = state.projects.slice().sort(function (a, b) { return b.updatedAt - a.updatedAt; })[0].id;
    const draft = existing ? deepClone(existing) : createGoal({ title: '', projectId: defaultProject });
    // Guarda valores digitados por tipo para não perdê-los ao alternar o tipo de acompanhamento.
    const trackingDrafts = {};
    trackingDrafts[draft.tracking.type] = draft.tracking;

    openModal({
      title: existing ? 'Editar meta' : 'Nova meta',
      size: 'lg',
      body: goalFormHtml(draft),
      actions: [
        { id: 'cancel', label: 'Cancelar' },
        { id: 'save', label: existing ? 'Salvar alterações' : 'Criar meta', variant: 'primary', submit: true }
      ],
      onOpen: function (modal) {
        const typeSelect = modal.el.querySelector('[name="trackingType"]');
        const container = modal.el.querySelector('[data-tracking-fields]');
        let currentType = typeSelect.value;
        typeSelect.addEventListener('change', function () {
          trackingDrafts[currentType] = readTrackingFields(container, currentType, {});
          currentType = typeSelect.value;
          container.innerHTML = trackingFieldsHtml(trackingDrafts[currentType] || defaultTracking(currentType));
        });
      },
      onAction: function (action, modal) {
        if (action !== 'save') return true;
        const root = modal.el;
        const get = function (name) { return root.querySelector('[name="' + name + '"]').value; };
        const errors = {};
        const type = get('trackingType');
        const tracking = readTrackingFields(root, type, errors);
        const data = {
          title: get('title').trim(),
          projectId: get('projectId'),
          description: get('description').trim(),
          difficulty: get('difficulty'),
          priority: get('priority'),
          startDate: get('startDate'),
          deadline: get('deadline'),
          nextAction: get('nextAction').trim(),
          tags: parseTags(get('tags'))
        };
        const status = get('status');
        if (!data.title) errors.title = 'Informe um título para a meta.';
        if (!findProject(data.projectId)) errors.projectId = 'Escolha um projeto.';
        if (data.startDate && !isValidISODate(data.startDate)) errors.startDate = 'Data inválida.';
        if (data.deadline && !isValidISODate(data.deadline)) errors.deadline = 'Data inválida.';
        if (data.startDate && data.deadline && data.deadline < data.startDate) errors.deadline = 'O prazo não pode ser anterior ao início.';
        if (!showFormErrors(root, errors)) return false;

        if (existing) {
          commit('Editar meta', function (s) {
            const g = findById(s.goals, existing.id);
            if (!g) throw new Error('Meta não encontrada.');
            const oldProject = g.projectId;
            Object.assign(g, data);
            g.tracking = normalizeTracking(tracking);
            g.updatedAt = Date.now();
            touchProject(s, oldProject);
            touchProject(s, g.projectId);
            setGoalStatus(s, g, status);
            addActivity(s, 'goal_update', 'Meta editada: "' + g.title + '"', { goalId: g.id, projectId: g.projectId });
          });
          showToast('Meta atualizada.', { type: 'success' });
        } else {
          commit('Criar meta', function (s) {
            const g = createGoal(Object.assign({}, data, { tracking: tracking }));
            s.goals.push(g);
            touchProject(s, g.projectId);
            markActiveDay(s);
            addActivity(s, 'goal_create', 'Meta criada: "' + g.title + '"', { goalId: g.id, projectId: g.projectId });
            setGoalStatus(s, g, status);
          });
          showToast('Meta criada.', { type: 'success' });
        }
        return true;
      }
    });
  }

  function deleteGoal(goalId) {
    const g = findGoal(goalId);
    if (!g) return;
    confirmDialog({
      title: 'Excluir meta',
      message: 'Excluir a meta "' + g.title + '"' + (g.log.length ? ' e seus ' + g.log.length + ' registros de progresso' : '') + '?\nO XP já conquistado é mantido.',
      confirmLabel: 'Excluir',
      danger: true
    }).then(function (ok) {
      if (!ok) return;
      const title = g.title;
      const done = commit('Excluir meta', function (s) {
        const target = findById(s.goals, goalId);
        s.goals = s.goals.filter(function (x) { return x.id !== goalId; });
        if (target) touchProject(s, target.projectId);
        addActivity(s, 'goal_delete', 'Meta excluída: "' + title + '"');
      });
      if (done) showToast('Meta "' + title + '" excluída.', { type: 'info', action: { label: 'Desfazer', onClick: performUndo } });
    });
  }

  function toggleGoalDone(goalId) {
    const g = findGoal(goalId);
    if (!g) return;
    const next = g.status === 'done' ? 'todo' : 'done';
    commit(next === 'done' ? 'Concluir meta' : 'Reabrir meta', function (s) {
      const target = findById(s.goals, goalId);
      if (target) setGoalStatus(s, target, next);
    });
  }

  function changeGoalStatus(goalId, status) {
    if (!isOneOf(STATUSES, status)) return;
    commit('Alterar status da meta', function (s) {
      const g = findById(s.goals, goalId);
      if (g) setGoalStatus(s, g, status);
    });

  function changeProjectStatus(projectId, status) {
    if (!isOneOf(STATUSES, status)) return;
    commit('Alterar status do projeto', function (s) {
      const p = findById(s.projects, projectId);
      if (p) setProjectStatus(s, p, status);
    });
  }

  function quickFrequencyIncrement(goalId) {
    const g = findGoal(goalId);
    if (!g || g.tracking.type !== 'frequency') return;
    commit('Registrar ocorrência', function (s) {
      const target = findById(s.goals, goalId);
      if (target) applyProgressLog(s, target, { value: 1, date: todayISO(), note: '' });

  function progressLogFieldsHtml(g) {

          '<p class="hint" style="align-self:end">Atual: ' + formatNumber(t.current) + '%</p>';
      case 'frequency':
        return numberField('Quantas ocorrências registrar <span class="req">*</span>', 'value', 1, 'step="1" autofocus') +
          '<p class="hint" style="align-self:end">Total: ' + t.count + ' de ' + t.target + '. Use número negativo para corrigir.</p>';
      case 'duration':
        return '<div class="field"><span class="field-label">Tempo investido <span class="req">*</span></span><div class="row">' +
          '<input class="input" type="number" name="hours" min="0" step="1" value="0" aria-label="Horas" autofocus><span class="muted">h</span>' +
          '<input class="input" type="number" name="value" min="0" step="1" value="30" aria-label="Minutos"><span class="muted">min</span></div></div>' +
          '<p class="hint" style="align-self:end">Total: ' + formatMinutes(t.logged) + ' de ' + formatMinutes(t.target) + '</p>';
      case 'scale':
        return numberField('Novo valor (' + formatNumber(t.min) + '–' + formatNumber(t.max) + ') <span class="req">*</span>', 'value', t.current, 'min="' + t.min + '" max="' + t.max + '" autofocus') +
          '<p class="hint" style="align-self:end">Atual: ' + formatNumber(t.current) + ' · Meta: ' + formatNumber(t.target) + '</p>';
      default:
        return '';
    }
  }

  function openProgressLog(goalId) {
    const g = findGoal(goalId);
    if (!g) return;
    if (g.tracking.type === 'simple') {
      toggleGoalDone(goalId);
      return;
    }
    openModal({
      title: 'Registrar progresso — ' + g.title,
      size: 'md',
      body: '<div class="form-grid">' + progressLogFieldsHtml(g) +
        '<label class="field"><span>Data</span><input class="input" type="date" name="date" value="' + todayISO() + '" max="' + todayISO() + '"></label>' +
        '<label class="field full"><span>Comentário</span><textarea class="textarea" name="note" maxlength="300" placeholder="Opcional"></textarea></label></div>',
      actions: [
        { id: 'cancel', label: 'Cancelar' },
        { id: 'save', label: 'Registrar (+' + multipliedXp(state.player, XP_PER_PROGRESS_LOG) + ' XP)', variant: 'primary', submit: true }
      ],
      onAction: function (action, modal) {
        if (action !== 'save') return true;
        const root = modal.el;
        const t = g.tracking;
        const errors = {};
        let value = parseNumber(root.querySelector('[name="value"]').value);
        if (t.type === 'duration') {
          const hours = parseNumber(root.querySelector('[name="hours"]').value);
          value = (isFiniteNumber(hours) ? hours : 0) * 60 + (isFiniteNumber(value) ? value : 0);
          if (value <= 0) errors.value = 'Informe um tempo maior que zero.';
        } else if (!isFiniteNumber(value)) {
          errors.value = 'Informe um valor.';
        } else if (t.type === 'percentage' && (value < 0 || value > 100)) {
          errors.value = 'Use um valor entre 0 e 100.';
        } else if (t.type === 'scale' && (value < t.min || value > t.max)) {
          errors.value = 'O valor precisa estar dentro da escala.';
        } else if (t.type === 'frequency' && (value === 0 || Math.round(value) !== value)) {
          errors.value = 'Informe um número inteiro diferente de zero.';
        }
        const date = root.querySelector('[name="date"]').value || todayISO();
        if (!isValidISODate(date)) errors.date = 'Data inválida.';
        if (!showFormErrors(root, errors)) return false;
        const note = root.querySelector('[name="note"]').value.trim();
        commit('Registrar progresso', function (s) {
          const target = findById(s.goals, goalId);
          if (!target) throw new Error('Meta não encontrada.');
          applyProgressLog(s, target, { value: value, date: date, note: note });
        });
        return true;
      }
    });
  }

  /* =====================================================================
   * 19. PERFIL E TEMA
   * ===================================================================== */

  function setTheme(theme) {
    if (!isOneOf(THEMES, theme) || state.settings.theme === theme) return;
    applyTheme(theme);
    commit('Alterar tema', function (s) { s.settings.theme = theme; }, { undoable: false });
  }

  function toggleTheme() {
    setTheme(state.settings.theme === 'dark' ? 'light' : 'dark');
  }

  function saveProfile() {
    const root = document.getElementById('profile-form');
    if (!root) return;
    const name = root.querySelector('[name="profile-name"]').value.trim();
    const subtitle = root.querySelector('[name="profile-subtitle"]').value.trim();
    if (!name) {
      showFormErrors(root, { 'profile-name': 'Informe um nome.' });
      return;
    }
    commit('Editar perfil', function (s) {
      s.profile.name = name;
      s.profile.subtitle = subtitle;
      addActivity(s, 'profile', 'Perfil atualizado');
    });
    showToast('Perfil salvo.', { type: 'success' });
  }

  /* =====================================================================
   * 19b. JOGADOR — proteções, reparo de streak, descanso e virada do dia
   * ===================================================================== */

  function buyFreeze() {
    const ps = getPlayerStats();
    if (ps.freezes >= FREEZE_MAX) {
      showToast('Você já tem o máximo de ' + FREEZE_MAX + ' proteções.', { type: 'info' });
      return;
    }
    if (ps.available < FREEZE_COST) {
      showToast('XP disponível insuficiente: a proteção custa ' + FREEZE_COST + ' XP e você tem ' + ps.available + '.', { type: 'warning' });
      return;
    }
    confirmDialog({
      title: 'Comprar proteção de streak',
      message: 'Gastar ' + FREEZE_COST + ' XP disponível em uma proteção?\n\nSe você passar um dia sem atividade, ela é usada automaticamente e o streak continua. Seu nível não muda — só o XP disponível para gastar.',
      confirmLabel: 'Comprar (' + FREEZE_COST + ' XP)'
    }).then(function (ok) {
      if (!ok) return;
      const done = commit('Comprar proteção de streak', function (s) {
        if (s.player.freezes >= FREEZE_MAX) throw new Error('limite de proteções atingido');
        if (s.player.xpEarned - s.player.xpSpent < FREEZE_COST) throw new Error('XP disponível insuficiente');
        s.player.freezes++;
        s.player.xpSpent += FREEZE_COST;
        addActivity(s, 'freeze_buy', 'Comprou uma proteção de streak (−' + FREEZE_COST + ' XP disponível)');
      });
      if (done) showToast('❄️ Proteção comprada. Você tem ' + state.player.freezes + '/' + FREEZE_MAX + '.', { type: 'success' });
    });
  }

  function repairStreak() {
    const r = getStreakRepair(state);
    if (!r) {
      showToast('Não há streak recente para reparar.', { type: 'info' });
      return;
    }
    if (!r.affordable) {
      showToast('O reparo custa ' + r.cost + ' XP disponível e você tem ' + getPlayerStats().available + '.', { type: 'warning' });
      return;
    }
    const n = r.days.length;
    const parts = [];
    if (r.freezeUse) parts.push(r.freezeUse + ' ' + plural(r.freezeUse, 'proteção', 'proteções'));
    if (r.cost) parts.push(r.cost + ' XP disponível');
    confirmDialog({
      title: 'Reparar streak',
      message: 'Cobrir ' + n + ' ' + plural(n, 'dia perdido', 'dias perdidos') + ' (' + r.days.map(formatDate).join(', ') + ') e recuperar seu streak de ' + r.lostStreak + ' dias?\n\nCusto: ' + parts.join(' + ') + '.',
      confirmLabel: 'Reparar'
    }).then(function (ok) {
      if (!ok) return;
      const done = commit('Reparar streak', function (s) {
        const repair = getStreakRepair(s);
        if (!repair || !repair.affordable) throw new Error('o reparo não está mais disponível');
        repair.days.forEach(function (d) { s.player.frozenDays.push(d); });
        s.player.freezes -= repair.freezeUse;
        s.player.xpSpent += repair.cost;
        addActivity(s, 'streak_repair', 'Reparou o streak de ' + repair.lostStreak + ' dias (' + parts.join(' + ') + ')');
      });
      if (done) showToast('🔧 Streak reparado! Agora: ' + getPlayerStats().streak + ' dias.', { type: 'success' });
    });
  }

  function toggleRest() {
    const on = !state.player.resting;
    commit(on ? 'Ativar modo descanso' : 'Desativar modo descanso', function (s) {
      s.player.resting = on;
      addActivity(s, 'rest', on ? 'Modo descanso ativado' : 'Modo descanso desativado');
    });
    showToast(on ? '🏖️ Modo descanso ativado: você não perde vitalidade enquanto ele estiver ligado. O streak continua valendo.' : 'Modo descanso desativado.', { type: 'info' });
  }

  // Na abertura do app: processa os dias passados antes do primeiro render (sem entrar no undo).
  function runInitialTick() {
    if (state.player.lastTickDate === todayISO()) return;
    pendingToasts = [];
    processDailyTick(state);
    state.updatedAt = Date.now();
    scheduleSave();
  }

  // Com o app aberto durante a virada da meia-noite.
  function checkDayRollover() {
    if (!state || state.player.lastTickDate === todayISO()) return;
    commit('Virada do dia', processDailyTick, { undoable: false });
  }

  /* =====================================================================
   * 20. ROTEAMENTO E EVENTOS GLOBAIS (delegação via addEventListener)
   * ===================================================================== */

  function parseRoute() {
    const hash = (window.location.hash || '').replace(ROUTE_PREFIX_REGEX, '');
    const parts = hash.split('/').filter(Boolean);
    const name = parts[0] || 'dashboard';
    if (name === 'project' && parts[1]) return { name: 'project', id: decodeURIComponent(parts[1]) };
    if (NAV_ITEMS.some(function (i) { return i.route === name; })) return { name: name };
    return { name: 'dashboard' };
  }

  function navigate(path) {
    const target = '#/' + path;
    if (window.location.hash === target) {
      handleRouteChange();
    } else {
      window.location.hash = target;
    }
  }

  function handleRouteChange() {
    const prev = ui.route;
    ui.route = parseRoute();
    if (ui.route.name === 'project' && (prev.name !== 'project' || prev.id !== ui.route.id)) ui.detailStatus = 'all';
    closeAllModals();
    renderApp();
    window.scrollTo(0, 0);
    applyGoalHighlight();
  }

  function closeAllModals() {
    modalStack.slice().forEach(function (m) { m.close('navigate'); });
  }

  function handleAction(action, el) {
    const id = el.getAttribute('data-id');
    switch (action) {
      case 'navigate': navigate(el.getAttribute('data-route')); break;
      case 'undo': performUndo(); break;
      case 'redo': performRedo(); break;
      case 'toggle-theme': toggleTheme(); break;
      case 'set-theme': setTheme(el.getAttribute('data-theme')); break;
      case 'new-project': openProjectForm(null); break;
      case 'edit-project': openProjectForm(id); break;
      case 'delete-project': deleteProject(id); break;
      case 'open-project': if (id) navigate('project/' + encodeURIComponent(id)); break;
      case 'new-goal': openGoalForm(null, el.getAttribute('data-project-id')); break;
      case 'edit-goal': openGoalForm(id, null); break;
      case 'delete-goal': deleteGoal(id); break;
      case 'goal-toggle-done': toggleGoalDone(id); break;
      case 'goal-log': openProgressLog(id); break;
      case 'goal-freq-inc': quickFrequencyIncrement(id); break;
      case 'goal-toggle-history':
        if (ui.expandedGoals.has(id)) ui.expandedGoals.delete(id);
        else ui.expandedGoals.add(id);
        renderView();
        break;
      case 'detail-status':
        ui.detailStatus = el.getAttribute('data-status');
        renderView();
        break;
      case 'clear-project-filters':
        ui.projectFilters = { text: '', status: 'all', category: 'all', sort: ui.projectFilters.sort };
        renderView();
        break;
      case 'clear-goal-filters':
        ui.goalFilters = { text: '', status: 'all', project: 'all', difficulty: 'all', type: 'all', sort: ui.goalFilters.sort };
        renderView();
        break;
      case 'save-profile': saveProfile(); break;
      case 'open-palette': openCommandPalette(); break;
      case 'buy-freeze': buyFreeze(); break;
      case 'repair-streak': repairStreak(); break;
      case 'toggle-rest': toggleRest(); break;
      case 'open-area':
        ui.projectFilters = { text: '', status: 'all', category: el.getAttribute('data-area'), sort: ui.projectFilters.sort };
        navigate('projects');
        break;
      default: console.warn('Ação desconhecida:', action);
    }
  }

  function handleChange(kind, el) {
    const id = el.getAttribute('data-id');
    switch (kind) {
      case 'goal-status': changeGoalStatus(id, el.value); break;
      case 'project-status': changeProjectStatus(id, el.value); break;
      case 'filter-projects':
        ui.projectFilters[el.getAttribute('data-field')] = el.value;
        renderProjectsList();
        break;
      case 'filter-goals':
        ui.goalFilters[el.getAttribute('data-field')] = el.value;
        renderGoalsList();
        break;
      default: break;
    }
  }

  function handleGlobalKeydown(e) {
    const mod = e.ctrlKey || e.metaKey;
    const key = (e.key || '').toLowerCase();
    if (mod && !e.altKey && key === 'k') {
      e.preventDefault();
      openCommandPalette();
      return;
    }
    if (modalStack.length) {
      if (e.key === 'Escape') {
        e.preventDefault();
        modalStack[modalStack.length - 1].close('dismiss');
      }
      return;
    }
    // Em campos de texto, Ctrl+Z/Y continuam sendo o desfazer nativo do navegador.
    if (!mod || e.altKey || isTypingTarget(e.target)) return;
    if (key === 'z' && !e.shiftKey) {
      e.preventDefault();
      performUndo();
    } else if ((key === 'z' && e.shiftKey) || key === 'y') {
      e.preventDefault();
      performRedo();
    }
  }

  function showTooltip(el) {
    const tip = document.getElementById('tooltip');
    const text = el.getAttribute('data-tip');
    if (!text) return;
    if (tip.textContent !== text) tip.textContent = text;
    const r = el.getBoundingClientRect();
    tip.classList.add('show');
    const tw = tip.offsetWidth;
    const th = tip.offsetHeight;
    let left = r.left + r.width / 2 - tw / 2;
    left = clamp(left, 8, window.innerWidth - tw - 8);
    let top = r.top - th - 8;
    if (top < 8) top = r.bottom + 8;
    tip.style.left = left + 'px';
    tip.style.top = top + 'px';
  }

  function hideTooltip() {
    const tip = document.getElementById('tooltip');
    if (tip) tip.classList.remove('show');
  }

  function bindGlobalEvents() {
    document.addEventListener('click', function (e) {
      if (e.target.closest('.modal-backdrop, #toast-root')) return;
      const el = e.target.closest('[data-action]');
      if (!el || el.disabled) return;
      handleAction(el.getAttribute('data-action'), el);
    });
    document.addEventListener('change', function (e) {
      const el = e.target.closest('[data-change]');
      if (el) handleChange(el.getAttribute('data-change'), el);
    });
    document.addEventListener('input', function (e) {
      const el = e.target.closest('[data-input]');
      if (el) handleChange(el.getAttribute('data-input'), el);
    });
    document.addEventListener('keydown', handleGlobalKeydown);
    document.addEventListener('mouseover', function (e) {
      const el = e.target.closest ? e.target.closest('[data-tip]') : null;
      if (el) showTooltip(el);
      else hideTooltip();
    });
    document.addEventListener('scroll', hideTooltip, true);
    window.addEventListener('hashchange', handleRouteChange);
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'hidden' && saveTimer) persistNow();
      if (document.visibilityState === 'visible') checkDayRollover();
    });
    window.addEventListener('pagehide', function () {
      if (saveTimer) persistNow();
    });
  }

  /* =====================================================================
   * 21. INICIALIZAÇÃO (ponto único, chamado uma vez)
   * ===================================================================== */

  function init() {
    applyTheme('dark');
    bindGlobalEvents();
    requestPersistentStorage();
    document.getElementById('palette-kbd').textContent = modShortcut('Ctrl K');
    loadState().then(function () {
      applyTheme(state.settings.theme);
      ui.route = parseRoute();
      runInitialTick();
      if (persistenceBlocked) setSaveStatus('blocked');
      else if (!storageAvailable) setSaveStatus('memory');
      else if (saveStatus === 'loading') setSaveStatus('saved');
      renderApp();
      flushPendingToasts();
      setInterval(checkDayRollover, TICK_INTERVAL_MS);
    });
  }

  document.addEventListener('DOMContentLoaded', init);
})();
</script>
</body>
</html>
